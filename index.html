<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rastro — Conhecimento (versão pública)</title>
<style>
:root{
  --bg:#F2F0F1; --painel:#FFFFFF; --tinta:#2A2430; --suave:#6B6570;
  --marca:#69103F; --marca2:#8E1A57; --verde:#7A9A12; --linha:#E4DEE2;
  --ok:#7A9A12; --meio:#B26A00; --ruim:#B00020; --chip:#F4EEF1;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 Arial,"Helvetica Neue",Helvetica,sans-serif;
  background:var(--bg);color:var(--tinta)}
header{background:linear-gradient(135deg,#5C0D36 0%,#69103F 55%,#7C1A4C 100%);
  color:#fff;padding:16px 26px;display:flex;align-items:center;gap:18px;
  flex-wrap:wrap}
header .logo{height:34px;width:auto}
header h1{font-size:19px;margin:0;letter-spacing:1.5px;font-weight:700;
  border-left:1px solid rgba(255,255,255,.35);padding-left:18px}
header h1 b{color:var(--verde);font-weight:700}
header small{opacity:.8;letter-spacing:.5px;font-size:12.5px}
nav{display:flex;gap:5px;background:#5C0D36;padding:9px 22px 11px;flex-wrap:wrap}
nav button{border:1px solid transparent;background:rgba(255,255,255,.07);color:#EAD7E2;
  padding:7px 15px;border-radius:6px;cursor:pointer;font-size:13.5px;
  transition:all .15s}
nav button:hover{border-color:var(--verde);color:#fff}
nav button.ativo{background:#fff;color:var(--marca);font-weight:700}
main{max-width:1080px;margin:22px auto;padding:0 18px}
.cartao{background:var(--painel);border:1px solid var(--linha);border-radius:12px;
  padding:18px 22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(105,16,63,.05)}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--painel);border:1px solid var(--linha);
  border-radius:12px;padding:16px 18px;text-align:center;position:relative;overflow:hidden;
  box-shadow:0 1px 3px rgba(105,16,63,.05)}
.kpi::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--marca),transparent)}
.kpi b{display:block;font-size:34px;color:var(--marca);font-variant-numeric:tabular-nums;
  font-weight:800;letter-spacing:-.5px}
.kpi b.laranja{color:var(--marca)} .kpi b.verde{color:var(--ok)} .kpi b.ambar{color:var(--meio)}
.donut{width:150px;height:150px;border-radius:50%;margin:6px auto;
  display:flex;align-items:center;justify-content:center}
.donut>div{width:96px;height:96px;border-radius:50%;background:var(--painel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;font-size:22px}
.barra-h{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.barra-h .trilho{flex:1;background:var(--chip);border-radius:6px;height:14px;overflow:hidden}
.barra-h .valor{height:14px;border-radius:6px;background:linear-gradient(90deg,#69103F,#A83A72)}
.graficos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.chip{display:inline-block;background:var(--chip);border-radius:20px;
  padding:1px 10px;font-size:12px;color:var(--suave);margin:1px 3px 1px 0}
.status-fichado{color:var(--ok);font-weight:600}
.status-a_fichar{color:var(--meio);font-weight:600}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--linha);padding:7px 9px;text-align:left;
  vertical-align:top}
th{font-size:12px;text-transform:uppercase;color:var(--suave);letter-spacing:.5px}
tr.clicavel{cursor:pointer}
tr.clicavel:hover{background:#FAF4F7}
button.acao{border:0;background:var(--marca);color:#fff;padding:9px 18px;
  border-radius:8px;cursor:pointer;font-size:14px;font-weight:700}
button.acao:hover{filter:brightness(1.12)}
button.acao.sec{background:transparent;color:var(--marca);border:1px solid var(--marca)}
button.acao:disabled{opacity:.5;cursor:default}
input[type=text],input[type=datetime-local],textarea,select{width:100%;
  border:1px solid var(--linha);border-radius:8px;padding:9px 11px;font:inherit;
  background:#fff;color:var(--tinta)}
textarea{min-height:90px;resize:vertical}
.md h1{font-size:22px;border-bottom:2px solid var(--linha);padding-bottom:6px}
.md h2{font-size:17px;color:var(--marca);margin-top:22px}
.md table{margin:10px 0}
.md code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:13px}
.md pre{background:#2A2430;color:#e6edf3;padding:14px;border-radius:10px;
  overflow-x:auto;font-size:13px;border:1px solid var(--linha)}
.md pre code{background:none;color:inherit;padding:0}
a.wiki{color:var(--marca2);text-decoration:none;border-bottom:1px dashed var(--marca2);
  cursor:pointer}
.aviso{background:#FBF3E5;border:1px solid #E7D3A8;border-radius:10px;
  padding:10px 14px;margin:10px 0;font-size:14px;color:#7A5A10}
.fb-correta{border-left:5px solid var(--ok)}
.fb-parcial{border-left:5px solid var(--meio)}
.fb-errada{border-left:5px solid var(--ruim)}
.relogio{font-variant-numeric:tabular-nums;background:var(--marca);color:#fff;
  border-radius:8px;padding:4px 12px;font-size:15px;font-weight:800}
.opcao{display:block;width:100%;text-align:left;background:#fff;color:var(--tinta);
  border:1px solid var(--linha);border-radius:10px;padding:11px 14px;margin:7px 0;
  cursor:pointer;font:inherit;transition:all .15s}
.opcao:hover{border-color:var(--marca);background:#FAF4F7}
pre.saida{background:#2A2430;color:#e6edf3;padding:14px;border-radius:10px;
  white-space:pre-wrap;font-size:13px;max-height:420px;overflow:auto;
  border:1px solid var(--linha)}
.rotulo{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--suave)}
.dim{color:var(--suave);font-size:13px}
h2.secao{margin:4px 0 14px}
.linha-botoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.grade2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.mini{background:var(--chip);border:1px solid var(--linha);border-radius:10px;padding:12px 14px}
.mini ul{font-size:14px}
button.acao.sec.ativo{background:var(--marca);color:#fff;font-weight:700}
#form-fichar{display:none !important}
.badge-pub{background:var(--chip);border:1px solid var(--linha);color:var(--suave);border-radius:20px;padding:2px 12px;font-size:12px}
</style>
</head>

 "caminho": "normas/anpd/anpd-ingest-primeiro-concurso-publico-para-carreira-propria-da-anpd-e-autorizado.md", "quando": "2026-07-29"}, "meta": {"id": "anpd-ingest-primeiro-concurso-publico-para-carreira-propria-da-anpd-e-autorizado", "tipo": "norma", "titulo": "Primeiro concurso público para carreira própria da ANPD é autorizado — INGESTÃO AUTOMÁTICA", "orgao": "ANPD", "data_publicacao": "2026-06-24", "fonte_primaria": "https://www.gov.br/anpd/pt-br/assuntos/noticias/copy_of_primeiro-concurso-publico-para-carreira-propria-da-anpd-e-autorizado", "status": "a_fichar", "tags": "[protecao de dados]", "confidencial": "false"}, "corpo": "\n## Descrição (retornada pelo portal — fonte: notícias; conferir no texto oficial/DOU)\n\nMGI aprova realização de certame com 50 vagas para o cargo de Especialista em Regulação de Proteção de Dados, visando fortalecimento da atuação da ANPD\n\n## Texto oficial (extração automática, 2026-07-29)\n\nItem sem número de norma identificável: trata-se de notícia ou publicação institucional, não de ato normativo. Não há inteiro teor a extrair da base de normativos.\n\n### Pendente do operador\n\n- Triagem: relevante para o escopo Rastro (fichar) ou descartar?\n- Se relevante: abrir a fonte no link do frontmatter e registrar o que interessa\n"}, {"info": {"id": "anpd-res-cd-15-2024", "titulo": "Resolução CD/ANPD nº 15, de 24 de abril de 2024 (comunicação de incidente)", "orgao": "ANPD", "tipo": "norma", "status": "fichado", "data_publicacao": "2024-04-26", "tags": "[anpd, lgpd, incidente, comunicacao, protecao-de-dados]", "grupo": "normas", "caminho": "normas/anpd/anpd-res-cd-15-2024.md", "quando": "2026-07-03"}, "meta": {"id": "anpd-res-cd-15-2024", "tipo": "norma", "titulo": "Resolução CD/ANPD nº 15, de 24 de abril de 2024 (comunicação de incidente)", "orgao": "ANPD", "data_publicacao": "2024-04-26", "vigencia": "", "altera": "[\"Resolução CD/ANPD nº 2/2022, art. 14, II (agentes de pequeno porte)\"]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico, retainer, adversarial]", "fonte_primaria": "https://pesquisa.in.gov.br/imprensa/servlet/INPDFViewer?jornal=515&pagina=114&data=26/04/2024&captchafield=firstAccess", "status": "fichado", "tags": "[anpd, lgpd, incidente, comunicacao, protecao-de-dados]", "confidencial": "false"}, "corpo": "\n# Resolução CD/ANPD nº 15/2024 — comunicação de incidente de segurança\n\n## Ementa\n\nEmenta oficial (literal): \"Aprova o Regulamento de Comunicação de Incidente de Segurança.\" Editada pelo Conselho Diretor da ANPD com fundamento no art. 55-J, XIII, da Lei nº 13.709/2018 (LGPD), regulamentando o art. 48. Publicada no DOU de 26/04/2024, Seção 1, p. 114. Vigência na data da publicação (art. 3º).\n\n## Vigência e prazos\n\nEm vigor desde 26/04/2024, sem cronograma escalonado. O prazo operacional central: a comunicação de incidente à ANPD deve ser realizada pelo controlador em três dias úteis, contados do conhecimento pelo controlador de que o incidente afetou dados pessoais (art. 6º, caput e §1º do Regulamento), ressalvada a existência de prazo em legislação específica. Mesmo prazo para a comunicação aos titulares afetados, quando exigida.\n\n## Obrigações principais\n\nComunicar à ANPD e aos titulares os incidentes que possam acarretar risco ou dano relevante. Risco relevante (art. 5º): afetação significativa de interesses e direitos fundamentais e, cumulativamente, ao menos um critério — dados sensíveis; dados de crianças, adolescentes ou idosos; dados financeiros; dados de autenticação em sistemas; dados sob sigilo legal, judicial ou profissional; ou dados em larga escala. Obrigação de registrar todos os incidentes, inclusive os não comunicados, por prazo mínimo de cinco anos contado da data do registro, com conteúdo mínimo (data de conhecimento, descrição das circunstâncias etc.).\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: existência de procedimento interno de avaliação de risco relevante e de livro de registro de incidentes — itens do benchmark. War room: o relógio de três dias úteis começa a correr no conhecimento do controlador; a decisão comunicar/não comunicar (com fundamentação registrada) é das primeiras do playbook de 72h. Recuperação/defesa: o registro de incidentes e a comunicação tempestiva (ou a fundamentação da não comunicação) são provas centrais na onda consumerista e em eventual fiscalização da ANPD.\n\n## Conexão comercial\n\nAlimenta todos os degraus: benchmark (bloco ANPD), diagnóstico (procedimento de avaliação de risco), retainer (execução da comunicação no war room) e adversarial (defesa em fiscalização e contencioso).\n\n## Lacunas\n\n- Formulário/canal de comunicação e eventuais orientações complementares da ANPD (perguntas frequentes, guia de comunicação): não fichados.\n- Interação com prazos setoriais do BCB (comunicação de incidente relevante ao BCB pela regulação de segurança cibernética): mapear na matriz de prazos — ver [[hub-matriz-prazos]].\n\n## Relações\n\n[[hub-anpd-lgpd]] · [[hub-matriz-prazos]] · [[bcb-res-538-2025]]\n"}, {"info": {"id": "bcb-ingest-comunicado-45296-2026-05-22", "titulo": "Comunicado N° 45.296 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2026-05-22", "tags": "[instituicao de pagamento]", "grupo": "normas", "caminho": "normas/bcb/bcb-ingest-comunicado-45296-2026-05-22.md", "quando": "2026-07-29"}, "meta": {"id": "bcb-ingest-comunicado-45296-2026-05-22", "tipo": "norma", "titulo": "Comunicado N° 45.296 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "data_publicacao": "2026-05-22", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Comunicado&numero=45296", "status": "a_fichar", "tags": "[instituicao de pagamento]", "confidencial": "false"}, "corpo": "\n## Ementa (retornada pela API do BCB — conferir no texto oficial)\n\n<div class=\"ExternalClass3E55A6CBD0A743EC95BFCCBA4AF24BC7\">Divulga pedido de cancelamento da autorização para 20Normativa%20BCB&numero=742", "status": "a_fichar", "tags": "[pix, dict]", "confidencial": "false"}, "corpo": "\n## Ementa (retornada pela API do BCB — conferir no texto oficial)\n\nDivulga a versão 8.3 do Manual Operacional do Diretório de Identificadores de Contas Transacionais (DICT), que compõe o Regulamento do Pix.\n\n## Texto oficial (extração automática, 2026-07-29)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** Publicada no DOU de 10/6/2026, Seção 1, p. 324-327.\n**Ementa oficial:** Divulga a versão 8.3 do Manual Operacional do Diretório de Identificadores de Contas Transacionais (DICT), que compõe o Regulamento do Pix.\n**Situação:** o registro do BCB marca esta norma como REVOGADA\n\n### Vigência (dispositivos transcritos)\n\n- Nenhum dispositivo de vigência localizado automaticamente. Conferir no texto.\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 01/04/2025 · 01/07/2025 · 01/10/2025 · 02/02/2026 · 02/09/2024 · 09/06/2026 · 09/12/2024 · 1/12/2023 · 1/7/2026 · 1/9/2022 · 10 de novembro de\n2021 · 10/9/2020\n\n### Normas alteradas ou revogadas\n\n- revogada a Instrução Normativa BCB nº 722, de 13 de abril de 2026\n- revogado pela Instrução Normativa BCB nº 752,\n\n### Dispositivos que tocam o escopo Rastro\n\n- Resolução Nº 222 \n INSTRUÇÃO NORMATIVA BCB Nº 742, DE 9 DE JUNHO DE 2026 Documento normativo revogado pela Instrução Normativa BCB nº 752, de 1/7/2026. Divulga a versão  8.3 do Manual  Operacional do Diretório de Identificadores de Contas Transacionais (DICT), que compõe o Regulamento do Pix. O Chefe substituto do Departamento de Competição e de Estrutura do Mercado Financeiro (Decem), no uso das atribuições que lhe conferem os arts. 23, inciso I, alínea “a”, e 94, inciso IX, do Regimento Interno do Banco Central do Brasil, anexo à Resolução BCB nº 340, de 21 de setembro de 2023, e tendo em vi\n\n- Art. 1º  Esta Instrução Normativa divulga a versão ento dos limites mínimos de capital social integralizado e de patrimônio líquido, para fins de participação no Pix na modalidade de provedor de conta transacional, bem como o prazo para a sua recomposição.                     O Chefe do Departamento de Competição e de Estrutura do Mercado Financeiro (Decem), no uso das atribuições que lhe conferem os arts. 23, inciso I, alínea “a”, e 94, inciso IX, do Regimento Interno do Banco Central do Brasil, anexo à Resolução BCB nº 340, de 21 de setemb\n\n- Art. 2º  Caso o participante do Pix apresente, para o capital social integralizado ou para o patrimônio líquido, saldo inferior ao limite mínimo previsto no art. 3º‑A da Resolução BCB nº 1, de 2020, ou deixe de encaminhar os documentos referidos no art. 1º até o prazo estabelecido na Instrução Normativa BCB nº 195, de 2021, o Decem encaminhará comunicação ao participante, preferencialmente por meio do Sistema de Correio Eletrônico do Banco Central do Brasil – BC Correio, informando sobre a necessidade de comprovação do atendimento aos limites regulamentares. Parágrafo único.  A comprovação do \n\n- Art. 3º  O prazo para comprovação do atendimento dos limites mínimos de capital social integralizado e de patrimônio líquido, de que trata a alínea “b” do inciso I do § 1º do art. 31 do Regulamento do Pix, anexo à Resolução BCB nº 1, de 2020, corresponderá ao prazo‑limite para a entrega dos documentos mencionados no art. 1º, referentes ao terceiro mês subsequente àquele em que tenha ocorrido o descumprimento dos limites regulamentares. Parágrafo único.  A não apresentação dos documentos no prazo referido no  caput  será considerada como não observância dos limites mínimos de capital social int\n\n- Art. 5º  Esta Instrução Normativa entra em vigor na data de sua publicação. RICARDO TEIXEIRA LEITE MOURÃO NOTA                         O Decreto nº 10.411, de 30 de junho de 2020, prevê a obrigatoriedade da realização de análise de impacto regulatório (AIR) para a edição de atos normativos de interesse geral produzidos pelos órgãos e entidades da administração pública federal direta e indireta.                         Todavia, em linha com o Voto 280/2021–BCB, de 10 de novembro de 2021, o Regulamento do Pix, bem como os documentos que o integram, detalham ou complementam, não se caracterizam c\n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n"}, {"info": {"id": "bcb-ingest-instrucao-normativa-bcb-752-2026-07-01", "titulo": "IN BCB nº 752, de 1º/7/2026 — Manual Operacional do DICT v8.4 (prazos do MED 2.0)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2026-07-02", "tags": "[pix, dict, med, recuperacao-de-valores, prazos-operacionais]", "grupo": "normas", "caminho": "normas/bcb/bcb-ingest-instrucao-normativa-bcb-752-2026-07-01.md", "quando": "2026-07-14"}, "meta": {"id": "bcb-ingest-instrucao-normativa-bcb-752-2026-07-01", "tipo": "norma", "titulo": "IN BCB nº 752, de 1º/7/2026 — Manual Operacional do DICT v8.4 (prazos do MED 2.0)", "orgao": "BCB", "data_publicacao": "2026-07-02", "vigencia": "", "altera": "[\"Revoga a IN BCB nº 742, de 9/6/2026\"]", "fase_rastro": "[war_room, prontidao]", "conexao_comercial": "[retainer, diagnostico, benchmark]", "fonte_primaria": "https://www.bcb.gov.br/content/estabilidadefinanceira/pix/Regulamento_Pix/X_ManualOperacionaldoDICT.pdf", "status": "fichado", "tags": "[pix, dict, med, recuperacao-de-valores, prazos-operacionais]", "confidencial": "false"}, "corpo": "\n# IN BCB 752/2026 — Manual do DICT v8.4: os prazos operacionais do MED 2.0\n\nIN publicada no DOU de 2/7/2026 (S.1, p. 113-116), divulgando a versão 8.4 do Manual Operacional do DICT; revoga a IN 742/2026. Fichada com leitura direta do PDF oficial (bcb.gov.br, 145 p.) em 2026-07-14 — capítulo 20, \"Fluxo de Recuperação de Valores\" (instauração → rastreamento → priorização → bloqueio → análise → devolução).\n\n## Os prazos operacionais (transcrições do Manual)\n\n- **Instauração: imediata, sem prazo em horas** — \"A abertura da Recuperação de Valores deve ocorrer de forma imediata, logo após a identificação da suspeita de fraude ou o recebimento da reclamação por parte do usuário\" (seção 20). A análise de mérito vem DEPOIS da instauração.\n- **Janela de contestação da transação**: pacs.008 (transação Pix) até **80 dias corridos**; pacs.004 (devolução) até **30 dias corridos** (seção 20.1.1).\n- **Bloqueio pela cadeia: imediato** — os participantes notificados \"deverão bloquear imediatamente os recursos solicitados nas contas de seus usuários, até o limite do saldo disponível\", com novos bloqueios à medida que entrarem recursos (seção 20.1.4).\n- **Análise da notificação de infração: 7 dias** (Manual de Tempos do Pix, cf. seção 20/p. 119).\n- **Início da devolução: 72 horas** após encerrada a análise — \"o participante recuperador tem até 72 horas para iniciar a etapa de devolução\"; o DICT conclui automaticamente (COMPLETED) a recuperação cuja devolução não for iniciada no prazo (seção 20.1.6). Devoluções sequenciais na ordem definida pelo DICT.\n- **Saltos: SEM número fixo** — profundidade é parâmetro do PSP recuperador na instauração (MaxHops); critérios mínimos de rastreabilidade serão comunicados pelo BCB fora do Manual (seção 20.1.2).\n- Regras de fecho: uma única Recuperação de Valores por transação; cancelamento impede reabertura (20.1.1); desbloqueio só após rejeição da NI, conclusão da devolução ou encerramento (20.1.7); as NIs do escopo do MED correm dentro da Recuperação de Valores (abertas automaticamente pelo DICT).\n\n## Aplicação prática no ciclo Rastro\n\nWar room: o playbook agora tem números — instauração imediata (o \"espera o jurídico de manhã\" viola o Manual), 7 dias de análise, 72h para iniciar a devolução sob pena de conclusão automática do procedimento (perda operacional irreversível: monitorar esse relógio é tarefa do coordenador). Prontidão: a janela de 80 dias corridos de contestação define até quando um cliente lesado ainda alcança o MED — pergunta de triagem de novos casos. Benchmark: aderência do fluxo interno do cliente a cada etapa/prazo do capítulo 20.\n\n## Lacunas\n\n- Prazo para o PSP recebedor EFETIVAR cada devolução após a solicitação: remetido ao \"Manual de Tempos do Pix\" (documento apartado, não lido) — NAO_CONFIRMADO; fichar o Manual de Tempos.\n- Critérios mínimos de rastreabilidade (e do art. 39-C da Res. 506): comunicados fora do Manual — monitorar.\n- O Manual é versionado (v8.4 revoga v8.3 da IN 742): revisões futuras chegam pelo monitor; conferir versão vigente antes de citar em peça.\n\n## Relações\n\n[[bcb-res-493-2025]] · [[bcb-res-506-2025]] · [[hub-pix-med]] · [[hub-matriz-prazos]] · [[estudo-72h-aprofundamento]]\n"}, {"info": {"id": "bcb-ingest-instrucao-normativa-bcb-766-2026-07-27", "titulo": "Instrução Normativa BCB N° 766 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2026-07-27", "tags": "[pix, dict]", "grupo": "normas", "caminho": "normas/bcb/bcb-ingest-instrucao-normativa-bcb-766-2026-07-27.md", "quando": "2026-07-29"}, "meta": {"id": "bcb-ingest-instrucao-normativa-bcb-766-2026-07-27", "tipo": "norma", "titulo": "Instrução Normativa BCB N° 766 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "data_publicacao": "2026-07-27", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=766", "status": "a_fichar", "tags": "[pix, dict]", "confidencial": "false"}, "corpo": "\n## Ementa (retornada pela API do BCB — conferir no texto oficial)\n\nDivulga a versão 8.5 do Manual Operacional do Diretório de Identificadores de Contas Transacionais (DICT), que compõe o Regulamento do Pix.\n\n## Texto oficial (extração automática, 2026-07-29)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** Publicada no DOU de 29/7/2026, Seção 1, p. 93-97.\n**Ementa oficial:** Divulga a versão 8.5 do Manual Operacional do Diretório de Identificadores de Contas Transacionais (DICT), que compõe o Regulamento do Pix.\n\n### Vigência (dispositivos transcritos)\n\n- Nenhum dispositivo de vigência localizado automaticamente. Conferir no texto.\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 01/04/2025 · 01/07/2025 · 01/07/2026 · 01/09/2026 · 01/10/2025 · 02/02/2026 · 02/09/2024 · 09/06/2026 · 09/12/2024 · 1/12/2023 · 1/9/2022 · 10 de\nagosto de 2026\n\n### Normas alteradas ou revogadas\n\n- revogada a Instrução Normativa BCB nº 752, de 1º de julho de 2026\n\n### Dispositivos que tocam o escopo Rastro\n\n- Resolução Nº 222 \n INSTRUÇÃO NORMATIVA BCB Nº 766, DE 27 DE JULHO DE 2026 Divulga a versão  8.5 do Manual  Operacional do Diretório de Identificadores de Contas Transacionais (DICT), que compõe o Regulamento do Pix. O Chefe do Departamento de Competição e de Estrutura do Mercado Financeiro (Decem), no uso das atribuições que lhe conferem os arts. 23, inciso I, alínea “a”, e 94, inciso IX, do Regimento Interno do Banco Central do Brasil, anexo à Resolução BCB nº 340, de 21 de setembro de 2023, e tendo em vista o disposto no art. 2º, inciso X, do Regulamento anexo à Resolução BCB nº 1, de 12 de \n\n- Art. 1º  Esta Instrução Normativa divulga a versão 8.5 do Manual Operacional do Diretório de Identificadores de Contas Transacionais (DICT), que compõe o Regulamento do Pix, conforme art. 2º do Regulamento anexo à Resolução BCB nº 1, de 12 de agosto de 2020. Parágrafo único.  O Manual Operacional do DICT está disponível no endereço eletrônico do Banco Central do Brasil na internet:  https://www.bcb.gov.br/content/estabilidadefinanceira/pix/Regulamento_Pix/X_ManualOperacionaldoDICT.pdf\n\n- Art. 3º  Esta Instrução Normativa entra em vigor: I - em 10 de agosto de 2026, para as alterações das seções 10.1 e 20.1.5; e II - em 1º de setembro de 2026, para as alterações das seções 20.1.1, 20.1.9 e 20.2 e para a revogação de que trata o art. 2º. RICARDO TEIXEIRA LEITE MOURÃO   ANEXO À INSTRUÇÃO NORMATIVA BCB Nº 766, DE 27 DE JULHO DE 2026 Manual Operacional do Diretório de Identificadores de Contas Transacionais (DICT) Histórico de revisão                                                                               Data       Versão       Descrição das alterações         11/8/2020     \n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n"}, {"info": {"id": "bcb-ingest-resolucao-bcb-576-2026-06-23", "titulo": "Resolução BCB N° 576 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2026-06-23", "tags": "[instituicoes de pagamento]", "grupo": "normas", "caminho": "normas/bcb/bcb-ingest-resolucao-bcb-576-2026-06-23.md", "quando": "2026-07-29"}, "meta": {"id": "bcb-ingest-resolucao-bcb-576-2026-06-23", "tipo": "norma", "titulo": "Resolução BCB N° 576 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "data_publicacao": "2026-06-23", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=576", "status": "a_fichar", "tags": "[instituicoes de pagamento]", "confidencial": "false"}, "corpo": "\n## Ementa (retornada pela API do BCB — conferir no texto oficial)\n\n  Dispõe sobre a política de sucessão de administradores das administradoras de consórcio, das sociedades corretoras de títulos e valores mobiliários, das sociedades distribuidoras de títulos e valores mobiliários, das sociedades corretoras de câmbio, das sociedades prestadoras de serviços de ativos virtuais e das instituições de pagamento.\n\n## Texto oficial (extração automática, 2026-07-29)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** Publicado no DOU de 25/06/2026, Seção 1, p. 214/215.\n**Ementa oficial:** Dispõe sobre a política de sucessão de administradores das administradoras de consórcio, das sociedades corretoras de títulos e valores mobiliários, das sociedades distribuidoras de títulos e valores mobiliários, das sociedades corretoras de câmbio, das sociedades prestadoras de serviços de ativos virtuais e das instituições de pagamento.\n\n### Vigência (dispositivos transcritos)\n\n- Art. 7º  Esta Resolução entra em vigor em 1º de janeiro de 2027. GILNEU FRANCISCO ASTOLFI VIVAN Diretor de Regulação\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 13 de junho de 2023 · 14 de julho de 1965 · 1º de janeiro de 2027 · 21\nde dezembro de 2022 · 23 DE JUNHO\nDE 2026 · 23 de junho de 2026 · 8 de outubro de 2008 · 9 de outubro de 2013\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n"}, {"info": {"id": "bcb-res-142-2021", "titulo": "Resolução BCB nº 142, de 23/9/2021 (prevenção de fraudes em pagamentos — consolidada com a Res. 501/2025)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2021-09-24", "tags": "[fraude, prevencao, limites, rejeicao, contas-laranja, pix]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-142-2021.md", "quando": "2026-07-15"}, "meta": {"id": "bcb-res-142-2021", "tipo": "norma", "titulo": "Resolução BCB nº 142, de 23/9/2021 (prevenção de fraudes em pagamentos — consolidada com a Res. 501/2025)", "orgao": "BCB", "data_publicacao": "2021-09-24", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico, adversarial]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=142", "status": "fichado", "tags": "[fraude, prevencao, limites, rejeicao, contas-laranja, pix]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 142/2021 — a norma real de \"controles antifraude\" (consolidada)\n\nVerificada no inteiro teor consolidado (API BCB) em 2026-07-15, já com a alteração da Resolução BCB nº 501, de 11/9/2025. DOU 24/9/2021, S.1, p. 49. Esta é a norma-base REAL sobre procedimentos e controles de prevenção de fraudes em serviços de pagamento — o objeto que material externo atribuiu falsamente às \"Res. 402/2024 e 475/2025\".\n\n## Ementa\n\n\"Dispõe sobre procedimentos e controles para prevenção de fraudes na prestação de serviços de pagamento a serem adotados pelas instituições financeiras, demais instituições autorizadas a funcionar pelo Banco Central do Brasil e instituições de pagamento integrantes do Sistema de Pagamentos Brasileiro (SPB).\"\n\n## Obrigações principais (redação vigente)\n\n- **Limite noturno**: teto para transações entre pessoas naturais distintas no período das 20h às 6h (art. 2º), incluindo agendadas à noite com liquidação antes das 6h (§2º); limites compatíveis com o perfil de risco do cliente (§3º).\n- **Trava de 24h para aumento de limite**: prazo mínimo de vinte e quatro horas para efetivar aumento de limites pedido pelo cliente em canal eletrônico (art. 2º, II) — a defesa técnica contra o golpe que eleva o limite e drena em seguida.\n- **Art. 2º-A (incluído pela Res. 501/2025) — o dever de REJEIÇÃO**: literal: as instituições, \"quando constatarem identificação de fundada suspeita de envolvimento de fraude em contas de depósitos à vista, contas de depósitos de poupança e contas de pagamento pré-pagas, devem rejeitar transações de pagamento que tenham essas contas como destinatárias\". §2º: a avaliação da fundada suspeita \"deve incluir fatores a critério de cada instituição, podendo inclusive se utilizar de informações constantes em sistemas eletrônicos e bases de dados de caráter público ou privado\" (ponte direta com o sistema da [[resolucao-conjunta-6-2023]]). §3º: dever de comunicar ao titular a rejeição. §4º: implementação até 13/10/2025.\n- Facultar ao cliente limites por período e cadastro prévio de contas destinatárias (art. 3º).\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: é o coração do bloco \"detecção\" do diagnóstico — limites noturnos, trava de 24h, motor de fundada suspeita e o fluxo de rejeição do art. 2º-A (item de auditoria novo: como a instituição forma e documenta a fundada suspeita sobre contas DESTINATÁRIAS). Defesa: o descumprimento do art. 2º-A por banco recebedor de conta-laranja é argumento de responsabilização dele (dialoga com o REsp 2.124.423 do [[dossie-pix-fortuito]]); no polo passivo, a rejeição documentada é prova de diligência. Contencioso emergente: rejeição/marcação indevida — o mesmo risco mapeado na [[bcb-res-343-2023]].\n\n## Lacunas\n\n- Res. BCB 501/2025: fichada aqui por consolidação; ficha própria se a minuta exigir (ementa própria e contexto do pacote de set/2025).\n- Valores exatos do limite noturno (fixados em normativo complementar/versões anteriores): conferir no texto integral ao citar.\n- IN BCB 664/2025 (prazos de adequação de PSTIs, citada em fontes secundárias): não verificada.\n\n## Relações\n\n[[resolucao-conjunta-6-2023]] · [[bcb-res-343-2023]] · [[bcb-res-506-2025]] · [[bcb-res-493-2025]] · [[hub-catalogo-medidas]] · [[hub-matriz-prazos]]\n"}, {"info": {"id": "bcb-res-343-2023", "titulo": "Resolução BCB nº 343, de 4 de outubro de 2023 (execução do compartilhamento de fraude — consolidada)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2023-10-06", "tags": "[fraude, compartilhamento, marcacao, pix, bets, ativos-virtuais, prazos]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-343-2023.md", "quando": "2026-07-14"}, "meta": {"id": "bcb-res-343-2023", "tipo": "norma", "titulo": "Resolução BCB nº 343, de 4 de outubro de 2023 (execução do compartilhamento de fraude — consolidada)", "orgao": "BCB", "data_publicacao": "2023-10-06", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico, retainer, adversarial]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=343", "status": "fichado", "tags": "[fraude, compartilhamento, marcacao, pix, bets, ativos-virtuais, prazos]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 343/2023 — a mecânica do compartilhamento (texto consolidado)\n\nVerificada no inteiro teor consolidado (API BCB) em 2026-07-14, já com as alterações das Resoluções BCB 552/2026 (ativos virtuais) e 569/2026 (bets). DOU 6/10/2023, S.1, p. 112.\n\n## Ementa\n\nLiteral: \"Dispõe sobre as medidas necessárias à execução do compartilhamento de dados e informações sobre indícios de fraudes de que trata a Resolução Conjunta nº 6, de 23 de maio de 2023.\"\n\n## O relógio central: 24 HORAS\n\nArt. 4º: registro do indício em no máximo **24 horas** da identificação; o MESMO prazo de 24h para **alteração e exclusão**, contado da identificação da necessidade. Declaração de conformidade mensal até o dia 15 (art. 5º). O prazo de exclusão em 24h é a blindagem contra a marcação indevida — e a prova de negligência de quem não exclui.\n\n## Rol de atividades cujos indícios obrigam registro (art. 2º, redação vigente)\n\nI - abertura de conta; II - prestação de serviço de pagamento (§1º: transferências internas, TED, cheque, **Pix**, DOC, boletos, saques); III - manutenção de conta; IV - operação de crédito; V - serviços de ativos virtuais (Res. 552/2026); VI - serviços financeiros/de pagamento a **operadoras de apostas não autorizadas** (Res. 569/2026, com base no art. 24-A, I da Lei 14.790/2023 — o sistema antifraude virou enforcement do mercado de bets ilegais; art. 1º-A e art. 3º, §4º).\n\n## O campo crítico para o contencioso (art. 3º)\n\nO registro detalha: identificação do suposto fraudador, descrição com data/hora/local/valor/canal/**dispositivo eletrônico**, e a \"indicação se houve ou não a atuação do cliente\" — sendo que o §3º manda registrar a atuação \"independentemente de ter sido induzida ou não por terceiros\". Tradução: a vítima de engenharia social que executou o Pix é registrada como tendo ATUADO. Esse campo serve à tese de culpa exclusiva/concorrente — e expõe quem registrar a vítima como executora sem lastro.\n\n## Demais obrigações\n\nUnicidade do registro (um indício, um sistema — art. 6º, §2º); leiautes padronizados e interoperabilidade; segurança com teste de intrusão anual independente (art. 8º); SLA de disponibilidade ≥ 99,8%/ano e RTO ≤ 2h (art. 9º); guarda de 5 anos (art. 12). Sem notificação ao marcado nem rito de contestação (o direito de acesso/correção fica na RC 6, art. 4º, III, \"h\").\n\n## Aplicação prática no ciclo Rastro\n\nWar room: o registro em 24h entra no playbook como obrigação paralela ao MED e à marcação no DICT (três camadas autônomas e cumulativas). Prontidão: auditar critérios de indício, fluxo de 24h (registro E exclusão) e a declaração mensal. Defesa: em ação de cliente marcado, a linha do tempo das 24h (registro fundamentado; exclusão tempestiva quando o indício caiu) é a prova central; no polo ativo, a omissão de registro por outra instituição é indício de falha sistêmica dela.\n\n## Lacunas\n\n- Res. BCB 552/2026 (também altera a Res. 85 e a 498): pendente de ficha própria — recorrente demais para ficar sem.\n- INs BCB 590/2025 e 592/2025 (operacionalização): não fichadas.\n- Interação marcação × recusa de conta: sem regra expressa — monitorar jurisprudência sobre marcação indevida.\n\n## Relações\n\n[[resolucao-conjunta-6-2023]] · [[bcb-res-569-2026]] · [[hub-matriz-prazos]] · [[bcb-res-506-2025]] · [[hub-catalogo-medidas]]\n"}, {"info": {"id": "bcb-res-493-2025", "titulo": "Resolução BCB nº 493, de 28 de agosto de 2025 (MED 2.0)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2025-08-29", "tags": "[pix, med, recuperacao-de-valores, fraude]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-493-2025.md", "quando": "2026-07-03"}, "meta": {"id": "bcb-res-493-2025", "tipo": "norma", "titulo": "Resolução BCB nº 493, de 28 de agosto de 2025 (MED 2.0)", "orgao": "BCB", "data_publicacao": "2025-08-29", "vigencia": "", "altera": "[\"Resolução BCB nº 1/2020 (arranjo Pix e regulamento anexo)\"]", "fase_rastro": "[prontidao, war_room]", "conexao_comercial": "[benchmark, diagnostico, retainer]", "fonte_primaria": "https://pesquisa.in.gov.br/imprensa/servlet/INPDFViewer?jornal=515&pagina=187&data=29/08/2025&captchafield=firstAccess", "status": "fichado", "tags": "[pix, med, recuperacao-de-valores, fraude]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 493/2025 — MED 2.0\n\n## Ementa\n\nEmenta oficial (literal): \"Altera a Resolução BCB nº 1, de 12 de agosto de 2020, que institui o arranjo de pagamentos Pix e aprova o seu regulamento, para ajustar dispositivos relacionados ao funcionamento do Fórum Pix, e altera o regulamento anexo à Resolução BCB nº 1, de 12 de agosto de 2020, para aprimorar o Mecanismo Especial de Devolução e os procedimentos de alteração de informações vinculadas às chaves Pix.\" Publicada no DOU de 29/08/2025, Edição nº 164, Seção 1, p. 187.\n\n## Vigência e prazos\n\nEntra em vigor na data da publicação, com efeitos escalonados (art. 4º): efeitos imediatos para a maior parte dos artigos e efeitos em 2 de fevereiro de 2026 para o art. 3º. Pelo art. 121 do regulamento anexo (redação dada), a funcionalidade de recuperação de valores pode ser implementada facultativamente a partir de 23 de novembro de 2025 e deve ser implementada obrigatoriamente, pelos participantes nas modalidades provedor de conta transacional e liquidante especial, a partir de 2 de fevereiro de 2026. São duas datas distintas — facultativa e obrigatória — e ambas constam do texto oficial.\n\n## Obrigações principais\n\nCria a \"recuperação de valores\": procedimento de rastreamento, de bloqueio e de devolução de valores no âmbito do Pix decorrente de suspeita de fraude na transação (art. 54, XII do regulamento). A instauração cabe ao PSP do pagador após reclamação do usuário, mediante fundada suspeita de fraude (art. 78-N). O detalhamento operacional é remetido ao Manual Operacional do DICT. O material oficial do BCB (Circuito Pix, Decem/Diseg) descreve o rastreio em múltiplos saltos com bloqueio em cadeia e devoluções sequenciais/parciais conforme o saldo bloqueado em cada conta, e confirma o pacote normativo de 28/8/2025 (Res. 493 + INs BCB 653, 654 e 655) e a IN BCB 673/2025 (requisitos de experiência do usuário).\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: verificar se o cliente (PSP pagador/recebedor) implementou a recuperação de valores no prazo obrigatório e se seus fluxos de atendimento acionam o MED corretamente — item central do questionário IMCI-Fraude. War room: nas 72h, o acionamento tempestivo do rastreio e bloqueio multi-salto é a principal alavanca de recuperação do valor fraudado; o playbook de incidente deve mapear quem aciona, como e em que prazo.\n\n## Conexão comercial\n\nAlimenta o benchmark IMCI-Fraude (maturidade de implementação do MED 2.0), o diagnóstico de prontidão e o retainer de war room (procedimento operacional de acionamento).\n\n## Lacunas\n\n- \"Produção plena em 11/6/2026\": NAO_CONFIRMADO. Essa data não consta do texto da Resolução 493 publicado no DOU nem do material oficial do BCB consultado; circula apenas em fontes secundárias (imprensa). Se o operador tiver fonte primária para essa data (ex.: instrução normativa ou manual operacional do DICT com cronograma próprio), fichar a fonte e atualizar o cronograma.\n- \"Autofraude/MED por coerção\": NAO_CONFIRMADO como obrigação desta resolução — os termos coação/sequestro/autofraude não aparecem no texto publicado no DOU. Verificar se o tema está em instrução normativa ou manual operacional apartado.\n- INs BCB 653, 654, 655 e 673/2025 (detalhamento operacional): ainda não fichadas.\n\n## Relações\n\n[[hub-pix-med]] · [[hub-matriz-prazos]] · [[bcb-res-494-498-2025]] · [[stj-sumula-479]]\n"}, {"info": {"id": "bcb-res-494-498-2025", "titulo": "Resoluções BCB nº 494 a 498, de 5 de setembro de 2025 (autorização de IPs, PSTI e seguro)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2025-09-05", "tags": "[instituicao-de-pagamento, psti, autorizacao, seguro, rsfn, pix, ted]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-494-498-2025.md", "quando": "2026-07-14"}, "meta": {"id": "bcb-res-494-498-2025", "tipo": "norma", "titulo": "Resoluções BCB nº 494 a 498, de 5 de setembro de 2025 (autorização de IPs, PSTI e seguro)", "orgao": "BCB", "data_publicacao": "2025-09-05", "vigencia": "", "altera": "[\"Resolução BCB nº 80/2021\", \"Resolução BCB nº 81/2021\", \"Resolução BCB nº 1/2020 (Pix)\", \"Resolução BCB nº 256/2022 (TED)\", \"Circular nº 3.970/2019 (dispositivos revogados)\"]", "fase_rastro": "[prontidao]", "conexao_comercial": "[benchmark, diagnostico]", "fonte_primaria": "https://pesquisa.in.gov.br/imprensa/servlet/INPDFViewer?jornal=600&pagina=1&data=05/09/2025&captchafield=firstAccess", "status": "fichado", "tags": "[instituicao-de-pagamento, psti, autorizacao, seguro, rsfn, pix, ted]", "confidencial": "false"}, "corpo": "\n# Pacote BCB de 5/9/2025 — Resoluções 494 a 498\n\n## Ementa\n\nPacote de cinco resoluções da Diretoria Colegiada (sessão de 3/9/2025), publicado na Edição Extra do DOU nº 169-A, de 05/09/2025, Seção 1. Endurece o perímetro prudencial: autorização prévia obrigatória de instituições de pagamento, requisitos para PSTIs (provedores de serviços de TI com acesso à RSFN), limites transacionais para não autorizados e seguro obrigatório de responsabilidade civil.\n\n## O que cada resolução trata\n\n- Res. 494 (altera a Res. BCB 80/2021): autorização prévia do BCB para toda IP iniciar prestação de serviço de pagamento; IPs pré-existentes não autorizadas devem protocolar pedido entre 1º/5/2026 e 31/5/2026.\n- Res. 495 (altera a Res. BCB 81/2021): novos requisitos de autorização — capacitação técnica dos administradores, capital/patrimônio mínimos, comprovação de sede física. Vigor na data de publicação.\n- Res. 496 (altera a Res. BCB 1/2020 — Pix): ajusta autorização de IPs participantes do Pix (pedido entre 1º/1/2026 e 1º/5/2026) e impõe limite de R$ 15.000,00 por transação Pix a IPs não autorizadas e a participantes conectados à RSFN via PSTI não credenciado (afastável mediante credenciamento do PSTI + relatório de asseguração de auditoria independente). Vigência escalonada: 180 dias após a publicação para as alterações ao art. 26 do regulamento; demais dispositivos na data de publicação.\n- Res. 497 (altera a Res. BCB 256/2022 — TED): veda TED ≥ R$ 15.000,00 por instituição que acessa a RSFN via PSTI não credenciado, com as mesmas exceções.\n- Res. 498 (norma nova): disciplina o credenciamento do PSTI para acesso à RSFN — governança (diretores de segurança e de riscos/compliance, comitê de crises), gestão de riscos, política de fraudes com monitoramento 24/7, plano de saída ordenada, e comprovação de contratação de seguro de responsabilidade civil e de riscos operacionais com cobertura mínima definida pelo BCB, incluindo incidentes de fraude e segurança cibernética (art. 3º, XIII, conforme texto consolidado oficial em bcb.gov.br — verificação anterior indicava art. 17; numeração conferida no inteiro teor em 2026-07-10). Pedido de credenciamento de PSTIs em funcionamento em até 4 meses da entrada em vigor (art. 37, §3º); adaptação conforme cronograma a ser publicado pelo BCB. Vigor na data de publicação (art. 39); revoga dispositivos da Circular 3.970/2019.\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: define o mapa de exposição regulatória do cliente fintech/BaaS — está autorizado? o PSTI é credenciado? há seguro com cobertura mínima? os limites de R$ 15 mil se aplicam? São perguntas diretas do questionário IMCI-Fraude e do diagnóstico. O contexto do pacote (resposta a incidentes de segurança na cadeia de PSTIs) é também argumento comercial para o recorte fintechs/BaaS.\n\n## Conexão comercial\n\nAlimenta o benchmark IMCI-Fraude (bloco de perímetro regulatório) e o diagnóstico de prontidão.\n\n## Alteração superveniente\n\nA Res. 498 foi alterada pela **Resolução BCB nº 547, de 30/1/2026** (identificada no texto consolidado em 2026-07-10): manteve o seguro obrigatório (art. 3º, XIII, sem nova redação), revogou o inciso XIV (Plano de Continuidade com comprovação anual), abrandou redações dos incisos VII a XII (capital mínimo de R$ 15 milhões mantido, com critérios ajustados). Res. 547 pendente de fichamento próprio.\n\n## Lacunas\n\n- A data exata do marco de 180 dias da Res. 496 (calculada como 4/3/2026) e a do teto de 4 meses da Res. 498 (calculada como 5/1/2026) são cômputos aritméticos a partir de 5/9/2025 — conferir regra de contagem no texto integral antes de usar em entregável.\n- Cronograma de adaptação dos PSTIs \"a ser publicado pelo BCB\" (Res. 498): monitorar; ainda não localizado.\n- Fichamento individual por resolução (um arquivo por norma) pode ser necessário quando o uso comercial exigir granularidade; por ora fichadas em bloco por integrarem um pacote único de publicação.\n\n## Relações\n\n[[hub-seguranca-cibernetica]] · [[hub-pix-med]] · [[hub-matriz-prazos]] · [[bcb-res-538-2025]]\n"}, {"info": {"id": "bcb-res-506-2025", "titulo": "Resolução BCB nº 506, de 26 de setembro de 2025 (segurança do arranjo Pix e marcação de fraude no DICT)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2025-09-30", "tags": "[pix, dict, marcacao-de-fraude, seguranca, autorizacao]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-506-2025.md", "quando": "2026-07-14"}, "meta": {"id": "bcb-res-506-2025", "tipo": "norma", "titulo": "Resolução BCB nº 506, de 26 de setembro de 2025 (segurança do arranjo Pix e marcação de fraude no DICT)", "orgao": "BCB", "data_publicacao": "2025-09-30", "vigencia": "", "altera": "[\"Resolução BCB nº 1/2020 (arranjo Pix e regulamento anexo)\"]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico, adversarial]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=506", "status": "fichado", "tags": "[pix, dict, marcacao-de-fraude, seguranca, autorizacao]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 506/2025 — segurança do arranjo Pix\n\n## Ementa\n\nEmenta oficial: altera a Resolução BCB nº 1/2020 para ajustar o critério de autorização das IPs não autorizadas participantes do Pix, e altera o regulamento anexo \"para aprimorar os mecanismos de segurança do arranjo e para ajustar dispositivos relativos às penalidades\". Diretoria Colegiada, sessão extraordinária de 26/09/2025; DOU de 30/9/2025, Seção 1, p. 448/449. Verificada no inteiro teor oficial (bcb.gov.br, exibenormativo).\n\n## Dispositivos-chave (transcrição do inteiro teor)\n\n- Art. 39-C (regulamento): \"Para fins de avaliação de suspeita de fraude ou de fundada suspeita de fraude em transações Pix, os participantes deverão adotar, no mínimo, os critérios indicados pelo Banco Central do Brasil, a ser divulgado em documento específico.\" — O BCB objetiva o juízo de \"fundada suspeita\" que dispara o MED (art. 78-N).\n- Art. 78-HA: \"O participante pode criar uma notificação de infração para marcação de fraude transacional, que permite a marcação de CPF ou de CNPJ de seu cliente que esteja envolvido em episódio de fraude relacionado a uma transação Pix específica.\"\n- Art. 89, §2º: o participante que aceitar notificação de infração ou criar marcação de fraude \"deve rejeitar todas as transações Pix que tenham o usuário envolvido na notificação como pagador ou como recebedor, bem como a conta envolvida\", salvo devoluções.\n- Efeitos da marcação sobre o ciclo da chave Pix: rejeição de registro de chave (art. 66, §3º), vedação de portabilidade (art. 68, §2º) e de reivindicação de posse (art. 70, §2º) para usuários marcados.\n- Art. 37: limites de valor só com base em critérios de mitigação de risco de fraude e PLD-FT, considerados características e perfil do usuário pagador.\n- Art. 3º, §9º da Resolução 1/2020: janelas escalonadas de pedido de autorização das IPs participantes (ver cronograma); descumprimento = hipótese de perda da condição de participante.\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: os critérios mínimos do art. 39-C (documento específico do BCB — monitorar publicação) e o uso da marcação 78-HA viram itens de auditoria do benchmark/IPR-72. War room: marcar a fraude no DICT e rejeitar transações do marcado (art. 89, §2º) integra o playbook logo após o acionamento do MED. Defesa: o conjunto forma o parâmetro objetivo de conduta exigível — cumprimento documentado sustenta fato exclusivo de terceiro; descumprimento caracteriza defeito do serviço.\n\n## Lacunas\n\n- \"Documento específico\" com os critérios mínimos do art. 39-C: publicação a monitorar — NAO_CONFIRMADO se já editado.\n- O termo \"bloqueio cautelar\" NÃO aparece nas alterações desta resolução; o instituto preexiste no regulamento do Pix (norma-base Res. 1/2020, não fichada) — não atribuir o bloqueio cautelar à 506 nem à 493.\n- Interação com o Manual de Penalidades do Pix (citado no texto): não fichado.\n\n## Relações\n\n[[hub-pix-med]] · [[bcb-res-493-2025]] · [[bcb-res-494-498-2025]] · [[hub-matriz-prazos]] · [[dossie-pix-fortuito]]\n"}, {"info": {"id": "bcb-res-538-2025", "titulo": "Resolução BCB nº 538, de 18 de dezembro de 2025 (segurança cibernética)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2025-12-22", "tags": "[seguranca-cibernetica, instituicao-de-pagamento, nuvem]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-538-2025.md", "quando": "2026-07-03"}, "meta": {"id": "bcb-res-538-2025", "tipo": "norma", "titulo": "Resolução BCB nº 538, de 18 de dezembro de 2025 (segurança cibernética)", "orgao": "BCB", "data_publicacao": "2025-12-22", "vigencia": "", "altera": "[\"Resolução BCB nº 85/2021 (política de segurança cibernética)\"]", "fase_rastro": "[prontidao, war_room]", "conexao_comercial": "[benchmark, diagnostico]", "fonte_primaria": "https://pesquisa.in.gov.br/imprensa/servlet/INPDFViewer?jornal=515&pagina=448&data=22/12/2025&captchafield=firstAccess", "status": "fichado", "tags": "[seguranca-cibernetica, instituicao-de-pagamento, nuvem]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 538/2025 — segurança cibernética\n\n## Ementa\n\nEmenta oficial (literal): \"Altera a Resolução BCB nº 85, de 8 de abril de 2021, que dispõe sobre a política de segurança cibernética e sobre os requisitos para a contratação de serviços de processamento e armazenamento de dados e de computação em nuvem a serem observados pelas instituições de pagamento, pelas sociedades corretoras de títulos e valores mobiliários, pelas sociedades distribuidoras de títulos e valores mobiliários e pelas sociedades corretoras de câmbio autorizadas a funcionar pelo Banco Central do Brasil.\" Assinada em 18/12/2025 (sessão da Diretoria Colegiada de 3/12/2025); publicada no DOU de 22/12/2025, Edição nº 243, Seção 1, p. 448.\n\n## Vigência e prazos\n\nEntra em vigor na data da publicação (art. 3º). As instituições em funcionamento na data de entrada em vigor devem promover as adaptações necessárias até 1º de março de 2026 (art. 2º, literal).\n\n## Obrigações principais\n\nAmplia os procedimentos e controles mínimos do art. 3º da Resolução BCB 85/2021; exige documentação dos critérios de configuração de crise (art. 20, parágrafo único); exige testes de intrusão com documentação de resultados e planos de correção de vulnerabilidades (art. 22-A, III). Escopo subjetivo: instituições de pagamento, corretoras e distribuidoras de TVM e corretoras de câmbio autorizadas pelo BCB.\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: a adequação até 1º/3/2026 é gatilho imediato de diagnóstico — política atualizada, testes de intrusão realizados e documentados, critérios de crise formalizados. War room: a existência (ou não) desses controles documentados define a exposição regulatória da instituição perante o BCB após o incidente e a narrativa de defesa.\n\n## Conexão comercial\n\nAlimenta diretamente o questionário do benchmark IMCI-Fraude (bloco de segurança cibernética) e o diagnóstico de prontidão.\n\n## Lacunas\n\n- A Resolução BCB nº 85/2021 (norma base consolidada) ainda não foi fichada; a leitura das obrigações completas exige o texto consolidado, não apenas a alteração.\n- O rol exaustivo das alterações promovidas pela 538 foi verificado por amostra no DOU; conferência integral do texto consolidado pendente de leitura do operador.\n\n## Relações\n\n[[hub-seguranca-cibernetica]] · [[hub-matriz-prazos]] · [[bcb-res-494-498-2025]] · [[anpd-res-cd-15-2024]]\n"}, {"info": {"id": "bcb-res-569-2026", "titulo": "Resolução BCB nº 569, de 19 de maio de 2026 (bets no compartilhamento de fraude)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2026-05-21", "tags": "[fraude, compartilhamento, bets, apostas, pix]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-569-2026.md", "quando": "2026-07-14"}, "meta": {"id": "bcb-res-569-2026", "tipo": "norma", "titulo": "Resolução BCB nº 569, de 19 de maio de 2026 (bets no compartilhamento de fraude)", "orgao": "BCB", "data_publicacao": "2026-05-21", "vigencia": "", "altera": "[\"Resolução BCB nº 343/2023\"]", "fase_rastro": "[prontidao, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=569", "status": "fichado", "tags": "[fraude, compartilhamento, bets, apostas, pix]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 569/2026 — bets ilegais entram no sistema de fraude\n\nVerificada no inteiro teor oficial (API BCB) em 2026-07-14. DOU 21/5/2026, S.1, p. 114; vigor na publicação.\n\n## O que altera na Res. 343/2023\n\n- Inclui o art. 1º-A: indícios de fraude passam a incluir \"os indícios de atuação de pessoas naturais ou jurídicas como operadoras de apostas não autorizadas\" (Lei 14.790/2023, art. 24-A, I).\n- Inclui o inciso VI no art. 2º (serviços financeiros/de pagamento a operadoras não autorizadas) e estende a ele o rol de serviços do §1º (Pix, TED etc.).\n- Inclui o §4º no art. 3º: nesse caso, o \"fraudador\" identificado é a própria operadora de apostas.\n- Reescreve o art. 13-A: adequação até 30/10/2026 para ativos virtuais (herdado da Res. 552/2026) e até 1º/12/2026 para a hipótese de bets.\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: clientes fintech/BaaS que processam pagamentos precisam, até 1º/12/2026, de mecanismo para identificar e registrar operadoras de apostas não autorizadas — novo item de diagnóstico (e novo risco: prestar serviço a operadora ilegal agora gera marcação na base interbancária). Defesa: a qualificação de \"operadora não autorizada\" tem consequências de desbancarização — potencial contencioso de marcados contestando a qualificação.\n\n## Lacunas\n\n- Critérios para identificar \"operadora não autorizada\" (lista do Ministério da Fazenda/SPA?): não especificados na resolução — verificar operacionalização antes de aconselhar.\n\n## Relações\n\n[[bcb-res-343-2023]] · [[resolucao-conjunta-6-2023]] · [[hub-matriz-prazos]]\n"}, {"info": {"id": "bcb-res-85-2021", "titulo": "Resolução BCB nº 85, de 8 de abril de 2021 (segurança cibernética — texto consolidado)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2021-04-12", "tags": "[seguranca-cibernetica, instituicao-de-pagamento, nuvem, psti, comunicacao-bcb, crise]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-85-2021.md", "quando": "2026-07-14"}, "meta": {"id": "bcb-res-85-2021", "tipo": "norma", "titulo": "Resolução BCB nº 85, de 8 de abril de 2021 (segurança cibernética — texto consolidado)", "orgao": "BCB", "data_publicacao": "2021-04-12", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico, retainer, adversarial]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=85", "status": "fichado", "tags": "[seguranca-cibernetica, instituicao-de-pagamento, nuvem, psti, comunicacao-bcb, crise]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 85/2021 — a norma-base de segurança cibernética (consolidada)\n\nFichada a partir do texto INTEGRAL CONSOLIDADO (versão 4) obtido da API oficial do BCB em 2026-07-14, já incorporando as Resoluções BCB 368/2024, 538/2025 e 552/2026.\n\n## Ementa\n\nEmenta vigente (literal, redação da Res. BCB 552/2026): \"Dispõe sobre a política de segurança cibernética e sobre os requisitos para a contratação de serviços de processamento e armazenamento de dados e de computação em nuvem a serem observados pelas instituições de pagamento, pelas sociedades corretoras de títulos e valores mobiliários, pelas sociedades distribuidoras de títulos e valores mobiliários, pelas sociedades corretoras de câmbio e pelas sociedades prestadoras de serviços de ativos virtuais autorizadas a funcionar pelo Banco Central do Brasil.\" DOU 12/4/2021, S.1, p. 66/67; vigor em 1º/8/2021 (art. 27).\n\n## O ACHADO CENTRAL — comunicação de incidentes ao BCB SEM prazo fixado\n\nArt. 20, III (literal, redação da Res. 368/2024): \"a comunicação tempestiva ao Banco Central do Brasil das ocorrências de incidentes relevantes e das interrupções dos serviços relevantes, citados no inciso I, que configurem situação de crise pela instituição mencionada no art. 1º, bem como das providências para o reinício das suas atividades.\" Parágrafo único: \"As instituições [...] devem estabelecer e documentar os critérios que configurem a situação de crise de que trata o inciso III do caput.\"\n\nTrês consequências: (1) o padrão é \"tempestiva\" — NENHUM prazo em horas/dias em todo o texto consolidado; (2) o gatilho é incidente relevante QUE CONFIGURE CRISE; (3) a régua é autorregulada: a instituição define os parâmetros de relevância (art. 3º, V, \"d\") e os critérios de crise (art. 20, p.u.), com guarda documental de 5 anos (art. 23, IX). Contraste: a comunicação de CONTRATAÇÃO de serviço relevante tem prazo de 10 dias (art. 15, §2º).\n\n## Obrigações principais (redação vigente)\n\n- Política de segurança cibernética (art. 3º) com rol mínimo de 14 controles no §2º (redação 538/2025): autenticação, criptografia, prevenção/detecção de intrusão, prevenção de vazamentos, antimalware, rastreabilidade, backup, gestão de vulnerabilidades, controles de acesso, configuração segura, proteção de rede, certificados digitais, segurança de APIs/interfaces, e inteligência cibernética (monitoramento incl. Deep/Dark Web e grupos privados).\n- Art. 3º-A (538/2025) — requisitos RSFN/Pix/STR: MFA para acesso administrativo, isolamento físico e lógico dos ambientes Pix e STR (instância dedicada em nuvem), monitoramento de credenciais do SPI, validação de integridade antes da assinatura, e a alínea-chave \"f\": \"vedação do acesso de empresas prestadoras de serviços a terceiros às chaves privadas associadas a certificados digitais utilizados pela instituição para a assinatura de mensagens\" — o vetor exato dos incidentes C&M/Sinqia, agora vedado expressamente.\n- Plano de ação e resposta a incidentes (arts. 6º-10): diretor designado responsável (art. 7º), relatório anual até 31/3 (art. 8º, incl. resultados de pentest — inciso V, 538/2025), aprovação pelo CA/diretoria (art. 9º), revisão mínima anual (art. 10).\n- Testes de intrusão (art. 22-A, 538/2025): periodicidade mínima anual, executor independente, resultados e planos de correção documentados.\n- Contratação de processamento/nuvem (arts. 11-17): due diligence documentada (art. 12, §2º); responsabilidade INDELEGÁVEL da contratante (art. 14: \"é responsável pela confiabilidade, pela integridade, pela disponibilidade, pela segurança e pelo sigilo\"); cláusulas obrigatórias (art. 17: segregação, portabilidade, acesso do BCB, notificação de subcontratação); comunicação da contratação em 10 dias (art. 15, §2º).\n- Art. 22-B (538/2025): o serviço de mensageria na RSFN (PSTI) é serviço RELEVANTE — arrasta todo o regime de contratação dos arts. 11-17.\n- Guarda documental de 5 anos (art. 23): política, plano, relatório anual, due diligence, contratos, critérios de crise, resultados de pentest.\n\n## Alterações incorporadas\n\nRes. BCB 368/2024 (corretoras/distribuidoras; efeitos 1º/3/2024) · Res. BCB 538/2025 (reforma técnica; adequação até 1º/3/2026 cf. [[bcb-res-538-2025]]) · Res. BCB 552/2026 (inclui VASPs — prestadoras de serviços de ativos virtuais; pendente de ficha própria).\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: os dois documentos autorregulados — parâmetros de relevância de incidente (art. 3º, V, \"d\") e critérios de crise (art. 20, p.u.) — são O item de auditoria: sem eles o cliente falha a norma E perde a defesa de tempestividade. Revisar contratos de PSTI contra art. 17 + 22-B; auditar guarda de chaves privadas (art. 3º-A, \"f\"). War room: o diretor do art. 7º comanda formalmente; configurada crise pelos critérios pré-documentados, comunicar o BCB com as providências de reinício. Defesa: art. 14 impede terceirizar a culpa ao PSTI perante o BCB — a tese defensiva se constrói sobre due diligence, cláusulas, pentests e critérios pré-existentes, tudo com guarda de 5 anos.\n\n## Lacunas\n\n- \"Incidente relevante\" e \"crise\" sem definição normativa (delegadas à instituição) — a régua do playbook deve preencher.\n- Res. BCB 552/2026 (VASPs) e Res. 368/2024: pendentes de ficha própria.\n- Regime sancionador: remete ao arcabouço geral (Leis 12.865/2013 e 13.506/2017 — paráfrase, conferir).\n\n## Relações\n\n[[bcb-res-538-2025]] · [[hub-seguranca-cibernetica]] · [[hub-matriz-prazos]] · [[bcb-res-494-498-2025]] · [[hub-catalogo-medidas]] · [[estudo-72h-aprofundamento]]\n"}, {"info": {"id": "manual-tempos-pix", "titulo": "Manual de Tempos do Pix v7.0 + Guia MED v4.3 + Manual de Resolução de Disputas v5.0 (os tempos operacionais)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2025-08-28", "tags": "[pix, med, prazos-operacionais, ans, manual, dict]", "grupo": "normas", "caminho": "normas/bcb/manual-tempos-pix.md", "quando": "2026-07-15"}, "meta": {"id": "manual-tempos-pix", "tipo": "norma", "titulo": "Manual de Tempos do Pix v7.0 + Guia MED v4.3 + Manual de Resolução de Disputas v5.0 (os tempos operacionais)", "orgao": "BCB", "data_publicacao": "2025-08-28", "vigencia": "", "altera": "[]", "fase_rastro": "[war_room, prontidao, recuperacao_defesa]", "conexao_comercial": "[retainer, diagnostico, benchmark]", "fonte_primaria": "https://www.bcb.gov.br/content/estabilidadefinanceira/pix/Regulamento_Pix/IX_ManualdeTemposdoPix.pdf", "status": "fichado", "tags": "[pix, med, prazos-operacionais, ans, manual, dict]", "confidencial": "false"}, "corpo": "\n# Os tempos operacionais do MED — Manual de Tempos v7.0 e Guia MED v4.3\n\nFichada em 2026-07-15 com leitura dos três PDFs oficiais: Manual de Tempos do Pix v7.0 (35 p., divulgado pela IN BCB 654/2025 — pacote MED 2.0 de 28/8/2025), Guia de implementação dos procedimentos de devolução no Pix v4.3 (47 p., bcb.gov.br/content/estabilidadefinanceira/pix/Guia_MED.pdf) e Manual de Resolução de Disputas v5.0 (8 p.).\n\n## DISTINÇÃO METODOLÓGICA (o que separa o especialista)\n\nO Manual de Tempos fixa **ANS por percentil** (metas de nível de serviço: \"X% dos casos em Y tempo\"), não prazos peremptórios caso a caso. Citar \"o prazo é 6 horas\" sem a nuance do percentil é tecnicamente errado — e um advogado adverso que saiba disso desmonta a afirmação. O Guia MED é documento operacional-orientativo (não normativo em sentido estrito); o vínculo normativo dos fluxos está no regulamento do Pix e no Manual do DICT.\n\n## Os tempos (transcrições/valores literais)\n\n| Tempo | O quê | Natureza | Fonte |\n|---|---|---|---|\n| 30 min (1.800 s) | Da reclamação do usuário no canal à abertura da notificação de infração/recuperação de valores | ANS 95% | Manual de Tempos, 4.2.2.7 |\n| 180 s | Acknowledge da notificação de infração | ANS 95% | Manual de Tempos, 4.2.1.1 |\n| 7 dias | Envio do resultado da análise da notificação de infração (\"Aberta\" no DICT) | ANS 95% | Manual de Tempos, 4.2.1.6; Guia MED (7 dias corridos) |\n| 72 horas | PSP do pagador iniciar a etapa de devolução após a análise (estado ANALYSED) | Guia MED (literal: \"tem até 72 horas\") + conclusão automática cf. Manual DICT 20.1.6 | Guia MED v4.3; [[bcb-ingest-instrucao-normativa-bcb-752-2026-07-01]] |\n| 6 horas | Conclusão de cada solicitação de devolução por fundada suspeita de fraude (efetivação pelo PSP recebedor) | **ANS 99%** | Manual de Tempos, 4.2.1.8 |\n| 48 horas | Conclusão de devolução por falha operacional | ANS 95% | Manual de Tempos, 4.2.1.9 |\n| Até 72 horas | Bloqueio cautelar de valores pelo PSP do recebedor, em suspeita de fraude | Guia MED (literal) | Guia MED v4.3 |\n| Até 24 horas | Cadeia de devoluções sequenciais quando há 4 PSPs | Guia MED (síntese literal) | Guia MED v4.3 |\n\n## Aplicação prática no ciclo Rastro\n\nWar room: a régua completa do relógio do dinheiro — reclamação → 30 min p/ abrir → bloqueios imediatos → 7 dias de análise → 72h p/ iniciar devolução → 6h por devolução. Prontidão: os ANS viram metas de auditoria do fluxo sistêmico do cliente (o serviço 2 do catálogo — implementação operacional do MED — audita exatamente contra esta tabela). Defesa: a natureza de ANS-percentil é argumento defensivo contra alegação de \"prazo estourado\" em caso isolado; e ofensivo quando o padrão do PSP adverso está sistematicamente fora da meta.\n\n## Lacunas\n\n- Manuais são versionados (v7.0/v4.3/v5.0 em 2026-07-15): conferir a versão vigente antes de citar em peça; atualizações chegam por IN (monitor captura).\n- Fundamento normativo exato do bloqueio cautelar no regulamento do Pix (artigo): o Guia o descreve; localizar o artigo no regulamento consolidado da Res. 1/2020 antes de citar em peça.\n\n## Relações\n\n[[bcb-ingest-instrucao-normativa-bcb-752-2026-07-01]] · [[bcb-res-493-2025]] · [[hub-matriz-prazos]] · [[hub-pix-med]] · [[estudo-72h-aprofundamento]]\n"}, {"info": {"id": "resolucao-conjunta-6-2023", "titulo": "Resolução Conjunta nº 6, de 23 de maio de 2023 (compartilhamento de indícios de fraude — norma-mãe)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2023-05-24", "tags": "[fraude, compartilhamento, marcacao, lgpd, sigilo]", "grupo": "normas", "caminho": "normas/bcb/resolucao-conjunta-6-2023.md", "quando": "2026-07-14"}, "meta": {"id": "resolucao-conjunta-6-2023", "tipo": "norma", "titulo": "Resolução Conjunta nº 6, de 23 de maio de 2023 (compartilhamento de indícios de fraude — norma-mãe)", "orgao": "BCB", "data_publicacao": "2023-05-24", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico, adversarial]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20Conjunta&numero=6", "status": "fichado", "tags": "[fraude, compartilhamento, marcacao, lgpd, sigilo]", "confidencial": "false"}, "corpo": "\n# Resolução Conjunta CMN/BCB nº 6/2023 — compartilhamento de indícios de fraude\n\nVerificada no inteiro teor oficial (API BCB) em 2026-07-14. DOU 24/5/2023, S.1, p. 108/109; vigor em 1º/11/2023.\n\n## Ementa\n\nLiteral: \"Dispõe sobre requisitos para compartilhamento de dados e informações sobre indícios de fraudes a serem observados pelas instituições financeiras, instituições de pagamento e demais instituições autorizadas a funcionar pelo Banco Central do Brasil.\"\n\n## Obrigações principais\n\n- Compartilhar, em sistema eletrônico (registro, alteração/exclusão e consulta — art. 2º, §1º), dados sobre \"indícios de ocorrências ou de tentativas de fraudes\", com finalidade única de \"subsidiar seus procedimentos e controles para prevenção de fraudes\" (art. 2º). A norma NÃO nomeia o sistema nem designa operador.\n- Conteúdo mínimo do registro (art. 2º, §2º): identificação de quem teria executado/tentado a fraude; descrição dos indícios; instituição registradora; dados da conta destinatária e do titular em caso de transferência.\n- Base LGPD escolhida: CONSENTIMENTO \"prévio e geral\" em cláusula contratual destacada (art. 2º, §§3º-5º) — fragilidade relevante frente ao art. 8º, §4º da LGPD (finalidades determinadas), e sem resposta para o TERCEIRO não cliente marcado como destinatário (nunca consentiu).\n- Direito do titular (art. 4º, III, \"h\", literal): \"o livre acesso às informações que lhe digam respeito, bem como a exclusão ou a correção tempestiva dos dados e das informações registrados, em caso de eventuais erros, inconsistências ou outras demandas\". Sem notificação prévia nem rito de contestação.\n- Responsabilidades (art. 6º): pela confiabilidade do que registra e pelo USO do que consulta. Equiparação de todos os obrigados a IF para fins da LC 105/2001 (art. 1º, §2º) — fecha a objeção de sigilo bancário.\n- Guarda: 10 anos (dados compartilhados e critérios de identificação); 5 anos (registros dos mecanismos de controle) — art. 8º.\n- NÃO há dever literal autônomo de \"consultar antes de abrir conta\": decorre da combinação do art. 2º, §§8º-9º com a regulamentação de contas — não afirmar consulta obrigatória literal em peça.\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: critérios documentados de identificação de indício \"compatíveis com o perfil de risco\" (art. 2º, §8º) são item de auditoria. War room: registrar o indício é obrigação autônoma e cumulativa com MED e marcação no DICT — três camadas distintas que os autos confundem (separá-las é defesa). Defesa/ataque: a MARCAÇÃO INDEVIDA é a próxima onda — exposição civil (analogia com cadastros restritivos), LGPD (exatidão, art. 6º, V; decisão automatizada, art. 20) e regulatória (art. 6º); a recusa de conta automatizada baseada só na marcação, sem análise própria, é o cenário de maior risco.\n\n## Lacunas\n\n- Sem notificação/contestação para o marcado; sem prazo máximo de permanência da marcação; sem regra expressa sobre recusa/encerramento de conta; sistema/operador não nomeados; base de tratamento do terceiro marcado sem resposta normativa.\n- INs BCB 590/2025 e 592/2025 (vinculadas): não fichadas.\n\n## Relações\n\n[[bcb-res-343-2023]] · [[bcb-res-569-2026]] · [[bcb-res-493-2025]] · [[bcb-res-506-2025]] · [[hub-catalogo-medidas]] · [[dossie-pix-fortuito]]\n"}, {"info": {"id": "cnj-rec-159-2024", "titulo": "Recomendação CNJ nº 159, de 23 de outubro de 2024 (litigância abusiva)", "orgao": "CNJ", "tipo": "norma", "status": "fichado", "data_publicacao": "2024-10-23", "tags": "[cnj, litigancia-predatoria, recomendacao]", "grupo": "normas", "caminho": "normas/cnj/cnj-rec-159-2024.md", "quando": "2026-07-07"}, "meta": {"id": "cnj-rec-159-2024", "tipo": "norma", "titulo": "Recomendação CNJ nº 159, de 23 de outubro de 2024 (litigância abusiva)", "orgao": "CNJ", "data_publicacao": "2024-10-23", "vigencia": "", "altera": "[]", "fase_rastro": "[recuperacao_defesa]", "conexao_comercial": "[adversarial]", "fonte_primaria": "https://atos.cnj.jus.br/atos/detalhar/5822", "status": "fichado", "tags": "[cnj, litigancia-predatoria, recomendacao]", "confidencial": "false"}, "corpo": "\n# Recomendação CNJ nº 159/2024 — litigância abusiva\n\n## Ementa\n\nRecomendação do CNJ (DJe/CNJ nº 261/2024) sobre o enfrentamento da litigância abusiva no Poder Judiciário. Define litigância abusiva como desvio ou excesso manifesto da finalidade do direito de acesso à Justiça; recomenda a magistrados medidas fundamentadas de verificação de legitimidade e diligências probatórias, e aos tribunais painéis de monitoramento, integração de bases de dados e cooperação com OAB, MP e Defensoria. Menciona prejuízos superiores a R$ 10,7 bilhões (2020) em dois segmentos processuais.\n\n## Distinção crítica (erro comum)\n\nNão confundir com a Recomendação CNJ nº 127/2022: aquela trata de \"assédio judicial\" contra a liberdade de expressão (ações em massa para calar críticos), não de massa consumerista. Para a tese defensiva de instituições financeiras, o ato pertinente é ESTA Recomendação 159/2024, combinada com o [[stj-tema-1198]].\n\n## Aplicação prática no ciclo Rastro\n\nRecuperação/defesa: fundamenta requerimentos de providências ao juízo (verificação de legitimidade, diligências) e o diálogo institucional com NUMOPEDE/Corregedorias na onda pós-incidente. Dado quantitativo oficial complementar: Diagnóstico CNJ/ABJ sobre litigância abusiva (dez/2025) — mais de 129 mil processos mencionando o fenômeno, 34,7 mil só no 1º semestre de 2025.\n\n## Lacunas\n\n- Recomendação não vincula — a força normativa vem do Tema 1198 (repetitivo); usar a 159/2024 como reforço argumentativo e institucional.\n\n## Relações\n\n[[hub-litigancia-predatoria]] · [[stj-tema-1198]]\n"}, {"info": {"id": "cnj-res-615-2025", "titulo": "Resolução CNJ nº 615, de 11 de março de 2025 (governança de IA no Judiciário)", "orgao": "CNJ", "tipo": "norma", "status": "fichado", "data_publicacao": "2025-03-14", "tags": "[cnj, ia, governanca, judiciario, auditoria]", "grupo": "normas", "caminho": "normas/cnj/cnj-res-615-2025.md", "quando": "2026-07-03"}, "meta": {"id": "cnj-res-615-2025", "tipo": "norma", "titulo": "Resolução CNJ nº 615, de 11 de março de 2025 (governança de IA no Judiciário)", "orgao": "CNJ", "data_publicacao": "2025-03-14", "vigencia": "", "altera": "[\"Revoga a Resolução CNJ nº 332/2020\"]", "fase_rastro": "[recuperacao_defesa]", "conexao_comercial": "[adversarial, diagnostico]", "fonte_primaria": "https://atos.cnj.jus.br/atos/detalhar/6001", "status": "fichado", "tags": "[cnj, ia, governanca, judiciario, auditoria]", "confidencial": "false"}, "corpo": "\n# Resolução CNJ nº 615/2025 — governança de IA no Judiciário\n\n## Ementa\n\nEstabelece diretrizes para o desenvolvimento, a utilização e a governança de soluções com recursos de inteligência artificial no Poder Judiciário. Aprovada em 11/03/2025; publicada no DJe/CNJ nº 54/2025, de 14/03/2025, p. 2-17. Revoga integralmente a Resolução CNJ nº 332/2020. Posteriormente alterada pela Resolução CNJ nº 674/2026 (composição do Comitê).\n\n## Vigência e prazos\n\nEntra em vigor 120 dias após a publicação (art. 47) — ou seja, julho de 2025. Os tribunais têm 12 meses para adequar projetos e modelos de IA em uso (art. 45, parágrafo único). Nota sobre as datas do cronograma acima: o cômputo exato dos 120 dias e dos 12 meses (dias corridos, termo inicial) não foi conferido no texto integral — as datas de 12/07/2025 e 12/07/2026 são cálculo aritmético a partir de 14/03/2025, marcado como aproximação; confirmar na leitura integral.\n\n## Estrutura principal\n\nClassificação de risco das soluções de IA: alto risco (AR1-AR5 — perfis comportamentais, valoração de provas, tipificação penal, aplicação de normas, reconhecimento facial/biométrico) e baixo risco (BR1-BR8). Comitê Nacional de IA do Judiciário (art. 15). Plataforma Sinapses na PDPJ-Br para cadastro, catálogo público e auditoria de modelos (art. 4º, III). Supervisão humana obrigatória; comunicação de eventos adversos em até 72 horas; revisão anual das classificações.\n\n## Aplicação prática no ciclo Rastro\n\nRecuperação/defesa: baliza o uso defensável de IA no contencioso de massa (triagem da onda consumerista, detecção de padrões de litigância predatória) e informa como o próprio Judiciário audita IA — parâmetro para a governança de IA que o escritório vende (ponte com o IMCI e o módulo de evidências do Projeto Rastro). Não impõe obrigações a fintechs; sua relevância é metodológica e de contencioso.\n\n## Conexão comercial\n\nAlimenta o entregável adversarial (uso auditável de IA na defesa em massa) e o diagnóstico de governança de IA no contencioso.\n\n## Lacunas\n\n- Datas exatas de vigência e do prazo de adequação: aproximadas por cálculo, não conferidas no texto integral (ver acima).\n- Resolução CNJ nº 674/2026 (alteração): não fichada.\n\n## Relações\n\n[[hub-litigancia-predatoria]] · [[hub-jurisprudencia-consumerista]]\n"}, {"info": {"id": "dossie-pix-fortuito", "titulo": "Dossiê — fortuito interno × externo em golpes Pix e engenharia social (STJ)", "orgao": "STJ", "tipo": "conceito", "status": "fichado", "data_publicacao": "2026-07-07", "tags": "[jurisprudencia, pix, fortuito-interno, fortuito-externo, engenharia-social, dossie]", "grupo": "jurisprudencia", "caminho": "jurisprudencia/dossie-pix-fortuito.md", "quando": "2026-07-30"}, "meta": {"id": "dossie-pix-fortuito", "tipo": "conceito", "titulo": "Dossiê — fortuito interno × externo em golpes Pix e engenharia social (STJ)", "orgao": "STJ", "data_publicacao": "2026-07-07", "vigencia": "", "altera": "[]", "fase_rastro": "[recuperacao_defesa, prontidao]", "conexao_comercial": "[adversarial, benchmark]", "fonte_primaria": "https://www.stj.jus.br/sites/portalp/Paginas/Comunicacao/Noticias/", "status": "fichado", "tags": "[jurisprudencia, pix, fortuito-interno, fortuito-externo, engenharia-social, dossie]", "confidencial": "false"}, "corpo": "\n# Dossiê — fortuito interno × externo em golpes Pix (STJ)\n\nCompilado em 2026-07-07 por pesquisa verificada. Cada precedente indica o grau de confirmação; os marcados \"conferir no SCON\" exigem checagem no acórdão oficial antes de citação em peça. Sem afetação repetitiva/IAC específica sobre engenharia social/Pix localizada até a data — o precedente qualificado segue sendo o Tema 466 (base
