 maio de 2023 (compartilhamento de indícios de fraude — norma-mãe)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2023-05-24", "tags": "[fraude, compartilhamento, marcacao, lgpd, sigilo]", "grupo": "normas", "caminho": "normas/bcb/resolucao-conjunta-6-2023.md", "quando": "2026-07-14"}, "meta": {"id": "resolucao-conjunta-6-2023", "tipo": "norma", "titulo": "Resolução Conjunta nº 6, de 23 de maio de 2023 (compartilhamento de indícios de fraude — norma-mãe)", "orgao": "BCB", "data_publicacao": "2023-05-24", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico, adversarial]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20Conjunta&numero=6", "status": "fichado", "tags": "[fraude, compartilhamento, marcacao, lgpd, sigilo]", "confidencial": "false"}, "corpo": "\n# Resolução Conjunta CMN/BCB nº 6/2023 — compartilhamento de indícios de fraude\n\nVerificada no inteiro teor oficial (API BCB) em 2026-07-14. DOU 24/5/2023, S.1, p. 108/109; vigor em 1º/11/2023.\n\n## Ementa\n\nLiteral: \"Dispõe sobre requisitos para compartilhamento de dados e informações sobre indícios de fraudes a serem observados pelas instituições financeiras, instituições de pagamento e demais instituições autorizadas a funcionar pelo Banco Central do Brasil.\"\n\n## Obrigações principais\n\n- Compartilhar, em sistema eletrônico (registro, alteração/exclusão e consulta — art. 2º, §1º), dados sobre \"indícios de ocorrências ou de tentativas de fraudes\", com finalidade única de \"subsidiar seus procedimentos e controles para prevenção de fraudes\" (art. 2º). A norma NÃO nomeia o sistema nem designa operador.\n- Conteúdo mínimo do registro (art. 2º, §2º): identificação de quem teria executado/tentado a fraude; descrição dos indícios; instituição registradora; dados da conta destinatária e do titular em caso de transferência.\n- Base LGPD escolhida: CONSENTIMENTO \"prévio e geral\" em cláusula contratual destacada (art. 2º, §§3º-5º) — fragilidade relevante frente ao art. 8º, §4º da LGPD (finalidades determinadas), e sem resposta para o TERCEIRO não cliente marcado como destinatário (nunca consentiu).\n- Direito do titular (art. 4º, III, \"h\", literal): \"o livre acesso às informações que lhe digam respeito, bem como a exclusão ou a correção tempestiva dos dados e das informações registrados, em caso de eventuais erros, inconsistências ou outras demandas\". Sem notificação prévia nem rito de contestação.\n- Responsabilidades (art. 6º): pela confiabilidade do que registra e pelo USO do que consulta. Equiparação de todos os obrigados a IF para fins da LC 105/2001 (art. 1º, §2º) — fecha a objeção de sigilo bancário.\n- Guarda: 10 anos (dados compartilhados e critérios de identificação); 5 anos (registros dos mecanismos de controle) — art. 8º.\n- NÃO há dever literal autônomo de \"consultar antes de abrir conta\": decorre da combinação do art. 2º, §§8º-9º com a regulamentação de contas — não afirmar consulta obrigatória literal em peça.\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: critérios documentados de identificação de indício \"compatíveis com o perfil de risco\" (art. 2º, §8º) são item de auditoria. War room: registrar o indício é obrigação autônoma e cumulativa com MED e marcação no DICT — três camadas distintas que os autos confundem (separá-las é defesa). Defesa/ataque: a MARCAÇÃO INDEVIDA é a próxima onda — exposição civil (analogia com cadastros restritivos), LGPD (exatidão, art. 6º, V; decisão automatizada, art. 20) e regulatória (art. 6º); a recusa de conta automatizada baseada só na marcação, sem análise própria, é o cenário de maior risco.\n\n## Lacunas\n\n- Sem notificação/contestação para o marcado; sem prazo máximo de permanência da marcação; sem regra expressa sobre recusa/encerramento de conta; sistema/operador não nomeados; base de tratamento do terceiro marcado sem resposta normativa.\n- INs BCB 590/2025 e 592/2025 (vinculadas): não fichadas.\n\n## Relações\n\n[[bcb-res-343-2023]] · [[bcb-res-569-2026]] · [[bcb-res-493-2025]] · [[bcb-res-506-2025]] · [[hub-catalogo-medidas]] · [[dossie-pix-fortuito]]\n"}, {"info": {"id": "cmn-res-4282-2013", "titulo": "Resolução CMN nº 4.282, de 4 de novembro de 2013 (diretrizes para regulamentação, vigilância e supervisão de arranjos e instituições de pagamento — consolidada, versão 3)", "orgao": "CMN", "tipo": "norma", "status": "fichado", "data_publicacao": "2013-11-06", "tags": "[cmn, arranjo-de-pagamento, instituicao-de-pagamento, diretrizes, spb, sigilo, terceirizacao, pld-ft]", "grupo": "normas", "caminho": "normas/cmn/cmn-res-4282-2013.md", "quando": "2026-11-05"}, "meta": {"id": "cmn-res-4282-2013", "tipo": "norma", "titulo": "Resolução CMN nº 4.282, de 4 de novembro de 2013 (diretrizes para regulamentação, vigilância e supervisão de arranjos e instituições de pagamento — consolidada, versão 3)", "orgao": "CMN", "data_publicacao": "2013-11-06", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao, recuperacao_defesa]", "conexao_comercial": "[diagnostico, adversarial]", "fonte_primaria": "https://normativos.bcb.gov.br/Lists/Normativos/Attachments/48841/Res_4282_v3_L.pdf", "status": "fichado", "tags": "[cmn, arranjo-de-pagamento, instituicao-de-pagamento, diretrizes, spb, sigilo, terceirizacao, pld-ft]", "confidencial": "false"}, "corpo": "\n# Resolução CMN nº 4.282/2013 — as diretrizes entre a lei e as resoluções do BCB (texto consolidado)\n\nLida em 5/11/2026 na versão consolidada 3 do BCB (`Res_4282_v3_L.pdf`, Attachments/48841), que incorpora as Resoluções CMN 4.951/2021 e 5.049/2022. DOU de 6/11/2013, Seção 1, p. 16. Em vigor na data da publicação (art. 18). Texto integral em `normas/cmn/_texto-res-4282-2013.txt`. Editada com base no art. 1º, § 1º, XIII, da LC 105/2001 e nos arts. 6º, 7º, 9º e 10 da Lei 12.865/2013. Esta ficha substitui o stub de triagem de 2/11/2026, que apontava para a versão 2 (sem a Res. 5.049/2022).\n\n## Ementa\n\nLiteral: \"Estabelece as diretrizes que devem ser observadas na regulamentação, na vigilância e na supervisão das instituições de pagamento e dos arranjos de pagamento integrantes do Sistema de Pagamentos Brasileiro (SPB), de que trata a Lei nº 12.865, de 9 de outubro de 2013.\"\n\n## Por que esta norma entra na base\n\nÉ norma de diretrizes dirigida ao BCB, não à fintech, mas três dispositivos são citáveis contra a instituição. O art. 17 submete instituidores de arranjo e instituições de pagamento à LC 105/2001, o que fecha a lacuna sobre sigilo bancário da IP. O art. 16 impõe responsabilidade integral da contratante pelo atendimento terceirizado, \"inclusive no que diz respeito à integridade, à confiabilidade, à segurança e ao sigilo\". E o art. 13 condiciona a disciplina da conta de pagamento às \"boas práticas para prevenção à lavagem de dinheiro\". O art. 3º, VIII, é a base da equivalência prudencial do conglomerado liderado por IP com IF dentro (Tipo 3 da Res. BCB 436/2024).\n\n## Dispositivos principais\n\n**Âmbito (art. 1º).** Diretrizes para regulamentação, vigilância e supervisão de IPs e arranjos do SPB; aplica-se \"também às instituições financeiras e demais instituições autorizadas a funcionar pelo Banco Central do Brasil que instituam ou participem de arranjo de pagamento\" (parágrafo único).\n\n**Definições (art. 2º).** Pagador, \"pessoa natural ou jurídica, que autoriza a transação de pagamento\" (I); recebedor, \"destinatário final dos recursos\" (II); transação de pagamento, \"ato de pagar, de aportar, de transferir ou de sacar recursos independentemente de quaisquer obrigações subjacentes entre o pagador e o recebedor\" (III), inclusive doações (parágrafo único, Res. 4.951/2021); usuário final (IV).\n\n**Objetivos da regulação (art. 3º).** Interoperabilidade (I); inovação (II); solidez, eficiência, competição e portabilidade de saldos (III); acesso não discriminatório (IV); atendimento às necessidades dos usuários finais, \"em especial liberdade de escolha, segurança, proteção de seus interesses econômicos, tratamento não discriminatório, privacidade e proteção de dados pessoais, transparência\" (V); confiabilidade, qualidade e segurança (VI); inclusão financeira (VII); \"uniformidade e equivalência entre as normas prudenciais aplicáveis ao conglomerado prudencial liderado por instituição de pagamento e integrado por instituição financeira e a regulamentação aplicável às instituições financeiras, observado o segmento\" (VIII, Res. 5.049/2022).\n\n**Arranjos (arts. 4º a 9º).** Requisitos de autorização e dispensa (art. 4º); cancelamento com saída ordenada (art. 5º); arranjos fora do SPB por limitação de propósito, valor, saldo, quantidade, usuários ou efeitos (art. 6º); vigilância voltada a funcionamento contínuo, eficiente e seguro (art. 8º).\n\n**Instituições de pagamento (arts. 10 a 14).** Modalidades proporcionais aos riscos (art. 10); autorização para constituição, funcionamento, controle e cargos \"fundamentados em critérios de prevenção e de mitigação de riscos\" (art. 11); cancelamento (art. 12); conta de pagamento disciplinada \"sem prejuízo das boas práticas para prevenção à lavagem de dinheiro e para combate ao financiamento do terrorismo\" (art. 13); gestão de riscos com preservação do valor e da liquidez dos saldos, abrangendo no mínimo riscos operacional, de crédito e de liquidez (art. 14).\n\n**Terceirização do atendimento (art. 16).** Literal: as regras \"devem assegurar a responsabilidade integral da instituição contratante pelo atendimento prestado pelo contratado, inclusive no que diz respeito à integridade, à confiabilidade, à segurança e ao sigilo dos serviços prestados, bem como quanto ao cumprimento da legislação e da regulamentação aplicável a esses serviços\".\n\n**Sigilo (art. 17).** Literal: \"Os instituidores de arranjos de pagamento e as instituições de pagamento ficam sujeitos ao disposto na Lei Complementar nº 105, de 10 de janeiro de 2001.\"\n\n## Aplicação prática no ciclo Rastro\n\nRegime: a IP está sob a LC 105 por força do art. 17; toda porta de saída do sigilo do art. 1º, § 3º, da LC vale para ela, e a quebra fora das hipóteses é o crime do art. 10 da LC. Responsabilidade: o art. 16 é o fundamento regulatório da responsabilidade da fintech pelo atendimento terceirizado (BPO, correspondente, chatbot de parceiro), ao lado da Res. 85, art. 14, para nuvem e processamento. Prontidão: o art. 13 é o gancho que liga a conta de pagamento à Circular 3.978 no diagnóstico de onboarding. Defesa: as definições do art. 2º (pagador, recebedor, transação) são as que o regulamento do Pix e a Res. 142 pressupõem; citar daqui quando a peça precisar de definição normativa.\n\n## Lacunas\n\n- Normas do BCB que concretizam cada diretriz (Res. BCB 80, 81, 436, 198, 265 e regulamento dos arranjos) estão em fichas próprias; a regulação de arranjos de pagamento em si não foi lida.\n- O regime de saída ordenada do art. 5º e os parâmetros do art. 6º dependem de ato do BCB não lido.\n\n## Relações\n\n[[lei-12865-2013]] · [[lcp-105-2001]] · [[bcb-res-80-2021]] · [[bcb-res-81-2021]] · [[bcb-res-436-2024]] · [[bcb-res-85-2021]] · [[bcb-circular-3978-2020]] · [[escopo-controles-internos]]\n\n## Fichamento (operador, 2026-11-02)\n\n### Aplicação prática no ciclo Rastro\n\nA Resolução CMN 4.282/2013 fecha a camada legal com as diretrizes gerais dos arranjos.\n\n### Lacunas\n\nNenhuma apontada no fichamento.\n"}, {"info": {"id": "cmn-res-4553-2017", "titulo": "Resolução CMN nº 4.553, de 30 de janeiro de 2017 (segmentação S1 a S5 das instituições financeiras)", "orgao": "CMN", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2017-01-31", "tags": "[perimetro, prudencial, segmentacao, instituicao-financeira, scd, sep, s5]", "grupo": "normas", "caminho": "normas/cmn/cmn-res-4553-2017.md", "quando": "2026-11-02"}, "meta": {"id": "cmn-res-4553-2017", "tipo": "norma", "titulo": "Resolução CMN nº 4.553, de 30 de janeiro de 2017 (segmentação S1 a S5 das instituições financeiras)", "orgao": "CMN", "data_publicacao": "2017-01-31", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao]", "conexao_comercial": "[benchmark, diagnostico]", "fonte_primaria": "https://normativos.bcb.gov.br/Lists/Normativos/Attachments/50335/Res_4553_v2_P.pdf", "status": "a_fichar", "tags": "[perimetro, prudencial, segmentacao, instituicao-financeira, scd, sep, s5]", "confidencial": "false"}, "corpo": "\n# Resolução CMN nº 4.553/2017 — segmentação S1 a S5\n\nFicha criada em 2026-10-29 a partir do PDF oficial consolidado (versão 2, com a revogação da Res. 4.721/2019) enviado por Fabio; cópia em `normas/cmn/_oficial-Res_4553_v2_P.pdf`. DOU 31/1/2017, S.1, p. 25. Aplicação e conexão comercial são propostas do assistente, por isso o status permanece `a_fichar`.\n\n## Ementa\n\n\"Estabelece a segmentação do conjunto das instituições financeiras e demais instituições autorizadas a funcionar pelo Banco Central do Brasil para fins de aplicação proporcional da regulação prudencial.\"\n\n## Vigência e prazos\n\nVigor na publicação (art. 11). Enquadramento apurado nas datas-bases de 30/6 e 31/12, em até noventa dias (art. 5º). Mudança de segmento exige permanência de três ou cinco semestres conforme a origem (art. 6º), com efeitos após o semestre subsequente (art. 8º), salvo entrada no S5 e saída do S5 para o S4, imediatas (art. 6º, IV, b, e V; art. 8º, parágrafo único).\n\n## Obrigações principais\n\nPorte medido pela razão entre a Exposição Total (ou o Ativo Total, para quem não apura Exposição Total) e o PIB (art. 3º). S1: bancos múltiplos, comerciais, de investimento, de câmbio e caixas com porte igual ou superior a 10% do PIB, ou atividade internacional relevante (art. 2º, §1º; art. 4º: ativos no exterior iguais ou superiores a US$ 10 bilhões). S2: esses bancos entre 1% e 10% do PIB, e as demais instituições com porte igual ou superior a 1% (§2º). S3: porte entre 0,1% e 1% (§3º). S4: porte inferior a 0,1% (§4º). S5: porte inferior a 0,1% do PIB **e** uso da metodologia facultativa simplificada para apuração dos requerimentos mínimos de PR, Nível I e Capital Principal, exceto os bancos listados (§5º, I; o inciso II, instituições não sujeitas a PR, foi revogado pela Res. 4.721/2019). Conglomerado prudencial enquadra-se de forma consolidada (§6º); instituição nova, pelo plano de negócio (§7º). O BCB pode determinar mudança de enquadramento (art. 7º) e divulga semestralmente o enquadramento de cada instituição (art. 9º).\n\n## Aplicação prática no ciclo Rastro (proposta — validar)\n\nCorrige uma premissa que circulava na base: o S5 não é \"quem é pequeno\", é quem é pequeno e **optou** pela metodologia simplificada de capital. Uma SCD ou SEP abaixo de 0,1% do PIB que não exerceu a opção é S4 e responde à estrutura completa de gerenciamento de riscos da Res. CMN 4.557 (arts. 5º a 60, com as dispensas do art. 60), inclusive à lista de controles de risco operacional do art. 33; só a optante responde à estrutura simplificada do art. 61. No diagnóstico, a pergunta \"qual é o seu segmento?\" tem resposta pública: o BCB divulga o enquadramento (art. 9º), e a opção pela metodologia simplificada consta das demonstrações da instituição.\n\n## Conexão comercial (proposta — validar)\n\nBenchmark e diagnóstico (segmento e opção pela metodologia simplificada como campos do questionário, com fonte verificável no BCB).\n\n## Lacunas\n\n- Norma que disciplina a metodologia facultativa simplificada (Res. CMN 4.606/2017, a confirmar) não lida.\n- Lista pública de enquadramento por instituição (art. 9º) não consultada.\n\n## Relações\n\n[[cmn-res-4557-2017]] · [[cmn-res-4968-2021]] · [[bcb-res-436-2024]] · [[escopo-controles-internos]] · [[mapa-controles-fintech]]\n\n## Texto oficial (extração automática, 2026-11-02)\n\nItem sem número de norma identificável: trata-se de notícia ou publicação institucional, não de ato normativo. Não há inteiro teor a extrair da base de normativos.\n\n### Pendente do operador\n\n- Triagem: relevante para o escopo Rastro (fichar) ou descartar?\n- Se relevante: abrir a fonte no link do frontmatter e registrar o que interessa\n"}, {"info": {"id": "cmn-res-4557-2017", "titulo": "Resolução CMN nº 4.557, de 23 de fevereiro de 2017 (estruturas de gerenciamento de riscos e de capital — instituições financeiras, S1 a S5)", "orgao": "CMN", "tipo": "norma", "status": "fichado", "data_publicacao": "2017-03-01", "tags": "[gerenciamento-de-riscos, risco-operacional, instituicao-financeira, scd, sep, s5, cro, prudencial]", "grupo": "normas", "caminho": "normas/cmn/cmn-res-4557-2017.md", "quando": "2026-11-03"}, "meta": {"id": "cmn-res-4557-2017", "tipo": "norma", "titulo": "Resolução CMN nº 4.557, de 23 de fevereiro de 2017 (estruturas de gerenciamento de riscos e de capital — instituições financeiras, S1 a S5)", "orgao": "CMN", "data_publicacao": "2017-03-01", "vigencia": "", "altera": "[\"Resoluções nºs 3.380/2006, 3.464/2007, 3.721/2009, 3.988/2011 e 4.090/2012 (revogadas)\"]", "fase_rastro": "[]", "conexao_comercial": "[]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o&numero=4557", "status": "fichado", "tags": "[gerenciamento-de-riscos, risco-operacional, instituicao-financeira, scd, sep, s5, cro, prudencial]", "confidencial": "false"}, "corpo": "\n# Resolução CMN nº 4.557/2017 — riscos e capital das instituições financeiras (Tipo 1)\n\nFicha criada em 2026-10-29 a partir do inteiro teor lido no endpoint oficial do BCB pelo navegador do app (texto em `normas/cmn/_texto-res-cmn-4557-2017.txt`). Ementa, vigência e obrigações são transcrição; aplicação e conexão comercial são propostas do assistente, a validar pelo operador, por isso o status permanece `a_fichar`.\n\n## Ementa\n\n\"Dispõe sobre a estrutura de gerenciamento de riscos e a estrutura de gerenciamento de capital.\" DOU 1º/3/2017, S.1, p. 41-46. Matriz de que a Res. BCB 265 é cópia para o Tipo 3. Aplica-se a IF e demais autorizadas nos segmentos S1 a S4 (estrutura completa, arts. 5º a 60) e S5 (estrutura simplificada, arts. 61 a 67), conforme a Res. CMN 4.553/2017.\n\n## Vigência e prazos\n\nVigor na publicação, com revogações em 360 dias (art. 68); implementação em 180 dias (S1) ou 360 dias (S2 a S5) da publicação (art. 67). Atenção: o texto devolvido pela API não traz notas de alteração, e a norma foi alterada várias vezes desde 2017 (p. ex. risco social, ambiental e climático pela Res. CMN 4.943/2021); conferir o consolidado antes de citar redação.\n\n## Obrigações principais\n\nPara S1 a S4: estruturas integradas de riscos e de capital, proporcionais e unificadas no conglomerado, com postura prospectiva (art. 2º); risco operacional definido no art. 32 (oito eventos, inclusive fraudes internas e externas, interrupção e falhas de TI) e controles do art. 33 (terceirização, governança de TI, sistemas seguros contra ataques digitais, base de perdas com causa raiz, cenários; contratos de TI com acesso do BCB). Governança com CRO, comitê de riscos e deveres de conselho e diretoria (arts. 43 a 52, lidos por cabeçalho). Para S5 (porte abaixo de 0,1% do PIB **com** opção pela metodologia simplificada de capital, Res. CMN 4.553, art. 2º, §5º; sem a opção a instituição é S4 e segue a estrutura completa, com as dispensas do art. 60): estrutura simplificada que identifique, mensure, avalie, monitore, reporte, controle e mitigue os riscos relevantes, com políticas periodicamente avaliadas pela administração e processos avaliados pela auditoria interna (art. 61), e diretor responsável designado perante o BCB (art. 62).\n\n## Aplicação prática no ciclo Rastro (proposta — validar)\n\nProntidão: para SCD, SEP e banco digital é a norma de riscos que o art. 5º, II e V, da Res. CMN 4.968 pressupõe. A diferença prática é o segmento: a SCD optante pelo S5 responde ao art. 61 (estrutura simplificada, sem a lista do art. 33), de modo que os controles antifraude dela vêm sobretudo da 4.968 (art. 5º, II, d, e III, k), da Res. CMN 4.893 (cibersegurança) e da Res. Conjunta 6/2023; a SCD no S4 responde ao art. 33 com as dispensas do art. 60. Antes de apontar lacuna, o diagnóstico precisa saber o segmento e se houve opção pela metodologia simplificada (ver [[cmn-res-4553-2017]]).\n\n## Conexão comercial (proposta — validar)\n\nBenchmark e diagnóstico (segmento da IF como campo do questionário); retainer para revisão das políticas.\n\n## Lacunas\n\n- Texto lido por extrato e sem notas de alteração; versão consolidada (v12 no site do BCB) a conferir.\n- Res. CMN 4.553/2017 lida em 2026-10-29 no PDF oficial (ficha [[cmn-res-4553-2017]]); o PDF original da 4.557 (v1) também foi gravado em `_oficial-Res_4557_v1_O.pdf`.\n- Arts. 43 a 52 (governança) não transcritos.\n\n## Relações\n\n[[bcb-res-265-2022]] · [[bcb-res-198-2022]] · [[cmn-res-4968-2021]] · [[cmn-res-4879-2020]] · [[cmn-res-4893-2021]] · [[bcb-res-436-2024]] · [[cmn-res-4553-2017]] · [[escopo-controles-internos]]\n\n## Texto oficial (extração automática, 2026-11-02)\n\nItem sem número de norma identificável: trata-se de notícia ou publicação institucional, não de ato normativo. Não há inteiro teor a extrair da base de normativos.\n\n### Pendente do operador\n\n- Triagem: relevante para o escopo Rastro (fichar) ou descartar?\n- Se relevante: abrir a fonte no link do frontmatter e registrar o que interessa\n\n## Fichamento (operador, 2026-11-03)\n\n### Aplicação prática no ciclo Rastro\n\nA Res. CMN 4.557/2017 é editada pelo Conselho Monetário Nacional com base na Lei 4.595/1964, e o seu art. 2º a aplica às instituições financeiras e demais autorizadas que estejam enquadradas nos segmentos S1 a S5 da Res. CMN 4.553/2017. Esse é o trilho das instituições financeiras. Uma instituição de pagamento não é instituição financeira; a Lei 12.865/2013 diz isso expressamente no art. 6º, § 2º, e no art. 9º atribui ao Banco Central, e não ao CMN, a competência para regular as IPs e os arranjos, cabendo ao CMN apenas fixar diretrizes gerais (art. 15), o que ele fez na Res. 4.282/2013. Por isso a regulação prudencial da IP vem em resoluções do próprio BCB, e por isso a Tipo 2 singular ou o conglomerado Tipo 2 estão fora da 4.557: a 4.557 pressupõe um enquadramento em segmento pela 4.553, e a IP pura nunca foi enquadrada ali. Historicamente, o regime prudencial da IP estava na Circular BCB 3.681/2013, que a própria 198 revogou em parte (art. 28); em 2022 o BCB montou o pacote que substituiu esse regime, com a 197 (hoje 436) definindo os tipos e a 198, a 201 e a 265 definindo riscos e capital por tipo.\n\n### Lacunas\n\nHá dois trilhos, portanto, e eles se cruzam apenas nos conglomerados. Quando um banco lidera o grupo e a IP está dentro, o conglomerado é Tipo 1 e a estrutura de riscos é a da 4.557, unificada para todo o grupo (art. 2º, § 2º da 4.557), de modo que a IP acaba sob a 4.557 por arrasto, nunca por aplicação direta. Quando a IP lidera um grupo misto, o conglomerado é Tipo 3, alínea c, e a norma aplicável é a Res. BCB 265, que, como anota o extrato da sua ficha da 4.557, espelha os arts. 4º a 8º daquela resolução; o BCB copiou a estrutura do CMN para dentro do seu próprio trilho, porque não podia simplesmente mandar aplicar a 4.557 a quem não está sob o CMN. Quando a IP é singular ou lidera um grupo só de pagamentos, o conglomerado é Tipo 2 e vale a 198, que é a versão mais enxuta das três, calibrada para quem não capta depósito nem empresta com recursos de terceiros.\n"}, {"info": {"id": "cmn-res-4595-2017", "titulo": "Resolução CMN nº 4.595, de 28 de agosto de 2017 (política de conformidade — instituições financeiras)", "orgao": "CMN", "tipo": "norma", "status": "fichado", "data_publicacao": "2017-08-30", "tags": "[compliance, conformidade, instituicao-financeira, scd, sep, controles-internos]", "grupo": "normas", "caminho": "normas/cmn/cmn-res-4595-2017.md", "quando": "2026-11-02"}, "meta": {"id": "cmn-res-4595-2017", "tipo": "norma", "titulo": "Resolução CMN nº 4.595, de 28 de agosto de 2017 (política de conformidade — instituições financeiras)", "orgao": "CMN", "data_publicacao": "2017-08-30", "vigencia": "", "altera": "[]", "fase_rastro": "[]", "conexao_comercial": "[]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o&numero=4595", "status": "fichado", "tags": "[compliance, conformidade, instituicao-financeira, scd, sep, controles-internos]", "confidencial": "false"}, "corpo": "\n# Resolução CMN nº 4.595/2017 — política de conformidade das instituições financeiras\n\nFicha criada em 2026-10-29 a partir do inteiro teor lido no endpoint oficial do BCB pelo navegador do app (texto em `normas/cmn/_texto-res-cmn-4595-2017.txt`). Ementa, vigência e obrigações são transcrição; aplicação e conexão comercial são propostas do assistente, a validar pelo operador, por isso o status permanece `a_fichar`.\n\n## Ementa\n\n\"Dispõe sobre a política de conformidade (compliance) das instituições financeiras e demais instituições autorizadas a funcionar pelo Banco Central do Brasil.\" DOU 30/8/2017, S.1, p. 27/28. O art. 1º, parágrafo único, exclui administradoras de consórcio e instituições de pagamento, remetidas ao BCB (Res. BCB 65/2021). O texto lido pela API não traz notas de alteração; não foi localizada, nesta leitura, extensão da exclusão a corretoras e DTVM como ocorreu na 4.968 e na 4.879 pela Res. CMN 5.117/2024 — conferir.\n\n## Vigência e prazos\n\nVigor na publicação (art. 14); implementação da política até 31/12/2017 (art. 12). Relatório anual (art. 7º, V) com guarda de cinco anos (art. 11, II).\n\n## Obrigações principais\n\nEspelho da Res. BCB 65: política proporcional (art. 2º), com risco de conformidade gerido de forma integrada aos demais riscos (parágrafo único); política única por conglomerado ou sistema cooperativo (art. 3º); aprovação pelo conselho, e pela assembleia nas cooperativas (art. 4º); conteúdo mínimo idêntico ao da 65 (art. 5º, I a IX); segregação da auditoria interna (art. 6º); atribuições dos responsáveis, inclusive relatório anual e reporte ao conselho (art. 7º); remuneração independente do desempenho das áreas de negócio (art. 8º, ainda vigente nesta leitura, ao contrário do art. 8º da 65); deveres do conselho (art. 9º); diretoria quando não houver conselho (art. 10); BCB pode determinar unidade específica e procedimentos simplificados para SCM e cooperativas S5 (art. 13).\n\n## Aplicação prática no ciclo Rastro (proposta — validar)\n\nProntidão: para SCD, SEP e bancos digitais é a norma da função de conformidade que testa o sistema da Res. CMN 4.968. Mesmo uso que a 65 no diagnóstico.\n\n## Conexão comercial (proposta — validar)\n\nDiagnóstico e retainer para o lado IF do universo Rastro.\n\n## Lacunas\n\n- Confirmar se a Res. CMN 5.117/2024 alterou o art. 1º, parágrafo único (o texto da API não mostra a nota).\n- Confirmar se o art. 8º foi revogado por norma de remuneração do CMN análoga à Res. BCB 432/2024.\n\n## Relações\n\n[[bcb-res-65-2021]] · [[cmn-res-4968-2021]] · [[cmn-res-4879-2020]] · [[escopo-controles-internos]]\n\n## Texto oficial (extração automática, 2026-11-02)\n\nItem sem número de norma identificável: trata-se de notícia ou publicação institucional, não de ato normativo. Não há inteiro teor a extrair da base de normativos.\n\n### Pendente do operador\n\n- Triagem: relevante para o escopo Rastro (fichar) ou descartar?\n- Se relevante: abrir a fonte no link do frontmatter e registrar o que interessa\n\n## Fichamento (operador, 2026-11-02)\n\n### Aplicação prática no ciclo Rastro\n\nLei 4.595/1964, para entender de onde vem a autoridade normativa do CMN e do BCB que todas as resoluções do repositório invocam no preâmbulo.\n\n### Lacunas\n\nNenhuma apontada no fichamento.\n"}, {"info": {"id": "cmn-res-4879-2020", "titulo": "Resolução CMN nº 4.879, de 23 de dezembro de 2020 (auditoria interna — instituições financeiras)", "orgao": "CMN", "tipo": "norma", "status": "fichado", "data_publicacao": "2020-12-24", "tags": "[auditoria-interna, instituicao-financeira, scd, sep, controles-internos, governanca]", "grupo": "normas", "caminho": "normas/cmn/cmn-res-4879-2020.md", "quando": "2026-10-29"}, "meta": {"id": "cmn-res-4879-2020", "tipo": "norma", "titulo": "Resolução CMN nº 4.879, de 23 de dezembro de 2020 (auditoria interna — instituições financeiras)", "orgao": "CMN", "data_publicacao": "2020-12-24", "vigencia": "", "altera": "[\"Resolução nº 4.588/2017 (revogada)\"]", "fase_rastro": "[prontidao]", "conexao_comercial": "[diagnostico]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=4879", "status": "fichado", "tags": "[auditoria-interna, instituicao-financeira, scd, sep, controles-internos, governanca]", "confidencial": "false"}, "corpo": "\n# Resolução CMN nº 4.879/2020 — auditoria interna das instituições financeiras\n\nFicha criada em 2026-10-29 a partir do inteiro teor lido no endpoint oficial do BCB pelo navegador do app (texto em `normas/cmn/_texto-res-cmn-4879-2020.txt`). Ementa, vigência e obrigações são transcrição; aplicação e conexão comercial são propostas do assistente, a validar pelo operador, por isso o status permanece `a_fichar`.\n\n## Ementa\n\n\"Dispõe sobre a atividade de auditoria interna nas instituições autorizadas a funcionar pelo Banco Central do Brasil.\" DOU 24/12/2020, S.1, p. 98/99. Exclui consórcios, IPs, corretoras, DTVM e câmbio (art. 1º, parágrafo único, I, redação da Res. CMN 5.117/2024) e cooperativas S5 de sistemas de dois ou três níveis (inciso II). Par da Res. BCB 93/2021.\n\n## Vigência e prazos\n\nVigor em 1º/1/2021 (art. 28). Art. 10 (remuneração) revogado em 1º/1/2025 pela Res. CMN 5.177/2024. Demais prazos espelham a Res. 93 (plano e relatório anuais; guarda de cinco anos).\n\n## Obrigações principais\n\nMesma arquitetura da Res. BCB 93 (arts. 2º e 3º transcritos; demais lidos por extrato). Particularidade do lado IF: o art. 13 impõe que o escopo da auditoria interna avalie a adequação e efetividade das políticas de gerenciamento dos riscos de crédito, mercado, IRRBB, operacional, liquidez, socioambiental e demais relevantes, dos sistemas e modelos de risco, do capital mantido e do planejamento de capital, fechando o circuito com a Res. CMN 4.557.\n\n## Aplicação prática no ciclo Rastro (proposta — validar)\n\nProntidão e defesa: idem à ficha [[bcb-res-93-2021]], para SCD, SEP e bancos digitais; o art. 13 é o gancho para auditar a estrutura de riscos da 4.557 (ou a simplificada do S5).\n\n## Conexão comercial (proposta — validar)\n\nDiagnóstico e retainer, lado IF.\n\n## Lacunas\n\n- Texto lido por extrato (arts. 1º a 3º, 11 a 13 e 28); os demais artigos foram apenas listados por cabeçalho.\n- Norma de comitê de auditoria aplicável às IFs não lida nesta rodada.\n\n## Relações\n\n[[bcb-res-93-2021]] · [[cmn-res-4968-2021]] · [[cmn-res-4557-2017]] · [[cmn-res-4595-2017]] · [[escopo-controles-internos]]\n\n## Fichamento (operador, 2026-10-29)\n\n### Vigência e prazos\n\n01/01/2021\n\n### Aplicação prática no ciclo Rastro\n\nDispõe sobre a atividade de auditoria interna nas instituições autorizadas a funcionar pelo Banco Central do Brasil.\n\n### Lacunas\n\nNenhuma apontada no fichamento.\n"}, {"info": {"id": "cmn-res-4893-2021", "titulo": "Resolução CMN nº 4.893, de 26 de fevereiro de 2021 (segurança cibernética e contratação de serviços relevantes — instituições financeiras) — A FICHAR", "orgao": "CMN", "tipo": "norma", "status": "fichado", "data_publicacao": "2021-02-26", "tags": "[seguranca-cibernetica, scd, sep, nuvem]", "grupo": "normas", "caminho": "normas/cmn/cmn-res-4893-2021.md", "quando": "2026-10-29"}, "meta": {"id": "cmn-res-4893-2021", "tipo": "norma", "titulo": "Resolução CMN nº 4.893, de 26 de fevereiro de 2021 (segurança cibernética e contratação de serviços relevantes — instituições financeiras) — A FICHAR", "orgao": "CMN", "data_publicacao": "2021-02-26", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao]", "conexao_comercial": "[diagnostico]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=4893", "status": "fichado", "tags": "[seguranca-cibernetica, scd, sep, nuvem]", "confidencial": "false"}, "corpo": "\n## Por que esta norma entra na base (triagem de 2026-10-26)\n\nPar da Res. BCB 85/2021 para as instituições financeiras (SCD e SEP). Data NAO_CONFIRMADA.\n\n## Ementa\n\nNAO_CONFIRMADO — transcrever do texto oficial (fonte_primaria). Nada abaixo pode ser preenchido por inferência.\n\n## Vigência e prazos\n\nNAO_CONFIRMADO\n\n## Obrigações principais\n\nNAO_CONFIRMADO\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: eixo de controles internos (ver [[matriz-controles-internos]]). Detalhar após fichamento.\n\n## Conexão comercial\n\nDiagnóstico de controles internos. Detalhar após fichamento.\n\n## Lacunas\n\nFicha criada como stub de triagem: todo o conteúdo normativo está pendente de leitura do inteiro teor. Fontes secundárias usadas só para justificar a inclusão.\n\n## Relações\n\n[[matriz-controles-internos]] · [[bcb-res-85-2021]] · [[bcb-res-494-498-2025]]\n\n## Texto oficial (extração automática, 2026-10-29)\n\nItem sem número de norma identificável: trata-se de notícia ou publicação institucional, não de ato normativo. Não há inteiro teor a extrair da base de normativos.\n\n### Pendente do operador\n\n- Triagem: relevante para o escopo Rastro (fichar) ou descartar?\n- Se relevante: abrir a fonte no link do frontmatter e registrar o que interessa\n\n## Fichamento (operador, 2026-10-29)\n\n### Vigência e prazos\n\nEsta Resolução entra em vigor em 1º de julho de 2021.\n\n### Aplicação prática no ciclo Rastro\n\nDispõe sobre a política de segurança cibernética e sobre os requisitos para a contratação de serviços de processamento e armazenamento de dados e de computação em nuvem a serem observados pelas instituições autorizadas a funcionar pelo Banco Central do Brasil. Art. 1º  Esta Resolução dispõe sobre a política de segurança cibernética e sobre os requisitos para a contratação de serviços de processamento e armazenamento de dados e de computação em nuvem a serem observados pelas instituições autorizadas a funcionar pelo Banco Central do Brasil.\nParágrafo único.  O disposto nesta Resolução não se aplica às instituições de pagamento, que devem observar a regulamentação emanada do Banco Central do Brasil, no exercício de suas atribuições legais.\nParágrafo único. O disposto nesta Resolução não se aplica às administradoras de consórcio, às instituições de pagamento, às sociedades corretoras de títulos e valores mobiliários, às sociedades distribuidoras de títulos e valores mobiliários e às sociedades corretoras de câmbio, que devem observar a regulamentação emanada do Banco Central do Brasil no exercício de suas atribuições legais\n\n### Lacunas\n\nverificar se Resolução CMN n° 4.893 de 26/2/2021 está contida na ficha de controles internos\n"}, {"info": {"id": "cmn-res-4968-2021", "titulo": "Resolução CMN nº 4.968, de 25 de novembro de 2021 (sistemas de controles internos das instituições financeiras) — A FICHAR", "orgao": "CMN", "tipo": "norma", "status": "fichado", "data_publicacao": "2021-11-25", "tags": "[controles-internos, scd, sep, instituicao-financeira]", "grupo": "normas", "caminho": "normas/cmn/cmn-res-4968-2021.md", "quando": "2026-10-29"}, "meta": {"id": "cmn-res-4968-2021", "tipo": "norma", "titulo": "Resolução CMN nº 4.968, de 25 de novembro de 2021 (sistemas de controles internos das instituições financeiras) — A FICHAR", "orgao": "CMN", "data_publicacao": "2021-11-25", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao]", "conexao_comercial": "[diagnostico]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=4968", "status": "fichado", "tags": "[controles-internos, scd, sep, instituicao-financeira]", "confidencial": "false"}, "corpo": "\n## Por que esta norma entra na base (triagem de 2026-10-26)\n\nPar da Res. BCB 260 para as instituições financeiras: é a norma de controles internos aplicável a SCD e SEP, que não são IPs. Sem ela o eixo de controles internos não cobre dois dos tipos do mapa. Data NAO_CONFIRMADA.\n\n## Ementa\n\nNAO_CONFIRMADO — transcrever do texto oficial (fonte_primaria). Nada abaixo pode ser preenchido por inferência.\n\n## Vigência e prazos\n\nNAO_CONFIRMADO\n\n## Obrigações principais\n\nNAO_CONFIRMADO\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: eixo de controles internos (ver [[matriz-controles-internos]]). Detalhar após fichamento.\n\n## Conexão comercial\n\nDiagnóstico de controles internos. Detalhar após fichamento.\n\n## Lacunas\n\nFicha criada como stub de triagem: todo o conteúdo normativo está pendente de leitura do inteiro teor. Fontes secundárias usadas só para justificar a inclusão.\n\n## Relações\n\n[[matriz-controles-internos]] · [[bcb-res-85-2021]] · [[bcb-res-494-498-2025]]\n\n## Texto oficial (extração automática, 2026-10-29)\n\nItem sem número de norma identificável: trata-se de notícia ou publicação institucional, não de ato normativo. Não há inteiro teor a extrair da base de normativos.\n\n### Pendente do operador\n\n- Triagem: relevante para o escopo Rastro (fichar) ou descartar?\n- Se relevante: abrir a fonte no link do frontmatter e registrar o que interessa\n\n## Fichamento (operador, 2026-10-29)\n\n### Aplicação prática no ciclo Rastro\n\n1) Quem fica de fora e quem entra\n\nO art. 1º, parágrafo único, da Resolução CMN 4.968/2021 (redação dada pela Resolução CMN 5.117/2024, vigente desde 1º/3/2024) exclui do seu alcance as administradoras de consórcio, as instituições de pagamento, as corretoras e distribuidoras de títulos e valores mobiliários e as corretoras de câmbio, remetendo-as à regulamentação própria do BCB. A razão é de competência: a Lei 12.865/2013 atribuiu ao BCB, e não ao CMN, a regulação das instituições de pagamento, de modo que o CMN não poderia discipliná-las diretamente.\n\nFicam de fora da 4.968, portanto, as fintechs autorizadas como instituição de pagamento nas modalidades da Resolução BCB 80/2021: emissor de moeda eletrônica (contas pré-pagas, carteiras digitais), emissor de instrumento de pagamento pós-pago (cartões de crédito sem licença bancária), credenciador (adquirência) e iniciador de transação de pagamento. Essas entram na Resolução BCB 260/2022.\n\nEntram na 4.968 as fintechs que são instituições financeiras: Sociedade de Crédito Direto (SCD) e Sociedade de Empréstimo entre Pessoas (SEP), ambas da Resolução CMN 5.050/2022; bancos digitais licenciados como banco múltiplo ou comercial; sociedades de crédito, financiamento e investimento (financeiras); e demais autorizadas pelo BCB não listadas na exclusão.\n\nDuas situações exigem atenção na prática. Primeiro, o arranjo híbrido, muito comum: um “banco digital” que opera por meio de uma IP emissora de moeda eletrônica (conta) e de uma SCD ou financeira (crédito) no mesmo grupo. Cada pessoa jurídica responde à sua norma, ou seja, a IP à 260 e a instituição financeira à 4.968, ainda que o grupo adote uma política unificada. Segundo, fintechs sem autorização do BCB (IPs abaixo dos limiares de autorização obrigatória da Resolução BCB 80/2021, correspondentes, modelos BaaS que operam sob a licença de terceiro) não estão sujeitas a nenhuma das duas resoluções por força própria; o dever recai sobre a instituição autorizada que lhes dá suporte. Esse é o ponto que mais importa para o Rastro, porque é justamente a instituição licenciada que responde pela falha de controle do parceiro.\n\n### Lacunas\n\nNenhuma apontada no fichamento.\n"}, {"info": {"id": "cnj-rec-159-2024", "titulo": "Recomendação CNJ nº 159, de 23 de outubro de 2024 (litigância abusiva)", "orgao": "CNJ", "tipo": "norma", "status": "fichado", "data_publicacao": "2024-10-23", "tags": "[cnj, litigancia-predatoria, recomendacao]", "grupo": "normas", "caminho": "normas/cnj/cnj-rec-159-2024.md", "quando": "2026-07-07"}, "meta": {"id": "cnj-rec-159-2024", "tipo": "norma", "titulo": "Recomendação CNJ nº 159, de 23 de outubro de 2024 (litigância abusiva)", "orgao": "CNJ", "data_publicacao": "2024-10-23", "vigencia": "", "altera": "[]", "fase_rastro": "[recuperacao_defesa]", "conexao_comercial": "[adversarial]", "fonte_primaria": "https://atos.cnj.jus.br/atos/detalhar/5822", "status": "fichado", "tags": "[cnj, litigancia-predatoria, recomendacao]", "confidencial": "false"}, "corpo": "\n# Recomendação CNJ nº 159/2024 — litigância abusiva\n\n## Ementa\n\nRecomendação do CNJ (DJe/CNJ nº 261/2024) sobre o enfrentamento da litigância abusiva no Poder Judiciário. Define litigância abusiva como desvio ou excesso manifesto da finalidade do direito de acesso à Justiça; recomenda a magistrados medidas fundamentadas de verificação de legitimidade e diligências probatórias, e aos tribunais painéis de monitoramento, integração de bases de dados e cooperação com OAB, MP e Defensoria. Menciona prejuízos superiores a R$ 10,7 bilhões (2020) em dois segmentos processuais.\n\n## Distinção crítica (erro comum)\n\nNão confundir com a Recomendação CNJ nº 127/2022: aquela trata de \"assédio judicial\" contra a liberdade de expressão (ações em massa para calar críticos), não de massa consumerista. Para a tese defensiva de instituições financeiras, o ato pertinente é ESTA Recomendação 159/2024, combinada com o [[stj-tema-1198]].\n\n## Aplicação prática no ciclo Rastro\n\nRecuperação/defesa: fundamenta requerimentos de providências ao juízo (verificação de legitimidade, diligências) e o diálogo institucional com NUMOPEDE/Corregedorias na onda pós-incidente. Dado quantitativo oficial complementar: Diagnóstico CNJ/ABJ sobre litigância abusiva (dez/2025) — mais de 129 mil processos mencionando o fenômeno, 34,7 mil só no 1º semestre de 2025.\n\n## Lacunas\n\n- Recomendação não vincula — a força normativa vem do Tema 1198 (repetitivo); usar a 159/2024 como reforço argumentativo e institucional.\n\n## Relações\n\n[[hub-litigancia-predatoria]] · [[stj-tema-1198]]\n"}, {"info": {"id": "cnj-res-615-2025", "titulo": "Resolução CNJ nº 615, de 11 de março de 2025 (governança de IA no Judiciário)", "orgao": "CNJ", "tipo": "norma", "status": "fichado", "data_publicacao": "2025-03-14", "tags": "[cnj, ia, governanca, judiciario, auditoria]", "grupo": "normas", "caminho": "normas/cnj/cnj-res-615-2025.md", "quando": "2026-07-03"}, "meta": {"id": "cnj-res-615-2025", "tipo": "norma", "titulo": "Resolução CNJ nº 615, de 11 de março de 2025 (governança de IA no Judiciário)", "orgao": "CNJ", "data_publicacao": "2025-03-14", "vigencia": "", "altera": "[\"Revoga a Resolução CNJ nº 332/2020\"]", "fase_rastro": "[recuperacao_defesa]", "conexao_comercial": "[adversarial, diagnostico]", "fonte_primaria": "https://atos.cnj.jus.br/atos/detalhar/6001", "status": "fichado", "tags": "[cnj, ia, governanca, judiciario, auditoria]", "confidencial": "false"}, "corpo": "\n# Resolução CNJ nº 615/2025 — governança de IA no Judiciário\n\n## Ementa\n\nEstabelece diretrizes para o desenvolvimento, a utilização e a governança de soluções com recursos de inteligência artificial no Poder Judiciário. Aprovada em 11/03/2025; publicada no DJe/CNJ nº 54/2025, de 14/03/2025, p. 2-17. Revoga integralmente a Resolução CNJ nº 332/2020. Posteriormente alterada pela Resolução CNJ nº 674/2026 (composição do Comitê).\n\n## Vigência e prazos\n\nEntra em vigor 120 dias após a publicação (art. 47) — ou seja, julho de 2025. Os tribunais têm 12 meses para adequar projetos e modelos de IA em uso (art. 45, parágrafo único). Nota sobre as datas do cronograma acima: o cômputo exato dos 120 dias e dos 12 meses (dias corridos, termo inicial) não foi conferido no texto integral — as datas de 12/07/2025 e 12/07/2026 são cálculo aritmético a partir de 14/03/2025, marcado como aproximação; confirmar na leitura integral.\n\n## Estrutura principal\n\nClassificação de risco das soluções de IA: alto risco (AR1-AR5 — perfis comportamentais, valoração de provas, tipificação penal, aplicação de normas, reconhecimento facial/biométrico) e baixo risco (BR1-BR8). Comitê Nacional de IA do Judiciário (art. 15). Plataforma Sinapses na PDPJ-Br para cadastro, catálogo público e auditoria de modelos (art. 4º, III). Supervisão humana obrigatória; comunicação de eventos adversos em até 72 horas; revisão anual das classificações.\n\n## Aplicação prática no ciclo Rastro\n\nRecuperação/defesa: baliza o uso defensável de IA no contencioso de massa (triagem da onda consumerista, detecção de padrões de litigância predatória) e informa como o próprio Judiciário audita IA — parâmetro para a governança de IA que o escritório vende (ponte com o IMCI e o módulo de evidências do Projeto Rastro). Não impõe obrigações a fintechs; sua relevância é metodológica e de contencioso.\n\n## Conexão comercial\n\nAlimenta o entregável adversarial (uso auditável de IA na defesa em massa) e o diagnóstico de governança de IA no contencioso.\n\n## Lacunas\n\n- Datas exatas de vigência e do prazo de adequação: aproximadas por cálculo, não conferidas no texto integral (ver acima).\n- Resolução CNJ nº 674/2026 (alteração): não fichada.\n\n## Relações\n\n[[hub-litigancia-predatoria]] · [[hub-jurisprudencia-consumerista]]\n"}, {"info": {"id": "lcp-105-2001", "titulo": "Lei Complementar nº 105, de 10 de janeiro de 2001 (sigilo das operações de instituições financeiras — o contraponto ao compartilhamento e à comunicação de ilícitos)", "orgao": "Congresso Nacional", "tipo": "norma", "status": "fichado", "data_publicacao": "2001-01-11", "tags": "[lei-complementar, sigilo-bancario, compartilhamento, coaf, quebra-de-sigilo, crime]", "grupo": "normas", "caminho": "normas/lei/lcp-105-2001.md", "quando": "2026-11-05"}, "meta": {"id": "lcp-105-2001", "tipo": "norma", "titulo": "Lei Complementar nº 105, de 10 de janeiro de 2001 (sigilo das operações de instituições financeiras — o contraponto ao compartilhamento e à comunicação de ilícitos)", "orgao": "Congresso Nacional", "data_publicacao": "2001-01-11", "vigencia": "", "altera": "[]", "fase_rastro": "[war_room, recuperacao_defesa]", "conexao_comercial": "[adversarial, diagnostico]", "fonte_primaria": "https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp105.htm", "status": "fichado", "tags": "[lei-complementar, sigilo-bancario, compartilhamento, coaf, quebra-de-sigilo, crime]", "confidencial": "false"}, "corpo": "\n# Lei Complementar nº 105/2001 — o sigilo e as suas portas de saída\n\nLida em 5/11/2026 no texto do Planalto (DOU de 11/1/2001). Texto integral em `normas/lei/_texto-lcp-105-2001.txt`. Entra como contraponto: toda medida do war room que envolve dar informação de cliente a alguém (PSP recebedor, sistema de compartilhamento, Coaf, polícia, juízo, parceiro forense) precisa passar por um dos incisos do § 3º do art. 1º ou por ordem judicial.\n\n## A regra (art. 1º, caput e §§ 1º e 2º)\n\n\"As instituições financeiras conservarão sigilo em suas operações ativas e passivas e serviços prestados.\" O § 1º lista quem é instituição financeira para a lei, incluindo \"VI - administradoras de cartões de crédito\" e \"XIII - outras sociedades que, em razão da natureza de suas operações, assim venham a ser consideradas pelo Conselho Monetário Nacional\". A instituição de pagamento não consta do rol de 2001; a sujeição vem de norma posterior: a Res. CMN 4.282/2013, art. 17, submete \"os instituidores de arranjos de pagamento e as instituições de pagamento\" à LC 105 ([[cmn-res-4282-2013]]), e a Res. Conjunta 6/2023, art. 1º, § 2º, equipara os obrigados ao compartilhamento (ficha [[resolucao-conjunta-6-2023]]). Factoring segue as normas das IFs (§ 2º).\n\n## As portas de saída (art. 1º, § 3º, literal)\n\n> § 3º Não constitui violação do dever de sigilo:\n> I – a troca de informações entre instituições financeiras, para fins cadastrais, inclusive por intermédio de centrais de risco, observadas as normas baixadas pelo Conselho Monetário Nacional e pelo Banco Central do Brasil;\n> II - o fornecimento de informações constantes de cadastro de emitentes de cheques sem provisão de fundos e de devedores inadimplentes, a entidades de proteção ao crédito, observadas as normas baixadas pelo Conselho Monetário Nacional e pelo Banco Central do Brasil;\n> III – o fornecimento das informações de que trata o § 2º do art. 11 da Lei nº 9.311, de 24 de outubro de 1996;\n> IV – a comunicação, às autoridades competentes, da prática de ilícitos penais ou administrativos, abrangendo o fornecimento de informações sobre operações que envolvam recursos provenientes de qualquer prática criminosa;\n> V – a revelação de informações sigilosas com o consentimento expresso dos interessados;\n> VI – a prestação de informações nos termos e condições estabelecidos nos artigos 2º, 3º, 4º, 5º, 6º, 7º e 9 desta Lei Complementar.\n> VII - o fornecimento de dados financeiros e de pagamentos, relativos a operações de crédito e obrigações de pagamento adimplidas ou em andamento de pessoas naturais ou jurídicas, a gestores de bancos de dados, para formação de histórico de crédito, nos termos de lei específica. (Incluído pela Lei Complementar nº 166, de 2019)\n> VIII - a prestação ou publicação de informações relativas à identificação dos beneficiários pessoas jurídicas e dos valores aproveitados na concessão de incentivo ou benefício de natureza tributária, financeira ou creditícia que implique diminuição de receita ou aumento de despesa. (Incluído pela Lei Complementar nº 224, de 2025)\n\nLeitura para o war room: a comunicação ao Coaf e a notícia-crime cabem no inciso IV; o compartilhamento de indícios de fraude entre instituições se apoia no inciso I (troca \"para fins cadastrais\", nas normas do CMN e do BCB) e no inciso V (consentimento), que é exatamente o que a Res. Conjunta 6/2023 exige em cláusula destacada; o ofício a PSP recebedor pedindo dados cadastrais da conta de destino não tem porta própria e, sem consentimento ou norma do BCB que o ampare, depende de ordem judicial (art. 3º).\n\n## Quebra e autoridades (arts. 1º, § 4º, 2º, 3º, 4º e 9º)\n\n§ 4º do art. 1º: a quebra \"poderá ser decretada, quando necessária para apuração de ocorrência de qualquer ilícito, em qualquer fase do inquérito ou do processo judicial, e especialmente\" nos crimes listados, entre eles \"V – contra o sistema financeiro nacional\", \"VIII – lavagem de dinheiro ou ocultação de bens, direitos e valores\" e \"IX – praticado por organização criminosa\". Art. 2º, § 1º: o sigilo \"não pode ser oposto ao Banco Central do Brasil\" na fiscalização, \"compreendendo a apuração, a qualquer tempo, de ilícitos praticados por controladores, administradores, membros de conselhos estatutários, gerentes, mandatários e prepostos\". Art. 3º: informações ordenadas pelo Judiciário, \"preservado o seu caráter sigiloso mediante acesso restrito às partes, que delas não poderão servir-se para fins estranhos à lide\". Art. 4º: Poder Legislativo e CPIs. Art. 9º: BCB e CVM informam ao Ministério Público crime de ação pública ou indícios, em quinze dias do recebimento do processo (§ 1º).\n\n## Crime (art. 10)\n\n\"A quebra de sigilo, fora das hipóteses autorizadas nesta Lei Complementar, constitui crime e sujeita os responsáveis à pena de reclusão, de um a quatro anos, e multa\"; \"incorre nas mesmas penas quem omitir, retardar injustificadamente ou prestar falsamente as informações requeridas nos termos desta Lei Complementar\" (parágrafo único). Art. 11: responsabilidade pessoal do servidor que usar informação obtida por quebra.\n\n## Aplicação prática no ciclo Rastro\n\nOperação: antes de cada envio de dado de cliente a terceiro, nomear o inciso do § 3º ou a ordem judicial que o autoriza, e registrar na ata; sem porta, pedir a exibição ou o bloqueio em juízo (CPC, arts. 300, 301 e 396 a 404). Sustentação: a cláusula de consentimento da Res. Conjunta 6 é a prova de que o compartilhamento passou pelo inciso V. Defesa: a resposta a ordem judicial é restrita às partes e à lide (art. 3º), o que limita o reaproveitamento do que se recebe. Regime: a IP não está no rol de 2001; a equiparação depende de norma posterior, a conferir caso a caso.\n\n## Lacunas\n\n- Equiparação das instituições de pagamento para fins de sigilo: resolvida em 5/11/2026 pela leitura da Res. CMN 4.282/2013, art. 17, literal: \"Os instituidores de arranjos de pagamento e as instituições de pagamento ficam sujeitos ao disposto na Lei Complementar nº 105, de 10 de janeiro de 2001\" ([[cmn-res-4282-2013]]). A ficha [[resolucao-conjunta-6-2023]] registra a equiparação feita pelo ato conjunto para os obrigados ao compartilhamento. A Lei 12.865/2013 não foi conferida quanto ao ponto.\n- Arts. 5º a 8º (Receita Federal, Fisco, convênios) não transcritos.\n- Jurisprudência sobre compartilhamento Coaf e Receita sem ordem judicial (tema de repercussão geral do STF): não fichada; não citar sem ficha.\n\n## Relações\n\n[[lei-9613-1998]] · [[bcb-circular-3978-2020]] · [[resolucao-conjunta-6-2023]] · [[bcb-res-343-2023]] · [[hub-catalogo-medidas]] · [[glossario-dispositivos-diagnostico]] · [[matriz-do-servico]]\n"}, {"info": {"id": "lei-12865-2013", "titulo": "Lei nº 12.865, de 9 de outubro de 2013 (arranjos de pagamento e instituições de pagamento integrantes do SPB) — A FICHAR", "orgao": "Congresso Nacional", "tipo": "norma", "status": "fichado", "data_publicacao": "2013-10-10", "tags": "[lei, arranjo-de-pagamento, instituicao-de-pagamento, conta-de-pagamento, patrimonio-separado, spb]", "grupo": "normas", "caminho": "normas/lei/lei-12865-2013.md", "quando": "2026-11-02"}, "meta": {"id": "lei-12865-2013", "tipo": "norma", "titulo": "Lei nº 12.865, de 9 de outubro de 2013 (arranjos de pagamento e instituições de pagamento integrantes do SPB) — A FICHAR", "orgao": "Congresso Nacional", "data_publicacao": "2013-10-10", "vigencia": "", "altera": "[]", "fase_rastro": "[]", "conexao_comercial": "[benchmark]", "fonte_primaria": "https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2013/lei/l12865.htm", "status": "fichado", "tags": "[lei, arranjo-de-pagamento, instituicao-de-pagamento, conta-de-pagamento, patrimonio-separado, spb]", "confidencial": "false"}, "corpo": "\n## Por que esta norma entra na base (triagem de 2026-11-02)\n\nLei que criou as figuras do arranjo de pagamento e da instituição de pagamento no Sistema de Pagamentos Brasileiro e atribuiu ao CMN e ao BCB a competência para regulá-los. É a norma-matriz de toda a camada BCB do repositório (Res. BCB 80/81/2021, 436/2024, 260/2022) e o fundamento legal da segregação patrimonial dos recursos de contas de pagamento, argumento central em defesa contra constrição de saldo de usuário final. Conversão do texto consolidado na Câmara: https://www2.camara.leg.br/legin/fed/lei/2013/lei-12865-9-outubro-2013-777235-normaatualizada-pl.pdf\n\n## Ementa\n\nNAO_CONFIRMADO — transcrever do texto oficial (fonte_primaria). Nada abaixo pode ser preenchido por inferência.\n\n## Vigência e prazos\n\nNAO_CONFIRMADO\n\n## Obrigações principais\n\nNAO_CONFIRMADO — dispositivos a ler com prioridade no fichamento: definições (art. 6º), competências do CMN e do BCB sobre arranjos e instituições de pagamento (arts. 9º e seguintes), regime dos recursos mantidos em contas de pagamento (art. 12). Confirmar numeração e redação vigente, inclusive alterações posteriores.\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: enquadramento da fintech (modalidade, sujeição à regulação do BCB). Recuperação/defesa: fundamento legal da inatingibilidade dos recursos de conta de pagamento por dívidas da instituição. Detalhar após fichamento.\n\n## Conexão comercial\n\nDiagnóstico de enquadramento regulatório; frente adversarial (defesa de saldo de usuário em execuções contra a IP). Detalhar após fichamento.\n\n## Lacunas\n\nFicha criada como stub de triagem: todo o conteúdo normativo está pendente de leitura do inteiro teor. Lei com alterações posteriores — usar texto consolidado e registrar a data da consolidação consultada.\n\n## Relações\n\n[[cmn-res-4282-2013]] · [[bcb-res-80-2021]] · [[bcb-res-81-2021]] · [[bcb-res-436-2024]] · [[bcb-res-260-2022]]\n\n## Fichamento (operador, 2026-11-02)\n\n### Aplicação prática no ciclo Rastro\n\nEstá na Lei 12.865/2013, que criou as figuras do arranjo de pagamento e da instituição de pagamento (art. 6º), atribuiu ao CMN e ao Banco Central a competência para regulá-los (arts. 9º e 15) e estabeleceu que os recursos mantidos em contas de pagamento constituem patrimônio separado, inatingível por dívidas da instituição (art. 12)\n\n### Lacunas\n\nNenhuma apontada no fichamento.\n"}, {"info": {"id": "lei-14478-2022", "titulo": "Lei nº 14.478, de 21 de dezembro de 2022 (marco legal dos ativos virtuais: autorização prévia das VASPs, diretrizes, crime do art. 171-A do CP e inclusão das VASPs na Lei 9.613)", "orgao": "Congresso Nacional", "tipo": "norma", "status": "fichado", "data_publicacao": "2022-12-22", "tags": "[lei, ativos-virtuais, vasp, pld-ft, crime, autorizacao, cdc]", "grupo": "normas", "caminho": "normas/lei/lei-14478-2022.md", "quando": "2026-11-05"}, "meta": {"id": "lei-14478-2022", "tipo": "norma", "titulo": "Lei nº 14.478, de 21 de dezembro de 2022 (marco legal dos ativos virtuais: autorização prévia das VASPs, diretrizes, crime do art. 171-A do CP e inclusão das VASPs na Lei 9.613)", "orgao": "Congresso Nacional", "data_publicacao": "2022-12-22", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[diagnostico, adversarial]", "fonte_primaria": "https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2022/lei/l14478.htm", "status": "fichado", "tags": "[lei, ativos-virtuais, vasp, pld-ft, crime, autorizacao, cdc]", "confidencial": "false"}, "corpo": "\n# Lei nº 14.478/2022 — o marco legal das VASPs\n\nLida em 5/11/2026 no texto do Planalto (DOU de 22/12/2022). Texto integral em `normas/lei/_texto-lei-14478-2022.txt`. Vigência: \"após decorridos 180 (cento e oitenta) dias de sua publicação oficial\" (art. 14); a data no frontmatter é cômputo aritmético a partir de 22/12/2022 e deve ser conferida contra a regra de contagem antes de uso em peça. O ato do Poder Executivo que atribuiu a disciplina e a supervisão ao Banco Central (art. 6º) não foi lido nesta rodada.\n\n## Ementa\n\nLiteral: \"Dispõe sobre diretrizes a serem observadas na prestação de serviços de ativos virtuais e na regulamentação das prestadoras de serviços de ativos virtuais; altera o Decreto-Lei nº 2.848, de 7 de dezembro de 1940 (Código Penal), para prever o crime de fraude com a utilização de ativos virtuais, valores mobiliários ou ativos financeiros; e altera a Lei nº 7.492, de 16 de junho de 1986, que define crimes contra o sistema financeiro nacional, e a Lei nº 9.613, de 3 de março de 1998, que dispõe sobre lavagem de dinheiro, para incluir as prestadoras de serviços de ativos virtuais no rol de suas disposições.\"\n\n## Por que esta norma entra na base\n\nÉ a lei que torna a VASP uma instituição autorizada (art. 2º), que a obriga à prevenção à lavagem de dinheiro como diretriz (art. 4º, VII) e que a inclui expressamente entre as pessoas obrigadas da Lei 9.613 (art. 12, inserindo o inciso XIX no parágrafo único do art. 9º). Dá o tipo penal próprio da fraude com ativos virtuais (CP, art. 171-A) e manda aplicar o CDC ao mercado de ativos virtuais (art. 13). É a base legal do cenário \"recursos de origem fraudulenta em ativos virtuais\" da matriz de incidentes e da entrada das VASPs nas Res. BCB 552/2026, 584/2026 e 591/2026.\n\n## Dispositivos principais\n\n**Autorização prévia (art. 2º).** \"As prestadoras de serviços de ativos virtuais somente poderão funcionar no País mediante prévia autorização de órgão ou entidade da Administração Pública federal.\" O parágrafo único admite procedimento simplificado nas hipóteses fixadas pelo regulador.\n\n**Ativo virtual (art. 3º).** \"A representação digital de valor que pode ser negociada ou transferida por meios eletrônicos e utilizada para realização de pagamentos ou com propósito de investimento\", excluídos moeda nacional e estrangeira (I), moeda eletrônica da Lei 12.865/2013 (II), pontos e recompensas de programas de fidelidade (III) e representações de ativos cuja emissão, escrituração, negociação ou liquidação esteja prevista em lei ou regulamento, como valores mobiliários e ativos financeiros (IV). A lei não alcança ativos representativos de valores mobiliários nem altera competência da CVM (art. 1º, parágrafo único).\n\n**Diretrizes (art. 4º).** Livre iniciativa e concorrência (I); boas práticas de governança, transparência e abordagem baseada em riscos (II); segurança da informação e proteção de dados pessoais (III); proteção e defesa de consumidores e usuários (IV); proteção à poupança popular (V); solidez e eficiência (VI); \"prevenção à lavagem de dinheiro e ao financiamento do terrorismo e da proliferação de armas de destruição em massa, em alinhamento com os padrões internacionais\" (VII).\n\n**VASP (art. 5º).** Pessoa jurídica que executa, em nome de terceiros, ao menos um dos serviços: troca entre ativos virtuais e moeda nacional ou estrangeira (I); troca entre ativos virtuais (II); transferência de ativos virtuais (III); custódia ou administração de ativos virtuais ou de instrumentos que possibilitem controle sobre eles (IV); participação em serviços financeiros e prestação de serviços relacionados à oferta por emissor ou venda de ativos virtuais (V).\n\n**Regulador (arts. 6º e 7º).** Ato do Poder Executivo atribui disciplina e supervisão; ao regulador compete autorizar funcionamento e atos societários (I), condições para cargos (II), supervisionar e aplicar a Lei 13.506/2017 (III), cancelar autorizações (IV) e dispor sobre inclusão no mercado de câmbio e capitais (V). Instituições autorizadas pelo BCB podem prestar o serviço exclusivamente ou cumulá-lo (art. 8º). Prazo de adequação das VASPs em atividade \"não inferiores a 6 (seis) meses\" (art. 9º).\n\n**Crime (art. 10, CP art. 171-A).** \"Organizar, gerir, ofertar ou distribuir carteiras ou intermediar operações que envolvam ativos virtuais, valores mobiliários ou quaisquer ativos financeiros com o fim de obter vantagem ilícita, em prejuízo alheio, induzindo ou mantendo alguém em erro, mediante artifício, ardil ou qualquer outro meio fraudulento. Pena - reclusão, de 4 (quatro) a 8 (oito) anos, e multa.\"\n\n**Alterações em outras leis (arts. 11 e 12).** Lei 7.492/1986, art. 1º, parágrafo único, I-A: equipara a instituição financeira \"a pessoa jurídica que ofereça serviços referentes a operações com ativos virtuais, inclusive intermediação, negociação ou custódia\". Lei 9.613/1998: § 4º do art. 1º (aumento de 1/3 a 2/3 se os crimes forem cometidos de forma reiterada, por organização criminosa \"ou por meio da utilização de ativo virtual\"); art. 9º, parágrafo único, XIX (VASPs como obrigadas); art. 10, II (registro de transações inclui ativos virtuais); art. 12-A (CNPEP e consulta obrigatória pelas pessoas do art. 9º).\n\n**CDC (art. 13).** \"Aplicam-se às operações conduzidas no mercado de ativos virtuais, no que couber, as disposições da Lei nº 8.078, de 11 de setembro de 1990 (Código de Defesa do Consumidor).\"\n\n## Aplicação prática no ciclo Rastro\n\nRegime: a VASP é obrigada pela Lei 9.613 desde a vigência desta lei, antes mesmo da autorização do BCB; o diagnóstico pergunta pela política de PLD ainda que a autorização esteja em curso. Sustentação: o art. 13 fecha a discussão sobre a aplicação do CDC à VASP, e a responsabilidade por fato do serviço (CDC, art. 14) vale para ela. Operação: a frente criminal tem tipo próprio (CP, art. 171-A) além do art. 171, § 2º-A; a notícia-crime deve nomear os dois quando houver intermediação. War room: a transferência de ou para carteira autocustodiada acima de US$ 10 mil é comunicada ao Coaf até o dia útil seguinte (Circular 3.978, art. 49, V, desde 1º/10/2026) e, a partir de 1º/1/2027, sofre retenção cautelar de 24 horas (Res. 142, art. 2º-B).\n\n## Lacunas\n\n- Decreto que atribuiu ao BCB a competência do art. 6º e as resoluções do BCB sobre autorização e adequação das VASPs: não lidos; não citar número sem conferir.\n- Data de vigência: cômputo aritmético de 180 dias (20/6/2023); conferir a regra de contagem.\n- Interface com a Lei 13.506/2017 (processo sancionador) não fichada.\n\n## Relações\n\n[[lei-9613-1998]] · [[bcb-circular-3978-2020]] · [[bcb-res-552-2026]] · [[bcb-res-584-2026]] · [[bcb-res-142-2021]] · [[bcb-res-343-2023]] · [[lei-12865-2013]] · [[hub-catalogo-medidas]]\n"}, {"info": {"id": "lei-9613-1998", "titulo": "Lei nº 9.613, de 3 de março de 1998 (lavagem de dinheiro — arts. 9º a 12: obrigados, cadastro e registro, comunicação ao Coaf em 24 horas, sanções administrativas)", "orgao": "Congresso Nacional", "tipo": "norma", "status": "fichado", "data_publicacao": "1998-03-04", "tags": "[lei, pld-ft, coaf, cadastro, registro, guarda, sancao, administradores, instituicao-de-pagamento, vasp]", "grupo": "normas", "caminho": "normas/lei/lei-9613-1998.md", "quando": "2026-11-05"}, "meta": {"id": "lei-9613-1998", "tipo": "norma", "titulo": "Lei nº 9.613, de 3 de março de 1998 (lavagem de dinheiro — arts. 9º a 12: obrigados, cadastro e registro, comunicação ao Coaf em 24 horas, sanções administrativas)", "orgao": "Congresso Nacional", "data_publicacao": "1998-03-04", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[diagnostico, adversarial]", "fonte_primaria": "https://www.planalto.gov.br/ccivil_03/leis/l9613.htm", "status": "fichado", "tags": "[lei, pld-ft, coaf, cadastro, registro, guarda, sancao, administradores, instituicao-de-pagamento, vasp]", "confidencial": "false"}, "corpo": "\n# Lei nº 9.613/1998 — a base legal do dever de comunicar (arts. 9º a 12)\n\nLida em 5/11/2026 no texto compilado do Planalto (DOU de 4/3/1998), que traz as redações sucessivas; esta ficha transcreve a redação vigente de cada dispositivo, com a lei que a deu. Texto integral em `normas/lei/_texto-lei-9613-1998.txt`. Os arts. 1º a 8º (tipo penal, efeitos da condenação, bens) ficam para a frente criminal e não estão fichados aqui; o art. 14 (Coaf) só na lacuna.\n\n## Por que esta norma entra na base\n\nÉ a fonte da obrigação que a Circular BCB 3.978/2020 detalha, e três coisas só estão na lei: o prazo de 24 horas para comunicar ao Coaf (art. 11, II), a imunidade das comunicações de boa-fé (art. 11, § 2º) e as sanções, que alcançam também os administradores (art. 12). Também é a lei que diz que a fintech de pagamento é obrigada: art. 9º, parágrafo único, IV.\n\n## Quem está obrigado (art. 9º, redação da Lei 12.683/2012)\n\nCaput: \"as pessoas físicas e jurídicas que tenham, em caráter permanente ou eventual, como atividade principal ou acessória, cumulativamente ou não: I - a captação, intermediação e aplicação de recursos financeiros de terceiros, em moeda nacional ou estrangeira; II - a compra e venda de moeda estrangeira ou ouro como ativo financeiro ou instrumento cambial; III - a custódia, emissão, distribuição, liquidação, negociação, intermediação ou administração de títulos ou valores mobiliários.\"\n\nParágrafo único, incisos que alcançam a carteira Rastro: \"III - as administradoras de cartões de credenciamento ou cartões de crédito, bem como as administradoras de consórcios\"; \"IV - as administradoras ou empresas que se utilizem de cartão ou qualquer outro meio eletrônico, magnético ou equivalente, que permita a transferência de fundos\" (é a instituição de pagamento, autorizada ou não); \"V - as empresas de arrendamento mercantil (leasing), as empresas de fomento comercial (factoring) e as Empresas Simples de Crédito (ESC)\" (LC 167/2019); \"VIII - as demais entidades cujo funcionamento dependa de autorização de órgão regulador dos mercados financeiro, de câmbio, de capitais e de seguros\"; \"XIX - as prestadoras de serviços de ativos virtuais\" (Lei 14.478/2022). Consequência: a IP sem autorização e o BaaS que \"permita a transferência de fundos\" são obrigados pela lei mesmo fora da Circular 3.978, que só alcança autorizadas.\n\n## Art. 10 — identificação, registro, controles internos e guarda\n\n> Art. 10. As pessoas referidas no art. 9º:\n> I - identificarão seus clientes e manterão cadastro atualizado, nos termos de instruções emanadas das autoridades competentes;\n> II - manterão registro de toda transação em moeda nacional ou estrangeira, títulos e valores mobiliários, títulos de crédito, metais, ativos virtuais, ou qualquer ativo passível de ser convertido em dinheiro, que ultrapassar limite fixado pela autoridade competente e nos termos de instruções por esta expedidas; (Redação dada pela Lei nº 14.478, de 2022)\n> III - deverão adotar políticas, procedimentos e controles internos, compatíveis com seu porte e volume de operações, que lhes permitam atender ao disposto neste artigo e no art. 11, na forma disciplinada pelos órgãos competentes; (Redação dada pela Lei nº 12.683, de 2012)\n> IV - deverão cadastrar-se e manter seu cadastro atualizado no órgão regulador ou fiscalizador e, na falta deste, no Conselho de Controle de Atividades Financeiras (Coaf), na forma e condições por eles estabelecidas; (Incluído pela Lei nº 12.683, de 2012)\n> V - deverão atender às requisições formuladas pelo Coaf na periodicidade, forma e condições por ele estabelecidas, cabendo-lhe preservar, nos termos da lei, o sigilo das informações prestadas. (Incluído pela Lei nº 12.683, de 2012)\n> § 1º Na hipótese de o cliente constituir-se em pessoa jurídica, a identificação referida no inciso I deste artigo deverá abranger as pessoas físicas autorizadas a representá-la, bem como seus proprietários.\n> § 2º Os cadastros e registros referidos nos incisos I e II deste artigo deverão ser conservados durante o período mínimo de cinco anos a partir do encerramento da conta ou da conclusão da transação, prazo este que poderá ser ampliado pela autoridade competente.\n> § 3º O registro referido no inciso II deste artigo será efetuado também quando a pessoa física ou jurídica, seus entes ligados, houver realizado, em um mesmo mês-calendário, operações com uma mesma pessoa, conglomerado ou grupo que, em seu conjunto, ultrapassem o limite fixado pela autoridade competente.\n\nA ampliação do § 2º é o que a Circular 3.978 faz no art. 67: dez anos. Art. 10-A (Lei 10.701/2003): cadastro geral de correntistas e clientes mantido pelo Banco Central.\n\n## Art. 11 — especial atenção e comunicação em 24 horas\n\n> Art. 11. As pessoas referidas no art. 9º:\n> I - dispensarão especial atenção às operações que, nos termos de instruções emanadas das autoridades competentes, possam constituir-se em sérios indícios dos crimes previstos nesta Lei, ou com eles relacionar-se;\n> II - deverão comunicar ao Coaf, abstendo-se de dar ciência de tal ato a qualquer pessoa, inclusive àquela à qual se refira a informação, no prazo de 24 (vinte e quatro) horas, a proposta ou realização: (Redação dada pela Lei nº 12.683, de 2012)\n> a) de todas as transações referidas no inciso II do art. 10, acompanhadas da identificação de que trata o inciso I do mencionado artigo; e\n> b) das operações referidas no inciso I;\n> III - deverão comunicar ao órgão regulador ou fiscalizador da sua atividade ou, na sua falta, ao Coaf, na periodicidade, forma e condições por eles estabelecidas, a não ocorrência de propostas, transações ou operações passíveis de serem comunicadas nos termos do inciso II. (Incluído pela Lei nº 12.683, de 2012)\n> § 1º As autoridades competentes, nas instruções referidas no inciso I deste artigo, elaborarão relação de operações que, por suas características, no que se refere às partes envolvidas, valores, forma de realização, instrumentos utilizados, ou pela falta de fundamento econômico ou legal, possam configurar a hipótese nele prevista.\n> § 2º As comunicações de boa-fé, feitas na forma prevista neste artigo, não acarretarão responsabilidade civil ou administrativa.\n> § 3º O Coaf disponibilizará as comunicações recebidas com base no inciso II do caput aos respectivos órgãos responsáveis pela regulação ou fiscalização das pessoas a que se refere o art. 9º. (Redação dada pela Lei nº 12.683, de 2012)\n\nA \"relação de operações\" do § 1º é, para as autorizadas pelo BCB, a Carta Circular 4.001/2020. Art. 11-A (Lei 12.683/2012): transferências internacionais e saques em espécie \"deverão ser previamente comunicados à instituição financeira, nos termos, limites, prazos e condições fixados pelo Banco Central do Brasil\".\n\n## Art. 12 — sanções administrativas, inclusive aos administradores\n\nAplicáveis \"às pessoas referidas no art. 9º, bem como aos administradores das pessoas jurídicas, que deixem de cumprir as obrigações previstas nos arts. 10 e 11\", cumulativamente ou não: I advertência; II multa pecuniária variável não superior ao dobro do valor da operação, ao dobro do lucro real obtido ou presumível, ou a R$ 20.000.000,00 (redação da Lei 12.683/2012); III inabilitação temporária, até dez anos, para cargo de administrador; IV cassação ou suspensão da autorização para o exercício de atividade, operação ou funcionamento. § 2º: multa \"por culpa ou dolo\" quando, entre outros, \"IV - descumprirem a vedação ou deixarem de fazer a comunicação a que se refere o art. 11\". § 3º e § 4º: inabilitação por infração grave ou reincidência; cassação por reincidência específica. Art. 12-A (Lei 14.478/2022): consulta ao Cadastro Nacional de Pessoas Expostas Politicamente entre os procedimentos dos arts. 10 e 11 (§ 2º).\n\n## Aplicação prática no ciclo Rastro\n\nRegime: a fintech responde à lei pelo inciso do art. 9º em que se enquadra, inclusive antes da autorização do BCB. Tempo: 24 horas do art. 11, II, lado a lado com o fluxo da Circular 3.978 (ver a nota de leitura na ficha dela). Acervo: cadastro, registros e a política do art. 10, III. Sustentação: o § 2º do art. 11 protege quem comunica de boa-fé; o art. 12 expõe o administrador, o que muda a conversa com o conselho. Operação: a vedação de dar ciência \"a qualquer pessoa, inclusive àquela à qual se refira a informação\" vale para a vítima, para o cliente barrado e para o próprio reclamante; a ata do war room e o roteiro de atendimento devem respeitá-la.\n\n## Lacunas\n\n- Art. 14 (Coaf): o compilado traz redações sucessivas dadas por medidas provisórias de 2019; a vinculação administrativa atual do Coaf não foi conferida nesta leitura (Lei 13.974/2020 não lida). NAO_CONFIRMADO.\n- Arts. 1º a 8º e 13 a 17: não fichados (frente criminal).\n- Limites e instruções \"da autoridade competente\" referidos nos arts. 10, II, e 11, II, \"a\": para as autorizadas pelo BCB, ver a Circular 3.978, art. 49; para as demais pessoas do art. 9º, não conferido.\n\n## Relações\n\n[[bcb-circular-3978-2020]] · [[bcb-carta-circular-4001-2020]] · [[lcp-105-2001]] · [[lei-12865-2013]] · [[hub-matriz-prazos]] · [[questionario-adequacao]] · [[matriz-do-servico]]\n"}, {"info": {"id": "dossie-pix-fortuito", "titulo": "Dossiê — fortuito interno × externo em golpes Pix e engenharia social (STJ)", "orgao": "STJ", "tipo": "conceito", "status": "fichado", "data_publicacao": "2026-07-07", "tags": "[jurisprudencia, pix, fortuito-interno, fortuito-externo, engenharia-social, dossie]", "grupo": "jurisprudencia", "caminho": "jurisprudencia/dossie-pix-fortuito.md", "quando": "2026-07-30"}, "meta": {"id": "dossie-pix-fortuito", "tipo": "conceito", "titulo": "Dossiê — fortuito interno × externo em golpes Pix e engenharia social (STJ)", "orgao": "STJ", "data_publicacao": "2026-07-07", "vigencia": "", "altera": "[]", "fase_rastro": "[recuperacao_defesa, prontidao]", "conexao_comercial": "[adversarial, benchmark]", "fonte_primaria": "https://www.stj.jus.br/sites/portalp/Paginas/Comunicacao/Noticias/", "status": "fichado", "tags": "[jurisprudencia, pix, fortuito-interno, fortuito-externo, engenharia-social, dossie]", "confidencial": "false"}, "corpo": "\n# Dossiê — fortuito interno × externo em golpes Pix (STJ)\n\nCompilado em 2026-07-07 por pesquisa verificada. Cada precedente indica o grau de confirmação; os marcados \"conferir no SCON\" exigem checagem no acórdão oficial antes de citação em peça. Sem afetação repetitiva/IAC específica sobre engenharia social/Pix localizada até a data — o precedente qualificado segue sendo o Tema 466 (base da Súmula 479); a divergência entre Turmas é candidata natural a afetação: monitorar.\n\n## A chave de leitura (síntese do conjunto)\n\nO critério decisório real do STJ não é \"Pix/engenharia social = interno ou externo\", e sim: (i) houve **falha autônoma da instituição** — vazamento de dados, transações atípicas não barradas, abertura negligente da conta recebedora? → fortuito interno, Súmula 479; (ii) a fraude correu **inteiramente fora do ambiente do banco**, com atos voluntários da vítima e sem operação destoante do perfil? → fortuito externo/culpa exclusiva (CDC, art. 14, §3º). Consequência prática: a defesa se ganha provando a ausência de falha autônoma — telemetria, perfil transacional, KYC e trilha do MED.\n\n## Polo 1 — fortuito externo / culpa exclusiva (defesa da instituição)\n\n- **REsp 2.155.065/MG** (\"golpe do motoboy\") — 3ª Turma, rel. p/ acórdão Min. Villas Bôas Cueva, j. 11/03/2025 (maioria 3x2). Entrega voluntária de cartão e senha ao estelionatário = culpa exclusiva da vítima (CDC, art. 14, §3º, II). CONFIRMADO (Migalhas, Conjur, Dizer o Direito).\n- **REsp 2.215.907/SP** (falsa central — culpa exclusiva) — 3ª Turma, rel. Min. Villas Bôas Cueva, 2025. Instalação voluntária de app e fornecimento de credenciais após ligação a número não oficial, com comunicação tardia ao banco → fortuito externo. CONFIRMADO (Conjur 06/10/2025); data exata de julgamento a conferir.\n- **REsp 2.208.212** (Pix pela própria vítima, golpe iniciado em rede social) — 4ª Turma, rel. Min. Isabel Gallotti, j. noticiado 06/03/2026. Transferências voluntárias com senha pessoal, sem prova de falha de segurança → banco não responde. É O precedente específico de Pix voluntário. CONFIRMADO (Migalhas).\n- **REsp 2.085.064/DF** — 4ª Turma, rel. Min. João Otávio de Noronha, j. indicado 09/03/2026. Artifícios de terceiros induzindo o correntista → fortuito externo. PARCIALMENTE CONFIRMADO — conferir no SCON antes de citar.\n- **REsp 2.124.423** (limite da responsabilidade do banco RECEBEDOR) — 3ª Turma, rel. Min. Nancy Andrighi, notícia oficial STJ 27/01/2025. O banco que hospeda a conta usada no golpe só responde se demonstrada falta de diligência na abertura/manutenção; cumprida a regulação do BCB (Res. CMN 4.753/2019), não há defeito do serviço. CONFIRMADO (fonte oficial STJ).\n\n## Polo 2 — fortuito interno (responsabilidade da instituição)\n\n- **REsp 1.197.929/PR** (Tema repetitivo 466, com REsp 1.199.782/PR — base da Súmula 479) — 2ª Seção, rel. Min. Salomão, j. 24/08/2011, DJe 12/09/2011. Fraudes por terceiros = risco do empreendimento = fortuito interno. CONFIRMADO.\n- **REsp 2.077.278/SP** (golpe do boleto viabilizado por vazamento do próprio fornecedor) — 3ª Turma, rel. Min. Nancy Andrighi, unânime, **j. 03/10/2023, DJe 09/10/2023, Informativo 791** (dado do próprio informativo do STJ, não de imprensa). Tratamento inadequado de dados sigilosos que facilita a fraude = fato do serviço; art. 43 da LGPD e Súmula 479. Caso concreto: boleto falso de R$ 19 mil após contato por WhatsApp. Ponte direta com [[anpd-res-cd-15-2024]]. CONFIRMADO em fonte oficial (reverificado 30/07/2026): https://www.stj.jus.br/sites/portalp/Paginas/Comunicacao/Noticias/2023/24102023-Banco-responde-por-vazamento-de-dados-que-resultou-em-aplicacao-do-%E2%80%9Cgolpe-do-boleto%E2%80%9D-contra-cliente.aspx\n- **REsp 1.995.458/SP** (transações atípicas não barradas) — 3ª Turma, rel. Min. Nancy Andrighi, j. 09/08/2022. Sistema que admite operações totalmente atípicas ao padrão do consumidor viola o dever de segurança → falha do serviço mesmo em engenharia social. CONFIRMADO (reverificado 30/07/
