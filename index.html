ada a clientes que atendam aos critérios estabelecidos pelo participante prestador de serviços de pagamento do usuário pagador, observado\n  o disposto no art. 15-F.” (NR) \n “\n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n"}, {"info": {"id": "bcb-ingest-resolucao-conjunta-21-2026-10-22", "titulo": "Resolução Conjunta N° 21 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2026-10-22", "tags": "[open finance]", "grupo": "normas", "caminho": "normas/bcb/bcb-ingest-resolucao-conjunta-21-2026-10-22.md", "quando": "2026-11-05"}, "meta": {"id": "bcb-ingest-resolucao-conjunta-21-2026-10-22", "tipo": "norma", "titulo": "Resolução Conjunta N° 21 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "data_publicacao": "2026-10-22", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20Conjunta&numero=21", "status": "a_fichar", "tags": "[open finance]", "confidencial": "false"}, "corpo": "\n## Ementa (retornada pela API do BCB — conferir no texto oficial)\n\nAltera a Resolução Conjunta nº 1, de 4 de maio de 2020, que dispõe sobre a implementação do Open Finance.\n\n## Texto oficial (extração automática, 2026-11-05)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** Publicada no DOU de 26/10/2026, Seção 1, p. 32/33.\n**Ementa oficial:** Altera a Resolução Conjunta nº 1, de 4 de maio de 2020, que dispõe sobre a implementação do Open Finance.\n\n### Vigência (dispositivos transcritos)\n\n- Art. 3º  Esta Resolução Conjunta entra em vigor na data de sua publicação. GABRIEL MURICCA GALÍPOLO Presidente do Banco Central do Brasil\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 14\nde outubro de 2026 · 14 de agosto de 2018 · 14 de julho de\n1965 · 22\nde outubro de 2026 · 22 DE OUTUBRO DE 2026 · 22 de outubro de 2026 · 31 de dezembro\nde 1964 · 4 de\nmaio de 2020 · 4 de maio de 2020 · 5 de maio de 2020 · 9 de outubro de 2013\n\n### Dispositivos que tocam o escopo Rastro\n\n- Art. 15.  .................................................................................................................................. ................................................................................................................................................. § 2º  É vedado à instituição transmissora de dados ou detentora de conta propor ao cliente a revogação de consentimento. ................................................................................................................................................. § 5º  Nos casos de fundada suspeita de fraude,\n\n- Art. 31.  A instituição participante é responsável pela confiabilidade, pela integridade, pela disponibilidade, pela segurança, pelo desempenho e pelo sigilo em relação ao compartilhamento de dados e serviços em que esteja envolvida, bem como pelo cumprimento da legislação e da regulamentação em vigor.\" (NR) \"\n\n- Art. 36.  Considera-se contrato de parceria e deve observar o disposto nesta Seção qualquer contrato estabelecido por instituição participante que preveja o compartilhamento de: I - dados de cadastro ou de transações de clientes de que trata o art. 5º,  caput , inciso I, alíneas \"c\" e \"d\" obtidos no âmbito do  Open Finance ; ou II - dados derivados de tratamento, análise ou modelagem dos dados de que trata o inciso I que permaneçam identificando ou permitindo identificar o cliente pessoa natural ou jurídica, a exemplo de notas ou pontuações de crédito. .........................................\n\n- Art. 38.  .................................................................................................................................. ................................................................................................................................................. III - a indicação dos países e da região em cada país para onde os dados de clientes poderão ser remetidos; IV - a adoção de medidas de segurança para a recepção e o armazenamento pela entidade parceira dos dados compartilhados de clientes; V - o acesso da instituição integradora a: a) informações fornecidas pel\n\n- Art. 39.  A instituição integradora é responsável pela confiabilidade, pela integridade, pela disponibilidade, pela segurança, pelo desempenho e pelo sigilo do compartilhamento e dos dados compartilhados, bem como pelo cumprimento da legislação e da regulamentação em vigor. Parágrafo único.  Sobrevindo à celebração a situação vedada pelo art. 36, § 5º, inciso I, enquanto não for encerrado o contrato de parceria, cada instituição passa a ser responsável pelo ambiente tecnológico e sistema eletrônico por ela disponibilizado, inclusive os registros gerados durante a execução dos procedimentos rel\n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n"}, {"info": {"id": "bcb-res-142-2021", "titulo": "Resolução BCB nº 142, de 23/9/2021 (prevenção de fraudes em pagamentos — consolidada com a Res. 501/2025)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2021-09-24", "tags": "[fraude, prevencao, limites, rejeicao, contas-laranja, pix]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-142-2021.md", "quando": "2026-07-15"}, "meta": {"id": "bcb-res-142-2021", "tipo": "norma", "titulo": "Resolução BCB nº 142, de 23/9/2021 (prevenção de fraudes em pagamentos — consolidada com a Res. 501/2025)", "orgao": "BCB", "data_publicacao": "2021-09-24", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico, adversarial]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=142", "status": "fichado", "tags": "[fraude, prevencao, limites, rejeicao, contas-laranja, pix]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 142/2021 — a norma real de \"controles antifraude\" (consolidada)\n\nVerificada no inteiro teor consolidado (API BCB) em 2026-07-15, já com a alteração da Resolução BCB nº 501, de 11/9/2025. DOU 24/9/2021, S.1, p. 49. Esta é a norma-base REAL sobre procedimentos e controles de prevenção de fraudes em serviços de pagamento — o objeto que material externo atribuiu falsamente às \"Res. 402/2024 e 475/2025\".\n\n## Ementa\n\n\"Dispõe sobre procedimentos e controles para prevenção de fraudes na prestação de serviços de pagamento a serem adotados pelas instituições financeiras, demais instituições autorizadas a funcionar pelo Banco Central do Brasil e instituições de pagamento integrantes do Sistema de Pagamentos Brasileiro (SPB).\"\n\n## Obrigações principais (redação vigente)\n\n- **Limite noturno**: teto para transações entre pessoas naturais distintas no período das 20h às 6h (art. 2º), incluindo agendadas à noite com liquidação antes das 6h (§2º); limites compatíveis com o perfil de risco do cliente (§3º).\n- **Trava de 24h para aumento de limite**: prazo mínimo de vinte e quatro horas para efetivar aumento de limites pedido pelo cliente em canal eletrônico (art. 2º, II) — a defesa técnica contra o golpe que eleva o limite e drena em seguida.\n- **Art. 2º-A (incluído pela Res. 501/2025) — o dever de REJEIÇÃO**: literal: as instituições, \"quando constatarem identificação de fundada suspeita de envolvimento de fraude em contas de depósitos à vista, contas de depósitos de poupança e contas de pagamento pré-pagas, devem rejeitar transações de pagamento que tenham essas contas como destinatárias\". §2º: a avaliação da fundada suspeita \"deve incluir fatores a critério de cada instituição, podendo inclusive se utilizar de informações constantes em sistemas eletrônicos e bases de dados de caráter público ou privado\" (ponte direta com o sistema da [[resolucao-conjunta-6-2023]]). §3º: dever de comunicar ao titular a rejeição. §4º: implementação até 13/10/2025.\n- Facultar ao cliente limites por período e cadastro prévio de contas destinatárias (art. 3º).\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: é o coração do bloco \"detecção\" do diagnóstico — limites noturnos, trava de 24h, motor de fundada suspeita e o fluxo de rejeição do art. 2º-A (item de auditoria novo: como a instituição forma e documenta a fundada suspeita sobre contas DESTINATÁRIAS). Defesa: o descumprimento do art. 2º-A por banco recebedor de conta-laranja é argumento de responsabilização dele (dialoga com o REsp 2.124.423 do [[dossie-pix-fortuito]]); no polo passivo, a rejeição documentada é prova de diligência. Contencioso emergente: rejeição/marcação indevida — o mesmo risco mapeado na [[bcb-res-343-2023]].\n\n## Lacunas\n\n- Res. BCB 501/2025: fichada aqui por consolidação; ficha própria se a minuta exigir (ementa própria e contexto do pacote de set/2025).\n- Valores exatos do limite noturno (fixados em normativo complementar/versões anteriores): conferir no texto integral ao citar.\n- IN BCB 664/2025 (prazos de adequação de PSTIs, citada em fontes secundárias): não verificada.\n\n## Relações\n\n[[resolucao-conjunta-6-2023]] · [[bcb-res-343-2023]] · [[bcb-res-506-2025]] · [[bcb-res-493-2025]] · [[hub-catalogo-medidas]] · [[hub-matriz-prazos]]\n"}, {"info": {"id": "bcb-res-198-2022", "titulo": "Resolução BCB nº 198, de 11 de março de 2022 (PRIP e estrutura de gerenciamento contínuo de riscos — IP singular e conglomerado Tipo 2)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2022-03-14", "tags": "[gerenciamento-de-riscos, risco-operacional, fraude, instituicao-de-pagamento, tipo-2, prudencial, continuidade]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-198-2022.md", "quando": "2026-11-03"}, "meta": {"id": "bcb-res-198-2022", "tipo": "norma", "titulo": "Resolução BCB nº 198, de 11 de março de 2022 (PRIP e estrutura de gerenciamento contínuo de riscos — IP singular e conglomerado Tipo 2)", "orgao": "BCB", "data_publicacao": "2022-03-14", "vigencia": "", "altera": "[\"Circular nº 3.681/2013 (art. 1º, §1º, e arts. 9º, 10, 10-A e 11 revogados)\"]", "fase_rastro": "[prontidao, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=198", "status": "fichado", "tags": "[gerenciamento-de-riscos, risco-operacional, fraude, instituicao-de-pagamento, tipo-2, prudencial, continuidade]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 198/2022 — a norma de riscos da IP pura (Tipo 2)\n\nFicha criada em 2026-10-29 a partir do inteiro teor lido no endpoint oficial do BCB pelo navegador do app (texto em `normas/bcb/_texto-res-198-2022.txt`). Ementa, vigência e obrigações são transcrição; aplicação e conexão comercial são propostas do assistente, a validar pelo operador, por isso o status permanece `a_fichar`.\n\n## Ementa\n\n\"Dispõe sobre o requerimento mínimo de Patrimônio de Referência de Instituição de Pagamento (PRIP) de conglomerado do Tipo 2, nos termos da Resolução BCB nº 197, de 11 de março de 2022, e de instituição de pagamento não integrante de conglomerado prudencial, e sobre a metodologia de apuração desses requerimentos e a respectiva estrutura de gerenciamento contínuo de riscos.\" DOU 14/3/2022, S.1, p. 141-144. A referência à Res. 197 deve ser lida como Res. BCB 436/2024 desde 1º/1/2025.\n\n## Vigência e prazos\n\nVigor em 1º/7/2023 (art. 29, redação da Res. BCB 258/2022). Revisão anual das políticas de risco pelo conselho (art. 24, I) e da política de preservação do valor e liquidez da moeda eletrônica (art. 24, VIII). Guarda de cinco anos (art. 27).\n\n## Obrigações principais\n\nPara IP singular e conglomerado Tipo 2, estrutura unificada de gerenciamento contínuo de riscos (art. 1º, §2º) capaz de identificar, mensurar, avaliar, monitorar, reportar, controlar e mitigar risco operacional, de liquidez, de crédito e demais relevantes, de modo proporcional (art. 12). Conteúdo mínimo: políticas documentadas, reporte de exceções ao conselho, monitoramento de capital, identificação prévia de riscos de mudanças em produtos, atribuições documentadas e relatórios gerenciais periódicos (art. 13), com políticas que cubram terceirização e continuidade dos serviços de pagamento (parágrafo único). Risco operacional definido no art. 14 com doze eventos, inclusive fraudes internas e externas, interrupção de serviços de pagamento, falhas de proteção de credenciais, de identificação e autenticação do usuário, de autorização e de iniciação. O art. 15 é a lista concreta de controles: plano de contingência; proteção de dados e redes; rastreio e restrição de acesso; monitoramento de falhas de segurança e reclamações; revisão após falhas; relatórios de correção; testes de segurança; segregação dev/teste/produção; identificação e autenticação do usuário; rastreabilidade de todas as transações; monitoramento e autorização para prevenir fraude e bloquear transações suspeitas tempestivamente; filtros de alto risco; notificação de não execução; verificação pelo usuário; terceirização e subcredenciador; controle de falhas de iniciação. Contratos de terceirização de segurança devem obrigar o contratado a cumprir o art. 15 e dar acesso à contratante (§1º). Base de dados de perdas operacionais só para conglomerado com ativo acima de 0,1% do PIB (art. 21). Diretor responsável pelo gerenciamento de riscos (art. 23) e deveres do conselho (art. 24); BCB pode exigir ações suplementares e capital adicional (art. 26).\n\n## Aplicação prática no ciclo Rastro (proposta — validar)\n\nÉ a norma que mais importa para o cliente-alvo. Prontidão: o art. 15 é, dispositivo por dispositivo, a lista de controles antifraude e de continuidade que o diagnóstico deve evidenciar; cruza diretamente com a matriz de incidentes e o IPR-72. War room: o inciso I (plano de contingência) e o inciso XIII (bloqueio tempestivo) são os deveres cuja prova se produz nas primeiras 72h. Defesa: o art. 14, §2º, define o risco legal como parte do risco operacional, o que torna o contencioso de fraude um evento de risco que a instituição tinha de gerir — argumento a ser usado com cuidado nas duas direções.\n\n## Conexão comercial (proposta — validar)\n\nBenchmark, diagnóstico, retainer e adversarial: a lista do art. 15 vira checklist de evidências e, no polo adversarial, roteiro de perguntas para a perícia sobre o que a instituição tinha o dever de manter.\n\n## Lacunas\n\n- Arts. 2º a 11 (PRIP, RWASP, fator F') e 16 a 20 (liquidez e crédito) não transcritos.\n- Referência à Res. 197 (revogada) no art. 1º: o consolidado lido não mostrou nota de atualização; conferir.\n\n## Relações\n\n[[bcb-res-436-2024]] · [[bcb-res-201-2022]] · [[bcb-res-265-2022]] · [[bcb-res-260-2022]] · [[bcb-res-85-2021]] · [[bcb-res-343-2023]] · [[matriz-controles-internos]] · [[escopo-controles-internos]]\n\n## Texto oficial (extração automática, 2026-11-02)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** Publicada no DOU de 14/3/2022, Seção 1, p. 141-144.\n**Ementa oficial:** Dispõe sobre o requerimento mínimo de Patrimônio de Referência de Instituição de Pagamento (PRIP) de conglomerado do Tipo 2, nos termos da Resolução BCB nº 197, de 11 de março de 2022, e de instituição de pagamento não integrante de conglomerado prudencial, e sobre a metodologia de apuração desses requerimentos e a respectiva estrutura de gerenciamento contínuo de riscos.\n\n### Vigência (dispositivos transcritos)\n\n- Nenhum dispositivo de vigência localizado automaticamente. Conferir no texto.\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 11 DE MARÇO\nDE 2022 · 11 de março de 2022 · 14/12/2023 · 18/11/2022 · 1º de janeiro de\n2025 · 1º de janeiro de 2023 · 1º de janeiro de 2024 · 1º de janeiro de 2025 · 1º de janeiro de 2026 · 1º de janeiro de 2027 · 1º de janeiro de 2028 · 1º de julho de 2023\n\n### Normas alteradas ou revogadas\n\n- revogados os seguintes dispositivos da Circular nº 3.681 de 4 de novembro de\n\n### Dispositivos que tocam o escopo Rastro\n\n- Resolução Nº 222 \n RESOLUÇÃO BCB Nº 198, DE 11 DE MARÇO DE 2022 Dispõe sobre o requerimento mínimo de Patrimônio de Referência de Instituição de Pagamento (PR IP ) de conglomerado do Tipo 2, nos termos da Resolução BCB nº 197, de 11 de março de 2022, e de instituição de pagamento não integrante de conglomerado prudencial, e sobre a metodologia de apuração desses requerimentos e a respectiva estrutura de gerenciamento contínuo de riscos. A Diretoria Colegiada do Banco Central do Brasil, em sessão realizada em 9 de março de 2022, com base nos arts. 9º, inciso II, 14 e 15 da Lei nº 12.865, de 9 d\n\n- Art. 1º  Esta Resolução dispõe sobre o requerimento mínimo de Patrimônio de Referência de Instituição de Pagamento (PR IP ) de conglomerado do Tipo 2, nos termos da Resolução BCB nº 197, de 11 de março de 2022, e de instituição de pagamento não integrante de conglomerado prudencial, e também sobre a metodologia de apuração desses requerimentos e a respectiva estrutura de gerenciamento contínuo de riscos. § 1º  O requerimento mínimo mencionado no  caput deve ser calculado de forma consolidada para instituições integrantes de um mesmo conglomerado prudencial do Tipo 2, nos termos do Padrão Contá\n\n- Art. 2º  As entidades mencionadas no art. 1º devem manter, permanentemente, montante de PR IP , conforme definido nos arts. 3º e 4º, em valor superior ao requerimento mínimo estabelecido nesta Resolução, destinado à cobertura dos riscos associados: I - aos serviços de pagamento prestados; e II - às demais atividades exercidas, nos termos da regulamentação em vigor. Parágrafo único.  A previsão de metodologia para apuração dos riscos associados às atividades de que trata o inciso II do  caput  não constitui permissão para a prática de operações ou serviços vedados por lei, regulamento ou ato ad\n\n- Art. 3º  O PR IP é apurado mediante: I - a soma dos valores correspondentes: a) ao capital social constituído por ações ou por quotas não resgatáveis e sem mecanismos de cumulatividade de dividendos; b) às reservas de capital, de reavaliação e de lucros; c) aos ganhos não realizados decorrentes dos ajustes de avaliação patrimonial; d) aos lucros acumulados; e) às contas de resultado credoras; e e) às contas de resultado credoras;  (Redação dada, a partir de 1º/1/2025, pela Resolução BCB nº 448, de 23/12/2024.) f) ao depósito em conta vinculada para suprir deficiência de capital, constituído no\n\n- Art. 4º  Os ajustes prudenciais mencionados na alínea “e” do inciso II do art. 3º correspondem aos seguintes elementos patrimoniais: I - ágios pagos na aquisição de investimentos com fundamento em expectativa de rentabilidade futura líquidos de passivos fiscais diferidos a eles associados; II - ativos intangíveis; III - ativos atuariais relacionados a fundos de pensão de benefício definido, líquidos de passivos fiscais diferidos a eles associados, aos quais o conglomerado não tenha acesso irrestrito; IV - valor agregado dos investimentos diretos ou indiretos: a) em instrumentos de Capital Prin\n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n\n## Fichamento (operador, 2026-11-03)\n\n### Vigência e prazos\n\nVigência desde 1º de julho de 2023, conforme a redação dada pela Res. BCB 258/2022.     Para a defesa, o art. 27 é o dispositivo mais útil da norma inteira: para qualquer fraude dos últimos cinco anos, a política vigente na data do fato deveria existir e ser localizável. Quando não é, o problema é regulatório antes de ser processual, e a contestação já nasce sem a prova central.\n\n### Aplicação prática no ciclo Rastro\n\nO art. 15 é o artigo que você vai usar. Ele lista o que precisa existir, por escrito e funcionando, para gerenciar o risco operacional: plano de contingência, proteção de dados e redes, controle e rastreio de acessos, monitoramento de falhas e de reclamações de clientes, revisão das medidas depois de cada incidente, testes de robustez, separação entre ambientes de desenvolvimento, teste e produção, identificação e autenticação do usuário final. É um checklist de prontidão escrito pelo próprio BCB, e o § 1º o estende ao fornecedor terceirizado, que precisa aceitar as mesmas regras no contrato e dar acesso à contratante. Essa é a ponte com a rede de fornecedores do Dia 1: a nuvem, a processadora e o antifraude não têm tipo prudencial, mas o contrato com eles tem de carregar o art. 15.   Acima de 0,1% do PIB em ativo total, o conglomerado precisa ainda de uma base de dados de perdas operacionais (art. 21) e de regras adicionais de crédito (art. 22); para a fintech média, isso não se aplica.\n\n### Lacunas\n\nNenhuma apontada no fichamento.\n"}, {"info": {"id": "bcb-res-201-2022", "titulo": "Resolução BCB nº 201, de 11 de março de 2022 (PRS5 e estrutura simplificada de riscos — Tipo 3 optante, S5)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2022-03-14", "tags": "[gerenciamento-de-riscos, risco-operacional, fraude, tipo-3, s5, vasp, prudencial, continuidade]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-201-2022.md", "quando": "2026-10-29"}, "meta": {"id": "bcb-res-201-2022", "tipo": "norma", "titulo": "Resolução BCB nº 201, de 11 de março de 2022 (PRS5 e estrutura simplificada de riscos — Tipo 3 optante, S5)", "orgao": "BCB", "data_publicacao": "2022-03-14", "vigencia": "", "altera": "[]", "fase_rastro": "[]", "conexao_comercial": "[]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=201", "status": "fichado", "tags": "[gerenciamento-de-riscos, risco-operacional, fraude, tipo-3, s5, vasp, prudencial, continuidade]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 201/2022 — estrutura simplificada de riscos do Tipo 3 (S5)\n\nFicha criada em 2026-10-29 a partir do inteiro teor lido no endpoint oficial do BCB pelo navegador do app (texto em `normas/bcb/_texto-res-201-2022.txt`). Ementa, vigência e obrigações são transcrição; aplicação e conexão comercial são propostas do assistente, a validar pelo operador, por isso o status permanece `a_fichar`.\n\n## Ementa\n\n\"Dispõe sobre a metodologia facultativa simplificada para apuração do requerimento mínimo de Patrimônio de Referência Simplificado (PRS5) para os conglomerados prudenciais classificados como do Tipo 3, sobre os requisitos para opção por essa metodologia e sobre a estrutura simplificada de gerenciamento contínuo de riscos.\" DOU 14/3/2022, S.1, p. 148-151. Art. 1º na redação da Res. BCB 447/2024 remete a classificação à Res. BCB 436/2024.\n\n## Vigência e prazos\n\nVigor em 1º/7/2023 (art. 41, redação da Res. BCB 258/2022). Reforma pela Res. BCB 447/2024 em 1º/1/2025: incisos V a XXI do art. 23 revogados e reinseridos como §3º só para quem realiza atividades de pagamento. Revisão das políticas de risco pelo conselho a cada dois anos (art. 36, I) e anual para a política de preservação da moeda eletrônica (art. 36, VII).\n\n## Obrigações principais\n\nPara a instituição do Tipo 3 que opte pela metodologia simplificada (perfil de risco simplificado, S5), estrutura simplificada de gerenciamento contínuo de riscos (arts. 19 a 21) cobrindo risco operacional, liquidez, crédito, social, ambiental, climático e demais relevantes, avaliada periodicamente pela auditoria interna. Risco operacional definido no art. 22 com os mesmos doze eventos da Res. 198. Controles mínimos do art. 23: terceirização, monitoramento de terceiros relevantes, infraestrutura de TI segura e política de continuidade de negócios com processos críticos, estratégias e plano (§2º); contratos de TI com cláusulas de continuidade, acesso da contratante e do BCB (§1º). Para quem realiza atividades de pagamento, o §3º reinsere os dezessete controles de segurança, autenticação, rastreabilidade, monitoramento e bloqueio de transações suspeitas, filtros de alto risco, notificação, subcredenciador e falhas de iniciação. Diretor responsável designado perante o BCB (art. 35); deveres do conselho (art. 36); diretoria quando não houver conselho (art. 37).\n\n## Aplicação prática no ciclo Rastro (proposta — validar)\n\nProntidão e war room: para VASP pequena, corretora digital ou conglomerado híbrido S5, é o equivalente do art. 15 da Res. 198; o §3º do art. 23 só vale para quem faz pagamento, o que exige perguntar no diagnóstico se a VASP presta serviço de pagamento.\n\n## Conexão comercial (proposta — validar)\n\nDiagnóstico e retainer para o segmento S5 do Tipo 3.\n\n## Lacunas\n\n- Requisitos de opção (arts. 2º a 5º) e PRS5 (arts. 6º a 18) não transcritos; a condição de \"grupo II\" do art. 5º não foi lida.\n- Limiar do S5 depende do art. 5º da Res. 436, não transcrito.\n\n## Relações\n\n[[bcb-res-436-2024]] · [[bcb-res-198-2022]] · [[bcb-res-265-2022]] · [[bcb-res-260-2022]] · [[escopo-controles-internos]]\n\n## Fichamento (operador, 2026-10-29)\n\n### Aplicação prática no ciclo Rastro\n\nProntidão e war room: para VASP pequena, corretora digital ou conglomerado híbrido S5, é o equivalente do art. 15 da Res. 198; o §3º do art. 23 só vale para quem faz pagamento, o que exige perguntar no diagnóstico se a VASP presta serviço de pagamento.\n\n### Lacunas\n\nNenhuma apontada no fichamento.\n"}, {"info": {"id": "bcb-res-260-2022", "titulo": "Resolução BCB nº 260, de 22 de novembro de 2022 (sistemas de controles internos das IPs) — A FICHAR", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2022-11-22", "tags": "[controles-internos, instituicao-de-pagamento, governanca, auditoria]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-260-2022.md", "quando": "2026-11-04"}, "meta": {"id": "bcb-res-260-2022", "tipo": "norma", "titulo": "Resolução BCB nº 260, de 22 de novembro de 2022 (sistemas de controles internos das IPs) — A FICHAR", "orgao": "BCB", "data_publicacao": "2022-11-22", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=260", "status": "fichado", "tags": "[controles-internos, instituicao-de-pagamento, governanca, auditoria]", "confidencial": "false"}, "corpo": "\n## Por que esta norma entra na base (triagem de 2026-10-26)\n\nNorma-mãe do novo eixo do produto. Ementa identificada em reprodução secundária (legismap.com.br): dispõe sobre os sistemas de controles internos das administradoras de consórcio e instituições de pagamento; alcance ampliado pela Res. BCB 552/2026. Alterada pelas Res. BCB 368/2024, 431/2024 e 552/2026. Revoga Circular 3.078/2002 e o inciso III do art. 25 da Res. BCB 80/2021. Conteúdo a transcrever do texto consolidado oficial antes de qualquer uso em entregável.\n\n## Ementa\n\nNAO_CONFIRMADO — transcrever do texto oficial (fonte_primaria). Nada abaixo pode ser preenchido por inferência.\n\n## Vigência e prazos\n\nNAO_CONFIRMADO\n\n## Obrigações principais\n\nNAO_CONFIRMADO\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: eixo de controles internos (ver [[matriz-controles-internos]]). Detalhar após fichamento.\n\n## Conexão comercial\n\nDiagnóstico de controles internos. Detalhar após fichamento.\n\n## Lacunas\n\nFicha criada como stub de triagem: todo o conteúdo normativo está pendente de leitura do inteiro teor. Fontes secundárias usadas só para justificar a inclusão.\n\n## Relações\n\n[[matriz-controles-internos]] · [[bcb-res-85-2021]] · [[bcb-res-494-498-2025]]\n\n## Texto oficial (extração automática, 2026-10-29)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** Publicada no DOU de 24/11/2022, Seção 1, p. 90/91.\n**Ementa oficial:** Dispõe sobre os sistemas de controles internos das administradoras de consórcio, das instituições de pagamento, das sociedades corretoras de títulos e valores mobiliários, das sociedades distribuidoras de títulos e valores mobiliários e das sociedades corretoras de câmbio autorizadas a funcionar pelo Banco Central do Brasil.\n\n### Vigência (dispositivos transcritos)\n\n- Art. 13.  Esta Resolução entra em vigor  em: I - 1º de janeiro de 2024, em relação ao art. 10; e II - 1º de janeiro de 2023, em relação aos demais artigos. Otávio Ribeiro Damaso Diretor de Regulação\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 10 de\njaneiro de 2002 · 10 de\nnovembro de 2017 · 13/11/2024 · 1º de janeiro de 2023 · 1º de janeiro de 2024 · 22\nde novembro de 2022 · 22 DE NOVEMBRO DE 2022 · 25 de março de 2021 · 25/1/2024 · 3/3/2026 · 8 de outubro de 2008 · 9 de outubro de 2013\n\n### Dispositivos que tocam o escopo Rastro\n\n- Art. 4º  Os sistemas de controles internos devem: I - ser contínuos e efetivos, abrangendo as atividades de controle para todos os níveis de negócios e para todos os riscos aos quais a administradora de consórcio ou a instituição de pagamento está exposta; I - ser contínuos e efetivos, abrangendo as atividades de controle para todos os níveis de negócios e para todos os riscos aos quais a instituição está exposta;  (Redação dada, a partir de 1º/3/2024, pela Resolução BCB nº 368, de 25/1/2024.) II - integrar as atividades rotineiras das áreas relevantes da administradora de consórcio ou da inst\n\n- Art. 5º  Os sistemas de controles internos devem prever: I - quanto aos aspectos relacionados à cultura de controle: a) definição das responsabilidades dos funcionários nos sistemas de controles internos e dos respectivos meios para o seu eficaz cumprimento; b) obrigatoriedade de comunicação tempestiva ao adequado nível gerencial, por parte dos funcionários, de: 1. problemas nas operações; 2. situações de não conformidade com os padrões de conduta definidos pela administradora de consórcio ou pela instituição de pagamento; e 2. situações de não conformidade com os padrões de conduta definidos \n\n- Art. 6º  O acompanhamento sistemático das atividades relacionadas com os sistemas de controles internos deve ser objeto de relatório anual, contendo: I - a avaliação sobre a adequação e a efetividade dos sistemas de controles internos; II - as recomendações a respeito de eventuais deficiências, com o estabelecimento de cronograma de saneamento, quando for o caso; e III - a manifestação dos responsáveis pelas correspondentes áreas a respeito das deficiências encontradas em verificações anteriores e das medidas efetivamente adotadas para saná-las. Parágrafo único.  O relatório de que trata o  ca\n\n- Art. 7º  O conselho de administração e a diretoria devem se envolver ativamente na definição dos sistemas de controles internos, mediante: I - a promoção de elevados padrões éticos e de integridade; II - o estabelecimento de cultura organizacional com ênfase na relevância dos sistemas de controles internos e no engajamento de cada funcionário no processo de controle interno; III - a manutenção de estrutura organizacional adequada para garantir a qualidade e a efetividade dos sistemas e processos de controles internos; e IV - a garantia de recursos adequados e suficientes para o exercício das a\n\n- Art. 8º  O conselho de administração é responsável por garantir que: I - a diretoria da administradora de consórcio ou da instituição de pagamento tome as medidas necessárias para identificar, medir, monitorar e controlar os riscos de acordo com os níveis de riscos definidos; I - a diretoria da instituição mencionada no art. 1º tome as medidas necessárias para identificar, medir, monitorar e controlar os riscos de acordo com os níveis de riscos definidos;  (Redação dada, a partir de 1º/3/2024, pela Resolução BCB nº 368, de 25/1/2024.) II - as falhas identificadas sejam tempestivamente corrigid\n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n\n## Fichamento (operador, 2026-11-04)\n\n### Aplicação prática no ciclo Rastro\n\nA 260 não vive sozinha. A Res. BCB 65/2021 impõe a política de conformidade e a função de compliance; a Res. BCB 93/2021 impõe a auditoria interna; e as três formam, com a estrutura de gerenciamento de riscos, aquilo que o mercado chama de três linhas. A estrutura de riscos é onde a classificação de segunda-feira se torna consequência concreta: a Res. BCB 198/2022 rege a IP singular e o conglomerado Tipo 2, a Res. BCB 201/2022 cria a estrutura simplificada para o Tipo 3 optante pelo S5, e a Res. BCB 265/2022 trata dos conglomerados Tipo 3 nos segmentos S2 a S4. Leia a 198 inteira e as outras duas em contraste, atento ao que a simplificação retira e ao que mantém, porque é nessa fronteira que uma fintech pequena costuma errar ao se considerar dispensada de algo que não foi dispensado.\n\n### Lacunas\n\nNenhuma apontada no fichamento.\n"}, {"info": {"id": "bcb-res-265-2022", "titulo": "Resolução BCB nº 265, de 25 de novembro de 2022 (estruturas de gerenciamento de riscos e de capital — Tipo 3, S2 a S4)", "orgao": "BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2022-11-28", "tags": "[gerenciamento-de-riscos, risco-operacional, fraude, tipo-3, conglomerado, cro, comite-de-riscos, continuidade, prudencial]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-265-2022.md", "quando": "2026-11-02"}, "meta": {"id": "bcb-res-265-2022", "tipo": "norma", "titulo": "Resolução BCB nº 265, de 25 de novembro de 2022 (estruturas de gerenciamento de riscos e de capital — Tipo 3, S2 a S4)", "orgao": "BCB", "data_publicacao": "2022-11-28", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico, retainer, adversarial]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=265", "status": "a_fichar", "tags": "[gerenciamento-de-riscos, risco-operacional, fraude, tipo-3, conglomerado, cro, comite-de-riscos, continuidade, prudencial]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 265/2022 — riscos e capital do Tipo 3 (S2 a S4): a norma da fintech híbrida\n\nFicha criada em 2026-10-29 a partir do inteiro teor lido no endpoint oficial do BCB pelo navegador do app (texto em `normas/bcb/_texto-res-265-2022.txt`). Ementa, vigência e obrigações são transcrição; aplicação e conexão comercial são propostas do assistente, a validar pelo operador, por isso o status permanece `a_fichar`.\n\n## Ementa\n\nEmenta vigente (redação da Res. BCB 447/2024): \"Dispõe sobre a estrutura de gerenciamento de riscos, a estrutura de gerenciamento de capital e a política de divulgação de informações de instituição classificada como Tipo 3 enquadrada no Segmento 2 – S2, Segmento 3 – S3 ou Segmento 4 – S4.\" DOU 28/11/2022, S.1, p. 131-136. Espelho, para o Tipo 3, da Res. CMN 4.557/2017.\n\n## Vigência e prazos\n\nVigor em 1º/7/2023 (art. 71); estruturas implementadas até 31/12/2023 (art. 70). Alterada pelas Res. BCB 306/2023, 319/2023 (limites de exposição, atribuição do CRO), 331/2023, 332/2023 (risco país, desde 1º/1/2024), 447/2024 (de conglomerado para instituição, desde 1º/1/2025) e 470/2025 (art. 58). Revisão anual pelo conselho das políticas, testes de estresse, continuidade, planos de contingência e de capital (art. 56, II). Guarda de cinco anos (art. 68).\n\n## Obrigações principais\n\nEstrutura integrada de riscos, estrutura de capital e política de divulgação, proporcionais e unificadas no conglomerado (art. 2º). RAS documentada (art. 3º). Riscos cobertos: crédito, mercado, IRRBB, operacional, liquidez, social, ambiental, climático, país e demais (art. 4º), com interações entre riscos e com PLD/FT (§§ 1º e 2º). Conteúdo da estrutura no art. 5º: políticas e limites, rastreamento de exceções, sistemas, avaliação periódica, identificação prévia de riscos em novos produtos e mudanças, papéis incluindo terceirizados, testes de estresse, avaliação de mitigação, continuidade de negócios e relatórios gerenciais; políticas compatíveis com PRSAC e política de conformidade (§4º). Continuidade de negócios com análise de impacto, estratégias, planos com prazos de reinício e testes (art. 18). Risco operacional definido no art. 34, com falhas específicas de pagamento no §3º; controles do art. 35 (terceirização, governança de TI, sistemas seguros com proteção de redes, rastreio de acesso e monitoramento de falhas, base de perdas com causa raiz, cenários, revisão pós-falha, relatórios, testes, segregação de ambientes) e, para atividades de pagamento, os oito controles do §1º (identificação, rastreabilidade, monitoramento e bloqueio de suspeitas, filtros de alto risco, notificação, verificação, subcredenciador, falhas de iniciação); contratos de TI com acesso do BCB (§2º). Base de perdas operacionais (art. 36). Governança: unidade de riscos segregada (art. 51); CRO designado perante o BCB com reporte direto ao conselho e destituição comunicada (art. 52); comitê de riscos com três integrantes e maioria independente (art. 53); diretor de capital (art. 55); deveres do conselho (art. 56), diretoria (art. 58) e conjuntos (art. 59); avaliação pela auditoria interna (art. 60). Dispensas para S3 (art. 66) e S4 (art. 67), que incluem, para o S4, base de perdas, cenários de risco operacional e comitê de riscos.\n\n## Aplicação prática no ciclo Rastro (proposta — validar)\n\nProntidão: para a fintech híbrida (IP líder com SCD ou financeira no grupo) e para VASP, corretora ou DTVM acima do S5, é a norma de riscos que a Res. 260, art. 5º, II, pressupõe. O art. 35, §1º, e o art. 18 são os dispositivos de fraude e contingência a evidenciar. A posição no segmento define o que a instituição pode dispensar (arts. 66 e 67), o que o diagnóstico precisa saber antes de apontar lacuna. War room e defesa: a base de perdas e a análise de causa raiz (art. 35, V) são a documentação que o BCB espera após o incidente; a sua inexistência é falha autônoma.\n\n## Conexão comercial (proposta — validar)\n\nBenchmark, diagnóstico, retainer (revisão anual do art. 56, II) e adversarial (mesmo uso da Res. 198).\n\n## Lacunas\n\n- Transcritos só os capítulos de escopo, RAS, estrutura, continuidade, risco operacional, governança, dispensas e finais; testes de estresse, crédito, mercado, liquidez, social/ambiental/climático, capital, conglomerado e transparência ficaram fora.\n- Res. BCB 447/2024 e 580/2026 não lidas em si.\n\n## Relações\n\n[[bcb-res-436-2024]] · [[bcb-res-198-2022]] · [[bcb-res-201-2022]] · [[cmn-res-4557-2017]] · [[bcb-res-260-2022]] · [[bcb-res-65-2021]] · [[bcb-res-93-2021]] · [[matriz-controles-internos]] · [[escopo-controles-internos]]\n\n## Texto oficial (extração automática, 2026-11-02)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** Publicada no DOU de 28/11/2022, Seção 1, p. 131-136.\n**Ementa oficial:** Dispõe sobre a estrutura de gerenciamento de riscos, a estrutura de gerenciamento de capital e a política de divulgação de informações de conglomerado prudencial classificado como Tipo 3 enquadrado no Segmento 2 (S2), Segmento 3 (S3) ou Segmento 4 (S4).\n\n### Vigência (dispositivos transcritos)\n\n- Art. 71.  Esta Resolução entra em vigor em 1º de julho de 2023. Roberto de Oliveira Campos Neto Presidente do Banco Central do Brasil​​\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 11 de março de 2022 · 16 de novembro de 2022 · 18 de maio de 2023 · 18/5/2023 · 19/12/2024 · 1º de dezembro de 2021 · 1º de julho de 2023 · 23/3/2023 · 25 DE NOVEMBRO DE 2022 · 26/6/2025 · 27/6/2023 · 28 de novembro de 2024\n\n### Normas alteradas ou revogadas\n\n- Revogado, a partir de 1º/1/2024, pela Resolução BCB nº 332, de 29/6/2023\n- Revogado, a partir de 1º/1/2025, pela Resolução BCB nº 332, de 29/6/2023\n\n### Dispositivos que tocam o escopo Rastro\n\n- Art. 2º  A instituição de pagamento líder de conglomerado prudencial classificado como Tipo 3 e enquadrado no S2, no S3 ou no S4 deve implementar:\n\n- Art. 2º  A instituição do Tipo 3 enqua​drada no S2, no S3 ou no S4 deve implementar:  (Redação dada, a partir de 1º/1/2025, pela Resolução BCB nº 447, de 19/12/2024.) I - estrutura de gerenciamento contínuo e integrado de riscos; II - estrutura de gerenciamento contínuo de capital; e III - política de divulgação de informações sobre: a) a estrutura de gerenciamento contínuo e integrado de riscos; b) a estrutura de gerenciamento contínuo de capital; c) a apuração do montante de ativos ponderados pelo risco (RWA), conforme Resolução BCB nº 200, de 11 de março de 2022; e d) a adequação do Patrimô\n\n- Art. 21.  A estrutura de gerenciamento de que trata o art. 5º deve prever, adicionalmente, para o risco de crédito: I - o gerenciamento de exposições com características semelhantes, tanto em nível individual quanto em nível agregado, abrangendo aspectos como fontes significativas do risco de crédito, identificação da contraparte ou do interveniente, forma de agregação das exposições e uso de instrumento mitigador; II - políticas que estabeleçam critérios para a identificação dos fatores de risco significativos para fins do gerenciamento do risco de concentração; III - mecanismos para o gerenc\n\n- Art. 22.  Para fins do gerenciamento do risco de crédito, a caracterização e a descaracterização de exposição como ativo problemático devem ocorrer nos termos do art. 3º da Resolução BCB nº 219, de 2022.   (Redação dada, a partir de 1º/1/2025, pela Resolução BCB nº 332, de 29/6/2023.) I - a respectiva obrigação está em atraso há mais de noventa dias; I -  (Revogado, a partir de 1º/1/2025, pela Resolução BCB nº 332, de 29/6/2023.) II - há indicativos de que a respectiva obrigação não será integralmente honrada sem que seja necessário recurso a garantias ou a colaterais. II -  (Revogado, a parti\n\n- Art. 32.  O gerenciamento do IRRBB deve prever: I - avaliação e controle de seus principais determinantes, incluindo o descasamento entre ativos e passivos, em relação a prazos, taxas, indexadores e moedas; e II - identificação, mensuração e controle desse risco com base em metodologias que sejam consistentes com as características da carteira bancária e que considerem a maturidade, a liquidez e a sensibilidade ao risco dos instrumentos classificados nessa carteira. § 1º  Para as instituições enquadradas no S2 ou S3, a identificação, a mensuração e o controle do IRRBB de que trata o  caput , i\n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n"}, {"info": {"id": "bcb-res-32-2020", "titulo": "Resolução BCB nº 32, de 29 de outubro de 2020 (Open Finance — requisitos técnicos e operacionais) — A FICHAR", "orgao": "BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2020-10-29", "tags": "[open-finance, seguranca-cibernetica, api]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-32-2020.md", "quando": "2026-10-29"}, "meta": {"id": "bcb-res-32-2020", "tipo": "norma", "titulo": "Resolução BCB nº 32, de 29 de outubro de 2020 (Open Finance — requisitos técnicos e operacionais) — A FICHAR", "orgao": "BCB", "data_publicacao": "2020-10-29", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao]", "conexao_comercial": "[diagnostico]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=32", "status": "a_fichar", "tags": "[open-finance, seguranca-cibernetica, api]", "confidencial": "false"}, "corpo": "\n## Por que esta norma entra na base (triagem de 2026-10-26)\n\nRequisitos técnicos e operacionais do Open Finance (APIs, segurança, certificação). Data de publicação NAO_CONFIRMADA; conferir.\n\n## Ementa\n\nNAO_CONFIRMADO — transcrever do texto oficial (fonte_primaria). Nada abaixo pode ser preenchido por inferência.\n\n## Vigência e prazos\n\nNAO_CONFIRMADO\n\n## Obrigações principais\n\nNAO_CONFIRMADO\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: eixo de controles internos (ver [[matriz-controles-internos]]). Detalhar após fichamento.\n\n## Conexão comercial\n\nDiagnóstico de controles internos. Detalhar após fichamento.\n\n## Lacunas\n\nFicha criada como stub de triagem: todo o conteúdo normativo está pendente de leitura do inteiro teor. Fontes secundárias usadas só para justificar a inclusão.\n\n## Relações\n\n[[matriz-controles-internos]] · [[bcb-res-85-2021]] · [[bcb-res-494-498-2025]]\n\n## Texto oficial (extração automática, 2026-10-29)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** Publicada no DOU de 3/11/2020, Seção 1, p. 445/446.\n**Ementa oficial:** Estabelece os requisitos técnicos e procedimentos operacionais para a implementação no País do Sistema Financeiro Aberto (Open Banking).\n\n### Vigência (dispositivos transcritos)\n\n- Nenhum dispositivo de vigência localizado automaticamente. Conferir no texto.\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 14/4/2021 · 15\nde janeiro de 2021 · 15 de janeiro de 2021 · 21/7/2021 · 23 de junho de 2020 · 23/2/2023 · 24 de fevereiro de\n2011 · 29 DE OUTUBRO DE 2020 · 29 de outubro\nde 2020 · 3/12/2025 · 31 de dezembro de 1964 · 4 de\nmaio de 2020\n\n### Dispositivos que tocam o escopo Rastro\n\n- Art. 3º  O detalhamento dos requisitos técnicos e dos procedimentos operacionais para a implementação do  Open Finance  estará previsto em:  (Redação dada, a partir de 1º/4/2023, pela Resolução BCB nº 294, de 23/2/2023.) I - Manual de Escopo de Dados e Serviços do  Open Banking ; I - Manual de Escopo de Dados e Serviços do  Open Finance ;  (Redação dada, a partir de 1º/4/2023, pela Resolução BCB nº 294, de 23/2/2023.) II - Manual de APIs do  Open Banking ; II - Manual de APIs do  Open Finance ;  (Redação dada, a partir de 1º/4/2023, pela Resolução BCB nº 294, de 23/2/2023.) III - Manual de Ser\n\n- Art. 6º  O compartilhamento da distribuição de frequência relativa dos valores de tarifas e taxas de juros cobrados dos clientes, de que trata o § 2º do art. 3º da Circular nº 4.015, de 2020, deve dar-se com base em quatro faixas de igual tamanho, com explicitação dos valores sobre a mediana e o percentual de clientes em cada uma dessas faixas, além dos valores máximos e mínimos do universo, segmentados em pessoas naturais e jurídicas, bem como por tipo de serviço ou modalidade de operação e por indexador ou referencial, no caso de operações pós-fixadas. § 1º  Admite-se que as instituições com\n\n- Art. 15.  A Estrutura de Governança do  Open Finance  de que trata o art. 44, § 1º, da Resolução Conjunta nº 1, de 4 de maio de 2020, deverá manter sítio eletrônico na internet para servir como portal do  Open Finance  no Brasil, que disponibilize, em um mesmo ambiente, informações atualizadas sobre as suas atividades, padrão de interfaces, inclusive o seu versionamento, e outras informações relacionadas à implementação do  Open Finance , organizadas em áreas específicas destinadas aos seguintes públicos:  (Redação dada pela Resolução BCB nº 398, de 4/7/2024.) I - instituições financeiras e de\n\n- Art. 15-A.  A Estrutura de Governança do  Open Finance  de que trata o art. 44, § 1º, da Resolução Conjunta nº 1, de 4 de maio de 2020, deverá manter ambiente de testes de APIs que permita às instituições participantes:  (Redação dada pela Resolução BCB nº 398, de 4/7/2024.) I -  submeter, ainda no estágio de desenvolvimento, suas implementações das APIs do  Open Banking  a testes automatizados funcionais e não funcionais; e I - submeter, ainda no estágio de desenvolvimento, suas implementações das APIs do  Open Finance  a testes automatizados funcionais e não funcionais; e  (Redação dada, a p\n\n- Art. 15-B.   (Revogado pela Resolução BCB nº 398, de 4/7/2024.) CAPÍTULO VIII DOS PADRÕES, DOS CERTIFICADOS E DEMAIS REQUISITOS DE SEGURANÇA\n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n"}, {"info": {"id": "bcb-res-343-2023", "titulo": "Resolução BCB nº 343, de 4 de outubro de 2023 (execução do compartilhamento de fraude — consolidada)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2023-10-06", "tags": "[fraude, compartilhamento, marcacao, pix, bets, ativos-virtuais, prazos]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-343-2023.md", "quando": "2026-07-14"}, "meta": {"id": "bcb-res-343-2023", "tipo": "norma", "titulo": "Resolução BCB nº 343, de 4 de outubro de 2023 (execução do compartilhamento de fraude — consolidada)", "orgao": "BCB", "data_publicacao": "2023-10-06", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico, retainer, adversarial]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=343", "status": "fichado", "tags": "[fraude, compartilhamento, marcacao, pix, bets, ativos-virtuais, prazos]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 343/2023 — a mecânica do compartilhamento (texto consolidado)\n\nVerificada no inteiro teor consolidado (API BCB) em 2026-07-14, já com as alterações das Resoluções BCB 552/2026 (ativos virtuais) e 569/2026 (bets). DOU 6/10/2023, S.1, p. 112.\n\n## Ementa\n\nLiteral: \"Dispõe sobre as medidas necessárias à execução do compartilhamento de dados e informações sobre indícios de fraudes de que trata a Resolução Conjunta nº 6, de 23 de maio de 2023.\"\n\n## O relógio central: 24 HORAS\n\nArt. 4º: registro do indício em no máximo **24 horas** da identificação; o MESMO prazo de 24h para **alteração e exclusão**, contado da identificação da necessidade. Declaração de conformidade mensal até o dia 15 (art. 5º). O prazo de exclusão em 24h é a blindagem contra a marcação indevida — e a prova de negligência de quem não exclui.\n\n## Rol de atividades cujos indícios obrigam registro (art. 2º, redação vigente)\n\nI - abertura de conta; II - prestação de serviço de pagamento (§1º: transferências internas, TED, cheque, **Pix**, DOC, boletos, saques); III - manutenção de conta; IV - operação de crédito; V - serviços de ativos virtuais (Res. 552/2026); VI - serviços financeiros/de pagamento a **operadoras de apostas não autorizadas** (Res. 569/2026, com base no art. 24-A, I da Lei 14.790/2023 — o sistema antifraude virou enforcement do mercado de bets ilegais; art. 1º-A e art. 3º, §4º).\n\n## O campo crítico para o contencioso (art. 3º)\n\nO registro detalha: identificação do suposto fraudador, descrição com data/hora/local/valor/canal/**dispositivo eletrônico**, e a \"indicação se houve ou não a atuação do cliente\" — sendo que o §3º manda registrar a atuação \"independentemente de ter sido induzida ou não por terceiros\". Tradução: a vítima de engenharia social que executou o Pix é registrada como tendo ATUADO. Esse campo serve à tese de culpa exclusiva/concorrente — e expõe quem registrar a vítima como executora sem lastro.\n\n## Demais obrigações\n\nUnicidade do registro (um indício, um sistema — art. 6º, §2º); leiautes padronizados e interoperabilidade; segurança com teste de intrusão anual independente (art. 8º); SLA de disponibilidade ≥ 99,8%/ano e RTO ≤ 2h (art. 9º); guarda de 5 anos (art. 12). Sem notificação ao marcado nem rito de contestação (o direito de acesso/correção fica na RC 6, art. 4º, III, \"h\").\n\n## Aplicação prática no ciclo Rastro\n\nWar room: o registro em 24h entra no playbook como obrigação paralela ao MED e à marcação no DICT (três camadas autônomas e cumulativas). Prontidão: auditar critérios de indício, fluxo de 24h (registro E exclusão) e a declaração mensal. Defesa: em ação de cliente marcado, a linha do tempo das 24h (registro fundamentado; exclusão tempestiva quando o indício caiu) é a prova central; no polo ativo, a omissão de registro por outra instituição é indício de falha sistêmica dela.\n\n## Lacunas\n\n- Res. BCB 552/2026 (também altera a Res. 85 e a 498): pendente de ficha própria — recorrente demais para ficar sem.\n- INs BCB 590/2025 e 592/2025 (operacionalização): não fichadas.\n- Interação marcação × recusa de conta: sem regra expressa — monitorar jurisprudência sobre marcação indevida.\n\n## Relações\n\n[[resolucao-conjunta-6-2023]] · [[bcb-res-569-2026]] · [[hub-matriz-prazos]] · [[bcb-res-506-2025]] · [[hub-catalogo-medidas]]\n"}, {"info": {"id": "bcb-res-436-2024", "titulo": "Resolução BCB nº 436, de 28 de novembro de 2024 (classificação Tipo 1, 2 e 3 e segmentação do Tipo 3) — sucessora da Res. BCB 197/2022", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2024-12-02", "tags": "[perimetro, prudencial, instituicao-de-pagamento, vasp, conglomerado, segmentacao]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-436-2024.md", "quando": "2026-11-03"}, "meta": {"id": "bcb-res-436-2024", "tipo": "norma", "titulo": "Resolução BCB nº 436, de 28 de novembro de 2024 (classificação Tipo 1, 2 e 3 e segmentação do Tipo 3) — sucessora da Res. BCB 197/2022", "orgao": "BCB", "data_publicacao": "2024-12-02", "vigencia": "", "altera": "[\"Resolução BCB nº 197/2022 (revogada a partir de 1º/1/2025)\"]", "fase_rastro": "[recuperacao_defesa]", "conexao_comercial": "[benchmark]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=436", "status": "fichado", "tags": "[perimetro, prudencial, instituicao-de-pagamento, vasp, conglomerado, segmentacao]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 436/2024 — quem é Tipo 1, Tipo 2 e Tipo 3\n\nFicha criada em 2026-10-29 a partir do inteiro teor lido no endpoint oficial do BCB pelo navegador do app (texto em `normas/bcb/_texto-res-436-2024.txt`). Ementa, vigência e obrigações são transcrição; aplicação e conexão comercial são propostas do assistente, a validar pelo operador, por isso o status permanece `a_fichar`.\n\n## Ementa\n\nEmenta vigente (redação da Res. BCB 580/2026): \"Classifica como Tipo 1, Tipo 2 ou Tipo 3 as instituições financeiras singulares e as demais instituições singulares autorizadas a funcionar pelo Banco Central do Brasil, bem como os conglomerados prudenciais liderados por essas instituições, e estabelece a segmentação das instituições e dos conglomerados classificados como Tipo 3.\" DOU 2/12/2024, S.1, p. 274/275. Substitui a Res. BCB 197/2022 (revogada desde 1º/1/2025), que as fichas e a matriz ainda citam.\n\n## Vigência e prazos\n\nVigor em 1º/1/2025 (data de revogação da 197 informada no consolidado). Transição de três meses entre Tipo 2 e Tipo 3 quando a composição do conglomerado muda (arts. 3º e 4º). Não se aplica a administradoras de consórcio (art. 1º, §2º).\n\n## Obrigações principais\n\nTipo 1: IF singular e outras autorizadas, exceto IP, corretora, DTVM, câmbio e VASP, e conglomerados por elas liderados; regime da Res. CMN 4.553 (e, para riscos, Res. CMN 4.557). Tipo 2: IP singular e conglomerado liderado por IP formado só por IPs (autorizadas ou não), securitizadoras, factoring, holdings dessas entidades e fundos; regime da Res. BCB 198. Tipo 3: corretora, DTVM, câmbio e VASP (Res. BCB 580/2026), seus conglomerados e o conglomerado liderado por IP que não cabe no Tipo 2 (isto é, que tem IF dentro); segmentação S2 a S5 do art. 5º, com S2 a partir de 1% do PIB; regime de riscos da Res. BCB 265 (S2 a S4) ou 201 (S5, metodologia simplificada facultativa).\n\n## Aplicação prática no ciclo Rastro (proposta — validar)\n\nProntidão: é a primeira pergunta do diagnóstico de riscos, porque decide qual norma de estrutura de riscos se aplica à fintech: SCD/SEP/banco → Tipo 1 → 4.557; IP pura ou grupo só de IPs → Tipo 2 → 198; IP que lidera grupo com SCD ou financeira (fintech híbrida), VASP, corretora digital → Tipo 3 → 265 ou 201 conforme o segmento. Notar que IP não autorizada entra no Tipo 2 como integrante do conglomerado (art. 2º, II, b, 2), o que atrai o BaaS ao perímetro pela via do conglomerado.\n\n## Conexão comercial (proposta — validar)\n\nBenchmark e diagnóstico (classificação e segmento como campo do questionário).\n\n## Lacunas\n\n- §§ 2º a 4º do art. 5º (limiares de S3, S4 e S5) não transcritos; conferir.\n- A Res. BCB 580/2026 que incluiu VASPs no Tipo 3 não foi lida.\n- Atualizar as referências à Res. 197 em `tipos-fintech.json` e nas fichas 198/201/265.\n\n## Relações\n\n[[bcb-res-198-2022]] · [[bcb-res-201-2022]] · [[bcb-res-265-2022]] · [[cmn-res-4557-2017]] · [[bcb-res-80-2021]] · [[escopo-controles-internos]]\n\n## Texto oficial (extração automática, 2026-11-02)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** Publicada no DOU de  2/12/2024, Seção 1, p. 274/275.\n**Ementa oficial:** Classifica como Tipo 1, Tipo 2 ou Tipo 3 as instituições singulares autorizadas a funcionar pelo Banco Central do Brasil e os conglomerados prudenciais liderados por essas instituições e estabelece a segmentação das instituições e dos conglomerados classificados como Tipo 3.\n\n### Vigência (dispositivos transcritos)\n\n- Art. 13.  Esta Resolução entra em vigor em 1º de janeiro de 2025. Otávio Ribeiro Damaso Diretor de Regulação\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 11 de março de 2022 · 14 de\nmarço de 2022 · 14 de julho de 1965 · 1º\nde janeiro de 2025 · 28 DE NOVEMBRO DE 2024 · 28 de novembro de 2024 · 28 de setembro\nde 2023 · 30 de\nmaio de 2025 · 30 de janeiro de 2017 · 30/5/2025 · 4 de novembro de 2013 · 9 de outubro de 2013\n\n### Normas alteradas ou revogadas\n\n- revogada a Resolução BCB nº 197, de 11 de março de 2022, publicada no D\n\n### Dispositivos que tocam o escopo Rastro\n\n- Art. 2º  As instituições mencionadas no art. 1º devem ser classificadas em um dos seguintes tipos para os fins da regulação prudencial de competência do Banco Central do Brasil: I - Tipo 1:  a) instituição singular autorizada a funcionar pelo Banco Central do Brasil, exceto: a) instituição financeira singular ou outra instituição singular autorizada a funcionar pelo Banco Central do Brasil, exceto:  (Redação dada pela Resolução BCB nº 580, de 1º/7/2026.) 1. instituição de pagamento; 2. sociedade corretora de títulos e valores mobiliários;  3. sociedade distribuidora de títulos e valores mobili\n\n- Art. 3º  Será concedido prazo de três meses para adequação ao arcabouço prudencial aplicável ao Tipo 3 nos seguintes casos: I - a instituição de pagamento singular constitua conglomerado não elegível ao Tipo 2; e II - o conglomerado do Tipo 2 deixe de atender aos critérios estabelecidos no art. 2º,  caput , inciso II.\n\n- Art. 7º  A alteração do enquadramento de que trata o art. 5º deve ocorrer: I - para o S2, quando a instituição atender ao disposto no art. 5º, § 1º, por três semestres consecutivos, se proveniente do S3, do S4 ou do S5; II - para o S3, quando a instituição atender ao disposto no art. 5º, § 2º: a) por três semestres consecutivos, se proveniente do S4 ou do S5; b) por cinco semestres consecutivos, se proveniente do S2; III - para o S4: a) quando a instituição atender ao disposto no art. 5º, § 3º, por cinco semestres consecutivos, se proveniente do S2 ou do S3; b) imediatamente, ao deixar de util\n\n- Art. 9º  As alterações de enquadramento produzem efeitos após o término do semestre subsequente à data da respectiva alteração. Parágrafo único.  Excetuam-se do disposto no  caput os casos dispostos no art. 7º,  caput , inciso III, alínea “b”, e inciso IV, cujas alterações produzirão efeitos imediatos. CAPÍTULO VII DA TRANSPARÊNCIA\n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n\n## Fichamento (operador, 2026-11-03)\n\n### Aplicação prática no ciclo Rastro\n\nEla classifica as instituições em Tipo 1, 2 e 3 e segmenta o Tipo 3, e é essa classificação que decide se uma fintech responde à Res. 198, à 201 ou à 265 em matéria de riscos. Sem a 436 no bolso, a terça-feira não faz sentido.  A pergunta que resolve quase todos os casos é quem lidera o grupo, e a lógica fica clara quando se lê as exceções da alínea a do Tipo 1: as cinco figuras ali listadas (IP, corretora, DTVM, corretora de câmbio e, desde a 580, VASP) são exatamente as que vão parar nos Tipos 2 e 3. O Tipo 1 é portanto a regra geral, o mundo das instituições financeiras, que seguem as regras do CMN; e um detalhe decisivo está na alínea b: se um banco lidera um grupo que tem uma IP dentro, o grupo inteiro é Tipo 1, e a IP segue o regime do líder.\n\n### Lacunas\n\nNenhuma apontada no fichamento.\n"}, {"info": {"id": "bcb-res-493-2025", "titulo": "Resolução BCB nº 493, de 28 de agosto de 2025 (MED 2.0)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2025-08-29", "tags": "[pix, med, recuperacao-de-valores, fraude]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-493-2025.md", "quando": "2026-09-28"}, "meta": {"id": "bcb-res-493-2025", "tipo": "norma", "titulo": "Resolução BCB nº 493, de 28 de agosto de 2025 (MED 2.0)", "orgao": "BCB", "data_publicacao": "2025-08-29", "vigencia": "", "altera": "[\"Resolução BCB nº 1/2020 (arranjo Pix e regulamento anexo)\"]", "fase_rastro": "[prontidao, war_room]", "conexao_comercial": "[benchmark, diagnostico, retainer]", "fonte_primaria": "https://pesquisa.in.gov.br/imprensa/servlet/INPDFViewer?jornal=515&pagina=187&data=29/08/2025&captchafield=firstAccess", "status": "fichado", "tags": "[pix, med, recuperacao-de-valores, fraude]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 493/2025 — MED 2.0\n\n## Ementa\n\nEmenta oficial (literal): \"Altera a Resolução BCB nº 1, de 12 de agosto de 2020, que institui o arranjo de pagamentos Pix e aprova o seu regulamento, para ajustar dispositivos relacionados ao funcionamento do Fórum Pix, e altera o regulamento anexo à Resolução BCB nº 1, de 12 de agosto de 2020, para aprimorar o Mecanismo Especial de Devolução e os procedimentos de alteração de informações vinculadas às chaves Pix.\" Publicada no DOU de 29/08/2025, Edição nº 164, Seção 1, p. 187.\n\n## Vigência e prazos\n\nEntra em vigor na data da publicação, com efeitos escalonados (art. 4º): efeitos imediatos para a maior parte dos artigos e efeitos em 2 de fevereiro de 2026 para o art. 3º. Pelo art. 121 do regulamento anexo (incluído pela Res. 493), a funcionalidade de recuperação de valores pode ser implementada facultativamente a partir de 23 de novembro de 2025 e deve ser implementada obrigatoriamente, pelos participantes nas modalidades provedor de conta transacional e liquidante especial, a partir de 2 de fevereiro de 2026. São duas datas distintas — facultativa e obrigatória — e ambas constam do texto oficial.\n\nHá uma terceira data, que não está na Res. 493 (atualização de 2026-09-28). A [[bcb-res-546-2026]], publicada no DOU de 23/1/2026, incluiu no regulamento o art. 113-A, que dispensa a instauração do processo de apuração de descumprimento para os descumprimentos relacionados ao art. 121 ocorridos entre 2 de fevereiro de 2026 e 10 de maio de 2026. O art. 121 não foi alterado: a obrigatoriedade continua sendo de 2/2/2026. O que muda é a exposição sancionatória no âmbito do arranjo, que só alcança os descumprimentos ocorridos a partir de 11 de maio de 2026 (dia seguinte ao termo final literal; a data de 11/5 não está escrita na norma).\n\n## Obrigações principais\n\nCria a \"recuperação de valores\": procedimento de rastreamento, de bloqueio e de devolução de valores no âmbito do Pix decorrente de suspeita de fraude na transação (art. 54, XII do regulamento). A instauração cabe ao PSP do pagador após reclamação do usuário, mediante fundada suspeita de fraude (art. 78-N). O detalhamento operacional é remetido ao Manual Operacional do DICT. O material oficial do BCB (Circuito Pix, Decem/Diseg) descreve o rastreio em múltiplos saltos com bloqueio em cadeia e devoluções sequenciais/parciais conforme o saldo bloqueado em cada conta, e confirma o pacote normativo de 28/8/2025 (Res. 493 + INs BCB 653, 654 e 655) e a IN BCB 673/2025 (requisitos de experiência do usuário).\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: verificar se o cliente (PSP pagador/recebedor) implementou a recuperação de valores no prazo obrigatório e se seus fluxos de atendimento acionam o MED corretamente — item central do questionário IMCI-Fraude. A data da implementação deve ser registrada em três faixas (até 2/2/2026; de 2/2 a 10/5/2026; a partir de 11/5/2026), porque a exposição à apuração de descumprimento difere em cada uma ([[bcb-res-546-2026]]). War room: nas 72h, o acionamento tempestivo do rastreio e bloqueio multi-salto é a principal alavanca de recuperação do valor fraudado; o playbook de incidente deve mapear quem aciona, como e em que prazo.\n\n## Conexão comercial\n\nAlimenta o benchmark IMCI-Fraude (maturidade de implementação do MED 2.0), o diagnóstico de prontidão e o retainer de war room (procedimento operacional de acionamento).\n\n## Lacunas\n\n- \"Produção plena em 11/6/2026\": NAO_CONFIRMADO. Essa data não consta do texto da Resolução 493 publicado no DOU, nem da Resolução 546, nem do material oficial do BCB consultado; circula apenas em fontes secundárias (imprensa). Revisão de 2026-09-28: a data com lastro primário é 11/5/2026, primeiro dia após a dispensa de apuração do art. 113-A do regulamento ([[bcb-res-546-2026]], DOU 23/1/2026, S.1, p. 72). Não há fonte primária que relacione as duas datas; não tratar \"11/6\" como variante de \"11/5\". Se o operador tiver fonte primária para \"11/6\" (ex.: instrução normativa ou manual operacional do DICT com cronograma próprio), fichar a fonte e atualizar o cronograma.\n- A expressão \"produção plena\" não é termo da Res. 493 nem da Res. 546. O que a fonte primária sustenta é: obrigatoriedade em 2/2/2026 e fim da dispensa de apuração em 10/5/2026. Não usar \"produção plena\" como se fosse categoria normativa.\n- \"Autofraude/MED por coerção\": NAO_CONFIRMADO como obrigação desta resolução — os termos coação/sequestro/autofraude não aparecem no texto publicado no DOU. Verificar se o tema está em instrução normativa ou manual operacional apartado.\n- INs BCB 653, 654, 655 e 673/2025 (detalhamento operacional): ainda não fichadas.\n\n## Relações\n\n[[hub-pix-med]] · [[hub-matriz-prazos]] · [[bcb-res-546-2026]] · [[bcb-res-494-498-2025]] · [[stj-sumula-479]]\n"}, {"info": {"id": "bcb-res-494-498-2025", "titulo": "Resoluções BCB nº 494 a 498, de 5 de setembro de 2025 (autorização de IPs, PSTI e seguro)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2025-09-05", "tags": "[instituicao-de-pagamento, psti, autorizacao, seguro, rsfn, pix, ted]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-494-498-2025.md", "quando": "2026-07-14"}, "meta": {"id": "bcb-res-494-498-2025", "tipo": "norma", "titulo": "Resoluções BCB nº 494 a 498, de 5 de setembro de 2025 (autorização de IPs, PSTI e seguro)", "orgao": "BCB", "data_publicacao": "2025-09-05", "vigencia": "", "altera": "[\"Resolução BCB nº 80/2021\", \"Resolução BCB nº 81/2021\", \"Resolução BCB nº 1/2020 (Pix)\", \"Resolução BCB nº 256/2022 (TED)\", \"Circular nº 3.970/2019 (dispositivos revogados)\"]", "fase_rastro": "[prontidao]", "conexao_comercial": "[benchmark, diagnostico]", "fonte_primaria": "https://pesquisa.in.gov.br/imprensa/servlet/INPDFViewer?jornal=600&pagina=1&data=05/09/2025&captchafield=firstAccess", "status": "fichado", "tags": "[instituicao-de-pagamento, psti, autorizacao, seguro, rsfn, pix, ted]", "confidencial": "false"}, "corpo": "\n# Pacote BCB de 5/9/2025 — Resoluções 494 a 498\n\n## Ementa\n\nPacote de cinco resoluções da Diretoria Colegiada (sessão de 3/9/2025), publicado na Edição Extra do DOU nº 169-A, de 05/09/2025, Seção 1. Endurece o perímetro prudencial: autorização prévia obrigatória de instituições de pagamento, requisitos para PSTIs (provedores de serviços de TI com acesso à RSFN), limites transacionais para não autorizados e seguro obrigatório de responsabilidade civil.\n\n## O que cada resolução trata\n\n- Res. 494 (altera a Res. BCB 80/2021): autorização prévia do BCB para toda IP iniciar prestação de serviço de pagamento; IPs pré-existentes não autorizadas devem protocolar pedido entre 1º/5/2026 e 31/5/2026.\n- Res. 495 (altera a Res. BCB 81/2021): novos requisitos de autorização — capacitação técnica dos administradores, capital/patrimônio mínimos, comprovação de sede física. Vigor na data de publicação.\n- Res. 496 (altera a Res. BCB 1/2020 — Pix): ajusta autorização de IPs participantes do Pix (pedido entre 1º/1/2026 e 1º/5/2026) e impõe limite de R$ 15.000,00 por transação Pix a IPs não autorizadas e a participantes conectados à RSFN via PSTI não credenciado (afastável mediante credenciamento do PSTI + relatório de asseguração de auditoria independente). Vigência escalonada: 180 dias após a publicação para as alterações ao art. 26 do regulamento; demais dispositivos na data de publicação.\n- Res. 497 (altera a Res. BCB 256/2022 — TED): veda TED ≥ R$ 15.000,00 por instituição que acessa a RSFN via PSTI não credenciado, com as mesmas exceções.\n- Res. 498 (norma nova): disciplina o credenciamento do PSTI para acesso à RSFN — governança (diretores de segurança e de riscos/compliance, comitê de crises), gestão de riscos, política de fraudes com monitoramento 24/7, plano de saída ordenada, e comprovação de contratação de seguro de responsabilidade civil e de riscos operacionais com cobertura mínima definida pelo BCB, incluindo incidentes de fraude e segurança cibernética (art. 3º, XIII, conforme texto consolidado oficial em bcb.gov.br — verificação anterior indicava art. 17; numeração conferida no inteiro teor em 2026-07-10). Pedido de credenciamento de PSTIs em funcionamento em até 4 meses da entrada em vigor (art. 37, §3º); adaptação conforme cronograma a ser publicado pelo BCB. Vigor na data de publicação (art. 39); revoga dispositivos da Circular 3.970/2019.\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: define o mapa de exposição regulatória do cliente fintech/BaaS — está autorizado? o PSTI é credenciado? há seguro com cobertura mínima? os limites de R$ 15 mil se aplicam? São perguntas diretas do questionário IMCI-Fraude e do diagnóstico. O contexto do pacote (resposta a incidentes de segurança na cadeia de PSTIs) é também argumento comercial para o recorte fintechs/BaaS.\n\n## Conexão comercial\n\nAlimenta o benchmark IMCI-Fraude (bloco de perímetro regulatório) e o diagnóstico de prontidão.\n\n## Alteração superveniente\n\nA Res. 498 foi alterada pela **Resolução BCB nº 547, de 30/1/2026** (identificada no texto consolidado em 2026-07-10): manteve o seguro obrigatório (art. 3º, XIII, sem nova redação), revogou o inciso XIV (Plano de Continuidade com comprovação anual), abrandou redações dos incisos VII a XII (capital mínimo de R$ 15 milhões mantido, com critérios ajustados). Res. 547 pendente de fichamento próprio.\n\n## Lacunas\n\n- A data exata do marco de 180 dias da Res. 496 (calculada como 4/3/2026) e a do teto de 4 meses da Res. 498 (calculada como 5/1/2026) são cômputos aritméticos a partir de 5/9/2025 — conferir regra de contagem no texto integral antes de usar em entregável.\n- Cronograma de adaptação dos PSTIs \"a ser publicado pelo BCB\" (Res. 498): monitorar; ainda não localizado.\n- Fichamento individual por resolução (um arquivo por norma) pode ser necessário quando o uso comercial exigir granularidade; por ora fichadas em bloco por integrarem um pacote único de publicação.\n\n## Relações\n\n[[hub-seguranca-cibernetica]] · [[hub-pix-med]] · [[hub-matriz-prazos]] · [[bcb-res-538-2025]]\n"}, {"info": {"id": "bcb-res-506-2025", "titulo": "Resolução BCB nº 506, de 26 de setembro de 2025 (segurança do arranjo Pix e marcação de fraude no DICT)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2025-09-30", "tags": "[pix, dict, marcacao-de-fraude, seguranca, autorizacao]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-506-2025.md", "quando": "2026-07-14"}, "meta": {"id": "bcb-res-506-2025", "tipo": "norma", "titulo": "Resolução BCB nº 506, de 26 de setembro de 2025 (segurança do arranjo Pix e marcação de fraude no DICT)", "orgao": "BCB", "data_publicacao": "2025-09-30", "vigencia": "", "altera": "[\"Resolução BCB nº 1/2020 (arranjo Pix e regulamento anexo)\"]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico, adversarial]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=506", "status": "fichado", "tags": "[pix, dict, marcacao-de-fraude, seguranca, autorizacao]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 506/2025 — segurança do arranjo Pix\n\n## Ementa\n\nEmenta oficial: altera a Resolução BCB nº 1/2020 para ajustar o critério de autorização das IPs não autorizadas participantes do Pix, e altera o regulamento anexo \"para aprimorar os mecanismos de segurança do arranjo e para ajustar dispositivos relativos às penalidades\". Diretoria Colegiada, sessão extraordinária de 26/09/2025; DOU de 30/9/2025, Seção 1, p. 448/449. Verificada no inteiro teor oficial (bcb.gov.br, exibenormativo).\n\n## Dispositivos-chave (transcrição do inteiro teor)\n\n- Art. 39-C (regulamento): \"Para fins de avaliação de suspeita de fraude ou de fundada suspeita de fraude em transações Pix, os participantes deverão adotar, no mínimo, os critérios indicados pelo Banco Central do Brasil, a ser divulgado em documento específico.\" — O BCB objetiva o juízo de \"fundada suspeita\" que dispara o MED (art. 78-N).\n- Art. 78-HA: \"O participante pode criar uma notificação de infração para marcação de fraude transacional, que permite a marcação de CPF ou de CNPJ de seu cliente que esteja envolvido em episódio de fraude relacionado a uma transação Pix específica.\"\n- Art. 89, §2º: o participante que aceitar notificação de infração ou criar marcação de fraude \"deve rejeitar todas as transações Pix que tenham o usuário envolvido na notificação como pagador ou como recebedor, bem como a conta envolvida\", salvo devoluções.\n- Efeitos da marcação sobre o ciclo da chave Pix: rejeição de registro de chave (art. 66, §3º), vedação de portabilidade (art. 68, §2º) e de reivindicação de posse (art. 70, §2º) para usuários marcados.\n- Art. 37: limites de valor só com base em critérios de mitigação de risco de fraude e PLD-FT, considerados características e perfil do usuário pagador.\n- Art. 3º, §9º da Resolução 1/2020: janelas escalonadas de pedido de autorização das IPs participantes (ver cronograma); descumprimento = hipótese de perda da condição de participante.\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: os critérios mínimos do art. 39-C (documento específico do BCB — monitorar publicação) e o uso da marcação 78-HA viram itens de auditoria do benchmark/IPR-72. War room: marcar a fraude no DICT e rejeitar transações do marcado (art. 89, §2º) integra o playbook logo após o acionamento do MED. Defesa: o conjunto forma o parâmetro objetivo de conduta exigível — cumprimento documentado sustenta fato exclusivo de terceiro; descumprimento caracteriza defeito do serviço.\n\n## Lacunas\n\n- \"Documento específico\" com os critérios mínimos do art. 39-C: publicação a monitorar — NAO_CONFIRMADO se já editado.\n- O termo \"bloqueio cautelar\" NÃO aparece nas alterações desta resolução; o instituto preexiste no regulamento do Pix (norma-base Res. 1/2020, não fichada) — não atribuir o bloqueio cautelar à 506 nem à 493.\n- Interação com o Manual de Penalidades do Pix (citado no texto): não fichado.\n\n## Relações\n\n[[hub-pix-med]] · [[bcb-res-493-2025]] · [[bcb-res-494-498-2025]] · [[hub-matriz-prazos]] · [[dossie-pix-fortuito]]\n"}, {"info": {"id": "bcb-res-538-2025", "titulo": "Resolução BCB nº 538, de 18 de dezembro de 2025 (segurança cibernética)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2025-12-22", "tags": "[seguranca-cibernetica, instituicao-de-pagamento, nuvem]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-538-2025.md", "quando": "2026-07-03"}, "meta": {"id": "bcb-res-538-2025", "tipo": "norma", "titulo": "Resolução BCB nº 538, de 18 de dezembro de 2025 (segurança cibernética)", "orgao": "BCB", "data_publicacao": "2025-12-22", "vigencia": "", "altera": "[\"Resolução BCB nº 85/2021 (política de segurança cibernética)\"]", "fase_rastro": "[prontidao, war_room]", "conexao_comercial": "[benchmark, diagnostico]", "fonte_primaria": "https://pesquisa.in.gov.br/imprensa/servlet/INPDFViewer?jornal=515&pagina=448&data=22/12/2025&captchafield=firstAccess", "status": "fichado", "tags": "[seguranca-cibernetica, instituicao-de-pagamento, nuvem]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 538/2025 — segurança cibernética\n\n## Ementa\n\nEmenta oficial (literal): \"Altera a Resolução BCB nº 85, de 8 de abril de 2021, que dispõe sobre a política de segurança cibernética e sobre os requisitos para a contratação de serviços de processamento e armazenamento de dados e de computação em nuvem a serem observados pelas instituições de pagamento, pelas sociedades corretoras de títulos e valores mobiliários, pelas sociedades distribuidoras de títulos e valores mobiliários e pelas sociedades corretoras de câmbio autorizadas a funcionar pelo Banco Central do Brasil.\" Assinada em 18/12/2025 (sessão da Diretoria Colegiada de 3/12/2025); publicada no DOU de 22/12/2025, Edição nº 243, Seção 1, p. 448.\n\n## Vigência e prazos\n\nEntra em vigor na data da publicação (art. 3º). As instituições em funcionamento na data de entrada em vigor devem promover as adaptações necessárias até 1º de março de 2026 (art. 2º, literal).\n\n## Obrigações principais\n\nAmplia os procedimentos e controles mínimos do art. 3º da Resolução BCB 85/2021; exige documentação dos critérios de configuração de crise (art. 20, parágrafo único); exige testes de intrusão com documentação de resultados e planos de correção de vulnerabilidades (art. 22-A, III). Escopo subjetivo: instituições de pagamento, corretoras e distribuidoras de TVM e corretoras de câmbio autorizadas pelo BCB.\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: a adequação até 1º/3/2026 é gatilho imediato de diagnóstico — política atualizada, testes de intrusão realizados e documentados, critérios de crise formalizados. War room: a existência (ou não) desses controles documentados define a exposição regulatória da instituição perante o BCB após o incidente e a narrativa de defesa.\n\n## Conexão comercial\n\nAlimenta diretamente o questionário do benchmark IMCI-Fraude (bloco de
