passos": [{"pergunta": "Antes da Resolução BCB 493/2025 já existia o MED. O que exatamente a norma acrescentou de novo em termos de conceito jurídico-operacional? Defina 'recuperação de valores' com as suas palavras.", "pontos": ["É um procedimento tripartite: rastreamento + bloqueio + devolução", "Escopo: valores no âmbito do Pix, decorrente de suspeita de fraude na transação", "Tem definição normativa expressa (art. 54, XII do regulamento do Pix)"], "gabarito": "A Resolução 493/2025 inseriu no regulamento do Pix a 'recuperação de valores': procedimento de rastreamento, de bloqueio e de devolução de valores no âmbito do Pix decorrente de suspeita de fraude na transação (art. 54, XII). A novidade conceitual é a fusão das três etapas num procedimento único e interparticipante — o MED original centrava-se na devolução pelo PSP recebedor direto."}, {"pergunta": "Quem instaura o procedimento e qual é o gatilho formal? Cuidado: a resposta tem dois elementos cumulativos.", "pontos": ["Instauração pelo PSP do PAGADOR (não do recebedor)", "Gatilho: reclamação do usuário + fundada suspeita de fraude (art. 78-N)"], "gabarito": "O PSP do pagador instaura a recuperação de valores após reclamação do usuário e mediante fundada suspeita de fraude (art. 78-N do regulamento do Pix, redação da Res. 493/2025). Os dois elementos são cumulativos: a reclamação sozinha não basta sem o juízo de fundada suspeita — e é esse juízo que o playbook do cliente precisa documentar."}, {"pergunta": "Por que o rastreio em múltiplos saltos muda o jogo contra a pulverização em contas-laranja? Descreva como o bloqueio e a devolução operam quando o dinheiro já saiu da primeira conta.", "pontos": ["Fraudador pulveriza o valor em cadeia de contas em minutos — o MED original parava na primeira conta", "O rastreio segue os saltos e o bloqueio ocorre em cadeia, nas contas de destino sucessivas", "A devolução é sequencial e PARCIAL: limitada ao saldo efetivamente bloqueado em cada conta"], "gabarito": "No desenho descrito no material oficial do BCB (Circuito Pix, Decem/Diseg), o rastreio acompanha os saltos do valor fraudado pela cadeia de contas, com bloqueio em cada conta de destino e devoluções sequenciais e parciais conforme o saldo bloqueado em cada uma. Ou seja: a vítima pode recuperar frações vindas de várias contas, e a velocidade do acionamento define quanto ainda há para bloquear. Atenção ao limite da fonte: o detalhamento operacional (número de saltos, janelas) está no Manual Operacional do DICT, não no corpo da resolução — a IN BCB 752/2026 (Manual 8.4) está no repositório com status a_fichar."}, {"pergunta": "Datas: quando a recuperação de valores passou a ser possível e quando passou a ser exigível — e exigível de quem, exatamente?", "pontos": ["Facultativa a partir de 23/11/2025", "Obrigatória a partir de 2/2/2026", "Sujeitos da obrigação: participantes nas modalidades provedor de conta transacional e liquidante especial (art. 121)"], "gabarito": "Implementação facultativa a partir de 23 de novembro de 2025 e obrigatória a partir de 2 de fevereiro de 2026 para os participantes nas modalidades provedor de conta transacional e liquidante especial (art. 121 do regulamento, redação da Res. 493/2025; efeitos cf. art. 4º, I). Nota de verificabilidade: a data de 'produção plena em 11/6/2026' que circula na imprensa NÃO consta do texto oficial — está como NAO_CONFIRMADO na ficha."}, {"pergunta": "Feche o ciclo: você está no war room às 4h da manhã com um cliente PSP do pagador. O que o conhecimento deste mecanismo exige que o playbook garanta nas primeiras horas — e qual é o argumento de defesa que isso constrói para a onda consumerista?", "pontos": ["Canal de reclamação funcionando 24/7 e fluxo interno para formar 'fundada suspeita' rápido", "Acionamento imediato do procedimento — cada minuto reduz o saldo bloqueável na cadeia", "Registro documental de cada passo (horários, decisões) — prova de diligência", "Ponte com a Súmula 479/STJ: controles cumpridos e documentados sustentam a tese de fortuito externo/culpa exclusiva"], "gabarito": "O playbook precisa garantir: recepção da reclamação a qualquer hora, formação rápida e documentada da fundada suspeita, acionamento imediato do rastreio/bloqueio (a chance de recuperação decai com a pulverização) e trilha documental completa. Na onda consumerista, essa trilha é o insumo da defesa: diante da Súmula 479/STJ (responsabilidade objetiva por fortuito interno), demonstrar que os mecanismos regulatórios foram acionados tempestivamente é o caminho para caracterizar fortuito externo ou culpa exclusiva de terceiro (CDC, art. 14, §3º)."}]}], "cenarios": [{"id": "pix-madrugada", "titulo": "Fraude Pix na madrugada — R$ 40 mil, cliente PSP do pagador", "inicio": "2026-03-10T03:00:00", "contexto": "Você é o advogado de plantão do retainer. Às 3h00 de terça-feira, o canal 24/7 da fintech NovaPag (instituição de pagamento, provedora de conta transacional, participante direta do Pix) recebe reclamação de um correntista: golpe de engenharia social, três transferências Pix somando R$ 40.000,00 feitas às 2h41, 2h44 e 2h47 para uma conta desconhecida. O time de fraude confirma padrão típico de conta de passagem: o dinheiro provavelmente já está sendo pulverizado. Há indícios de que o golpista obteve também o CPF, a senha do app e prints de dados cadastrais da vítima (dados de autenticação).", "decisoes": [{"situacao": "03:05 — O analista de fraude pergunta: 'aciono o mecanismo de devolução agora ou espero o jurídico validar de manhã? A vítima ainda não registrou boletim de ocorrência.'", "opcoes": [{"texto": "Acionar imediatamente a recuperação de valores (MED 2.0): há reclamação do usuário e fundada suspeita de fraude documentável agora.", "avaliacao": "correta", "custo_minutos": 15, "feedback": "Os dois requisitos do art. 78-N (reclamação do usuário + fundada suspeita de fraude) já estão presentes; BO não é requisito normativo. Como a NovaPag é provedora de conta transacional, a recuperação de valores é obrigatória desde 2/2/2026 — e cada minuto reduz o saldo bloqueável na cadeia de saltos.", "fonte": "Resolução BCB nº 493/2025, regulamento do Pix, arts. 78-N e 121 (DOU 29/08/2025)"}, {"texto": "Aguardar o expediente para o jurídico validar a instauração com mais segurança.", "avaliacao": "errada", "custo_minutos": 360, "feedback": "Não há exigência normativa de validação jurídica prévia, e a espera de horas praticamente garante a pulverização completa — a devolução é limitada ao saldo bloqueado em cada conta da cadeia. A demora ainda enfraquece a futura tese de fortuito externo.", "fonte": "Resolução BCB nº 493/2025, art. 78-N; material oficial BCB MED 2.0 (Circuito Pix)"}, {"texto": "Exigir que a vítima registre boletim de ocorrência primeiro e acionar o MED na sequência.", "avaliacao": "parcial", "custo_minutos": 120, "feedback": "O BO pode fortalecer o dossiê, mas não é requisito do art. 78-N — condicionar o acionamento a ele desperdiça a janela de bloqueio. Correto seria acionar já e orientar o BO em paralelo.", "fonte": "Resolução BCB nº 493/2025, regulamento do Pix, art. 78-N"}], "quando": "2026-03-10T03:05:00"}, {"situacao": "03:40 — O CISO informa: o golpista tinha senha do app e dados cadastrais da vítima. Pode ter havido vazamento interno ou captura externa; ainda não se sabe. O COO pergunta: 'isso já é um incidente que temos que reportar à ANPD?'", "opcoes": [{"texto": "Ainda não se sabe — mas o relógio de avaliação começa agora: registrar formalmente o momento do conhecimento, abrir apuração sobre afetação de dados pessoais e aplicar o teste do art. 5º (afetação significativa + critério objetivo).", "avaliacao": "correta", "custo_minutos": 30, "feedback": "A comunicação só é devida se houver risco/dano relevante (teste cumulativo do art. 5º — aqui há dados financeiros e de autenticação, um dos critérios; falta apurar a afetação significativa e se houve incidente no ambiente do controlador). O prazo de 3 dias úteis conta do conhecimento de que o incidente afetou dados pessoais — registrar QUANDO esse conhecimento se formou é decisivo.", "fonte": "Resolução CD/ANPD nº 15/2024, arts. 5º e 6º, §1º do Regulamento (DOU 26/04/2024)"}, {"texto": "Sim — comunicar à ANPD imediatamente, ainda esta madrugada, por precaução.", "avaliacao": "parcial", "custo_minutos": 90, "feedback": "Comunicar sem apurar não é exigido e pode ser prematuro: o dever nasce com o risco/dano relevante (art. 5º) e o prazo é de 3 dias úteis do conhecimento — há tempo para uma avaliação fundamentada. Comunicação precipitada e incompleta gera retrabalho e exposição desnecessária. Não é ilícito, mas não é o padrão da norma.", "fonte": "Resolução CD/ANPD nº 15/2024, arts. 5º e 6º do Regulamento"}, {"texto": "Não — golpe de engenharia social é problema entre o fraudador e a vítima; não há incidente de segurança da NovaPag.", "avaliacao": "errada", "custo_minutos": 30, "feedback": "Conclusão sem apuração. Se a senha e os dados cadastrais saíram de vazamento no ambiente do controlador, há incidente de segurança com dados de autenticação (critério do art. 5º). Descartar sem investigar nem registrar é exatamente o comportamento que a fiscalização e a onda consumerista exploram.", "fonte": "Resolução CD/ANPD nº 15/2024, art. 5º do Regulamento; Lei nº 13.709/2018, art. 48"}], "quando": "2026-03-10T03:40:00"}, {"situacao": "10:00 do mesmo dia — O rastreio bloqueou R$ 12.300 em duas contas de segundo salto. A apuração interna indica, até aqui, que NÃO houve vazamento no ambiente da NovaPag (captura provável no dispositivo da vítima). O comitê inclina-se por não comunicar à ANPD. O que você orienta?", "opcoes": [{"texto": "Formalizar a decisão de não comunicar com a fundamentação técnica, e registrar o incidente no livro de registro com o conteúdo mínimo, guardando por no mínimo 5 anos.", "avaliacao": "correta", "custo_minutos": 60, "feedback": "A norma obriga o registro de TODOS os incidentes, inclusive os não comunicados, por prazo mínimo de cinco anos, com conteúdo mínimo (data de conhecimento, circunstâncias). A fundamentação documentada é a defesa da decisão perante a ANPD e no contencioso.", "fonte": "Resolução CD/ANPD nº 15/2024, Regulamento de Comunicação de Incidente (DOU 26/04/2024)"}, {"texto": "Se não vai comunicar, não formalizar nada — documento interno vira prova contra a empresa depois.", "avaliacao": "errada", "custo_minutos": 10, "feedback": "Inverte a lógica normativa: o registro é obrigatório e a sua ausência é infração autônoma e indício de ocultação. No contencioso, é a trilha documental que sustenta a tese de fortuito externo.", "fonte": "Resolução CD/ANPD nº 15/2024, Regulamento; Súmula 479/STJ (contexto de defesa)"}, {"texto": "Registrar apenas se a ANPD abrir fiscalização no futuro, reconstituindo os fatos a partir dos logs.", "avaliacao": "errada", "custo_minutos": 10, "feedback": "Registro reconstituído a posteriori não cumpre a norma (que exige registro com data de conhecimento) e tem valor probatório fragilizado. O dever é contemporâneo ao incidente.", "fonte": "Resolução CD/ANPD nº 15/2024, Regulamento de Comunicação de Incidente"}], "quando": "2026-03-10T10:00:00"}, {"situacao": "14:00 — A vítima, orientada por um advogado, avisa que vai processar a NovaPag pelos R$ 27.700 não recuperados, invocando responsabilidade objetiva. O CEO pergunta o tamanho do risco e o que fazer AGORA para a defesa futura.", "opcoes": [{"texto": "Risco real (Súmula 479/STJ), mas defensável: preservar desde já toda a trilha — horários da reclamação, da instauração do MED, dos bloqueios, laudo indicando captura no dispositivo da vítima — para sustentar fortuito externo/culpa exclusiva.", "avaliacao": "correta", "custo_minutos": 60, "feedback": "A Súmula 479 impõe responsabilidade objetiva por fortuito interno; a fronteira de defesa é demonstrar fortuito externo ou culpa exclusiva da vítima/terceiro (CDC, art. 14, §3º). O acionamento tempestivo do MED 2.0 e os controles documentados são exatamente a prova que desloca o caso do fortuito interno.", "fonte": "STJ, Súmula 479 (Segunda Seção, DJe 1º/08/2012); CDC, art. 14, §3º"}, {"texto": "Risco nenhum: a NovaPag não teve culpa, e sem culpa não há dever de indenizar.", "avaliacao": "errada", "custo_minutos": 20, "feedback": "A responsabilidade da Súmula 479 é objetiva — independe de culpa. A discussão não é culpa, é a qualificação do evento como fortuito interno ou externo.", "fonte": "STJ, Súmula 479; CDC, art. 14"}, {"texto": "Propor acordo imediato pelo valor integral para evitar o processo.", "avaliacao": "parcial", "custo_minutos": 30, "feedback": "Pode ser decisão de negócio legítima caso a caso, mas como orientação padrão cria incentivo à litigância em massa (inclusive predatória) e ignora que há defesa técnica viável com a trilha do MED. Antes de precificar acordo, preserva-se a prova.", "fonte": "STJ, Súmula 479; contexto: hub-litigancia-predatoria"}], "quando": "2026-03-10T14:00:00"}, {"situacao": "Quinta-feira, 16:00 (D+2) — Reviravolta: a perícia acha um acesso não autorizado a uma base interna de dados cadastrais e de autenticação, 10 dias atrás, compatível com o golpe. A afetação é potencialmente ampla (150 mil clientes). Qual é o seu prazo-limite para comunicar à ANPD e a partir de quando ele conta?", "opcoes": [{"texto": "Três dias úteis a partir de AGORA (quinta 16h), quando se formou o conhecimento de que o incidente afetou dados pessoais — ou seja, até terça-feira. Preparar a comunicação já.", "avaliacao": "correta", "custo_minutos": 120, "feedback": "O termo inicial do art. 6º, §1º é o conhecimento pelo controlador de que o incidente afetou dados pessoais — formado agora com o achado pericial, não na data da invasão (10 dias atrás) nem na madrugada da fraude. Com dados de autenticação + larga escala + afetação significativa, o teste do art. 5º está preenchido: comunicar.", "fonte": "Resolução CD/ANPD nº 15/2024, arts. 5º e 6º, caput e §1º do Regulamento"}, {"texto": "O prazo conta da invasão (10 dias atrás) — já estourou; melhor não comunicar para não confessar atraso.", "avaliacao": "errada", "custo_minutos": 30, "feedback": "Termo inicial errado (é o conhecimento, não o evento) e a conclusão agrava: omitir a comunicação devida é infração autônoma à LGPD. O registro da linha do tempo da apuração demonstra a tempestividade.", "fonte": "Resolução CD/ANPD nº 15/2024, art. 6º, §1º; Lei nº 13.709/2018, art. 48"}, {"texto": "Três dias corridos a partir de agora — comunicar até domingo.", "avaliacao": "parcial", "custo_minutos": 60, "feedback": "Termo inicial correto, contagem errada: são dias ÚTEIS (art. 6º), não corridos. O erro para mais é inofensivo aqui, mas em outro cenário levaria a estourar prazo por contagem indevida.", "fonte": "Resolução CD/ANPD nº 15/2024, art. 6º do Regulamento"}], "quando": "2026-03-12T16:00:00"}], "verificacoes_finais": [{"descricao": "Comunicação do incidente à ANPD dentro de 3 dias úteis do conhecimento (quinta 16h → terça-feira seguinte, 2026-03-17)", "limite": "2026-03-17T23:59:00", "fonte": "Resolução CD/ANPD nº 15/2024, art. 6º do Regulamento; hub-matriz-prazos"}]}], "tipos_fintech": {"titulo": "Estratégia por tipo de fintech", "nota": "Cada tipo tem cenários que se aplicam e cenários que não se aplicam. Dizer o que não se aplica é parte do valor: reduz o plano ao executável. Cada tipo aponta para os cenários da matriz de incidentes que se aplicam a ele e para os que expressamente não se aplicam.", "tipos": [{"id": "ip-conta", "nome": "IP · Provedora de conta transacional", "oque": "Conta digital de pagamento com participação direta no Pix. O cliente final movimenta recursos pela instituição.", "risco": "Exposição máxima. É o tipo que responde tanto como PSP pagador (cliente vítima de golpe) quanto como PSP recebedor (conta usada por fraudador).", "aplicaveis": ["Golpe de engenharia social contra o cliente", "Conta-laranja hospedada na própria base", "Vazamento de chaves e dados cadastrais", "Enxurrada de determinações judiciais de bloqueio", "Onda consumerista pós-incidente"], "nao_aplicaveis": ["Chargeback de cartão (salvo se também emissora)", "Risco de carteira de crédito próprio"], "gaps": ["Canal 24/7 e formação documentada da fundada suspeita (art. 78-N)", "Motor de transação atípica e trava de aumento de limite (Res. 142/2021)", "Rejeição de transação a conta suspeita (Res. 501/2025, desde 13/10/2025)", "KYC e critérios de encerramento de conta", "Fluxo de cumprimento de ordem judicial com prova de tempestividade"], "normas": ["bcb-res-493-2025", "bcb-res-506-2025", "bcb-res-142-2021", "bcb-res-343-2023", "anpd-res-cd-15-2024", "bcb-res-85-2021"], "estrategia": "Prioridade absoluta no eixo de detecção e acionamento: é onde nascem as condenações por falha autônoma. Plano precisa garantir instauração imediata do MED, marcação no DICT e registro do indício em 24h. Segundo eixo: determinações judiciais, pela frequência.", "cenarios_matriz": ["engenharia-social", "conta-laranja", "vazamento", "determinacoes-judiciais", "onda-consumerista", "credencial-fornecedor", "insider"], "cenarios_matriz_na": ["chargeback-recebivel", "perimetro-regulatorio", "recursos-origem-fraudulenta"]}, {"id": "ip-credenciadora", "nome": "IP · Credenciadora ou subadquirente", "oque": "Captura e liquidação de transações de cartão para estabelecimentos. Não mantém conta transacional do consumidor final.", "risco": "O risco migra do consumidor para o lojista e para a cadeia de liquidação. Fraude de estabelecimento, chargeback em massa e retenção de recebíveis.", "aplicaveis": ["Fraude de estabelecimento credenciado (loja fantasma, transação simulada)", "Chargeback em massa e disputa de recebível", "Bloqueio judicial sobre recebíveis de lojista", "Ataque via fornecedor de tecnologia"], "nao_aplicaveis": ["MED e recuperação de valores do Pix (salvo se também PSP)", "Golpe de engenharia social contra correntista"], "gaps": ["Critérios de credenciamento e descredenciamento de estabelecimento", "Política de retenção e ante <script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const INTERVALOS=[1,3,7,16,35], POR_SESSAO=5;
const LS = k => JSON.parse(localStorage.getItem("rastro-"+k)||"{}");
const LSet = (k,v) => localStorage.setItem("rastro-"+k, JSON.stringify(v));
const hojeISO = () => new Date().toISOString().slice(0,10);
function filaRevisao(){
  const D=window.DADOS, e=LS("revisao"), hoje=hojeISO();
  const fila=D.cartoes.filter(c=>!e[c.id]||e[c.id].proxima<=hoje)
    .sort((a,b)=>((e[a.id]||{}).proxima||"").localeCompare((e[b.id]||{}).proxima||""));
  return {hoje, total:D.cartoes.length, vencidos:fila.length,
    sessao:fila.slice(0,POR_SESSAO),
    todos:D.cartoes.map(c=>({id:c.id,norma:c.norma||"",
      nivel:(e[c.id]||{}).nivel||0, proxima:(e[c.id]||{}).proxima||"novo"}))};
}
const api = async (rota, corpo) => {
  const D=window.DADOS;
  const u=new URL(rota,"http://x"), p=u.pathname, q=u.searchParams;
  if(p==="/api/resumo") return {...D.resumo, revisao:{vencidos:filaRevisao().vencidos}};
  if(p==="/api/fichas") return D.fichas.map(f=>f.info);
  if(p==="/api/ficha"){ const f=D.fichas.find(x=>x.info.id===q.get("id"));
    return f?{meta:f.meta,corpo:f.corpo,caminho:f.info.caminho}:{erro:"não disponível nesta versão pública"}; }
  if(p==="/api/mudancas") return [...D.fichas.map(f=>({...f.info,quando:f.info.quando}))]
    .sort((a,b)=>b.quando.localeCompare(a.quando)).slice(0,12);
  if(p==="/api/comerciais") return [];
  if(p==="/api/trilha"){ const prog=LS("trilha");
    const t=JSON.parse(JSON.stringify(D.trilha));
    t.licoes.forEach(l=>l.concluida=!!prog[l.id]);
    t.concluidas=t.licoes.filter(l=>l.concluida).length; return t; }
  if(p==="/api/trilha/concluir"){ const prog=LS("trilha");
    prog[corpo.id]=corpo.concluida; LSet("trilha",prog); return {ok:true}; }
  if(p==="/api/tipos-fintech") return D.tipos_fintech;
  if(p==="/api/matriz-incidentes") return D.matriz_incidentes;
  if(p==="/api/roteiros") return D.roteiros.map(r=>({id:r.id,titulo:r.tema}));
  if(p==="/api/roteiro") return D.roteiros.find(r=>r.id===q.get("id"))||{erro:"?"};
  if(p==="/api/cenarios") return D.cenarios.map(c=>({id:c.id,titulo:c.titulo}));
  if(p==="/api/cenario") return D.cenarios.find(c=>c.id===q.get("id"))||{erro:"?"};
  if(p==="/api/revisao/fila") return filaRevisao();
  if(p==="/api/revisao/responder"){ const e=LS("revisao");
    const prev=e[corpo.id]||{nivel:0}; let nivel,dias;
    if(corpo.acertou){ nivel=prev.nivel+1;
      dias=nivel<=INTERVALOS.length?INTERVALOS[nivel-1]:INTERVALOS[INTERVALOS.length-1]*2**(nivel-INTERVALOS.length); }
    else { nivel=0; dias=1; }
    const prox=new Date(); prox.setDate(prox.getDate()+dias);
    e[corpo.id]={nivel, proxima:prox.toISOString().slice(0,10), ultima:hojeISO()};
    LSet("revisao",e); return {id:corpo.id, nivel, proxima_em_dias:dias}; }
  return {erro:"função indisponível na versão pública (somente leitura)"};
};
const esc = t => (t??"").toString().replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- mini-markdown (títulos, negrito, listas, tabelas, código, links) */
function md(texto){
  const linhas = texto.split("\n");
  let html = "", i = 0, lista = false, tabela = [];
  const inline = s => esc(s)
    .replace(/\[\[([a-z0-9-]+)\]\]/g, '<a class="wiki" data-ficha="$1">$1</a>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  const fechaLista = () => { if (lista){ html += "</ul>"; lista = false; } };
  const fechaTabela = () => {
    if (!tabela.length) return;
    const corpo = tabela.filter(l => !/^\s*\|[\s|:-]+\|\s*$/.test(l));
    html += "<table>";
    corpo.forEach((l, n) => {
      const cels = l.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|");
      const tag = n === 0 ? "th" : "td";
      html += "<tr>" + cels.map(c => `<${tag}>${inline(c.trim())}</${tag}>`).join("") + "</tr>";
    });
    html += "</table>"; tabela = [];
  };
  while (i < linhas.length){
    const l = linhas[i];
    if (l.startsWith("```")){
      fechaLista(); fechaTabela();
      let bloco = ""; i++;
      while (i < linhas.length && !linhas[i].startsWith("```")){ bloco += linhas[i]+"\n"; i++; }
      html += `<pre><code>${esc(bloco)}</code></pre>`; i++; continue;
    }
    if (/^\s*\|/.test(l)){ fechaLista(); tabela.push(l); i++; continue; }
    fechaTabela();
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h){ fechaLista(); html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; }
    else if (/^\s*[-•]\s+/.test(l)){
      if (!lista){ html += "<ul>"; lista = true; }
      html += `<li>${inline(l.replace(/^\s*[-•]\s+/,""))}</li>`;
    }
    else if (l.trim() === ""){ fechaLista(); }
    else { fechaLista(); html += `<p>${inline(l)}</p>`; }
    i++;
  }
  fechaLista(); fechaTabela();
  return html;
}

/* ---------- caso real (gerador de passo a passo do war room) */
function somaDiasUteis(data, n){
  const d = new Date(data);
  let uteis = 0;
  while (uteis < n){
    d.setDate(d.getDate()+1);
    if (d.getDay() !== 0 && d.getDay() !== 6) uteis++;
  }
  return d;
}

        ${l.concluida?"✅":"⬜️"} <b>${esc(l.titulo)}</b></button>`).join("")}
  </div>`).join("")}`;
};

/* ---------- IPR-72 */
TELAS.ipr72 = async () => {
  const f = await api("/api/ipr72");
  $("#main").innerHTML = `
  <div class="cartao"><h2 class="secao">${esc(f.titulo)}</h2>
    <p class="dim">Versão ${esc(f.versao)}</p>
    <div class="aviso"><b>CONTEÚDO CONFIDENCIAL</b> — protótipo interno: pesos,
    fórmula e régua são segredo de negócio. Não apresentar a cliente sem decisão
    expressa. Documento conceitual na ficha <a class="wiki" data-ficha="metodologia-proprietaria">metodologia-proprietaria</a>.</div>
    <p>Responda pensando num cliente concreto (ou na própria tese). Níveis:</p>
    <ul>${f.niveis.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>
  </div>
  <form id="quiz">
  ${f.dimensoes.map(d=>`<div class="cartao"><h2 class="secao">${esc(d.nome)}
      <span class="chip">peso ${d.peso}%</span></h2>
    ${d.perguntas.map(p=>`<p style="margin-bottom:4px"><b>${esc(p.texto)}</b><br>
      <span class="dim">Âncora: ${esc(p.fonte)}</span></p>
      <div class="linha-botoes">${[1,2,3,4].map(n=>`
        <label><input type="radio" name="${p.id}" value="${n}" required> ${n}</label>`).join("")}
      </div>`).join("")}
  </div>`).join("")}
  <div class="linha-botoes"><button class="acao" type="submit">Calcular score</button></div>
  </form><div id="resultado"></div>`;
  $("#quiz").onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    let score = 0; const porDim = [];
    f.dimensoes.forEach(d => {
      const media = d.perguntas.reduce((s,p)=>s + +fd.get(p.id), 0) / d.perguntas.length;
      const nota = (media - 1) / 3 * 100;           // nível 1→0, nível 4→100
      porDim.push({nome: d.nome, nota, peso: d.peso,
        fraca: d.perguntas.filter(p=>+fd.get(p.id)<=2)});
      score += nota * d.peso / 100;
    });
    score = Math.round(score);
    const faixa = f.faixas.find(x => score <= x.ate);
    porDim.sort((a,b)=>a.nota-b.nota);
    $("#resultado").innerHTML = `
    <div class="cartao"><h2 class="secao">Score IPR-72: ${score}/100 — ${esc(faixa.rotulo)}</h2>
      <p>${esc(faixa.leitura)}</p>
      ${porDim.map(d=>`<p style="margin:6px 0"><b>${esc(d.nome)}</b> — ${Math.round(d.nota)}/100
        <span class="chip">peso ${d.peso}%</span></p>
        <div style="background:var(--chip);border-radius:8px;height:8px;max-width:520px">
          <div style="background:${d.nota<40?"var(--ruim)":d.nota<70?"var(--meio)":"var(--ok)"};
            height:8px;border-radius:8px;width:${Math.max(2,d.nota)}%"></div></div>`).join("")}
      ${porDim[0].fraca.length ? `<div class="aviso" style="margin-top:14px">
        <b>Prioridades (respostas nível 1-2 na dimensão mais fraca):</b>
        <ul>${porDim[0].fraca.map(p=>`<li>${esc(p.texto)}<br>
          <span class="dim">Âncora: ${esc(p.fonte)}</span></li>`).join("")}</ul></div>` : ""}
      <p class="dim">Protótipo v0.1: régua não calibrada — validar em 3-5 casos antes de uso comercial.</p>
    </div>`;
    $("#resultado").scrollIntoView({behavior:"smooth"});
  };
};

/* ---------- revisão espaçada */
TELAS.revisao = async () => {
  const fila = await api("/api/revisao/fila");
  if (!fila.sessao.length){
    $("#main").innerHTML = `
    <div class="cartao"><h2 class="secao">Nenhum cartão vencido hoje 🎉</h2>
    <p class="dim">Próximas revisões:</p>
    <table><tr><th>Cartão</th><th>Norma</th><th>Nível</th><th>Próxima</th></tr>
    ${fila.todos.map(c=>`<tr><td>${esc(c.id)}</td><td>${esc(c.norma)}</td>
      <td>${c.nivel}</td><td>${esc(c.proxima)}</td></tr>`).join("")}</table></div>`;
    return;
  }
  let idx = 0, acertos = 0;
  const mostra = () => {
    const c = fila.sessao[idx];
    $("#main").innerHTML = `
    <div class="cartao">
      <div class="rotulo">Cartão ${idx+1}/${fila.sessao.length} · ${esc(c.norma)}</div>
      <h2 class="secao">${esc(c.pergunta)}</h2>
      <div id="zona">
        <button class="acao" id="revelar">Revelar resposta</button>
      </div>
    </div>`;
    $("#revelar").onclick = () => {
      $("#zona").innerHTML = `
      <div class="cartao fb-correta"><b>Resposta:</b> ${esc(c.resposta)}
        <p class="dim">Fonte: ${esc(c.fonte)}</p></div>
      <div class="linha-botoes">
        <button class="acao" id="sim">Acertei</button>
        <button class="acao sec" id="nao">Errei</button>
      </div>`;
      const responder = async ok => {
        const r = await api("/api/revisao/responder", {id: c.id, acertou: ok});
        if (ok) acertos++;
        idx++;
        if (idx < fila.sessao.length) mostra();
        else $("#main").innerHTML = `
        <div class="cartao"><h2 class="secao">Sessão concluída</h2>
        <p>${acertos}/${fila.sessao.length} acertos. Próxima revisão do último
        cartão em ${r.proxima_em_dias} dia(s).</p>
        <button class="acao sec" onclick="irPara('revisao')">Ver fila</button></div>`;
      };
      $("#sim").onclick = () => responder(true);
      $("#nao").onclick = () => responder(false);
    };
  };
  mostra();
};

/* ---------- socrático */
TELAS.socratico = async (rid) => {
  if (!rid){
    const rs = await api("/api/roteiros");
    $("#main").innerHTML = `<div class="cartao"><h2 class="secao">Roteiros socráticos</h2>
    ${rs.map(r=>`<button class="opcao" onclick="irPara('socratico','${r.id}')">
      <b>${esc(r.titulo)}</b><br><span class="dim">${esc(r.id)}</span></button>`).join("")}
    <p class="dim">Método: você escreve a sua articulação ANTES de ver o gabarito
    — que confirma ou corrige com a citação da norma.</p></div>`;
    return;
  }
  const rot = await api("/api/roteiro?id=" + encodeURIComponent(rid));
  let idx = 0; const autos = [];
  const mostra = () => {
    const p = rot.passos[idx];
    $("#main").innerHTML = `
    <div class="linha-botoes"><button class="acao sec" onclick="irPara('socratico')">← roteiros</button>
      <span class="rotulo">${esc(rot.tema)}</span></div>
    <div class="cartao">
      <div class="rotulo">Pergunta ${idx+1}/${rot.passos.length}</div>
      <h2 class="secao">${esc(p.pergunta)}</h2>
      <textarea id="artic" placeholder="Articule a sua resposta aqui antes de revelar…"></textarea>
      <div class="linha-botoes"><button class="acao" id="rev">Revelar gabarito</button></div>
      <div id="gab"></div>
    </div>`;
    $("#rev").onclick = () => {
      if (!$("#artic").value.trim()){
        alert("O método exige tentar antes de ver: escreva ao menos uma linha."); return;
      }
      $("#rev").disabled = true; $("#artic").readOnly = true;
      $("#gab").innerHTML = `
      <div class="aviso"><b>Sua articulação deveria cobrir:</b>
        <ul>${p.pontos.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="cartao fb-correta"><b>Gabarito:</b> ${esc(p.gabarito)}</div>
      <div class="linha-botoes"><span class="rotulo">Autoavaliação:</span>
        <button class="acao" data-a="s">Cobri</button>
        <button class="acao sec" data-a="p">Parcial</button>
        <button class="acao sec" data-a="n">Não cobri</button></div>`;
      $("#gab").querySelectorAll("button[data-a]").forEach(b => b.onclick = () => {
        autos.push(b.dataset.a); idx++;
        if (idx < rot.passos.length) mostra(); else fim();
      });
    };
  };
  const fim = () => {
    const mapa = {s:["coberto","ok"], p:["parcial","meio"], n:["a revisar","ruim"]};
    $("#main").innerHTML = `
    <div class="cartao"><h2 class="secao">Resumo — ${esc(rot.tema)}</h2>
    <table><tr><th>Pergunta</th><th>Resultado</th></tr>
    ${autos.map((a,n)=>`<tr><td>${esc(rot.passos[n].pergunta.slice(0,90))}…</td>
      <td class="status-${a==='s'?'fichado':'a_fichar'}">${mapa[a][0]}</td></tr>`).join("")}
    </table>
    <p class="dim">Fontes do roteiro: ${esc(rot.fontes)}</p>
    <div class="linha-botoes">
      <button class="acao sec" onclick="irPara('socratico')">Outro roteiro</button>
      <button class="acao sec" onclick="irPara('revisao')">Reforçar na revisão</button>
    </div></div>`;
  };
  mostra();
};

/* ---------- simulador */
TELAS.simulador = async (cid) => {
  if (!cid){
    const cs = await api("/api/cenarios");
    $("#main").innerHTML = `<div class="cartao"><h2 class="secao">Cenários de incidente</h2>
    ${cs.map(c=>`<button class="opcao" onclick="irPara('simulador','${c.id}')">
      <b>${esc(c.titulo)}</b><br><span class="dim">${esc(c.id)}</span></button>`).join("")}
    <p class="dim">O relógio do caso avança conforme as suas escolhas. Ao final,
    cada decisão é avaliada contra a matriz de obrigações, com a fonte.</p></div>`;
    return;
  }
  const cen = await api("/api/cenario?id=" + encodeURIComponent(cid));
  let relogio = new Date(cen.inicio), idx = 0;
  const historico = []; const t0 = Date.now();
  const fmt = d => d.toLocaleString("pt-BR",
    {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
  const mostra = () => {
    const p = cen.decisoes[idx];
    if (p.quando){ const q = new Date(p.quando); if (q > relogio) relogio = q; }
    $("#main").innerHTML = `
    <div class="linha-botoes"><button class="acao sec" onclick="irPara('simulador')">← cenários</button>
      <span class="relogio">🕐 ${fmt(relogio)}</span>
      <span class="rotulo">Decisão ${idx+1}/${cen.decisoes.length}</span></div>
    ${idx===0?`<div class="cartao"><b>${esc(cen.titulo)}</b><p>${esc(cen.contexto)}</p></div>`:""}
    <div class="cartao"><p><b>${esc(p.situacao)}</b></p>
      ${p.opcoes.map((o,n)=>`<button class="opcao" data-n="${n}">${esc(o.texto)}</button>`).join("")}
    </div>`;
    document.querySelectorAll(".opcao").forEach(b => b.onclick = () => {
      const o = p.opcoes[+b.dataset.n];
      relogio = new Date(relogio.getTime() + o.custo_minutos*60000);
      historico.push({o, quando: new Date(relogio)});
      idx++;
      if (idx < cen.decisoes.length) mostra(); else fim();
    });
  };
  const fim = () => {
    const nota = {correta:2, parcial:1, errada:0};
    const rot = {correta:"CORRETA", parcial:"PARCIAL", errada:"ERRADA"};
    const obtido = historico.reduce((s,h)=>s+nota[h.o.avaliacao],0);
    const verifs = (cen.verificacoes_finais||[]).map(v => {
      const ok = relogio <= new Date(v.limite);
      return `<div class="cartao ${ok?"fb-correta":"fb-errada"}">
        <b>${ok?"DENTRO DO PRAZO":"PRAZO ESTOURADO"}</b> — ${esc(v.descricao)}<br>
        <span class="dim">limite ${fmt(new Date(v.limite))} · caso encerrado às ${fmt(relogio)}
        · Fonte: ${esc(v.fonte)}</span></div>`;
    }).join("");
    $("#main").innerHTML = `
    <div class="cartao"><h2 class="secao">Relatório — ${esc(cen.titulo)}</h2>
    <p><b>Pontuação: ${obtido}/${historico.length*2}</b> ·
      tempo real de decisão: ${Math.round((Date.now()-t0)/1000)}s ·
      relógio final do caso: ${fmt(relogio)}</p></div>
    ${historico.map((h,n)=>`<div class="cartao fb-${h.o.avaliacao}">
      <div class="rotulo">Decisão ${n+1} — ${rot[h.o.avaliacao]}</div>
      <p><b>${esc(h.o.texto)}</b></p><p>${esc(h.o.feedback)}</p>
      <p class="dim">Fonte: ${esc(h.o.fonte)}</p></div>`).join("")}
    ${verifs}
    <div class="linha-botoes">
      <button class="acao sec" onclick="irPara('simulador','${cen.id}')">Repetir cenário</button>
      <button class="acao sec" onclick="irPara('matriz')">Rever matriz de prazos</button>
    </div>`;
  };
  mostra();
};

/* ---------- monitor */
TELAS.monitor = async () => {
  $("#main").innerHTML = `
  <div class="cartao">
    <h2 class="secao">Monitor normativo (Módulo 2)</h2>
    <p class="dim">Consulta a API de normativos do BCB e a REST API da ANPD,
    filtra pelas palavras-chave do escopo Rastro e cria fichas
    <b>a fichar</b>. Roda apenas sob o seu comando.</p>
    <div class="linha-botoes">
      <label class="rotulo">Desde:</label>
      <input type="text" id="desde" placeholder="AAAA-MM-DD (vazio = última execução)" style="max-width:280px">
      <label><input type="checkbox" id="dry"> só simular (dry-run)</label>
      <button class="acao" id="rodar">Rodar agora</button>
    </div>
    <div id="saida"></div>
  </div>`;
  $("#rodar").onclick = async () => {
    $("#rodar").disabled = true;
    $("#saida").innerHTML = `<p class="dim">Consultando BCB e ANPD… (até 1-2 min)</p>`;
    try{
      const r = await api("/api/monitorar",
        {desde: $("#desde").value.trim(), dry_run: $("#dry").checked});
      $("#saida").innerHTML = `<pre class="saida">${esc(r.saida)}</pre>` +
        (r.ok ? `<p class="dim">Concluído. Novos itens aparecem no
          <a class="wiki" onclick="irPara('painel')">Painel</a> como “a fichar”.</p>`
        : `<p class="status-a_fichar">O monitor retornou erro — ver saída acima.</p>`);
    } catch(e){
      $("#saida").innerHTML = `<p class="status-a_fichar">Falha: ${esc(e.message)}</p>`;
    }
    $("#rodar").disabled = false;
  };
};

else { nav(); TELAS.painel(); }
