 \"S1 a S4 — Res. 4.557, art. 33 (S4 com as dispensas do art. 60)\": [\"Políticas de terceirização e seleção de prestadores (art. 33, I)\", \"Recursos para avaliar e monitorar o risco de terceiros relevantes (II)\", \"Governança de TI consistente com a RAS (III)\", \"Sistemas e infraestrutura de TI íntegros, seguros, disponíveis, robustos e com proteção contra ataques digitais (IV)\", \"Base de perdas operacionais com causa raiz (V; art. 34)\", \"Análises de cenários de eventos raros e severos (VI)\", \"Contratos de TI com acesso do BCB a termos, documentação e dependências (§1º)\"]}, \"conexas\": [[\"Compliance\", \"Res. CMN 4.595/2017\", \"cmn-res-4595-2017\", \"Política aprovada pelo conselho; função segregada da auditoria interna; relatório anual; guarda de 5 anos\"], [\"Auditoria interna\", \"Res. CMN 4.879/2020\", \"cmn-res-4879-2020\", \"Unidade subordinada ao conselho; escopo inclui a estrutura de riscos (art. 13); plano e relatório anuais\"], [\"Cibersegurança e nuvem\", \"Res. CMN 4.893/2021\", \"cmn-res-4893-2021\", \"Política de segurança cibernética; plano de resposta a incidentes; contratação de nuvem (ficha ainda stub)\"], [\"Fraude (compartilhamento)\", \"Res. Conjunta 6/2023\", \"resolucao-conjunta-6-2023\", \"Sistema de registro e consulta de indícios de fraude\"], [\"Qualidade da informação\", \"Res. Conjunta 18/2025\", \"resolucao-conjunta-18-2025\", \"Política em documento próprio até 31/12/2026; testes prévios; relatório semestral; diretor designado\"], [\"PLD/FT\", \"Circular 3.978/2020\", \"bcb-circular-3978-2020\", \"Política, procedimentos e controles de PLD/FT\"]], \"diretores\": [\"Diretor de controles internos (Res. 4.968, art. 10)\", \"Diretor de riscos (Res. 4.557, art. 44, CRO, ou art. 62 no S5)\", \"Diretor de qualidade da informação (Res. Conjunta 18, art. 5º)\", \"Chefe da auditoria interna comunicado ao BCB (Res. 4.879)\", \"Diretor de segurança cibernética (Res. 4.893) e de PLD (Circular 3.978) — conferir nas fichas\"], \"prazos\": [\"Diretor de controles internos exigível desde 1º/1/2023 (Res. 4.968, art. 13, I)\", \"Política de qualidade da informação até 31/12/2026 (Res. Conjunta 18, art. 12)\", \"Compartilhamento de fraude conforme Res. Conjunta 6/2023\"], \"notas\": [\"Mesmas observações da SCD.\", \"O risco de informação ao investidor pessoa física não é tema das normas de controles internos; está na regulação própria da SEP.\"], \"fontes\": [\"cmn-res-4968-2021\", \"cmn-res-4557-2017\", \"cmn-res-4595-2017\", \"cmn-res-4879-2020\", \"escopo-controles-internos\", \"cmn-res-4553-2017\"], \"rotulo\": [\"SEP\", \"Empréstimo P2P\"]}, {\"id\": \"baas-psti\", \"nome\": \"BaaS, infraestrutura e PSTI\", \"resumo\": \"Fornece trilhos, licença ou conexão para que terceiros ofereçam serviço financeiro; inclui prestador de TI com acesso à RSFN.\", \"enquadramento\": \"Não é IP nem IF, salvo quando o provedor detém licença própria (então é tratado pelo tipo correspondente). O PSTI tem regime próprio de credenciamento (Res. BCB 498/2025). Sem autorização, nenhuma das normas de controles internos o alcança por força própria.\", \"regime\": \"Nenhuma por força própria; obrigações derivadas por contrato da instituição contratante\", \"regime_id\": \"bcb-res-494-498-2025\", \"riscos_norma\": \"Nenhuma própria; o contratante responde pelo risco de terceiro (Res. 198, art. 15, XVII e XVIII; Res. 265, art. 35, I e II; Res. 4.557, art. 33, I e II)\", \"riscos_id\": \"bcb-res-198-2022\", \"controles_antifraude\": {\"O que o contrato com a instituição regulada tem de carregar (Res. 198, art. 15, §1º; Res. 265, art. 35, §2º; Res. 201, art. 23, §1º; Res. 4.557, art. 33, §1º)\": [\"Cumprir os controles de segurança e de pagamento que a norma impõe ao contratante\", \"Dar à contratante acesso aos dados e informações sobre os serviços prestados\", \"Dar ao BCB acesso aos termos firmados, à documentação e às dependências do contratado\", \"Ter política de continuidade de negócios (Res. 201, art. 23, §1º, I)\", \"Constar das políticas de terceirização e seleção de prestadores do contratante, com cláusulas mínimas\"], \"PSTI — Res. BCB 498/2025 (ficha em bloco 494-498)\": [\"Diretores de segurança e de riscos/compliance; comitê de crises\", \"Gestão de riscos e política de fraudes com monitoramento 24/7\", \"Plano de saída ordenada\", \"Seguro de responsabilidade civil e riscos operacionais com cobertura mínima do BCB (art. 3º, XIII)\"]}, \"conexas\": [[\"Cibersegurança e nuvem\", \"Res. BCB 85/2021 e Res. CMN 4.893/2021 (como contratado relevante)\", \"bcb-res-85-2021\", \"Requisitos de contratação que a instituição regulada deve impor ao provedor\"], [\"Credenciamento PSTI\", \"Res. BCB 498/2025 (alterada pela 547/2026)\", \"bcb-res-494-498-2025\", \"Credenciamento para acesso à RSFN; limites de R$ 15 mil para quem usa PSTI não credenciado (Res. 496 e 497)\"]], \"diretores\": [\"Nenhum diretor designado perante o BCB pelas normas de controles internos; o PSTI tem diretores próprios pela Res. 498\"], \"prazos\": [\"PSTI em funcionamento: pedido de credenciamento em até 4 meses da Res. 498 (art. 37, §3º)\", \"Limites transacionais de R$ 15 mil para participantes via PSTI não credenciado (Res. 496/497, efeitos em 2026)\"], \"notas\": [\"Pela Res. BCB 436, art. 2º, II, b, 2, uma IP não autorizada que integre conglomerado de IPs entra no perímetro prudencial do Tipo 2 pelo grupo.\", \"A exposição real do BaaS é regressiva: o contratante responde ao BCB e cobra do provedor.\"], \"fontes\": [\"bcb-res-494-498-2025\", \"bcb-res-198-2022\", \"bcb-res-265-2022\", \"bcb-res-85-2021\", \"escopo-controles-internos\"], \"rotulo\": [\"BaaS\", \"Infra / PSTI\"]}, {\"id\": \"embedded\", \"nome\": \"Embedded finance e marketplace\", \"resumo\": \"Empresa não autorizada que oferece conta, cartão ou crédito dentro do próprio produto, sob licença de parceiro regulado.\", \"enquadramento\": \"Não é instituição autorizada. Fora da 4.968 e da 260 por força própria. O parceiro licenciado (IP sob a 260 ou IF sob a 4.968) responde ao BCB pelo serviço que roda sob sua licença e deve avaliar o risco do grupo e de terceiros (art. 5º, II, a; Res. 198, art. 15, XVII e XVIII).\", \"regime\": \"Nenhuma por força própria; o parceiro regulado carrega a obrigação\", \"regime_id\": \"escopo-controles-internos\", \"riscos_norma\": \"Nenhuma própria; o parceiro responde pela terceirização e pelo risco de terceiro\", \"riscos_id\": \"bcb-res-198-2022\", \"controles_antifraude\": {\"O que o parceiro regulado vai exigir por contrato (derivado das normas dele)\": [\"Identificação e autenticação do usuário final conforme os controles do parceiro\", \"Rastreabilidade das transações originadas na plataforma\", \"Mecanismos de monitoramento e bloqueio de transações suspeitas, ou integração aos do parceiro\", \"Proteção de dados e credenciais; segregação de ambientes\", \"Acesso do parceiro e do BCB a dados, documentação e dependências\", \"Continuidade de negócios compatível com o plano do parceiro\", \"Participação no compartilhamento de indícios de fraude por meio do parceiro (Res. Conjunta 6)\"]}, \"conexas\": [[\"Relacionamento com clientes\", \"Res. BCB 155/2021 ou Res. CMN 4.949/2021, via parceiro\", \"bcb-res-552-2026\", \"Princípios de relacionamento com usuários aplicados ao canal do marketplace pelo parceiro\"], [\"Proteção de dados\", \"LGPD\", \"hub-anpd-lgpd\", \"Controlador ou operador conforme o desenho do serviço\"]], \"diretores\": [\"Nenhum perante o BCB\"], \"prazos\": [\"Nenhum próprio; os do parceiro (ver tipo correspondente)\"], \"notas\": [\"Operar sem autorização quando a atividade exigiria é o risco de enquadramento (Res. 80, art. 9º, redação da 494/2025: toda IP precisa de autorização prévia).\", \"Responsabilidade solidária perante o consumidor independe da regulação do BCB.\"], \"fontes\": [\"bcb-res-80-2021\", \"bcb-res-494-498-2025\", \"escopo-controles-internos\"], \"rotulo\": [\"Embedded\", \"finance\"]}, {\"id\": \"vasp\", \"nome\": \"VASP · Prestadora de serviços de ativos virtuais\", \"resumo\": \"Custódia, intermediação e negociação de criptoativos.\", \"enquadramento\": \"Autorizada pelo BCB (Lei 14.478/2022). Entrou na Res. 260 e nas conexas pela Res. 552/2026 (5/3/2026). Tipo 3 pela Res. BCB 580/2026 (436, art. 2º, III, a): S2 a S4 → Res. 265; S5 optante → Res. 201.\", \"regime\": \"Res. BCB 260/2022, art. 1º, VI (incluído pela 552)\", \"regime_id\": \"bcb-res-260-2022\", \"riscos_norma\": \"Tipo 3 S2–S4: Res. BCB 265/2022 · Tipo 3 S5 optante: Res. BCB 201/2022\", \"riscos_id\": \"bcb-res-265-2022\", \"controles_antifraude\": {\"Tipo 3 S2–S4 — Res. 265, arts. 18 e 35\": [\"Políticas de terceirização e seleção de prestadores com cláusulas mínimas (art. 35, I)\", \"Recursos para avaliar e monitorar o risco de terceiros relevantes (II)\", \"Governança de TI consistente com a RAS (III)\", \"Sistemas e infraestrutura de TI com integridade, segurança e disponibilidade; proteção de redes contra ataques; rastreio e restrição de acesso; monitoramento de falhas e reclamações; adequação ao modelo de negócio (IV, a a e)\", \"Base de dados de risco operacional com coleta tempestiva, classificação de perdas e análise de causa raiz (V; art. 36)\", \"Análises de cenários de eventos raros e severos (VI; S3 e S4 dispensados)\", \"Revisão das medidas de segurança após falhas e antes de mudanças (VII)\", \"Relatórios com procedimentos de correção (VIII)\", \"Testes de robustez das medidas de segurança (IX)\", \"Segregação de ambientes de desenvolvimento, teste e produção (X)\", \"Para atividades de pagamento: identificação do usuário; rastreabilidade; monitoramento e bloqueio de suspeitas; filtros de alto risco; notificação; verificação pelo usuário; subcredenciador; falhas de iniciação (§1º, I a VIII)\", \"Contratos de TI obrigam o contratado a cumprir IV, VII a X e §1º, com acesso da contratante e do BCB (§2º)\", \"Continuidade de negócios: análise de impacto, estratégias, planos com prazos de reinício e comunicação, testes periódicos, inclusive para terceiros (art. 18)\", \"Capacitação sobre risco operacional (art. 38)\", \"Relatórios gerenciais com perdas operacionais relevantes (art. 37)\"], \"Tipo 3 S5 — Res. 201, art. 23 (o §3º só se prestar serviço de pagamento)\": [\"Critérios de terceirização e seleção de prestadores (art. 23, I)\", \"Avaliação e monitoramento do risco de terceiros relevantes (II)\", \"Infraestrutura de TI com integridade, segurança e disponibilidade (III)\", \"Política de continuidade de negócios com processos críticos, estratégias e plano de reinício (IV e §2º)\", \"Contratos de TI com continuidade do contratado, acesso da contratante e do BCB (§1º)\", \"Só para quem presta serviço de pagamento (§3º, I a XVII): proteção de dados e redes; rastreio de acesso; monitoramento de falhas e reclamações; revisão pós-falha; relatórios de correção; testes; segregação de ambientes; identificação e autenticação; rastreabilidade; monitoramento e bloqueio de suspeitas; filtros de alto risco; notificação; verificação pelo usuário; subcredenciador; falhas de iniciação\", \"Capacitação sobre risco operacional (art. 24)\"]}, \"conexas\": [[\"Compliance\", \"Res. BCB 65/2021\", \"bcb-res-65-2021\", \"Política aprovada pelo conselho; função segregada da auditoria interna; relatório anual; guarda de 5 anos\"], [\"Auditoria interna\", \"Res. BCB 93/2021\", \"bcb-res-93-2021\", \"Unidade subordinada ao conselho; plano anual baseado em risco; relatório anual e de acompanhamento; chefe comunicado ao BCB\"], [\"Cibersegurança e nuvem\", \"Res. BCB 85/2021\", \"bcb-res-85-2021\", \"Política de segurança cibernética; plano de resposta a incidentes; requisitos de contratação de nuvem\"], [\"Fraude (compartilhamento)\", \"Res. Conjunta 6/2023 + Res. BCB 343/2023\", \"bcb-res-343-2023\", \"Sistema de registro e consulta de indícios de fraude; prazos; declaração de conformidade\"], [\"Qualidade da informação\", \"Res. Conjunta 18/2025 + art. 5º, IV, i, da 260\", \"resolucao-conjunta-18-2025\", \"Política em documento próprio até 31/12/2026; testes prévios; relatório semestral; diretor designado\"], [\"PLD/FT\", \"Circular 3.978/2020\", \"bcb-circular-3978-2020\", \"Política, procedimentos e controles de PLD/FT, com avaliação interna de risco\"]], \"diretores\": [\"Diretor de controles internos (Res. 260, art. 10)\", \"CRO (Res. 265, art. 52) ou diretor da estrutura simplificada (Res. 201, art. 35)\", \"Diretor de qualidade da informação (Res. Conjunta 18, art. 5º; prazo próprio para VASP em adequação)\", \"Chefe da auditoria interna (Res. 93, art. 5º)\"], \"prazos\": [\"Compartilhamento de fraude para serviços de ativos virtuais até 30/10/2026 (Res. 343, art. 13-A)\", \"Qualidade da informação: prazo da regulamentação de adequação (Res. Conjunta 18, art. 12, parágrafo único)\", \"Controles internos, compliance, auditoria interna, ouvidoria, relacionamento e remuneração desde 5/3/2026 (Res. 552)\"], \"notas\": [\"Controles físicos de ativos de valor (art. 5º, III, d) ganham peso próprio: custódia de chaves.\", \"Regime de autorização e adequação das VASPs (Lei 14.478, art. 9º) não lido nesta base.\"], \"fontes\": [\"bcb-res-552-2026\", \"bcb-res-260-2022\", \"bcb-res-265-2022\", \"bcb-res-201-2022\", \"bcb-res-436-2024\", \"bcb-res-343-2023\", \"escopo-controles-internos\"], \"rotulo\": [\"VASP\", \"Ativos virtuais\"]}, {\"id\": \"open-finance\", \"nome\": \"ITP e participantes do Open Finance\", \"resumo\": \"Iniciadora de transação de pagamento (modalidade de IP) e instituições que compartilham dados ou recebem iniciação.\", \"enquadramento\": \"ITP é instituição de pagamento (Res. 80, art. 3º, IV) com autorização obrigatória (art. 9º); pode executar iniciação sem redirecionamento como atividade especial (art. 4º-A). Tipo 2 se singular. Os demais participantes seguem o regime do seu próprio tipo (IF ou IP).\", \"regime\": \"Res. BCB 260/2022 (ITP); para os demais participantes, a norma do tipo próprio\", \"regime_id\": \"bcb-res-260-2022\", \"riscos_norma\": \"ITP Tipo 2: Res. BCB 198/2022, com o inciso XX do art. 15 (falhas de iniciação)\", \"riscos_id\": \"bcb-res-198-2022\", \"controles_antifraude\": {\"ITP — Res. 198, art. 15\": [\"Plano de contingência e mecanismos de continuidade dos serviços de pagamento (I)\", \"Proteção e segurança dos dados armazenados, processados ou transmitidos (II)\", \"Proteção de redes, sítios, servidores e canais contra ataques (III)\", \"Monitorar, rastrear e restringir acesso a dados sensíveis, redes, sistemas, bases e módulos de segurança (IV)\", \"Monitoramento das falhas de segurança e das reclamações dos usuários (V)\", \"Revisão das medidas de segurança após falhas e antes de mudanças (VI)\", \"Relatórios com procedimentos de correção de falhas (VII)\", \"Testes de robustez e efetividade das medidas de segurança (VIII)\", \"Segregação de funções entre desenvolvimento, teste e produção (IX)\", \"Identificação adequada do usuário final (X)\", \"Autenticação dos usuários e autorização das transações (XI)\", \"Rastreabilidade de todas as transações de pagamento (XII)\", \"Monitoramento e autorização para prevenir fraude, detectar e bloquear transações suspeitas tempestivamente (XIII)\", \"Avaliações e filtros para transações de alto risco (XIV)\", \"Notificação ao usuário de não execução de transação (XV)\", \"Mecanismo para o usuário verificar a execução correta (XVI)\", \"Critérios de terceirização e seleção de prestadores, com cláusulas mínimas (XVII)\", \"Avaliação e monitoramento do risco operacional de terceiros relevantes (XVIII)\", \"Gestão do risco de subcredenciador na liquidação, no caso de credenciadora (XIX)\", \"Monitoramento e controle de falhas de iniciação: não autorizada, não executada, incorreta, atrasada (XX)\", \"Contrato de terceirização de segurança obriga o contratado a cumprir o art. 15 e dar acesso à contratante (§1º)\", \"Capacitação de empregados e terceirizados relevantes sobre risco operacional (§2º)\"], \"Vedações próprias do ITP — Res. 80, art. 4º\": [\"Não armazenar credenciais suficientes para autenticar a transação perante a detentora da conta (I)\", \"Não exigir dados além dos necessários (II)\", \"Não usar, armazenar ou acessar dados para outra finalidade (III)\", \"Não alterar montante ou elemento da transação autorizada (IV)\", \"Não iniciar transação em conta de instituição fora do SPB (V)\", \"Se presta nuvem ou processamento a autorizadas: observar cibersegurança, PLD e Open Finance (parágrafo único)\"]}, \"conexas\": [[\"Compliance\", \"Res. BCB 65/2021\", \"bcb-res-65-2021\", \"Política aprovada pelo conselho; função segregada da auditoria interna; relatório anual; guarda de 5 anos\"], [\"Auditoria interna\", \"Res. BCB 93/2021\", \"bcb-res-93-2021\", \"Unidade subordinada ao conselho; plano anual baseado em risco; relatório anual e de acompanhamento; chefe comunicado ao BCB\"], [\"Cibersegurança e nuvem\", \"Res. BCB 85/2021\", \"bcb-res-85-2021\", \"Política de segurança cibernética; plano de resposta a incidentes; requisitos de contratação de nuvem\"], [\"Fraude (compartilhamento)\", \"Res. Conjunta 6/2023 + Res. BCB 343/2023\", \"bcb-res-343-2023\", \"Sistema de registro e consulta de indícios de fraude; prazos; declaração de conformidade\"], [\"Qualidade da informação\", \"Res. Conjunta 18/2025 + art. 5º, IV, i, da 260\", \"resolucao-conjunta-18-2025\", \"Política em documento próprio até 31/12/2026; testes prévios; relatório semestral; diretor designado\"], [\"PLD/FT\", \"Circular 3.978/2020\", \"bcb-circular-3978-2020\", \"Política, procedimentos e controles de PLD/FT, com avaliação interna de risco\"], [\"Governança da IP\", \"Res. BCB 80/2021, art. 6º\", \"bcb-res-80-2021\", \"Política de governança aprovada pelo conselho ou diretoria, revisada a cada dois anos\"], [\"Open Finance\", \"Res. Conjunta 1/2020 e Res. BCB 32/2020 (stubs)\", \"resolucao-conjunta-1-2020\", \"Consentimento, APIs, responsabilidade na cadeia\"]], \"diretores\": [\"Diretor de controles internos (Res. 260, art. 10)\", \"Diretor de riscos (Res. 198, art. 23 / Res. 265, art. 52, CRO / Res. 201, art. 35)\", \"Diretor de qualidade da informação (Res. Conjunta 18, art. 5º)\", \"Chefe da auditoria interna comunicado ao BCB (Res. 93, art. 5º)\", \"Diretor de segurança cibernética (Res. 85) e de PLD (Circular 3.978) — conferir nas fichas\"], \"prazos\": [\"Diretor de controles internos exigível desde 1º/1/2024 (Res. 260, art. 13, I)\", \"Estrutura de riscos vigente desde 1º/7/2023 (Res. 198/201/265)\", \"Política de qualidade da informação até 31/12/2026 (Res. Conjunta 18, art. 12)\", \"Compartilhamento de fraude: VASPs até 30/10/2026; bets até 1º/12/2026 (Res. 343, art. 13-A)\", \"Comunicação prévia de 90 dias ao BCB para iniciação sem redirecionamento (Res. 80, art. 4º-A)\"], \"notas\": [\"Falhas de iniciação segregadas em quatro eventos (não autorizada, não executada, incorreta, atrasada) são controle nominado na 198, na 265 e na 201.\"], \"fontes\": [\"bcb-res-80-2021\", \"bcb-res-260-2022\", \"bcb-res-198-2022\", \"resolucao-conjunta-1-2020\", \"escopo-controles-internos\"], \"rotulo\": [\"ITP\", \"Open Finance\"]}]}\n```\n\n## Fichamento (operador, 2026-10-29)\n\n### Aplicação prática no ciclo Rastro\n\nFundamental\n\n### Lacunas\n\nNenhuma apontada no fichamento.\n"}], "resumo": {"fichas": 85, "fichadas": 56, "a_fichar": 29}, "cartoes": [{"id": "med2-prazo-obrigatorio", "norma": "Resolução BCB nº 493/2025", "pergunta": "A partir de que data a recuperação de valores do MED 2.0 passou a ser de implementação obrigatória, e para quais modalidades de participantes do Pix?", "resposta": "A partir de 2 de fevereiro de 2026, para os participantes nas modalidades provedor de conta transacional e liquidante especial (art. 121 do regulamento do Pix, na redação da Resolução BCB nº 493/2025; efeitos cf. art. 4º, I). A implementação facultativa foi possível desde 23 de novembro de 2025.", "fonte": "Resolução BCB nº 493/2025, arts. 4º, I e 121 (DOU 29/08/2025, S.1, p. 187)"}, {"id": "med2-dispensa-apuracao", "norma": "Resolução BCB nº 546/2026", "pergunta": "A obrigatoriedade do MED 2.0 é de 2/2/2026. A partir de que data o descumprimento do art. 121 fica sujeito a processo de apuração, e por quê?", "resposta": "A partir de 11 de maio de 2026. O art. 113-A do regulamento do Pix, incluído pela Resolução BCB nº 546/2026, dispensa a instauração do processo de apuração para os descumprimentos relacionados ao art. 121 ocorridos entre 2 de fevereiro de 2026 e 10 de maio de 2026. A obrigação não mudou de data; 11/5 é o dia seguinte ao termo final e não está escrito na norma. A data de \"11/6/2026\" segue NAO_CONFIRMADO.", "fonte": "Resolução BCB nº 546/2026, art. 1º; regulamento do Pix, art. 113-A (DOU 23/01/2026, S.1, p. 72)"}, {"id": "med2-o-que-e-recuperacao", "norma": "Resolução BCB nº 493/2025", "pergunta": "O que é a \"recuperação de valores\" criada pelo MED 2.0 e quem a instaura?", "resposta": "Procedimento de rastreamento, de bloqueio e de devolução de valores no âmbito do Pix decorrente de suspeita de fraude na transação (art. 54, XII do regulamento do Pix). É instaurada pelo PSP do pagador, após reclamação do usuário, mediante fundada suspeita de fraude (art. 78-N).", "fonte": "Resolução BCB nº 493/2025 (DOU 29/08/2025), regulamento do Pix, arts. 54, XII e 78-N"}, {"id": "seguranca-cibernetica-adequacao", "norma": "Resolução BCB nº 538/2025", "pergunta": "Até quando as instituições em funcionamento devem se adequar às novas exigências de segurança cibernética da Resolução BCB nº 538/2025, e qual norma ela altera?", "resposta": "Até 1º de março de 2026 (art. 2º). Ela altera a Resolução BCB nº 85/2021 (política de segurança cibernética e contratação de processamento, armazenamento de dados e nuvem por IPs, corretoras e distribuidoras).", "fonte": "Resolução BCB nº 538/2025, art. 2º (DOU 22/12/2025, S.1, p. 448)"}, {"id": "anpd-prazo-comunicacao", "norma": "Resolução CD/ANPD nº 15/2024", "pergunta": "Qual o prazo para o controlador comunicar um incidente de segurança à ANPD e qual o termo inicial da contagem?", "resposta": "Três dias úteis, contados do conhecimento pelo controlador de que o incidente afetou dados pessoais, ressalvado prazo de legislação específica (art. 6º, caput e §1º, do Regulamento aprovado pela Resolução CD/ANPD nº 15/2024, que regulamenta o art. 48 da Lei nº 13.709/2018).", "fonte": "Resolução CD/ANPD nº 15/2024, art. 6º (DOU 26/04/2024, S.1, p. 114)"}, {"id": "anpd-registro-incidentes", "norma": "Resolução CD/ANPD nº 15/2024", "pergunta": "Incidentes de segurança que NÃO foram comunicados à ANPD precisam ser registrados? Por quanto tempo?", "resposta": "Sim. O controlador deve manter registro de todos os incidentes, inclusive dos não comunicados, por prazo mínimo de cinco anos contado da data do registro, com conteúdo mínimo (data de conhecimento, circunstâncias etc.).", "fonte": "Resolução CD/ANPD nº 15/2024, Regulamento de Comunicação de Incidente (DOU 26/04/2024)"}, {"id": "sumula-479-enunciado", "norma": "Súmula 479 do STJ", "pergunta": "Qual é o enunciado literal da Súmula 479 do STJ e qual a fronteira de defesa que ela deixa aberta?", "resposta": "\"As instituições financeiras respondem objetivamente pelos danos gerados por fortuito interno relativo a fraudes e delitos praticados por terceiros no âmbito de operações bancárias\" (Segunda Seção, j. 27/06/2012, DJe 1º/08/2012). A defesa gira em torno de caracterizar fortuito externo ou culpa exclusiva da vítima/terceiro (CDC, art. 14, §3º).", "fonte": "STJ, Súmula 479, Segunda Seção, DJe 1º/08/2012"}, {"id": "pacote-494-limite-pix", "norma": "Resoluções BCB nº 494-498/2025", "pergunta": "Qual limite por transação Pix foi imposto pela Resolução BCB nº 496/2025 e a quem ele se aplica?", "resposta": "R$ 15.000,00 por transação, aplicável a IPs não autorizadas e a participantes conectados à RSFN por meio de PSTI não credenciado. O limite é afastável mediante credenciamento do PSTI e relatório de asseguração de auditoria independente. (A Res. 497 impõe vedação análoga para TED.)", "fonte": "Resolução BCB nº 496/2025 (DOU Extra 169-A, 05/09/2025, S.1)"}, {"id": "pacote-498-seguro", "norma": "Resoluções BCB nº 494-498/2025", "pergunta": "Que exigência de seguro a Resolução BCB nº 498/2025 impõe aos PSTIs credenciados para acesso à RSFN?", "resposta": "Comprovação de contratação de seguro de responsabilidade civil e de riscos operacionais, com cobertura mínima definida pelo BCB, incluindo incidentes de fraude e de segurança cibernética (art. 3º, XIII, texto consolidado). O requisito sobreviveu à Resolução BCB 547/2026, que revogou o inciso XIV (plano de continuidade) e abrandou outros requisitos do credenciamento.", "fonte": "Resolução BCB nº 498/2025, art. 3º, XIII (DOU Extra 169-A, 05/09/2025; consolidado bcb.gov.br)"}, {"id": "cnj-615-estrutura", "norma": "Resolução CNJ nº 615/2025", "pergunta": "Como a Resolução CNJ nº 615/2025 classifica as soluções de IA no Judiciário e o que ela revogou?", "resposta": "Classifica por risco: alto risco (AR1-AR5 — ex.: valoração de provas, reconhecimento facial) e baixo risco (BR1-BR8), com supervisão humana, auditoria via Plataforma Sinapses (PDPJ-Br) e comunicação de eventos adversos em até 72h. Revogou integralmente a Resolução CNJ nº 332/2020.", "fonte": "Resolução CNJ nº 615/2025 (DJe/CNJ nº 54, 14/03/2025, p. 2-17)"}, {"id": "anpd-risco-relevante", "norma": "Resolução CD/ANPD nº 15/2024", "pergunta": "Quando um incidente envolvendo dados financeiros exige comunicação à ANPD?", "resposta": "Quando houver risco ou dano relevante: afetação significativa a interesses e direitos fundamentais E, cumulativamente, ao menos um critério do art. 5º — entre eles dados financeiros, dados sensíveis, dados de autenticação em sistemas ou dados em larga escala. Dado financeiro sozinho não basta: é preciso o requisito da afetação significativa.", "fonte": "Resolução CD/ANPD nº 15/2024, art. 5º do Regulamento (DOU 26/04/2024)"}], "trilha": {"titulo": "Trilha — do zero à referência em fraude e incidentes", "descricao": "Oito lições em quatro blocos. Cada uma começa com a explicação que você daria a um adolescente, desce ao detalhe técnico com fonte, e termina mostrando onde aquilo entra no ciclo Rastro (prontidão → war room → recuperação/defesa). Faça na ordem: cada lição usa a anterior.", "blocos": ["O tabuleiro", "O ataque e o resgate", "As regras do jogo", "O war room e a referência"], "licoes": [{"id": "l1-tabuleiro", "bloco": "O tabuleiro", "titulo": "1. O mapa do dinheiro instantâneo — quem é quem no Pix", "analogia": "Imagine o dinheiro como passageiros num metrô que funciona 24h e leva qualquer pessoa a qualquer estação em segundos. O **Pix** é esse metrô. Quem opera as estações são os **PSPs** (prestadores de serviço de pagamento): bancos e **instituições de pagamento** (as fintechs de conta digital). Quem desenhou o metrô, faz as regras e vigia tudo é o **Banco Central (BCB)**. Existe um catálogo gigante de endereços — o **DICT** — que traduz uma chave (celular, e-mail, CPF) na conta de destino. E os trilhos por onde as mensagens entre instituições correm formam a **RSFN**, a rede do sistema financeiro; algumas instituições nem se conectam direto aos trilhos: contratam uma empresa de tecnologia, o **PSTI**, para se conectar por elas.", "tecnica": "O arranjo Pix foi instituído pela Resolução BCB nº 1/2020, que aprova o seu regulamento (norma-base ainda não fichada no repositório — está na fila). Participantes atuam em modalidades distintas: **provedor de conta transacional** (mantém a conta do usuário) e **liquidante especial**, entre outras — a distinção importa porque as obrigações do MED 2.0 recaem sobre essas modalidades. O DICT tem manual operacional próprio, atualizado por instruções normativas (a IN BCB 752/2026, capturada pelo monitor, divulga a versão 8.4). O acesso à RSFN via PSTI passou a ser regulado com força em 2025, depois de incidentes na cadeia de tecnologia — é o pacote da lição 6.", "fontes": ["Resolução BCB nº 1/2020 (regulamento do Pix) — a fichar", "IN BCB 752/2026 (Manual DICT 8.4) — a fichar, capturada pelo monitor", "Ficha [[bcb-res-494-498-2025]] (PSTI e RSFN)"], "rastro": "Todo diagnóstico começa perguntando: o cliente é o quê nesse mapa? IP autorizada ou não? Provedor de conta transacional? Conecta-se à RSFN direto ou via PSTI? Cada resposta muda o conjunto de obrigações — e o tamanho da exposição.", "verificar": "Abra a ficha [[bcb-res-494-498-2025]] e identifique qual resolução do pacote trata do seu tipo de cliente.", "atencao": ""}, {"id": "l2-golpe", "bloco": "O tabuleiro", "titulo": "2. Anatomia de um golpe — engenharia social e contas-laranja", "analogia": "O golpista quase nunca 'hackeia o banco'. Ele hackeia a **pessoa**: liga fingindo ser o gerente, cria pânico ('sua conta foi invadida, transfira tudo para a conta segura'), ou vende um produto falso. A vítima mesma faz o Pix — é a **engenharia social**. Do outro lado, o dinheiro não para na conta do golpista: em minutos ele é fatiado e repassado por uma corrente de **contas-laranja** (contas de pessoas que alugam ou vendem seus dados), como uma nota roubada trocada de mão em mão até ninguém saber de onde veio. Isso se chama **pulverização** — e é uma corrida contra o relógio: cada minuto, o dinheiro está mais espalhado.", "tecnica": "Juridicamente, a engenharia social cria o problema central da responsabilidade: a transação foi autenticada pela própria vítima, então a discussão se desloca para saber se a instituição **deveria ter detectado e barrado** o padrão anômalo (horário, valor, destinatário novo, sequência rápida — sinais que os motores antifraude pontuam). A cadeia de laranjas é o que o rastreio multi-salto do MED 2.0 ataca (lição 3). E a fronteira entre 'falha de segurança do banco' e 'culpa exclusiva da vítima' é exatamente o campo de batalha da Súmula 479 (lição 7).", "fontes": ["Ficha [[bcb-res-493-2025]] (contexto do MED 2.0)", "Ficha [[stj-sumula-479]] (moldura de responsabilidade)"], "rastro": "No benchmark e no diagnóstico, a pergunta é dupla: que sinais o motor antifraude do cliente captura ANTES do Pix sair, e com que velocidade o time reage quando a vítima liga? As duas respostas viram prova no contencioso.", "verificar": "No simulador ('Fraude Pix na madrugada'), repare como a decisão 1 pune quem espera: a pulverização é o motivo.", "atencao": ""}, {"id": "l3-med", "bloco": "O ataque e o resgate", "titulo": "3. O resgate — MED e MED 2.0, o rastreio em múltiplos saltos", "analogia": "Pense num alarme de banco ligado à polícia da cidade inteira. Quando a vítima reporta o golpe, o PSP dela aciona o **MED** (Mecanismo Especial de Devolução): um pedido formal de congelar o dinheiro onde ele estiver. O MED original só conseguia congelar na PRIMEIRA conta de destino — se o dinheiro já tinha pulado adiante, acabou. O **MED 2.0** (Resolução BCB 493/2025) deu visão de raio-X: o sistema **segue os saltos** do dinheiro pela corrente de laranjas, congela o que encontrar em cada conta e devolve por partes — R$ 3 mil que sobraram numa conta, R$ 9 mil noutra. Não garante tudo de volta; garante que a velocidade do acionamento importa mais do que nunca.", "tecnica": "A Res. BCB 493/2025 define a **recuperação de valores** como procedimento de rastreamento, bloqueio e devolução decorrente de suspeita de fraude (art. 54, XII do regulamento do Pix). Instauração: pelo **PSP do pagador**, após **reclamação do usuário** e mediante **fundada suspeita de fraude** — requisitos cumulativos do art. 78-N; boletim de ocorrência NÃO é requisito. Datas (art. 121): facultativa desde **23/11/2025**, obrigatória desde **02/02/2026** para provedores de conta transacional e liquidantes especiais. A Res. BCB 546/2026 incluiu o art. 113-A no regulamento: dispensada a apuração dos descumprimentos do art. 121 ocorridos de **02/02/2026 a 10/05/2026**; a obrigação não mudou de data e a apuração alcança os descumprimentos a partir de **11/05/2026**. O detalhamento operacional (número de saltos, janelas) mora no Manual do DICT, não na resolução.", "fontes": ["Ficha [[bcb-res-493-2025]] — Res. BCB 493/2025, arts. 54, XII, 78-N e 121 (DOU 29/08/2025, S.1, p. 187)", "Ficha [[bcb-res-546-2026]] — Res. BCB 546/2026, art. 113-A do regulamento do Pix (DOU 23/01/2026, S.1, p. 72)"], "rastro": "É o coração do war room: o playbook precisa garantir canal de reclamação 24/7, formação documentada da 'fundada suspeita' em minutos e acionamento imediato. Cada passo com hora registrada — isso vira a prova de diligência da fase de defesa.", "verificar": "Roteiro socrático 'med2-rastreio' (5 perguntas) e os cartões de revisão do MED.", "atencao": "A data de 'produção plena em 11/6/2026' que circula na imprensa NÃO consta do texto oficial — está como NAO_CONFIRMADO na ficha. Não a use em entregável até haver fonte primária. A data com lastro primário é 11/05/2026, dia seguinte ao fim da dispensa de apuração (Res. BCB 546/2026); nenhuma fonte relaciona as duas datas."}, {"id": "l4-anpd", "bloco": "O ataque e o resgate", "titulo": "4. O outro relógio — dados pessoais e a ANPD", "analogia": "No mesmo incidente, dois relógios correm em paralelo. O primeiro é o do dinheiro (lição 3). O segundo é o dos **dados**: se o golpe envolveu vazamento de informações (senha, CPF, cadastro), existe uma autoridade — a **ANPD** — que precisa ser avisada em até **3 dias úteis**. Mas atenção ao detalhe que derruba os desavisados: o relógio NÃO começa quando o hacker invadiu, nem quando o cliente ligou. Começa quando a empresa **toma conhecimento de que dados pessoais foram afetados**. E mesmo quando se decide NÃO avisar, é obrigatório escrever a decisão num 'livro de registro' e guardar por 5 anos — não registrar é como rasgar a prova da própria inocência.", "tecnica": "Resolução CD/ANPD nº 15/2024 (regulamenta o art. 48 da LGPD): comunicação em **3 dias úteis** contados do conhecimento pelo controlador de que o incidente afetou dados pessoais (art. 6º, caput e §1º). O dever só existe se houver **risco ou dano relevante** — teste CUMULATIVO do art. 5º: afetação significativa a direitos E ao menos um critério objetivo (dados sensíveis, de crianças/idosos, financeiros, de autenticação, sob sigilo, ou larga escala). Registro de TODOS os incidentes, inclusive não comunicados, por mínimo de **5 anos**, com conteúdo mínimo.", "fontes": ["Ficha [[anpd-res-cd-15-2024]] — Res. CD/ANPD 15/2024 (DOU 26/04/2024, S.1, p. 114)", "Lei nº 13.709/2018 (LGPD), art. 48"], "rastro": "No war room, a primeira hora inclui registrar formalmente QUANDO o conhecimento se formou — é o marco zero do prazo. A decisão comunicar/não comunicar, fundamentada por escrito, é das primeiras do playbook e prova central em fiscalização.", "verificar": "Roteiro socrático 'anpd-incidente' e a decisão 5 do simulador (a reviravolta da perícia testa exatamente o termo inicial).", "atencao": ""}, {"id": "l5-cyber", "bloco": "As regras do jogo", "titulo": "5. A muralha exigida — segurança cibernética (Res. 85/2021 + 538/2025)", "analogia": "O BCB não espera o ataque para cobrar: ele exige que cada instituição construa a muralha ANTES. A Resolução 85/2021 é o projeto da muralha — política de segurança cibernética formal, regras para usar computação em nuvem, plano para agir em crise. A Resolução 538/2025 veio depois dos ataques recentes e disse: a muralha precisa ficar mais alta, e vocês têm até **1º de março de 2026** para reformar. Entre os reforços: **testes de intrusão** (contratar alguém para tentar invadir você mesmo e documentar o que achou) e critérios escritos do que configura uma crise.", "tecnica": "Res. BCB 538/2025 (DOU 22/12/2025) altera a Res. BCB 85/2021; escopo: instituições de pagamento, corretoras/distribuidoras de TVM e corretoras de câmbio. Adequação até 1º/3/2026 (art. 2º). Amostra das obrigações: ampliação dos controles mínimos do art. 3º da Res. 85; documentação dos critérios de configuração de crise (art. 20, p.u.); testes de intrusão com resultados documentados e planos de correção (art. 22-A, III). O texto consolidado da Res. 85/2021 ainda não está fichado — leitura pendente.", "fontes": ["Ficha [[bcb-res-538-2025]] — Res. BCB 538/2025 (DOU 22/12/2025, S.1, p. 448)"], "rastro": "Pura prontidão: o gap entre o que a norma exige e o que o cliente tem É o produto do diagnóstico. E depois do incidente, a muralha documentada define a narrativa perante o BCB — e alimenta a tese de fortuito externo no contencioso.", "verificar": "Cartão 'seguranca-cibernetica-adequacao' na revisão espaçada.", "atencao": "A ficha da Res. 85/2021 consolidada está pendente — as obrigações completas exigem o texto-base, não só a alteração."}, {"id": "l6-perimetro", "bloco": "As regras do jogo", "titulo": "6. O cerco de 2025 — autorização, PSTI e seguro (pacote 494-498)", "analogia": "Depois de incidentes graves envolvendo empresas de tecnologia que conectavam fintechs aos trilhos do sistema, o BCB publicou NUM ÚNICO DIA (5/9/2025, edição extra do DOU) cinco resoluções que fecham o cerco: 1) toda instituição de pagamento passa a precisar de **crachá** (autorização prévia) para operar; 2) os requisitos do crachá ficaram mais duros; 3) quem ainda não tem crachá, ou se conecta por um PSTI sem credenciamento, só pode fazer Pix de até **R$ 15 mil** por transação; 4) o mesmo teto vale para TED; 5) o próprio **PSTI** agora precisa de credenciamento, governança de crise, monitoramento de fraude 24/7 e — a novidade que interessa ao seu nicho — **seguro obrigatório** cobrindo fraude e incidentes cibernéticos.", "tecnica": "Res. 494 (altera Res. 80/2021): autorização prévia; janela de protocolo para IPs pré-existentes de 1º a 31/5/2026. Res. 495 (altera Res. 81/2021): requisitos — capacitação de administradores, capital mínimo, sede física. Res. 496 (altera Res. 1/2020): janela de pedido 1º/1–1º/5/2026 para participantes do Pix; limite de R$ 15 mil afastável com PSTI credenciado + relatório de asseguração. Res. 497 (altera Res. 256/2022): trava análoga na TED. Res. 498 (nova): credenciamento do PSTI — diretores de segurança e riscos, comitê de crises, política de fraude 24/7, plano de saída, seguro de RC e riscos operacionais com cobertura mínima do BCB (art. 17, XIII).", "fontes": ["Ficha [[bcb-res-494-498-2025]] — DOU Extra 169-A, 05/09/2025, S.1"], "rastro": "É o mapa de exposição do cliente fintech/BaaS — e um gancho comercial: as janelas de autorização de 2026 são datas em que o cliente PRECISA de assessoria. O seguro obrigatório do PSTI cria um novo ator no war room: a seguradora.", "verificar": "Cartões 'pacote-494-limite-pix' e 'pacote-498-seguro'.", "atencao": "Os prazos calculados (180 dias, 4 meses) estão marcados como cômputo aritmético a conferir no texto integral."}, {"id": "l7-tribunal", "bloco": "As regras do jogo", "titulo": "7. O tribunal — Súmula 479, fortuito interno x externo e a onda consumerista", "analogia": "Regra de ouro do STJ desde 2012: se o golpe é um **risco do próprio negócio bancário** (o chamado 'fortuito interno' — cartão clonado, conta aberta por fraudador, falha do sistema), a instituição paga MESMO SEM TER CULPA. É responsabilidade objetiva: não adianta dizer 'fizemos tudo certo'. A saída da defesa é provar que o evento foi **fortuito externo** — algo fora do risco do negócio — ou **culpa exclusiva da vítima** (ela entregou a senha ao golpista fora do ambiente do banco). Depois de um incidente com milhares de vítimas, vem a **onda consumerista**: centenas de processos iguais, alguns legítimos, outros fabricados em escala por escritórios que pescam clientes — a **litigância predatória**.", "tecnica": "Súmula 479/STJ (Segunda Seção, j. 27/06/2012, DJe 1º/08/2012): 'As instituições financeiras respondem objetivamente pelos danos gerados por fortuito interno relativo a fraudes e delitos praticados por terceiros no âmbito de operações bancárias.' Base: CDC, art. 14 (precedente de origem: REsp 1.197.929/PR). A defesa opera no art. 14, §3º do CDC (culpa exclusiva da vítima/terceiro). A fronteira em golpes de engenharia social via Pix é o litígio contemporâneo — o mapeamento de acórdãos com número de processo é o próximo passo do dossiê. Para a resposta em escala com IA, a Res. CNJ 615/2025 baliza o que o próprio Judiciário considera uso auditável.", "fontes": ["Ficha [[stj-sumula-479]]", "Ficha [[cnj-res-615-2025]]", "CDC, art. 14"], "rastro": "Fecha o ciclo: tudo que as lições 3-6 mandam documentar existe para ESTE momento. Quem acionou o MED em minutos, comunicou a ANPD no prazo e tem a muralha em dia chega ao processo com a tese de fortuito externo de pé. E a detecção de padrões de litigância predatória (petições idênticas, procurações suspeitas) é onde a governança de IA do escritório entra.", "verificar": "Decisão 4 do simulador e cartão 'sumula-479-enunciado'.", "atencao": "Dossiê de jurisprudência pós-Pix ainda não montado — as fichas de acórdãos virão com número de processo, nunca de resumo de terceiros."}, {"id": "l8-warroom", "bloco": "O war room e a referência", "titulo": "8. O war room e o caminho para ser a referência", "analogia": "Agora junte tudo. Incidente detectado — quem você chama, em que ordem? O war room é uma sala (real ou virtual) com cadeiras definidas ANTES da crise: o **coordenador jurídico** (você — quem entende os dois relógios e fala com BCB, ANPD, seguradora e imprensa jurídica), o **time de fraude** do cliente (aciona o MED), o **CISO/TI**, e os **parceiros de tecnologia** que você traz: forense digital (imagem dos sistemas, cadeia de custódia das evidências), antifraude (telemetria dos dispositivos) e, se houver PSTI ou seguradora, os representantes deles. Ser 'a referência' não é saber tudo de tecnologia — é ser quem REGE a orquestra: sabe qual prazo vence primeiro, o que documentar e quem executa cada parte.", "tecnica": "A estrutura das 72h decorre das lições anteriores: (1ª hora) registrar o conhecimento, acionar recuperação de valores — art. 78-N; (manhã) apuração de dados pessoais e teste do art. 5º da Res. 15/2024, abertura do registro de incidente; (dia 1-3) decisão fundamentada de comunicar ANPD/titulares, preservação forense com cadeia de custódia, narrativa única para reguladores; (semana 1+) preparação da defesa consumerista com a trilha probatória. Os papéis e critérios de convocação devem estar num playbook assinado antes — é o entregável do retainer. A matriz de prazos consolidada ([[hub-matriz-prazos]]) é o instrumento de regência.", "fontes": ["Ficha [[hub-matriz-prazos]]", "Fichas [[bcb-res-493-2025]], [[anpd-res-cd-15-2024]], [[bcb-res-538-2025]], [[stj-sumula-479]]"], "rastro": "É o serviço inteiro: prontidão (benchmark IPR-72 + diagnóstico + playbook), war room (retainer com você na regência e parceiros de tecnologia contratados ou pré-acordados), recuperação/defesa (contencioso da onda + fiscalizações). O estudo contínuo — revisão espaçada diária, um socrático por semana, o simulador uma vez por mês — é o que mantém a autoridade técnica que sustenta o posicionamento público.", "verificar": "Rode o simulador completo tentando 10/10 e depois preencha o IPR-72 imaginando um cliente real.", "atencao": "Prazos operacionais internos do MED (janelas exatas de bloqueio/análise) dependem do Manual do DICT — fichar a IN 752/2026 antes de desenhar o playbook-modelo."}]}, "roteiros": [{"id": "anpd-incidente", "tema": "Comunicação de incidente à ANPD — Resolução CD/ANPD nº 15/2024", "fontes": "Resolução CD/ANPD nº 15/2024 (DOU 26/04/2024, S.1, p. 114); ficha anpd-res-cd-15-2024", "passos": [{"pergunta": "Nem todo incidente de segurança se comunica à ANPD. Qual é o teste do art. 5º do Regulamento para 'risco ou dano relevante'? Atenção à estrutura lógica do dispositivo.", "pontos": ["Estrutura CUMULATIVA: afetação significativa a interesses e direitos fundamentais E ao menos um critério objetivo", "Critérios: dados sensíveis; crianças/adolescentes/idosos; dados financeiros; autenticação em sistemas; sigilo legal/judicial/profissional; larga escala"], "gabarito": "O art. 5º exige cumulação: (1) o incidente pode afetar significativamente interesses e direitos fundamentais dos titulares E (2) envolve ao menos um critério objetivo — dados sensíveis, de crianças/adolescentes/idosos, financeiros, de autenticação, sob sigilo, ou em larga escala. Dado financeiro sozinho não dispara a comunicação: sem a afetação significativa, não há risco relevante."}, {"pergunta": "Qual é o prazo de comunicação e — a parte que decide casos — qual é o termo inicial da contagem?", "pontos": ["Três dias úteis (não corridos)", "Termo inicial: conhecimento pelo CONTROLADOR de que o incidente afetou DADOS PESSOAIS (art. 6º, §1º)", "Ressalva: prazo diverso em legislação específica"], "gabarito": "Três dias úteis, contados do conhecimento pelo controlador de que o incidente afetou dados pessoais (art. 6º, caput e §1º), ressalvado prazo de legislação específica. O relógio não corre da invasão, nem da detecção técnica pelo SOC: corre do momento em que o controlador sabe que dados pessoais foram afetados — por isso o war room precisa registrar com precisão QUANDO esse conhecimento se formou."}, {"pergunta": "O comitê decidiu NÃO comunicar. O trabalho acabou? O que a norma ainda exige e por quanto tempo?", "pontos": ["Registro obrigatório de TODOS os incidentes, inclusive os não comunicados", "Prazo mínimo de cinco anos da data do registro", "Conteúdo mínimo: data de conhecimento, descrição das circunstâncias etc.", "Função defensiva do registro em fiscalização e contencioso"], "gabarito": "Não. O controlador deve registrar todos os incidentes, inclusive os não comunicados, por no mínimo cinco anos da data do registro, com conteúdo mínimo (data de conhecimento, circunstâncias, avaliação). É a fundamentação documentada da decisão de não comunicar que protege a instituição em fiscalização da ANPD e na onda consumerista — a ausência de registro transforma uma decisão defensável em indício de ocultação."}]}, {"id": "med2-rastreio", "tema": "MED 2.0 — o mecanismo de recuperação de valores (rastreio em múltiplos saltos)", "fontes": "Resolução BCB nº 493/2025 (DOU 29/08/2025, S.1, p. 187) e material oficial BCB 'MED 2.0 — Circuito Pix' (Decem/Diseg); ficha bcb-res-493-2025", "passos": [{"pergunta": "Antes da Resolução BCB 493/2025 já existia o MED. O que exatamente a norma acrescentou de novo em termos de conceito jurídico-operacional? Defina 'recuperação de valores' com as suas palavras.", "pontos": ["É um procedimento tripartite: rastreamento + bloqueio + devolução", "Escopo: valores no âmbito do Pix, decorrente de suspeita de fraude na transação", "Tem definição normativa expressa (art. 54, XII do regulamento do Pix)"], "gabarito": "A Resolução 493/2025 inseriu no regulamento do Pix a 'recuperação de valores': procedimento de rastreamento, de bloqueio e de devolução de valores no âmbito do Pix decorrente de suspeita de fraude na transação (art. 54, XII). A novidade conceitual é a fusão das três etapas num procedimento único e interparticipante — o MED original centrava-se na devolução pelo PSP recebedor direto."}, {"pergunta": "Quem instaura o procedimento e qual é o gatilho formal? Cuidado: a resposta tem dois elementos cumulativos.", "pontos": ["Instauração pelo PSP do PAGADOR (não do recebedor)", "Gatilho: reclamação do usuário + fundada suspeita de fraude (art. 78-N)"], "gabarito": "O PSP do pagador instaura a recuperação de valores após reclamação do usuário e mediante fundada suspeita de fraude (art. 78-N do regulamento do Pix, redação da Res. 493/2025). Os dois elementos são cumulativos: a reclamação sozinha não basta sem o juízo de fundada suspeita — e é esse juízo que o playbook do cliente precisa documentar."}, {"pergunta": "Por que o rastreio em múltiplos saltos muda o jogo contra a pulverização em contas-laranja? Descreva como o bloqueio e a devolução operam quando o dinheiro já saiu da primeira conta.", "pontos": ["Fraudador pulveriza o valor em cadeia de contas em minutos — o MED original parava na primeira conta", "O rastreio segue os saltos e o bloqueio ocorre em cadeia, nas contas de destino sucessivas", "A devolução é sequencial e PARCIAL: limitada ao saldo efetivamente bloqueado em cada conta"], "gabarito": "No desenho descrito no material oficial do BCB (Circuito Pix, Decem/Diseg), o rastreio acompanha os saltos do valor fraudado pela cadeia de contas, com bloqueio em cada conta de destino e devoluções sequenciais e parciais conforme o saldo bloqueado em cada uma. Ou seja: a vítima pode recuperar frações vindas de várias contas, e a velocidade do acionamento define quanto ainda há para bloquear. Atenção ao limite da fonte: o detalhamento operacional (número de saltos, janelas) está no Manual Operacional do DICT, não no corpo da resolução — a IN BCB 752/2026 (Manual 8.4) está no repositório com status a_fichar."}, {"pergunta": "Datas: quando a recuperação de valores passou a ser possível e quando passou a ser exigível — e exigível de quem, exatamente?", "pontos": ["Facultativa a partir de 23/11/2025", "Obrigatória a partir de 2/2/2026", "Sujeitos da obrigação: participantes nas modalidades provedor de conta transacional e liquidante especial (art. 121)", "Apuração de descumprimento dispensada para os ocorridos de 2/2/2026 a 10/5/2026 (art. 113-A, Res. BCB 546/2026); a obrigação segue sendo de 2/2/2026"], "gabarito": "Implementação facultativa a partir de 23 de novembro de 2025 e obrigatória a partir de 2 de fevereiro de 2026 para os participantes nas modalidades provedor de conta transacional e liquidante especial (art. 121 do regulamento, redação da Res. 493/2025; efeitos cf. art. 4º, I). Nota de verificabilidade: a data de 'produção plena em 11/6/2026' que circula na imprensa NÃO consta do texto oficial — está como NAO_CONFIRMADO na ficha. Exigível e sancionável são coisas distintas: a Res. BCB 546/2026 (DOU 23/1/2026) incluiu o art. 113-A no regulamento e dispensou a instauração do processo de apuração para os descumprimentos relacionados ao art. 121 ocorridos entre 2 de fevereiro e 10 de maio de 2026; a data com lastro primário é, portanto, 11 de maio de 2026 (dia seguinte ao termo final), e nenhuma fonte a relaciona com '11/6'."}, {"pergunta": "Feche o ciclo: você está no war room às 4h da manhã com um cliente PSP do pagador. O que o conhecimento deste mecanismo exige que o playbook garanta nas primeiras horas — e qual é o argumento de defesa que isso constrói para a onda consumerista?", "pontos": ["Canal de reclamação funcionando 24/7 e fluxo interno para formar 'fundada suspeita' rápido", "Acionamento imediato do procedimento — cada minuto reduz o saldo bloqueável na cadeia", "Registro documental de cada passo (horários, decisões) — prova de diligência", "Ponte com a Súmula 479/STJ: controles cumpridos e documentados sustentam a tese de fortuito externo/culpa exclusiva"], "gabarito": "O playbook precisa garantir: recepção da reclamação a qualquer hora, formação rápida e documentada da fundada suspeita, acionamento imediato do rastreio/bloqueio (a chance de recuperação decai com a pulverização) e trilha documental completa. Na onda consumerista, essa trilha é o insumo da defesa: diante da Súmula 479/STJ (responsabilidade objetiva por fortuito interno), demonstrar que os mecanismos regulatórios foram acionados tempestivamente é o caminho para caracterizar fortuito externo ou culpa exclusiva de terceiro (CDC, art. 14, §3º)."}]}], "cenarios": [{"id": "pix-madrugada", "titulo": "Fraude Pix na madrugada — R$ 40 mil, cliente PSP do pagador", "inicio": "2026-03-10T03:00:00", "contexto": "Você é o advogado de plantão do retainer. Às 3h00 de terça-feira, o canal 24/7 da fintech NovaPag (instituição de pagamento, provedora de conta transacional, participante direta do Pix) recebe reclamação de um correntista: golpe de engenharia social, três transferências Pix somando R$ 40.000,00 feitas às 2h41, 2h44 e 2h47 para uma conta desconhecida. O time de fraude confirma padrão típico de conta de passagem: o dinheiro provavelmente já está sendo pulverizado. Há indícios de que o golpista obteve também o CPF, a senha do app e prints de dados cadastrais da vítima (dados de autenticação).", "decisoes": [{"situacao": "03:05 — O analista de fraude pergunta: 'aciono o mecanismo de devolução agora ou espero o jurídico validar de manhã? A vítima ainda não registrou boletim de ocorrência.'", "opcoes": [{"texto": "Acionar imediatamente a recuperação de valores (MED 2.0): há reclamação do usuário e fundada suspeita de fraude documentável agora.", "avaliacao": "correta", "custo_minutos": 15, "feedback": "Os dois requisitos do art. 78-N (reclamação do usuário + fundada suspeita de fraude) já estão presentes; BO não é requisito normativo. Como a NovaPag é provedora de conta transacional, a recuperação de valores é obrigatória desde 2/2/2026 — e cada minuto reduz o saldo bloqueável na cadeia de saltos.", "fonte": "Resolução BCB nº 493/2025, regulamento do Pix, arts. 78-N e 121 (DOU 29/08/2025)"}, {"texto": "Aguardar o expediente para o jurídico validar a instauração com mais segurança.", "avaliacao": "errada", "custo_minutos": 360, "feedback": "Não há exigência normativa de validação jurídica prévia, e a espera de horas praticamente garante a pulverização completa — a devolução é limitada ao saldo bloqueado em cada conta da cadeia. A demora ainda enfraquece a futura tese de fortuito externo.", "fonte": "Resolução BCB nº 493/2025, art. 78-N; material oficial BCB MED 2.0 (Circuito Pix)"}, {"texto": "Exigir que a vítima registre boletim de ocorrência primeiro e acionar o MED na sequência.", "avaliacao": "parcial", "custo_minutos": 120, "feedback": "O BO pode fortalecer o dossiê, mas não é requisito do art. 78-N — condicionar o acionamento a ele desperdiça a janela de bloqueio. Correto seria acionar já e orientar o BO em paralelo.", "fonte": "Resolução BCB nº 493/2025, regulamento do Pix, art. 78-N"}], "quando": "2026-03-10T03:05:00"}, {"situacao": "03:40 — O CISO informa: o golpista tinha senha do app e dados cadastrais da vítima. Pode ter havido vazamento interno ou captura externa; ainda não se sabe. O COO pergunta: 'isso já é um incidente que temos que reportar à ANPD?'", "opcoes": [{"texto": "Ainda não se sabe — mas o relógio de avaliação começa agora: registrar formalmente o momento do conhecimento, abrir apuração sobre afetação de dados pessoais e aplicar o teste do art. 5º (afetação significativa + critério objetivo).", "avaliacao": "correta", "custo_minutos": 30, "feedback": "A comunicação só é devida se houver risco/dano relevante (teste cumulativo do art. 5º — aqui há dados financeiros e de autenticação, um dos critérios; falta apurar a afetação significativa e se houve incidente no ambiente do controlador). O prazo de 3 dias úteis conta do conhecimento de que o incidente afetou dados pessoais — registrar QUANDO esse conhecimento se formou é decisivo.", "fonte": "Resolução CD/ANPD nº 15/2024, arts. 5º e 6º, §1º do Regulamento (DOU 26/04/2024)"}, {"texto": "Sim — comunicar à ANPD imediatamente, ainda esta madrugada, por precaução.", "avaliacao": "parcial", "custo_minutos": 90, "feedback": "Comunicar sem apurar não é exigido e pode ser prematuro: o dever nasce com o risco/dano relevante (art. 5º) e o prazo é de 3 dias úteis do conhecimento — há tempo para uma avaliação fundamentada. Comunicação precipitada e incompleta gera retrabalho e exposição desnecessária. Não é ilícito, mas não é o padrão da norma.", "fonte": "Resolução CD/ANPD nº 15/2024, arts. 5º e 6º do Regulamento"}, {"texto": "Não — golpe de engenharia social é problema entre o fraudador e a vítima; não há incidente de segurança da NovaPag.", "avaliacao": "errada", "custo_minutos": 30, "feedback": "Conclusão sem apuração. Se a senha e os dados cadastrais saíram de vazamento no ambiente do controlador, há incidente de segurança com dados de autenticação (critério do art. 5º). Descartar sem investigar nem registrar é exatamente o comportamento que a fiscalização e a onda consumerista exploram.", "fonte": "Resolução CD/ANPD nº 15/2024, art. 5º do Regulamento; Lei nº 13.709/2018, art. 48"}], "quando": "2026-03-10T03:40:00"}, {"situacao": "10:00 do mesmo dia — O rastreio bloqueou R$ 12.300 em duas contas de segundo salto. A apuração interna indica, até aqui, que NÃO houve vazamento no ambiente da NovaPag (captura provável no dispositivo da vítima). O comitê inclina-se por não comunicar à ANPD. O que você orienta?", "opcoes": [{"texto": "Formalizar a decisão de não comunicar com a fundamentação técnica, e registrar o incidente no livro de registro com o conteúdo mínimo, guardando por no mínimo 5 anos.", "avaliacao": "correta", "custo_minutos": 60, "feedback": "A norma obriga o registro de TODOS os incidentes, inclusive os não comunicados, por prazo mínimo de cinco anos, com conteúdo mínimo (data de conhecimento, circunstâncias). A fundamentação documentada é a defesa da decisão perante a ANPD e no contencioso.", "fonte": "Resolução CD/ANPD nº 15/2024, Regulamento de Comunicação de Incidente (DOU 26/04/2024)"}, {"texto": "Se não vai comunicar, não formalizar nada — documento interno vira prova contra a empresa depois.", "avaliacao": "errada", "custo_minutos": 10, "feedback": "Inverte a lógica normativa: o registro é obrigatório e a sua ausência é infração autônoma e indício de ocultação. No contencioso, é a trilha documental que sustenta a tese de fortuito externo.", "fonte": "Resolução CD/ANPD nº 15/2024, Regulamento; Súmula 479/STJ (contexto de defesa)"}, {"texto": "Registrar apenas se a ANPD abrir fiscalização no futuro, reconstituindo os fatos a partir dos logs.", "avaliacao": "errada", "custo_minutos": 10, "feedback": "Registro reconstituído a posteriori não cumpre a norma (que exige registro com data de conhecimento) e tem valor probatório fragilizado. O dever é contemporâneo ao incidente.", "fonte": "Resolução CD/ANPD nº 15/2024, Regulamento de Comunicação de Incidente"}], "quando": "2026-03-10T10:00:00"}, {"situacao": "14:00 — A vítima, orientada por um advogado, avisa que vai processar a NovaPag pelos R$ 27.700 não recuperados, invocando responsabilidade objetiva. O CEO pergunta o tamanho do risco e o que fazer AGORA para a defesa futura.", "opcoes": [{"texto": "Risco real (Súmula 479/STJ), mas defensável: preservar desde já toda a trilha — horários da reclamação, da instauração do MED, dos bloqueios, laudo indicando captura no dispositivo da vítima — para sustentar fortuito externo/culpa exclusiva.", "avaliacao": "correta", "custo_minutos": 60, "feedback": "A Súmula 479 impõe responsabilidade objetiva por fortuito interno; a fronteira de defesa é demonstrar fortuito externo ou culpa exclusiva da vítima/terceiro (CDC, art. 14, §3º). O acionamento tempestivo do MED 2.0 e os controles documentados são exatamente a prova que desloca o caso do fortuito interno.", "fonte": "STJ, Súmula 479 (Segunda Seção, DJe 1º/08/2012); CDC, art. 14, §3º"}, {"texto": "Risco nenhum: a NovaPag não teve culpa, e sem culpa não há dever de indenizar.", "avaliacao": "errada", "custo_minutos": 20, "feedback": "A responsabilidade da Súmula 479 é objetiva — independe de culpa. A discussão não é culpa, é a qualificação do evento como fortuito interno ou externo.", "fonte": "STJ, Súmula 479; CDC, art. 14"}, {"texto": "Propor acordo imediato pelo valor integral para evitar o processo.", "avaliacao": "parcial", "custo_minutos": 30, "feedback": "Pode ser decisão de negócio legítima caso a caso, mas como orientação padrão cria incentivo à litigância em massa (inclusive predatória) e ignora que há defesa técnica viável com a trilha do MED. Antes de precificar acordo, preserva-se a prova.", "fonte": "STJ, Súmula 479; contexto: hub-litigancia-predatoria"}], "quando": "2026-03-10T14:00:00"}, {"situacao": "Quinta-feira, 16:00 (D+2) — Reviravolta: a perícia acha um acesso não autorizado a uma base interna de dados cadastrais e de autenticação, 10 dias atrás, compatível com o golpe. A afetação é potencialmente ampla (150 mil clientes). Qual é o seu prazo-limite para comunicar à ANPD e a partir de quando ele conta?", "opcoes": [{"texto": "Três dias úteis a partir de AGORA (quinta 16h), quando se formou o conhecimento de que o incidente afetou dados pessoais — ou seja, até terça-feira. Preparar a comunicação já.", "avaliacao": "correta", "custo_minutos": 120, "feedback": "O termo inicial do art. 6º, §1º é o conhecimento pelo controlador de que o incidente afetou dados pessoais — formado agora com o achado pericial, não na data da invasão (10 dias atrás) nem na madrugada da fraude. Com dados de autenticação + larga escala + afetação significativa, o teste do art. 5º está preenchido: comunicar.", "fonte": "Resolução CD/ANPD nº 15/2024, arts. 5º e 6º, caput e §1º do Regulamento"}, {"texto": "O prazo conta da invasão (10 dias atrás) — já estourou; melhor não comunicar para não confessar atraso.", "avaliacao": "errada", "custo_minutos": 30, "feedback": "Termo inicial errado (é o conhecimento, não o evento) e a conclusão agrava: omitir a comunicação devida é infração autônoma à LGPD. O registro da linha do tempo da apuração demonstra a tempestividade.", "fonte": "Resolução CD/ANPD nº 15/2024, art. 6º, §1º; Lei nº 13.709/2018, art. 48"}, {"texto": "Três dias corridos a partir de agora — comunicar até domingo.", "avaliacao": "parcial", "custo_minutos": 60, "feedback": "Termo inicial correto, contagem errada: são dias ÚTEIS (art. 6º), não corridos. O erro para mais é inofensivo aqui, mas em outro cenário levaria a estourar prazo por contagem indevida.", "fonte": "Resolução CD/ANPD nº 15/2024, art. 6º do Regulamento"}], "quando": "2026-03-12T16:00:00"}], "verificacoes_finais": [{"descricao": "Comunicação do incidente à ANPD dentro de 3 dias úteis do conhecimento (quinta 16h → terça-feira seguinte, 2026-03-17)", "limite": "2026-03-17T23:59:00", "fonte": "Resolução CD/ANPD nº 15/2024, art. 6º do Regulamento; hub-matriz-prazos"}]}], "tipos_fintech": {"titulo": "Estratégia por tipo de fintech", "nota": "Cada tipo tem cenários que se aplicam e cenários que não se aplicam. Dizer o que não se aplica é parte do valor: reduz o plano ao executável. Cada tipo aponta para os cenários da matriz de incidentes que se aplicam a ele e para os que expressamente não se aplicam.", "tipos": [{"id": "ip-conta", "nome": "IP · Provedora de conta transacional", "oque": "Conta digital de pagamento com participação direta no Pix. O cliente final movimenta recursos pela instituição.", "risco": "Exposição máxima. É o tipo que responde tanto como PSP pagador (cliente vítima de golpe) quanto como PSP recebedor (conta usada por fraudador).", "aplicaveis": ["Golpe de engenharia social contra o cliente", "Conta-laranja hospedada na própria base", "Vazamento de chaves e dados cadastrais", "Enxurrada de determinações judiciais de bloqueio", "Onda consumerista pós-incidente"], "nao_aplicaveis": ["Chargeback de cartão (salvo se também emissora)", "Risco de carteira de crédito próprio"], "gaps": ["Canal 24/7 e formação documentada da fundada suspeita (art. 78-N)", "Motor de transação atípica e trava de aumento de limite (Res. 142/2021)", "Rejeição de transação a conta suspeita (Res. 501/2025, desde 13/10/2025)", "KYC e critérios de encerramento de conta", "Fluxo de cumprimento de ordem judicial com prova de tempestividade"], "normas": ["bcb-res-493-2025", "bcb-res-506-2025", "bcb-res-142-2021", "bcb-res-343-2023", "anpd-res-cd-15-2024", "bcb-res-85-2021"], "estrategia": "Prioridade absoluta no eixo de detecção e acionamento: é onde nascem as condenações por falha autônoma. Plano precisa garantir instauração imediata do MED, marcação no DICT e registro do indício em 24h. Segundo eixo: determinações judiciais, pela frequência.", "cenarios_matriz": ["engenharia-social", "conta-laranja", "vazamento", "determinacoes-judiciais", "onda-consumerista", "credencial-fornecedor", "insider"], "cenarios_matriz_na": ["chargeback-recebivel", "perimetro-regulatorio", "recursos-origem-fraudulenta"]}, {"id": "ip-credenciadora", "nome": "IP · Credenciadora ou subadquirente", "oque": "Captura e liquidação de transações de cartão para estabelecimentos. Não mantém conta transacional do consumidor final.", "risco": "O risco migra do consumidor para o lojista e para a cadeia de liquidação. Fraude de estabelecimento, chargeback em massa e retenção de recebíveis.", "aplicaveis": ["Fraude de estabelecimento credenciado (loja fantasma, transação simulada)", "Chargeback em massa e disputa de recebível", "Bloqueio judicial sobre recebíveis de lojista", "Ataque via fornecedor de tecnologia"], "nao_aplicaveis": ["MED e recuperação de valores do Pix (salvo se também PSP)", "Golpe de engenharia social contra correntista"], "gaps": ["Critérios de credenciamento e descredenciamento de estabelecimento", "Política de retenção e antecipação de recebíveis", "Controle de determinações judiciais sobre recebíveis (frequência alta)", "Gestão de fornecedores de captura e processamento"], "normas": ["bcb-res-85-2021", "bcb-res-494-498-2025", "anpd-res-cd-15-2024"], "estrategia": "Plano centrado em cadeia contratual: quem responde pelo quê entre credenciadora, subadquirente e lojista. O contencioso típico é comercial e de recebível, não consumerista de massa.", "cenarios_matriz": ["chargeback-recebivel", "determinacoes-judiciais", "credencial-fornecedor", "vazamento", "insider"], "cenarios_matriz_na": ["engenharia-social", "conta-laranja", "recursos-origem-fraudulenta"]}, {"id": "ip-prepago", "nome": "IP · Emissora de moeda eletrônica e pré-pago", "oque": "Cartões pré-pagos, benefícios, vale-refeição, contas de moeda eletrônica com uso restrito ou aberto.", "risco": "Fraude de cadastro e uso indevido de saldo. Alta exposição a fraude documental no onboarding e a golpes de saque.", "aplicaveis": ["Fraude documental no onboarding", "Uso indevido de saldo e clonagem de cartão", "Vazamento de base cadastral", "Bloqueio judicial de saldo"], "nao_aplicaveis": ["Recuperação de valores do Pix em cadeia de saltos, quando não há Pix", "Risco de inadimplência de carteira"], "gaps": ["Verificação de identidade no onboarding e prova dela", "Controles de uso e limite por perfil", "Registro e comunicação de incidente com dados de autenticação", "Contrato e jornada de contratação frente ao CDC"], "normas": ["bcb-res-85-2021", "anpd-res-cd-15-2024", "bcb-res-343-2023"], "estrategia": "Plano com peso no onboarding e na jornada contratual. É o tipo em que a consultoria de produto novo tem maior demanda, porque o portfólio muda com frequência.", "cenarios_matriz": ["fraude-onboarding", "contratacao-fraudulenta", "vazamento", "determinacoes-judiciais", "onda-consumerista"], "cenarios_matriz_na": ["engenharia-social", "chargeback-recebivel", "recursos-origem-fraudulenta"]}, {"id": "scd", "nome": "SCD · Crédito digital com capital próprio", "oque": "Concede crédito com recursos próprios, sem captação. Empréstimo pessoal, consignado digital, crédito para PJ.", "risco": "Fraude na contratação (crédito tomado em nome de terceiro) e contencioso de cobrança, superendividamento e revisional.", "aplicaveis": ["Contratação fraudulenta em nome de terceiro", "Contencioso de cobrança e revisional", "Litigância de massa sobre juros e encargos", "Vazamento de base de clientes"], "nao_aplicaveis": ["MED e recuperação de valores do Pix", "Responsabilidade como PSP recebedor de conta-laranja"], "gaps": ["Prova de contratação: assinatura eletrônica, biometria, trilha de aceite", "Jornada de contratação e informação adequada (CDC)", "Política de cobrança e negativação", "Triagem de demanda de massa e litigância predatória"], "normas": ["stj-sumula-479", "dossie-pix-fortuito", "stj-tema-1198", "anpd-res-cd-15-2024"], "estrategia": "Plano voltado à prova da contratação: o litígio típico alega que o cliente não contratou. Quem tem trilha de aceite íntegra ganha; quem não tem, paga. Segundo eixo: defesa organizada da massa, com Tema 1198.", "cenarios_matriz": ["contratacao-fraudulenta", "onda-consumerista", "determinacoes-judiciais", "vazamento", "fraude-onboarding"], "cenarios_matriz_na": ["engenharia-social", "conta-laranja", "chargeback-recebivel"]}, {"id": "sep", "nome": "SEP · Empréstimo entre pessoas", "oque": "Plataforma que conecta credor e devedor pessoa a pessoa, sem assumir o risco de crédito.", "risco": "Responsabilidade da plataforma por falha de intermediação, informação e seleção de tomadores.", "aplicaveis": ["Alegação de responsabilidade da plataforma por inadimplência", "Fraude de tomador com documento falso", "Informação inadequada ao investidor pessoa física"], "nao_aplicaveis": ["MED e cadeia de contas de passagem", "Risco de balanço por carteira própria"], "gaps": ["Delimitação contratual do papel de intermediária", "Informação de risco ao credor pessoa física", "Verificação de identidade do tomador"], "normas": ["anpd-res-cd-15-2024", "bcb-res-85-2021"], "estrategia": "Plano focado na fronteira de responsabilidade: o contrato e a jornada precisam deixar claro o que a plataforma faz e o que não faz, sob pena de responder como se fosse a credora.", "cenarios_matriz": ["contratacao-fraudulenta", "fraude-onboarding", "vazamento", "perimetro-regulatorio"], "cenarios_matriz_na": ["engenharia-social", "conta-laranja", "chargeback-recebivel"]}, {"id": "baas-psti", "nome": "BaaS, infraestrutura e PSTI", "oque": "Fornece trilhos, licença ou conexão para que terceiros ofereçam serviço financeiro. Inclui prestador de tecnologia com acesso à RSFN.", "risco": "O maior risco sistêmico do setor. Os três maiores ataques recentes entraram por credencial de fornecedor, e o BCB passou a exigir credenciamento, capital e seguro do PSTI.", "aplicaveis": ["Ataque via credencial comprometida", "Fraude interna de operador com acesso privilegiado", "Regresso de instituições contratantes", "Responsabilização regulatória do credenciamento"], "nao_aplicaveis": ["Onda consumerista direta, salvo se houver relação com o consumidor final"], "gaps": ["Controle e guarda de chaves privadas (vedação de acesso de terceiros, Res. 85, art. 3º-A)", "Segregação e monitoramento de credenciais privilegiadas", "Seguro de responsabilidade civil e riscos operacionais (Res. 498, art. 3º, XIII)", "Governança de crise e plano de saída ordenada", "Cadeia contratual com as instituições contratantes"], "normas": ["bcb-res-494-498-2025", "bcb-res-85-2021", "bcb-res-538-2025", "camadas-da-fraude"], "estrategia": "Plano com dois lados: defender-se do regresso das contratantes e demonstrar diligência ao regulador. Insider é cenário obrigatório, não hipótese remota.", "cenarios_matriz": ["credencial-fornecedor", "insider", "vazamento", "determinacoes-judiciais"], "cenarios_matriz_na": ["onda-consumerista", "chargeback-recebivel"]}, {"id": "embedded", "nome": "Embedded finance e marketplace", "oque": "Empresa não autorizada que oferece serviço financeiro dentro do próprio produto, operando sob a licença de um parceiro regulado.", "risco": "Risco de perímetro: operar sem autorização quando ela seria exigível, e responder perante o consumidor por serviço prestado por terceiro.", "aplicaveis": ["Enquadramento regulatório indevido (operar sem autorização exigível)", "Responsabilidade solidária perante o consumidor", "Falha do parceiro regulado que respinga na marca; no sentido inverso, o parceiro responde ao BCB pelo serviço que roda sob sua licença"], "nao_aplicaveis": ["Obrigações diretas de participante do Pix, enquanto não autorizada", "Comunicação própria de incidente ao BCB, que cabe ao parceiro"], "gaps": ["Análise de perímetro: o produto exige autorização própria", "Contrato com o parceiro regulado e divisão de responsabilidades, inclusive os deveres de segurança cibernética e de contratação de terceiros que o parceiro carrega pela Res. BCB 85/2021", "Jornada de contratação e quem aparece como fornecedor ao consumidor", "Plano de contingência para falha do parceiro"], "normas": ["bcb-res-494-498-2025", "bcb-res-85-2021", "stj-sumula-479", "anpd-res-cd-15-2024"], "estrategia": "Prioridade no perímetro regulatório, agravado pela janela única de pedido de autorização de 1º a 31 de maio de 2026 (Res. BCB 494/2025). Depois, a cadeia contratual: perante o consumidor, quem estampa a marca responde.", "cenarios_matriz": ["perimetro-regulatorio", "onda-consumerista", "contratacao-fraudulenta", "credencial-fornecedor"], "cenarios_matriz_na": ["engenharia-social", "conta-laranja"]}, {"id": "vasp", "nome": "VASP · Prestadora de serviços de ativos virtuais", "oque": "Custódia, intermediação e negociação de criptoativos. Entrou no perímetro do BCB e nas obrigações de segurança cibernética.", "risco": "Vetor de saída da fraude do sistema financeiro. Recurso convertido em cripto é praticamente irrecuperável, o que atrai tanto o criminoso quanto o regulador.", "aplicaveis": ["Recebimento de recursos de origem fraudulenta", "Compartilhamento obrigatório de indícios de fraude (prazo de 30/10/2026)", "Segurança cibernética e custódia de chaves", "Bloqueio judicial de ativos digitais"], "nao_aplicaveis": ["MED, que é mecanismo interno do arranjo Pix"], "gaps": ["Adequação ao compartilhamento de indícios até 30/10/2026", "Política de bloqueio e resposta a ordem judicial sobre ativos", "Segurança cibernética sob a Res. 85 na redação da Res. 552/2026", "Rastreabilidade de origem de recursos"], "normas": ["bcb-res-85-2021", "bcb-res-343-2023", "bcb-res-569-2026"], "estrategia": "Plano orientado ao prazo de outubro de 2026 e à resposta a ordem judicial, que é o ponto de atrito recorrente. Cenário de recebimento de recurso fraudado precisa ter procedimento escrito.", "cenarios_matriz": ["recursos-origem-fraudulenta", "determinacoes-judiciais", "credencial-fornecedor", "vazamento", "insider"], "cenarios_matriz_na": ["engenharia-social", "conta-laranja", "chargeback-recebivel"]}, {"id": "open-finance", "nome": "ITP e participantes do Open Finance", "oque": "Iniciadora de transação de pagamento (modalidade de IP) e instituições que compartilham dados ou recebem iniciação de pagamento no ecossistema do Open Finance, sob <script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const INTERVALOS=[1,3,7,16,35], POR_SESSAO=5;
const LS = k => JSON.parse(localStorage.getItem("rastro-"+k)||"{}");
const LSet = (k,v) => localStorage.setItem("rastro-"+k, JSON.stringify(v));
const hojeISO = () => new Date().toISOString().slice(0,10);
function filaRevisao(){
  const D=window.DADOS, e=LS("revisao"), hoje=hojeISO();
  const fila=D.cartoes.filter(c=>!e[c.id]||e[c.id].proxima<=hoje)
    .sort((a,b)=>((e[a.id]||{}).proxima||"").localeCompare((e[b.id]||{}).proxima||""));
  return {hoje, total:D.cartoes.length, vencidos:fila.length,
    sessao:fila.slice(0,POR_SESSAO),
    todos:D.cartoes.map(c=>({id:c.id,norma:c.norma||"",
      nivel:(e[c.id]||{}).nivel||0, proxima:(e[c.id]||{}).proxima||"novo"}))};
}
const api = async (rota, corpo) => {
  const D=window.DADOS;
  const u=new URL(rota,"http://x"), p=u.pathname, q=u.searchParams;
  if(p==="/api/resumo") return {...D.resumo, revisao:{vencidos:filaRevisao().vencidos}};
  if(p==="/api/fichas") return D.fichas.map(f=>f.info);
  if(p==="/api/ficha"){ const f=D.fichas.find(x=>x.info.id===q.get("id"));
    return f?{meta:f.meta,corpo:f.corpo,caminho:f.info.caminho}:{erro:"não disponível nesta versão pública"}; }
  if(p==="/api/mudancas") return [...D.fichas.map(f=>({...f.info,quando:f.info.quando}))]
    .sort((a,b)=>b.quando.localeCompare(a.quando)).slice(0,12);
  if(p==="/api/comerciais") return [];
  if(p==="/api/trilha"){ const prog=LS("trilha");
    const t=JSON.parse(JSON.stringify(D.trilha));
    t.licoes.forEach(l=>l.concluida=!!prog[l.id]);
    t.concluidas=t.licoes.filter(l=>l.concluida).length; return t; }
  if(p==="/api/trilha/concluir"){ const prog=LS("trilha");
    prog[corpo.id]=corpo.concluida; LSet("trilha",prog); return {ok:true}; }
  if(p==="/api/tipos-fintech") return D.tipos_fintech;
  if(p==="/api/matriz-incidentes") return D.matriz_incidentes;
  if(p==="/api/roteiros") return D.roteiros.map(r=>({id:r.id,titulo:r.tema}));
  if(p==="/api/roteiro") return D.roteiros.find(r=>r.id===q.get("id"))||{erro:"?"};
  if(p==="/api/cenarios") return D.cenarios.map(c=>({id:c.id,titulo:c.titulo}));
  if(p==="/api/cenario") return D.cenarios.find(c=>c.id===q.get("id"))||{erro:"?"};
  if(p==="/api/revisao/fila") return filaRevisao();
  if(p==="/api/revisao/responder"){ const e=LS("revisao");
    const prev=e[corpo.id]||{nivel:0}; let nivel,dias;
    if(corpo.acertou){ nivel=prev.nivel+1;
      dias=nivel<=INTERVALOS.length?INTERVALOS[nivel-1]:INTERVALOS[INTERVALOS.length-1]*2**(nivel-INTERVALOS.length); }
    else { nivel=0; dias=1; }
    const prox=new Date(); prox.setDate(prox.getDate()+dias);
    e[corpo.id]={nivel, proxima:prox.toISOString().slice(0,10), ultima:hojeISO()};
    LSet("revisao",e); return {id:corpo.id, nivel, proxima_em_dias:dias}; }
  return {erro:"função indisponível na versão pública (somente leitura)"};
};
const esc = t => (t??"").toString().replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- mini-markdown (títulos, negrito, listas, tabelas, código, links) */
function md(texto){
  const linhas = texto.split("\n");
  let html = "", i = 0, lista = false, tabela = [];
  const inline = s => esc(s)
    .replace(/\[\[([a-z0-9-]+)\]\]/g, '<a class="wiki" data-ficha="$1">$1</a>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  const fechaLista = () => { if (lista){ html += "</ul>"; lista = false; } };
  const fechaTabela = () => {
    if (!tabela.length) return;
    const corpo = tabela.filter(l => !/^\s*\|[\s|:-]+\|\s*$/.test(l));
    html += "<table>";
    corpo.forEach((l, n) => {
      const cels = l.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|");
      const tag = n === 0 ? "th" : "td";
      html += "<tr>" + cels.map(c => `<${tag}>${inline(c.trim())}</${tag}>`).join("") + "</tr>";
    });
    html += "</table>"; tabela = [];
  };
  while (i < linhas.length){
    const l = linhas[i];
    if (l.startsWith("```")){
      fechaLista(); fechaTabela();
      let bloco = ""; i++;
      while (i < linhas.length && !linhas[i].startsWith("```")){ bloco += linhas[i]+"\n"; i++; }
      html += `<pre><code>${esc(bloco)}</code></pre>`; i++; continue;
    }
    if (/^\s*\|/.test(l)){ fechaLista(); tabela.push(l); i++; continue; }
    fechaTabela();
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h){ fechaLista(); html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; }
    else if (/^\s*[-•]\s+/.test(l)){
      if (!lista){ html += "<ul>"; lista = true; }
      html += `<li>${inline(l.replace(/^\s*[-•]\s+/,""))}</li>`;
    }
    else if (l.trim() === ""){ fechaLista(); }
    else { fechaLista(); html += `<p>${inline(l)}</p>`; }
    i++;
  }
  fechaLista(); fechaTabela();
  return html;
}
