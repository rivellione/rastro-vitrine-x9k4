 da Súmula 479); a divergência entre Turmas é candidata natural a afetação: monitorar.\n\n## A chave de leitura (síntese do conjunto)\n\nO critério decisório real do STJ não é \"Pix/engenharia social = interno ou externo\", e sim: (i) houve **falha autônoma da instituição** — vazamento de dados, transações atípicas não barradas, abertura negligente da conta recebedora? → fortuito interno, Súmula 479; (ii) a fraude correu **inteiramente fora do ambiente do banco**, com atos voluntários da vítima e sem operação destoante do perfil? → fortuito externo/culpa exclusiva (CDC, art. 14, §3º). Consequência prática: a defesa se ganha provando a ausência de falha autônoma — telemetria, perfil transacional, KYC e trilha do MED.\n\n## Polo 1 — fortuito externo / culpa exclusiva (defesa da instituição)\n\n- **REsp 2.155.065/MG** (\"golpe do motoboy\") — 3ª Turma, rel. p/ acórdão Min. Villas Bôas Cueva, j. 11/03/2025 (maioria 3x2). Entrega voluntária de cartão e senha ao estelionatário = culpa exclusiva da vítima (CDC, art. 14, §3º, II). CONFIRMADO (Migalhas, Conjur, Dizer o Direito).\n- **REsp 2.215.907/SP** (falsa central — culpa exclusiva) — 3ª Turma, rel. Min. Villas Bôas Cueva, 2025. Instalação voluntária de app e fornecimento de credenciais após ligação a número não oficial, com comunicação tardia ao banco → fortuito externo. CONFIRMADO (Conjur 06/10/2025); data exata de julgamento a conferir.\n- **REsp 2.208.212** (Pix pela própria vítima, golpe iniciado em rede social) — 4ª Turma, rel. Min. Isabel Gallotti, j. noticiado 06/03/2026. Transferências voluntárias com senha pessoal, sem prova de falha de segurança → banco não responde. É O precedente específico de Pix voluntário. CONFIRMADO (Migalhas).\n- **REsp 2.085.064/DF** — 4ª Turma, rel. Min. João Otávio de Noronha, j. indicado 09/03/2026. Artifícios de terceiros induzindo o correntista → fortuito externo. PARCIALMENTE CONFIRMADO — conferir no SCON antes de citar.\n- **REsp 2.124.423** (limite da responsabilidade do banco RECEBEDOR) — 3ª Turma, rel. Min. Nancy Andrighi, notícia oficial STJ 27/01/2025. O banco que hospeda a conta usada no golpe só responde se demonstrada falta de diligência na abertura/manutenção; cumprida a regulação do BCB (Res. CMN 4.753/2019), não há defeito do serviço. CONFIRMADO (fonte oficial STJ).\n\n## Polo 2 — fortuito interno (responsabilidade da instituição)\n\n- **REsp 1.197.929/PR** (Tema repetitivo 466, com REsp 1.199.782/PR — base da Súmula 479) — 2ª Seção, rel. Min. Salomão, j. 24/08/2011, DJe 12/09/2011. Fraudes por terceiros = risco do empreendimento = fortuito interno. CONFIRMADO.\n- **REsp 2.077.278/SP** (golpe do boleto viabilizado por vazamento do próprio fornecedor) — 3ª Turma, rel. Min. Nancy Andrighi, unânime, **j. 03/10/2023, DJe 09/10/2023, Informativo 791** (dado do próprio informativo do STJ, não de imprensa). Tratamento inadequado de dados sigilosos que facilita a fraude = fato do serviço; art. 43 da LGPD e Súmula 479. Caso concreto: boleto falso de R$ 19 mil após contato por WhatsApp. Ponte direta com [[anpd-res-cd-15-2024]]. CONFIRMADO em fonte oficial (reverificado 30/07/2026): https://www.stj.jus.br/sites/portalp/Paginas/Comunicacao/Noticias/2023/24102023-Banco-responde-por-vazamento-de-dados-que-resultou-em-aplicacao-do-%E2%80%9Cgolpe-do-boleto%E2%80%9D-contra-cliente.aspx\n- **REsp 1.995.458/SP** (transações atípicas não barradas) — 3ª Turma, rel. Min. Nancy Andrighi, j. 09/08/2022. Sistema que admite operações totalmente atípicas ao padrão do consumidor viola o dever de segurança → falha do serviço mesmo em engenharia social. CONFIRMADO (reverificado 30/07/2026).\n- **REsp 2.222.059 e REsp 2.229.519** (falsa central COM falha de detecção; alcança instituições de pagamento) — 3ª Turma, rel. Min. Ricardo Villas Bôas Cueva, unânime. Falha na proteção de dados ou na identificação de transações fora do perfil → responsabilidade. O acórdão invoca expressamente o **art. 7º da Lei 12.865/2013** para estender o dever de segurança às instituições de pagamento, e manda o sistema considerar valor, horário, local, intervalo entre transações e meio utilizado. Precedente central sobre dever de monitoramento por perfil. CONFIRMADO em fonte oficial (reverificado 30/07/2026): https://www.stj.jus.br/sites/portalp/Paginas/Comunicacao/Noticias/2025/21102025-Bancos-e-instituicoes-de-pagamento-devem-indenizar-clientes-por-falhas-que-viabilizam-golpe-da-falsa-central.aspx — **ATENÇÃO à data**: a notícia oficial é de 21/10/2025; a data de julgamento de 07/10/2025 vinha de matéria da Conjur (08/10/2025) e NÃO foi reconfirmada em fonte oficial. Conferir no acórdão antes de citar dia e mês em peça.\n- **REsp 2.220.333** (falha de segurança afasta culpa concorrente) — 3ª Turma, rel. Min. Ricardo Villas Bôas Cueva, unânime. Caso concreto: vítima induzida a instalar aplicativo sob pretexto de \"regularizar a segurança da conta\"; empréstimo fraudulento de R$ 45 mil e prejuízo material de R$ 55.046,84, em operações incompatíveis com o perfil. Vítima induzida não assume \"risco consciente\"; havendo falha da instituição, reparação integral, sem culpa concorrente. CONFIRMADO em fonte oficial (reverificado 30/07/2026): https://www.stj.jus.br/sites/portalp/Paginas/Comunicacao/Noticias/2025/13112025-Falha-de-seguranca-do-banco-afasta-alegacao-de-culpa-concorrente-do-consumidor-em-caso-de-golpe.aspx — **CORREÇÃO: a data \"07/10/2025, mesma sessão\" registrada aqui até 30/07/2026 estava ERRADA.** A notícia oficial é de 13/11/2025 e não informa a data de julgamento. NAO_CONFIRMADO quanto ao dia; usar \"3ª Turma, rel. Villas Bôas Cueva\" e conferir o acórdão antes de datar em peça.\n\n## Não confirmados — NÃO usar sem checagem no SCON\n\n- REsp 2.222.137/SP (suposto caso de banco recebedor sem KYC, 07/10/2025): apenas em resumo de busca; NÃO CONFIRMADO.\n- REsp 2.082.281/SP (21/11/2023): número não confirmado em nenhuma fonte. NÃO CONFIRMADO.\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: os precedentes do Polo 2 definem O QUE documentar antes do incidente (perfil transacional, motor de atípicas, KYC do onboarding, guarda de dados) — cada item vira pergunta de benchmark/IPR-72. Recuperação/defesa: a contestação-tipo argumenta pela chave de leitura acima — ausência de falha autônoma provada com a trilha das fases 1-2; contra bancos recebedores de contas-laranja, o REsp 2.124.423 delimita o que exigir deles (e o que nos exigirão).\n\n## Lacunas\n\n- Datas de DJe dos acórdãos de 2025-2026: conferir no SCON antes de citar em peça (vários confirmados por notícia oficial/veículo, não pelo inteiro teor).\n- Divergência 3ª × 4ª Turmas: monitorar afetação pela 2ª Seção (radar Hermes + monitor).\n- Fichas individuais por acórdão: desmembrar deste dossiê quando a minuta exigir profundidade em precedente específico.\n\n## Relações\n\n[[stj-sumula-479]] · [[hub-jurisprudencia-consumerista]] · [[hub-catalogo-medidas]] · [[bcb-res-493-2025]] · [[anpd-res-cd-15-2024]]\n"}, {"info": {"id": "stj-sumula-479", "titulo": "Súmula 479 do STJ (fortuito interno)", "orgao": "STJ", "tipo": "sumula", "status": "fichado", "data_publicacao": "2012-08-01", "tags": "[jurisprudencia, fortuito-interno, responsabilidade-objetiva, consumidor]", "grupo": "jurisprudencia", "caminho": "jurisprudencia/stj-sumula-479.md", "quando": "2026-07-23"}, "meta": {"id": "stj-sumula-479", "tipo": "sumula", "titulo": "Súmula 479 do STJ (fortuito interno)", "orgao": "STJ", "data_publicacao": "2012-08-01", "vigencia": "", "altera": "[]", "fase_rastro": "[recuperacao_defesa, prontidao]", "conexao_comercial": "[adversarial, benchmark]", "fonte_primaria": "https://processo.stj.jus.br/jurisprudencia/externo/informativo/?acao=pesquisar&sumula=479", "status": "fichado", "tags": "[jurisprudencia, fortuito-interno, responsabilidade-objetiva, consumidor]", "confidencial": "false"}, "corpo": "\n# Súmula 479 do STJ\n\n## Enunciado\n\nEnunciado literal: \"As instituições financeiras respondem objetivamente pelos danos gerados por fortuito interno relativo a fraudes e delitos praticados por terceiros no âmbito de operações bancárias.\" Segunda Seção, julgada em 27/06/2012, publicada no DJe de 1º/08/2012 (também RSTJ vol. 227, p. 937).\n\n## Alcance\n\nConsagra a responsabilidade objetiva das instituições financeiras por fraudes que constituam fortuito interno — risco inerente à atividade bancária —, com base no CDC, art. 14 (precedentes de origem, ex.: REsp 1.197.929/PR). A fronteira operacional do litígio contemporâneo é a distinção entre fortuito interno (falha de segurança do fornecedor) e fortuito externo/culpa exclusiva da vítima (CDC, art. 14, §3º), especialmente em golpes de engenharia social via Pix.\n\n## Aplicação prática no ciclo Rastro\n\nRecuperação/defesa: é a moldura de imputação de toda a onda consumerista pós-incidente; a tese de defesa gira em torno de deslocar o caso para o fortuito externo ou para a culpa exclusiva da vítima/terceiro, com prova técnica de que os controles exigidos (MED 2.0, Res. 85/538) foram cumpridos. Prontidão: quanto melhor a instituição documenta seus controles antes do incidente, mais viável a tese de fortuito externo depois — argumento comercial central do benchmark.\n\n## Conexão comercial\n\nAlimenta o entregável adversarial (dossiê de jurisprudência da onda consumerista) e sustenta o discurso de venda do benchmark (prevenção documentada como insumo de defesa futura).\n\n## Lacunas\n\n- Referência legislativa detalhada da súmula: o núcleo (CDC, art. 14) é pacífico nos precedentes de origem; a lista exata de dispositivos indicada pelo STJ inclui menção à Lei nº 4.595/1964, mas o detalhamento por artigo é NAO_CONFIRMADO nas páginas oficiais consultadas.\n- Jurisprudência posterior delimitando fortuito interno vs. externo em golpes via Pix/engenharia social (acórdãos com número de processo): mapeamento pendente — é o próximo passo do dossiê. Ver [[hub-jurisprudencia-consumerista]].\n\n## Relações\n\n[[hub-jurisprudencia-consumerista]] · [[bcb-res-493-2025]] · [[hub-litigancia-predatoria]]\n"}, {"info": {"id": "stj-tema-1198", "titulo": "STJ, Tema Repetitivo 1198 (litigância predatória — emenda da inicial)", "orgao": "STJ", "tipo": "acordao", "status": "fichado", "data_publicacao": "2025-03-13", "tags": "[jurisprudencia, litigancia-predatoria, repetitivo, contencioso]", "grupo": "jurisprudencia", "caminho": "jurisprudencia/stj-tema-1198.md", "quando": "2026-07-07"}, "meta": {"id": "stj-tema-1198", "tipo": "acordao", "titulo": "STJ, Tema Repetitivo 1198 (litigância predatória — emenda da inicial)", "orgao": "STJ", "data_publicacao": "2025-03-13", "vigencia": "", "altera": "[]", "fase_rastro": "[recuperacao_defesa]", "conexao_comercial": "[adversarial]", "fonte_primaria": "https://www.stj.jus.br/sites/portalp/Paginas/Comunicacao/Noticias/2025/20032025-Corte-Especial-decide-em-repetitivo-que-juiz-pode-exigir-documentos-para-coibir-litigancia-abusiva.aspx", "status": "fichado", "tags": "[jurisprudencia, litigancia-predatoria, repetitivo, contencioso]", "confidencial": "false"}, "corpo": "\n# STJ — Tema Repetitivo 1198\n\n## Identificação e tese\n\nTema 1198/STJ, REsp 2.021.665/MS (oriundo de IRDR do TJMS), rel. Min. Moura Ribeiro. Afetado pela Segunda Seção em 02/05/2023 (DJe 09/05/2023, Informativo 774); mérito julgado pela Corte Especial em 13/03/2025. Tese firmada: \"Constatados indícios de litigância abusiva, o juiz pode exigir de modo fundamentado e com observância à razoabilidade do caso concreto a emenda da petição inicial a fim de demonstrar o interesse de agir e a autenticidade da postulação, respeitadas as regras de distribuição do ônus da prova.\"\n\n## Alcance\n\nAutoriza o juiz, diante de indícios de litigância predatória, a exigir na emenda documentos que lastreiem minimamente a pretensão (procuração atualizada, declarações de pobreza e residência, contrato, extratos). Vedada a extinção automática: assegura-se oportunidade de emenda. É repetitivo — vincula as instâncias ordinárias (CPC, art. 927, III).\n\n## Aplicação prática no ciclo Rastro\n\nRecuperação/defesa: é a alavanca processual central contra a onda predatória pós-incidente — permite requerer, caso a caso e com indícios documentados (petições clonadas, procurações antigas/viciadas, padrões de distribuição), que o juízo condicione o prosseguimento à comprovação de autenticidade. A triagem de massa do escritório (com IA governada — [[cnj-res-615-2025]]) produz exatamente os indícios que fundamentam o requerimento.\n\n## Lacunas\n\n- Data e página de publicação do acórdão no DJe: conferir no acórdão oficial antes de citar em peça (a sessão de julgamento foi 13/03/2025; a notícia oficial é de 20/03/2025).\n\n## Relações\n\n[[hub-litigancia-predatoria]] · [[cnj-rec-159-2024]] · [[stj-sumula-479]]\n"}, {"info": {"id": "camadas-da-fraude", "titulo": "As três camadas da fraude — do incidente à fraude-como-negócio", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "2026-07-23", "tags": "[conceito, fraude, deep-web, insider, crime-organizado, inteligencia, war-room]", "grupo": "conceitos", "caminho": "conceitos/camadas-da-fraude.md", "quando": "2026-07-23"}, "meta": {"id": "camadas-da-fraude", "tipo": "conceito", "titulo": "As três camadas da fraude — do incidente à fraude-como-negócio", "orgao": "", "data_publicacao": "2026-07-23", "status": "fichado", "tags": "[conceito, fraude, deep-web, insider, crime-organizado, inteligencia, war-room]", "confidencial": "false"}, "corpo": "\n# As três camadas da fraude\n\nModelo analítico para desenhar a resposta do Rastro além do incidente visível. A maior parte do mercado (e a versão inicial do próprio war room) trata apenas a camada 1. As camadas 2 e 3 são onde o crime realmente se organiza — e onde entram os parceiros de tecnologia, sob coordenação jurídica.\n\n## Camada 1 — a fraude do incidente\n\nO golpe aconteceu, o dinheiro saiu, correm os relógios (MED 2.0, ANPD). É a resposta jurídico-operacional que o war room já cobre: rastreio, bloqueio, comunicação a reguladores, preservação de prova, defesa consumerista. Ver [[hub-catalogo-medidas]] e [[estudo-72h-aprofundamento]]. É reativa e visível — começa quando a vítima reclama.\n\n## Camada 2 — a fraude da origem\n\nO incidente da camada 1 quase nunca nasce na madrugada em que é detectado. Nasce semanas antes: um **vazamento de dados** (às vezes externo, às vezes **interno** — o insider, vetor confirmado no caso C&M Software), credenciais e bases cadastrais vendidas em fóruns e na **deep/dark web**, kits de golpe circulando. Quando o PSP recebe a reclamação, os dados da vítima já podem estar num mercado que a instituição não monitora.\n\nConsequência para o Rastro: a resposta madura inclui **inteligência PRÉ-incidente** — monitorar a exposição do cliente (dados à venda, menções, credenciais vazadas) antes de o golpe se consumar. Isso é capacidade técnica de threat intelligence, não jurídica; entra por parceiro especializado, coordenado pelo escritório. No insider, a apuração é simultaneamente **trabalhista + criminal + forense**, com cadeia de custódia reforçada (a prova precisa sobreviver às duas jurisdições).\n\n## Camada 3 — a fraude como estrutura de negócio (fraud-as-a-service)\n\nO adversário contemporâneo não é o \"hacker no porão\". É uma **organização com divisão de trabalho**: quem vaza, quem compra dado, quem opera o golpe, quem fornece contas-laranja, quem lava via bets e cripto. Margem alta, risco baixo — porque cada elo é substituível e o combate estatal é fragmentado (rastreio de laranja não chega ao topo da estrutura). É crime organizado com racionalidade empresarial.\n\nConsequência para o Rastro: bloquear o laranja da camada 1 não desmonta o negócio. A **atribuição** (quem é a estrutura por trás) é o que transforma resposta reativa em persecução criminal real e recuperação de ativos com alcance — território de frente criminal + inteligência + cooperação com PF, orquestrado juridicamente.\n\n## Como as três camadas mudam o war room\n\n- A frente de inteligência do catálogo sobe de \"forense pós-incidente\" para incluir **vigilância pré-incidente** e **atribuição** (ver ajuste em [[hub-catalogo-medidas]]).\n- O produto (retainer de prontidão) ganha argumento concreto: não basta responder rápido; é saber que os dados do cliente estão à venda antes de o dinheiro sair.\n- O papel do escritório é de **maestro**: coordena os parceiros técnicos (threat intel, DFIR, chain analysis), decide o que vira comunicação a regulador, notícia-crime ou ação de recuperação. A execução técnica é do parceiro; a regência e a defensabilidade jurídica são do Rastro.\n\n## Isto NÃO é um novo serviço — é o mesmo produto, com mais alcance\n\nRegra de desenho comercial: as camadas 2 e 3 NÃO viram um segundo produto (não há \"assinatura de monitoramento de deep web\" à parte). Elas são frentes do MESMO produto — \"RASTRO · Resposta a Fraudes 72h\" — e se encaixam na escada existente sem criar degrau novo:\n\n- Camada 1 (incidente) = o war room das 72h. É o núcleo do produto.\n- Camada 2 (origem/vigilância pré-incidente) = entra em ANTES (diagnóstico de prontidão) e SEMPRE (retainer): o mesmo plantão que responde ao incidente também vigia a exposição do cliente. Não é uma venda nova; é um argumento a mais para o retainer que já existe.\n- Camada 3 (atribuição/fraude-como-negócio) = entra em DEPOIS (recuperação & defesa) e reforça o war room: identificar a estrutura vira persecução criminal e recuperação de ativos, dentro do caso já contratado.\n\nContinua valendo \"um comando, todas as frentes\": o cliente aciona UM número; o que muda é que esse comando agora orquestra também o parceiro técnico das camadas 2 e 3. A escada comercial (prontidão → retainer → recuperação/defesa) permanece com três degraus, não quatro.\n\n## Fronteira de core business (decisão estratégica)\n\nCamadas 2 e 3 são **capacidade técnica**, não jurídica. Absorvê-las transformaria o escritório em empresa de segurança mediana e destruiria a **independência** necessária para auditar com isenção os fornecedores do cliente. Por isso: parceria de indicação, não fusão. O Rastro coordena e responde pela camada jurídica; o parceiro fornece o músculo técnico das camadas 2 e 3.\n\n## Lacunas / pendências\n\n- Parceiro tecnológico de referência: avaliação de fornecedor concluída em 2026-07-23 — perfil e cautelas na ficha interna de parceiro (confidencial). Confirma-se que camadas 2 e 3 têm fornecedor de mercado maduro. Definir modelo (indicação recíproca vs. unidirecional) e concluir due diligence.\n- Base normativa da apuração de insider (interface trabalhista × criminal × LGPD): mapear e fichar.\n\n## Relações\n\n[[hub-catalogo-medidas]] · governança interna do projeto · [[estudo-72h-aprofundamento]] · [[dossie-pix-fortuito]] · [[bcb-res-85-2021]]\n"}, {"info": {"id": "estudo-72h-aprofundamento", "titulo": "Estudo — a estrutura das 72 horas, item por item (prazos, textos originais e explicação)", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "2026-07-09", "tags": "[estudo, war-room, 72h, prazos, aprofundamento]", "grupo": "conceitos", "caminho": "conceitos/estudo-72h-aprofundamento.md", "quando": "2026-07-14"}, "meta": {"id": "estudo-72h-aprofundamento", "tipo": "conceito", "titulo": "Estudo — a estrutura das 72 horas, item por item (prazos, textos originais e explicação)", "orgao": "", "data_publicacao": "2026-07-09", "status": "fichado", "tags": "[estudo, war-room, 72h, prazos, aprofundamento]", "confidencial": "false"}, "corpo": "\n# A estrutura das 72 horas — aprofundamento técnico\n\nDocumento de estudo. Cada item traz: o que fazer, o prazo, o **texto original** da norma (transcrito da fonte primária — Resoluções BCB obtidas do inteiro teor oficial em bcb.gov.br; LGPD do Planalto; Res. CD/ANPD 15/2024 conforme verificação no DOU de 26/04/2024), um resumo objetivo e a explicação didática. Ao final, as lacunas de verificabilidade.\n\n## Visão geral — a linha do tempo e os dois relógios\n\n| Janela | Ação central | Relógio | Fonte |\n|---|---|---|---|\n| 1ª hora | Registrar o conhecimento + acionar a recuperação de valores | O dinheiro pulveriza em minutos | Res. BCB 493/2025, art. 78-N |\n| Manhã | Teste de risco relevante + abrir o registro de incidente | 3 dias úteis começam a correr | Res. CD/ANPD 15/2024, arts. 5º e 6º |\n| Dia 1-3 | Decisão fundamentada de comunicar + preservação forense + narrativa única | Vencimento dos 3 dias úteis | LGPD, art. 48; Res. 15/2024 |\n| Semana 1+ | Preparar a defesa consumerista com a trilha probatória | A onda de processos | Súmula 479/STJ; Tema 1198/STJ |\n\nA ideia-força: correm **dois relógios paralelos** — o do dinheiro (Pix/MED, medido em minutos) e o dos dados (ANPD, medido em dias úteis). O war room existe para que nenhum dos dois estoure, e para que cada passo deixe rastro documental que vira defesa depois.\n\n---\n\n## Bloco 1 — Primeira hora\n\n### 1.1 Registrar o momento do conhecimento\n\n**O que é.** Anotar formalmente (ata, e-mail com hora, registro no sistema) QUANDO a instituição soube do incidente e, separadamente, quando soube que ele afetou dados pessoais.\n\n**Por que é a primeira ação.** O prazo de comunicação à ANPD não conta da invasão nem da reclamação do cliente — conta do conhecimento pelo controlador de que dados pessoais foram afetados (Res. CD/ANPD 15/2024, art. 6º, §1º — ver Bloco 3). Quem não registra o marco zero não consegue provar depois que comunicou no prazo. É prova que só existe se for contemporânea.\n\n**Didaticamente:** é o \"carimbo de ponto\" da crise. Sem ele, qualquer discussão futura sobre tempestividade vira palavra contra palavra — e a dúvida corre contra a instituição.\n\n### 1.2 Acionar a recuperação de valores (MED 2.0)\n\n**Texto original** (Resolução BCB nº 493/2025, alterando o regulamento do Pix — inteiro teor oficial, bcb.gov.br; DOU 29/08/2025, S.1, p. 187):\n\n> Art. 54, XII — \"recuperação de valores: procedimento de rastreamento, de bloqueio e de devolução de valores no âmbito do Pix decorrente de suspeita de fraude na transação.\"\n\n> Art. 78-N — \"O procedimento de recuperação de valores deverá ser iniciado pelo participante prestador de serviço de pagamento do usuário pagador quando houver fundada suspeita de que a transação Pix tenha sido realizada de forma fraudulenta após reclamação do usuário pagador. Parágrafo único. As regras e os procedimentos operacionais da recuperação de valores serão detalhados no Manual Operacional do DICT.\"\n\n> Art. 121 — \"A funcionalidade de recuperação de valores de que trata o art. 54, caput, inciso XII: I - poderá ser implementada facultativamente pelos participantes do Pix a partir de 23 de novembro de 2025; e II - deverá ser implementada obrigatoriamente pelos participantes do Pix nas modalidades provedor de conta transacional e liquidante especial a partir de 2 de fevereiro de 2026.\"\n\n> Art. 4º (da Resolução) — \"Esta Resolução entra em vigor na data de sua publicação produzindo efeitos: I - em 2 de fevereiro de 2026, para o art. 3º; e II - imediatos, para os demais artigos.\"\n\n**Resumo.** Dois requisitos cumulativos para instaurar: reclamação do usuário pagador + fundada suspeita de fraude. Quem instaura é o PSP do PAGADOR. Boletim de ocorrência não é requisito. Obrigatório desde 02/02/2026 para provedores de conta transacional e liquidantes especiais.\n\n**Explicação didática.** O MED original congelava só a primeira conta de destino; o MED 2.0 segue o dinheiro pelos saltos da cadeia de laranjas, bloqueando o que encontrar em cada conta — e a devolução é limitada ao saldo bloqueado. Tradução operacional: cada minuto de espera é dinheiro que sai do alcance. Por isso a decisão da 1ª hora não é jurídica sofisticada, é executiva: formar a \"fundada suspeita\" rápido (sinais: horário, valor, destinatário novo, sequência de transações) e documentar com hora — porque esse mesmo registro vira, meses depois, a prova de diligência na onda consumerista.\n\n**Atenção (verificabilidade).** O parágrafo único do art. 78-N remete TODO o detalhamento operacional (janelas de bloqueio, número de saltos, prazos de análise e devolução) ao Manual Operacional do DICT. A versão 8.4 do Manual foi divulgada pela IN BCB nº 752/2026 (capturada pelo monitor, status a_fichar). Antes de desenhar o playbook-modelo com prazos operacionais internos do MED, é obrigatório fichar essa IN — nenhum prazo interno do MED deve ser afirmado sem ela.\n\n---\n\n## Bloco 2 — Manhã do dia 1\n\n### 2.1 O teste do risco relevante (art. 5º)\n\n**Teor** (Res. CD/ANPD nº 15/2024, art. 5º, conforme verificação no DOU de 26/04/2024 — conferir inteiro teor ao citar em peça): o incidente deve ser comunicado quando puder acarretar risco ou dano relevante aos titulares, assim entendido o que afeta significativamente interesses e direitos fundamentais E, cumulativamente, envolva ao menos um critério objetivo: dados sensíveis; dados de crianças, adolescentes ou idosos; dados financeiros; dados de autenticação em sistemas; dados protegidos por sigilo legal, judicial ou profissional; ou dados em larga escala.\n\n**Resumo.** Teste em duas etapas cumulativas: (1) afetação significativa + (2) pelo menos um critério objetivo. Dado financeiro sozinho não dispara comunicação.\n\n**Explicação didática.** Pense num interruptor de duas chaves: as duas precisam estar ligadas. Num golpe Pix típico há quase sempre a chave 2 (dados financeiros, dados de autenticação); a análise da manhã concentra-se na chave 1 — houve incidente no ambiente do controlador? A afetação é significativa? Essa análise deve ser roteirizada (quem avalia, com que perguntas, em que documento), porque a decisão precisa nascer fundamentada por escrito — comunicar ou não comunicar são AMBAS decisões defensáveis, desde que documentadas.\n\n### 2.2 Abrir o registro de incidente\n\n**Teor** (Res. CD/ANPD 15/2024, Regulamento): obrigação de registrar TODOS os incidentes de segurança, inclusive os não comunicados, por prazo mínimo de cinco anos contado da data do registro, com conteúdo mínimo (data de conhecimento, descrição das circunstâncias, natureza dos dados, avaliação de risco, medidas adotadas).\n\n**Explicação didática.** O registro é o \"diário de bordo\" obrigatório — e a sua ausência é infração autônoma. A lógica que o cliente precisa entender: registrar não é confessar; é construir a prova da própria diligência. Registro reconstituído a posteriori a partir de logs não cumpre a norma (que exige data de conhecimento) e tem valor probatório fragilizado.\n\n---\n\n## Bloco 3 — Dias 1 a 3\n\n### 3.1 A decisão de comunicar ANPD e titulares\n\n**Texto original** (Lei nº 13.709/2018 — LGPD, art. 48, planalto.gov.br):\n\n> \"Art. 48. O controlador deverá comunicar à autoridade nacional e ao titular a ocorrência de incidente de segurança que possa acarretar risco ou dano relevante aos titulares. § 1º A comunicação será feita em prazo razoável, conforme definido pela autoridade nacional, e deverá mencionar, no mínimo: I - a descrição da natureza dos dados pessoais afetados; II - as informações sobre os titulares envolvidos; III - a indicação das medidas técnicas e de segurança utilizadas para a proteção dos dados, observados os segredos comercial e industrial; IV - os riscos relacionados ao incidente; V - os motivos da demora, no caso de a comunicação não ter sido imediata; e VI - as medidas que foram ou que serão adotadas para reverter ou mitigar os efeitos do prejuízo.\"\n\n**Teor do prazo** (Res. CD/ANPD 15/2024, art. 6º, caput e §1º, conforme verificação no DOU): \"A comunicação de incidente de segurança à ANPD deverá ser realizada pelo controlador no prazo de três dias úteis, ressalvada a existência de prazo para comunicação previsto em legislação específica\", contado \"do conhecimento pelo controlador de que o incidente afetou dados pessoais\".\n\n**Resumo.** O \"prazo razoável\" do art. 48, §1º da LGPD foi concretizado pela ANPD em três dias úteis, com termo inicial no conhecimento da afetação de dados pessoais. O §1º do art. 48 é, na prática, o checklist do conteúdo da comunicação — repare no inciso V: a própria lei prevê a justificativa de demora, mais uma razão para o registro do marco zero.\n\n**Explicação didática.** O erro clássico é contar o prazo do evento (a invasão) ou da reclamação. O termo inicial é cognitivo: quando o controlador soube que dados pessoais foram afetados. Isso protege a instituição diligente (a perícia pode revelar a afetação semanas depois — o prazo nasce ali) e pune a negligente (não investigar não suspende o relógio; a ANPD avalia a razoabilidade da apuração). Corolário: a linha do tempo da apuração deve ser documentada com o mesmo rigor do incidente.\n\n### 3.2 Preservação forense com cadeia de custódia\n\n**O que é.** Congelar as evidências digitais (logs de transação, telemetria de dispositivo, registros de acesso, imagens de sistemas) de forma que a integridade e a origem sejam demonstráveis em juízo — quem coletou, quando, como, com que hash, quem custodiou.\n\n**Base normativa.** A Res. BCB 85/2021 (na redação da Res. 538/2025) exige testes de intrusão com resultados documentados e planos de correção (art. 22-A, III — texto original: \"ter os resultados de sua execução documentados, especialmente as eventuais vulnerabilidades que forem identificadas e os planos de ação estabelecidos para suas correções\"). Para o padrão de cadeia de custódia em si, o parâmetro normativo é o CPP, arts. 158-A a 158-F (incluídos pela Lei nº 13.964/2019) — nascidos para a prova penal, usados por analogia como régua de melhor prática na prova cível/regulatória (marcar como parâmetro, conferir na minuta).\n\n**Explicação didática.** A tese de fortuito externo (Bloco 4) morre se a prova técnica for impugnável. Log sem hash, coleta sem ata, perícia sobre sistema alterado — tudo isso transforma prova em indício. Por isso o parceiro de forense entra nas primeiras horas, não na semana 2: prova digital é perecível e a coleta correta não se refaz.\n\n### 3.3 Narrativa única para reguladores\n\n**O que é.** Um documento-mestre de fatos (o que se sabe, desde quando, o que foi feito) do qual derivam TODAS as comunicações: BCB, ANPD, seguradora, clientes, imprensa. Inconsistência entre canais vira prova adversa — a comunicação à ANPD que contradiz o aviso de sinistro à seguradora é presente para o autor da ação.\n\n**Atenção (verificabilidade).** A obrigação e o prazo de comunicação de incidente relevante AO BCB decorrem da Res. BCB 85/2021 consolidada, ainda não fichada — NAO_CONFIRMADO neste documento. Fichar a norma-base antes de fixar esse item no playbook.\n\n---\n\n## Bloco 4 — Semana 1 em diante\n\n### 4.1 A moldura: Súmula 479 e a chave interno × externo\n\n**Texto original** (STJ, Segunda Seção, j. 27/06/2012, DJe 1º/08/2012): \"As instituições financeiras respondem objetivamente pelos danos gerados por fortuito interno relativo a fraudes e delitos praticados por terceiros no âmbito de operações bancárias.\"\n\n**Explicação didática.** Responsabilidade objetiva significa: não se discute culpa, discute-se a qualificação do evento. A chave de leitura extraída do dossiê de precedentes ([[dossie-pix-fortuito]]): houve falha autônoma da instituição (vazamento, transação atípica não barrada, conta recebedora aberta sem diligência)? Fortuito interno — paga. A fraude correu inteira fora do ambiente do banco, com atos voluntários da vítima no seu padrão de uso? Fortuito externo/culpa exclusiva (CDC, art. 14, §3º) — não paga. Tudo que os Blocos 1-3 mandam documentar existe para responder essa pergunta a favor do cliente.\n\n### 4.2 A onda e a litigância predatória\n\nCom a tese pronta, a semana 1+ organiza a defesa em escala: contestação-padrão ancorada na trilha probatória, triagem da massa separando vítimas legítimas de padrões predatórios (petições clonadas, procurações viciadas), e o instrumento processual do [[stj-tema-1198]] (Corte Especial, 13/03/2025): o juiz pode exigir emenda fundamentada diante de indícios de litigância abusiva. Reforço institucional: Recomendação CNJ 159/2024 e NUMOPEDE ([[hub-litigancia-predatoria]]).\n\n---\n\n## O playbook e os papéis (por que \"assinado antes\")\n\nNada do que está acima pode ser decidido às 3h da manhã por consenso improvisado. O playbook é o documento que fixa ANTES: quem recebe a reclamação, quem forma a fundada suspeita, quem aciona o MED, quem roda o teste do art. 5º, quem decide comunicar, quem fala com cada regulador, quando o forense é convocado — com nomes, suplentes e critérios de convocação. A exigência de critérios documentados de configuração de crise tem base expressa na Res. BCB 85/2021, art. 20, parágrafo único (redação da Res. 538/2025). \"Assinado\" importa: playbook sem aprovação da diretoria não protege quem o executa às 3h. É o entregável central do retainer; o mapeamento de quem executa cada frente na banca está em governança interna do projeto.\n\n## O instrumento de regência\n\nA [[hub-matriz-prazos]] consolida todos os relógios num único lugar — é o que o coordenador olha durante a crise (e o que o simulador usa para avaliar você no treino). Este documento explica; a matriz comanda.\n\n## Lacunas consolidadas deste estudo\n\n1. RESOLVIDO (2026-07-14, leitura do Manual DICT v8.4 — [[bcb-ingest-instrucao-normativa-bcb-752-2026-07-01]]): instauração IMEDIATA após a reclamação/suspeita; contestação em até 80 dias corridos (pacs.008) ou 30 (pacs.004); bloqueio imediato na cadeia até o saldo disponível; análise da notificação em 7 dias; 72 horas para iniciar a devolução após a análise, sob pena de conclusão automática. Pendente apenas: prazo de EFETIVAÇÃO da devolução pelo recebedor (Manual de Tempos do Pix, não lido).\n2. RESOLVIDO (2026-07-14 — [[bcb-res-85-2021]]): comunicação de incidente ao BCB NÃO tem prazo fixado — \"tempestiva\" quando configurada crise pelos critérios documentados da própria instituição (art. 20, III e p.u.).\n3. Res. CD/ANPD 15/2024: teores dos arts. 5º e 6º transcritos da verificação no DOU; conferir inteiro teor oficial ao citar em peça.\n4. CPP arts. 158-A a 158-F como régua de cadeia de custódia no cível: uso por analogia — conferir redação na minuta.\n\n## Relações\n\n[[hub-matriz-prazos]] · [[hub-catalogo-medidas]] · [[bcb-res-493-2025]] · [[anpd-res-cd-15-2024]] · [[bcb-res-538-2025]] · [[stj-sumula-479]] · [[dossie-pix-fortuito]] · [[stj-tema-1198]] · governança interna do projeto\n"}, {"info": {"id": "hub-anpd-lgpd", "titulo": "Hub — ANPD e LGPD", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "", "tags": "[hub, anpd, lgpd, incidente]", "grupo": "hubs", "caminho": "hubs/hub-anpd-lgpd.md", "quando": "2026-07-03"}, "meta": {"id": "hub-anpd-lgpd", "tipo": "conceito", "titulo": "Hub — ANPD e LGPD", "status": "fichado", "tags": "[hub, anpd, lgpd, incidente]", "confidencial": "false"}, "corpo": "\n# Hub — ANPD e LGPD\n\nNó estrutural do tema proteção de dados: obrigações da Lei nº 13.709/2018 (LGPD) e regulamentos da ANPD relevantes para incidentes de segurança em fintechs.\n\n## Unidades\n\n- [[anpd-res-cd-15-2024]] — regulamento de comunicação de incidente de segurança (art. 48 da LGPD).\n\n## Pendências de fichamento\n\n- Lei nº 13.709/2018 (LGPD), arts. 46–52 — ainda não fichada como unidade própria.\n- Resolução CD/ANPD nº 4/2023 (dosimetria de sanções) — ainda não fichada.\n\n## Relações\n\n[[hub-seguranca-cibernetica]] · [[hub-matriz-prazos]] · [[hub-jurisprudencia-consumerista]]\n"}, {"info": {"id": "hub-catalogo-medidas", "titulo": "Hub — Catálogo de medidas do war room (arsenal consolidado)", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "", "tags": "[hub, war-room, medidas, arsenal]", "grupo": "hubs", "caminho": "hubs/hub-catalogo-medidas.md", "quando": "2026-07-23"}, "meta": {"id": "hub-catalogo-medidas", "tipo": "conceito", "titulo": "Hub — Catálogo de medidas do war room (arsenal consolidado)", "status": "fichado", "tags": "[hub, war-room, medidas, arsenal]", "confidencial": "false"}, "corpo": "\n# Catálogo de medidas — o arsenal do war room\n\nConsolidação de TODAS as frentes de ação disponíveis num incidente de fraude, organizadas por natureza. Complementa a [[hub-matriz-prazos]] (que diz *quando*) dizendo *o quê* e *com que fundamento*. Fundamentos marcados \"conferir\" devem ser validados na fonte antes de constar em minuta.\n\n## A. Frente administrativa-regulatória (primeiras horas)\n\n- Acionamento da recuperação de valores / MED 2.0 — rastreio, bloqueio em cadeia e devolução ([[bcb-res-493-2025]], arts. 54, XII e 78-N). Requisitos: reclamação do usuário + fundada suspeita, documentados com hora.\n- Comunicação de incidente relevante ao BCB — obrigação da Res. BCB 85/2021 (norma-base ainda não fichada — prazo e forma: PENDENTE de verificação).\n- Interlocução com os PSPs da cadeia (recebedor e saltos seguintes) pelos canais do arranjo Pix.\n- Registro interno de crise conforme critérios documentados ([[bcb-res-538-2025]], art. 20, p.u.).\n\n## B. Frente de proteção de dados (relógio de 3 dias úteis)\n\n- Registro formal do momento do conhecimento (marco zero — [[anpd-res-cd-15-2024]], art. 6º, §1º).\n- Teste de risco relevante (art. 5º: afetação significativa + critério objetivo) com decisão fundamentada por escrito.\n- Comunicação à ANPD e aos titulares, quando devida; registro de TODOS os incidentes por 5 anos, mesmo sem comunicação.\n- Avaliação de comunicação a outros controladores/operadores afetados na cadeia (fundamento contratual/LGPD — analisar caso a caso).\n\n## C. Frente cível (recuperação e contenção)\n\n- Tutela de urgência cautelar para bloqueio judicial de valores na cadeia de contas-laranja (arresto/sequestro), complementando o alcance administrativo do MED.\n- Produção antecipada de provas (CPC, art. 381) — cristalizar logs, telemetria e perícia antes do perecimento.\n- Exibição de documentos contra PSPs recebedores (dados KYC das contas de destino) — conferir cabimento e via na minuta.\n- Ação de ressarcimento contra fraudador e titulares de contas-laranja; desconsideração/extensão quando pessoa jurídica de fachada.\n- Ação de regresso contratual contra PSTI/prestador de tecnologia comprometido.\n- Ata notarial de páginas, perfis e conversas fraudulentas (prova de autenticidade).\n\n## D. Frente criminal\n\n- Notícia-crime por fraude eletrônica (CP, art. 171, §2º-A, incluído pela Lei nº 14.155/2021).\n- Invasão de dispositivo informático (CP, art. 154-A), organização criminosa (Lei nº 12.850/2013) e lavagem (Lei nº 9.613/1998), conforme o caso — conferir enquadramentos na minuta.\n- Representação e cooperação com PF/polícias civis (laboratórios de cibercrime); é a via para quebras de sigilo que o cível não alcança.\n- Sindicância interna quando houver suspeita de insider (vetor do caso C&M) — interface trabalhista e criminal, com cadeia de custódia da apuração.\n\n## E. Ofícios e extrajudicial (velocidade sem juiz)\n\n- Ofícios/notificações a PSPs recebedores: preservação de logs e KYC, bloqueio cautelar voluntário.\n- Notificações a plataformas (Meta/WhatsApp, Telegram, marketplaces) para remoção de perfis e anúncios fraudulentos (takedown) e preservação de dados (Marco Civil, art. 13 e ss. — conferir na minuta).\n- Registro.br / provedores de hospedagem: derrubada de domínios e páginas clonadas.\n- Operadoras de telecom: preservação de registros vinculados a linhas usadas no golpe (via ofício judicial, em regra).\n- Aviso de sinistro à seguradora (própria e/ou do PSTI — [[bcb-res-494-498-2025]], Res. 498, art. 17, XIII) nos prazos da apólice.\n\n## F. Inteligência e pesquisa (pré-incidente, incidente e atribuição)\n\nVer o modelo das três camadas em [[camadas-da-fraude]]: esta frente deixa de ser só forense pós-incidente e passa a cobrir também vigilância ANTES do golpe e atribuição da estrutura criminosa.\n\n- Vigilância PRÉ-incidente (camada 2): monitoramento contínuo de exposição do cliente — dados/credenciais à venda em fóruns e dark web, menções, kits de golpe — antes de o incidente se consumar (parceiro de threat intelligence).\n- OSINT sobre beneficiários das contas de destino (vínculos societários, padrões de laranja).\n- Análise de vínculos entre contas/incidentes (grafo de reincidência — insumo para predatória e para o criminal).\n- Rastreamento de conversão em cripto (chain analysis, com parceiro especializado) quando os valores saem do Pix.\n- ATRIBUIÇÃO (camada 3): identificar a estrutura por trás (fraud-as-a-service) — o que transforma bloqueio de laranja em persecução criminal real e recuperação com alcance. Parceiro técnico coordenado juridicamente; parceiro em avaliação em parceiro técnico em avaliação.\n\n## G. Apoio técnico externo (forense, DFIR, hackers éticos)\n\n- Forense digital: imagem de sistemas e dispositivos, preservação com cadeia de custódia, laudo pericial.\n- DFIR (resposta a incidente): contenção, erradicação, análise de vetor — o par técnico do war room jurídico.\n- Apuração de INSIDER (camada 2): quando a origem é interna, investigação simultânea trabalhista + criminal + forense, com cadeia de custódia reforçada (a prova precisa sobreviver às duas jurisdições).\n- Antifraude/telemetria: reconstrução dos sinais pré-transação (device, geolocalização, biometria comportamental) para a tese de fortuito externo.\n- Pentest/red team pós-incidente: fechar o vetor e documentar correção ([[bcb-res-538-2025]], art. 22-A — testes com planos de correção).\n\n## H. Comunicação de crise e stakeholders\n\n- Narrativa única e controlada para BCB, ANPD, seguradora, clientes, imprensa e investidores — inconsistência entre canais vira prova adversa.\n- Roteiro de atendimento às vítimas (o que dizer e o que não prometer) — reduz a onda consumerista e a predatória.\n\n## I. Frente consumerista (a onda — fase recuperação/defesa)\n\n- Contestação estruturada na tese fortuito externo/culpa exclusiva ([[stj-sumula-479]]; CDC, art. 14, §3º) com o dossiê probatório das frentes A-G.\n- Triagem de litigância predatória (petições clonadas, procurações viciadas) e impugnações concentradas; uso de IA governada ([[cnj-res-615-2025]]).\n- Gestão de acordos seletiva (critérios, não padrão) para não alimentar o incentivo à massa.\n\n## Lacunas\n\n- Prazo/forma da comunicação de incidente ao BCB (Res. 85/2021 consolidada): NAO_CONFIRMADO — fichar a norma-base.\n- Fundamentos marcados \"conferir na minuta\": art. 154-A CP, Lei 12.850, Lei 9.613, Marco Civil art. 13, cabimento de exibição contra terceiro — verificar texto legal ao redigir.\n- Mecânica operacional dos ofícios interbancários no arranjo Pix (canais, SLAs): depende do Manual do DICT — fichar IN 752/2026.\n\n## Relações\n\n[[hub-matriz-prazos]] · [[hub-pix-med]] · [[hub-anpd-lgpd]] · [[hub-jurisprudencia-consumerista]] · [[hub-litigancia-predatoria]] · [[hub-seguranca-cibernetica]]\n"}, {"info": {"id": "hub-jurisprudencia-consumerista", "titulo": "Hub — Jurisprudência consumerista", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "", "tags": "[hub, jurisprudencia, consumidor, fortuito-interno]", "grupo": "hubs", "caminho": "hubs/hub-jurisprudencia-consumerista.md", "quando": "2026-07-07"}, "meta": {"id": "hub-jurisprudencia-consumerista", "tipo": "conceito", "titulo": "Hub — Jurisprudência consumerista", "status": "fichado", "tags": "[hub, jurisprudencia, consumidor, fortuito-interno]", "confidencial": "false"}, "corpo": "\n# Hub — Jurisprudência consumerista\n\nNó estrutural da responsabilidade civil de instituições financeiras e de pagamento perante consumidores vítimas de fraude — base da fase de recuperação/defesa (onda consumerista pós-incidente).\n\n## Unidades\n\n- [[stj-sumula-479]] — responsabilidade objetiva por fortuito interno em fraudes bancárias.\n- [[dossie-pix-fortuito]] — 10 precedentes STJ (2011-2026) sobre fortuito interno × externo em golpes Pix/engenharia social, com a chave de leitura: o critério é a existência de falha autônoma da instituição, não o tipo de golpe.\n\n## Pendências de fichamento\n\n- Afetação repetitiva/IAC sobre engenharia social: não localizada até 2026-07-07 — a divergência 3ª × 4ª Turmas é candidata; monitorar.\n- Fichas individuais dos acórdãos-chave do dossiê (desmembrar sob demanda de minuta).\n\n## Relações\n\n[[hub-litigancia-predatoria]] · [[hub-pix-med]] · [[hub-matriz-prazos]]\n"}, {"info": {"id": "hub-litigancia-predatoria", "titulo": "Hub — Litigância predatória", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "", "tags": "[hub, litigancia-predatoria, contencioso]", "grupo": "hubs", "caminho": "hubs/hub-litigancia-predatoria.md", "quando": "2026-07-07"}, "meta": {"id": "hub-litigancia-predatoria", "tipo": "conceito", "titulo": "Hub — Litigância predatória", "status": "fichado", "tags": "[hub, litigancia-predatoria, contencioso]", "confidencial": "false"}, "corpo": "\n# Hub — Litigância predatória\n\nNó estrutural do tema litigância predatória/abusiva na onda consumerista pós-incidente — defesa adversarial na fase de recuperação.\n\n## Unidades\n\n- [[stj-tema-1198]] — repetitivo (Corte Especial, 13/03/2025): juiz pode exigir emenda fundamentada diante de indícios de litigância abusiva. A alavanca processual central.\n- [[cnj-rec-159-2024]] — Recomendação CNJ sobre litigância abusiva (o ato certo — NÃO confundir com a Rec. 127/2022, que trata de assédio judicial à liberdade de expressão).\n- [[cnj-res-615-2025]] — governança de IA no Judiciário (uso defensável de IA na triagem da massa).\n\n## Referências operacionais verificadas\n\n- NUMOPEDE/TJSP: criado pela Corregedoria em set/2016 (Comunicado CG nº 1757/2016, Proc. 2016/163905); Comunicado CG nº 02/2017 orienta juízes sobre demandas predatórias; enunciados EPM/TJSP publicados. Relatório 2016-2021: ~330 mil processos atípicos, custo estimado R$ 2,7 bi/ano. Modelo replicado (TJAM NT 01/2022, TJPR, TJPB).\n- Precedentes de aplicação (TJSP): Ap. 1009643-53.2024.8.26.0606 (14ª Câm. Dir. Privado, rel. Des. César Zalaf, set/2025 — extinção mantida + comunicação ao NUMOPEDE, fonte Migalhas); proc. 1011910-66.2022.8.26.0606 (4ª V. Cível Suzano, 2023 — extinção + má-fé por ação sem consentimento da autora, fonte oficial TJSP).\n- Dado quantitativo: Diagnóstico CNJ/ABJ sobre litigância abusiva (dez/2025) — 129 mil+ processos mencionam o fenômeno; 34,7 mil no 1º sem/2025. NÃO usar \"estudo da AMB\": não confirmado em fonte primária.\n\n## Pendências de fichamento\n\n- DJe do acórdão do Tema 1198: conferir antes de citar em peça.\n\n## Relações\n\n[[hub-jurisprudencia-consumerista]] · [[hub-matriz-prazos]]\n"}, {"info": {"id": "hub-matriz-prazos", "titulo": "Hub — Matriz consolidada de prazos ANPD/BACEN/MED", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "", "tags": "[hub, prazos, matriz]", "grupo": "hubs", "caminho": "hubs/hub-matriz-prazos.md", "quando": "2026-07-15"}, "meta": {"id": "hub-matriz-prazos", "tipo": "conceito", "titulo": "Hub — Matriz consolidada de prazos ANPD/BACEN/MED", "status": "fichado", "tags": "[hub, prazos, matriz]", "confidencial": "false"}, "corpo": "\n# Matriz consolidada de prazos — ANPD / BACEN / MED\n\nFonte única de prazos para o playbook de incidente e para o simulador de estudo de caso (Módulo 3). Só entram prazos confirmados em fonte primária; cômputos aritméticos vêm marcados. Datas em ordem cronológica.\n\n## Prazos operacionais (correm a partir de um evento)\n\n| Prazo | Termo inicial | Obrigação | Fonte |\n|---|---|---|---|\n| 3 dias úteis | Conhecimento pelo controlador de que o incidente afetou dados pessoais | Comunicar incidente com risco/dano relevante à ANPD (e aos titulares) | [[anpd-res-cd-15-2024]], art. 6º do Regulamento |\n| 5 anos (mínimo) | Data do registro | Manter registro de todos os incidentes, inclusive não comunicados | [[anpd-res-cd-15-2024]] |\n| Reclamação do usuário | Fundada suspeita de fraude | PSP do pagador instaura a recuperação de valores (rastreio/bloqueio/devolução) | [[bcb-res-493-2025]], art. 78-N do regulamento do Pix |\n| 24 horas | Identificação do indício de fraude (ou da necessidade de alterar/excluir) | Registrar/alterar/excluir o indício no sistema de compartilhamento | [[bcb-res-343-2023]], art. 4º |\n| Dia 15 de cada mês | Mês anterior | Declaração de conformidade do compartilhamento de indícios | [[bcb-res-343-2023]], art. 5º |\n\n| \"Tempestiva\" (SEM prazo fixado) | Incidente relevante que configure crise, pelos critérios documentados da própria instituição | Comunicar ao BCB o incidente e as providências de reinício | [[bcb-res-85-2021]], art. 20, III e p.u. |\n| 10 dias | Contratação/alteração de serviço relevante (incl. PSTI de mensageria) | Comunicar a contratação ao BCB | [[bcb-res-85-2021]], arts. 15, §2º e 22-B |\n\n| Imediata | Reclamação do usuário ou identificação da suspeita | Instaurar a Recuperação de Valores (a análise de mérito vem depois) | [[bcb-ingest-instrucao-normativa-bcb-752-2026-07-01]], Manual DICT v8.4, seção 20 |\n| 80 dias corridos (pacs.008) / 30 (pacs.004) | Transação contestada | Janela máxima de contestação para instaurar o MED | Manual DICT v8.4, seção 20.1.1 |\n| Imediato | Recebimento da notificação na cadeia | Bloquear recursos até o limite do saldo disponível | Manual DICT v8.4, seção 20.1.4 |\n| 7 dias | Notificação de infração | Informar ao DICT o resultado da análise | Manual DICT v8.4 / Manual de Tempos do Pix |\n| 72 horas | Encerramento da análise | Iniciar a etapa de devolução — sob pena de conclusão automática do procedimento | Manual DICT v8.4, seção 20.1.6 |\n\n| 30 min (ANS 95%) | Reclamação do usuário no canal | Abrir a notificação de infração/recuperação de valores | [[manual-tempos-pix]], Manual de Tempos 4.2.2.7 |\n| 6 horas (ANS 99%) | Solicitação de devolução por fundada suspeita | PSP recebedor concluir/efetivar a devolução | [[manual-tempos-pix]], Manual de Tempos 4.2.1.8 |\n| Até 72 horas | Suspeita de fraude | Bloqueio cautelar de valores pelo PSP do recebedor | [[manual-tempos-pix]], Guia MED v4.3 |\n\nATENÇÃO metodológica: os tempos do Manual de Tempos são ANS por PERCENTIL (metas de nível de serviço), não prazos peremptórios caso a caso — citar sempre com essa nuance.\n\n## Marcos de adequação (datas fixas de calendário)\n\n| Data | Marco | Fonte |\n|---|---|---|\n| 2025-11-23 | Implementação facultativa da recuperação de valores (MED 2.0) | [[bcb-res-493-2025]], art. 121 |\n| 2026-01-01 a 2026-05-01 | Janela de pedido de autorização — IPs participantes do Pix | [[bcb-res-494-498-2025]] (Res. 496) |\n| ~2026-01-05 | Teto de 4 meses para pedido de credenciamento de PSTIs em funcionamento (cômputo aritmético — conferir) | [[bcb-res-494-498-2025]] (Res. 498, art. 37, §3º) |\n| 2026-02-02 | Implementação obrigatória da recuperação de valores (provedores de conta transacional e liquidantes especiais) | [[bcb-res-493-2025]], arts. 4º, I e 121 |\n| 2026-03-01 | Prazo final de adequação à nova redação da Res. BCB 85/2021 (segurança cibernética) | [[bcb-res-538-2025]], art. 2º |\n| ~2026-03-04 | Efeitos das alterações ao art. 26 do regulamento do Pix — 180 dias (cômputo aritmético — conferir) | [[bcb-res-494-498-2025]] (Res. 496) |\n| 2026-05-01 a 2026-05-31 | Janela de protocolo de pedido de autorização — IPs pré-existentes não autorizadas | [[bcb-res-494-498-2025]] (Res. 494) |\n| ~2026-07-12 | Fim dos 12 meses de adequação de projetos de IA dos tribunais (cômputo aritmético — conferir) | [[cnj-res-615-2025]], art. 45, p.u. |\n| 2026-10-30 | Adequação do compartilhamento de indícios para ativos virtuais | [[bcb-res-343-2023]], art. 13-A, I |\n| 2026-12-01 | Adequação do compartilhamento para operadoras de apostas não autorizadas | [[bcb-res-569-2026]]; Res. 343, art. 13-A, II |\n\n## Lacunas\n\n- \"Produção plena do MED 2.0 em 11/6/2026\": NAO_CONFIRMADO em fonte primária — não incluído na matriz (ver [[bcb-res-493-2025]]).\n- RESOLVIDO (2026-07-14): comunicação de incidente ao BCB não tem prazo fixado — padrão \"tempestiva\" condicionado aos critérios de crise autodocumentados ([[bcb-res-85-2021]]).\n\n## Relações\n\n[[hub-pix-med]] · [[hub-seguranca-cibernetica]] · [[hub-anpd-lgpd]] · [[hub-jurisprudencia-consumerista]] · [[hub-litigancia-predatoria]] · [[hub-catalogo-medidas]]\n"}, {"info": {"id": "hub-pix-med", "titulo": "Hub — Pix e MED", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "", "tags": "[hub, pix, med]", "grupo": "hubs", "caminho": "hubs/hub-pix-med.md", "quando": "2026-07-03"}, "meta": {"id": "hub-pix-med", "tipo": "conceito", "titulo": "Hub — Pix e MED", "status": "fichado", "tags": "[hub, pix, med]", "confidencial": "false"}, "corpo": "\n# Hub — Pix e MED\n\nNó estrutural do tema Pix e Mecanismo Especial de Devolução. Agrupa o regulamento do Pix (Resolução BCB nº 1/2020) e suas alterações, com destaque para o MED 2.0.\n\n## Unidades\n\n- [[bcb-res-493-2025]] — MED 2.0 (rastreio em múltiplos saltos, devolução parcial), altera a Resolução BCB nº 1/2020.\n\n## Pendências de fichamento\n\n- Resolução BCB nº 1/2020 (regulamento base do Pix) — ainda não fichada.\n- Comunicados/instruções normativas do BCB detalhando o manual operacional do MED — ainda não fichados.\n\n## Relações\n\n[[hub-matriz-prazos]] · [[hub-seguranca-cibernetica]] · [[hub-jurisprudencia-consumerista]]\n"}, {"info": {"id": "hub-seguranca-cibernetica", "titulo": "Hub — Segurança cibernética (BCB)", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "", "tags": "[hub, seguranca-cibernetica, psti]", "grupo": "hubs", "caminho": "hubs/hub-seguranca-cibernetica.md", "quando": "2026-07-03"}, "meta": {"id": "hub-seguranca-cibernetica", "tipo": "conceito", "titulo": "Hub — Segurança cibernética (BCB)", "status": "fichado", "tags": "[hub, seguranca-cibernetica, psti]", "confidencial": "false"}, "corpo": "\n# Hub — Segurança cibernética (BCB)\n\nNó estrutural do tema segurança cibernética de instituições de pagamento e prestadores relevantes (PSTI).\n\n## Unidades\n\n- [[bcb-res-538-2025]] — altera a Resolução BCB nº 85/2021 (política de segurança cibernética de IPs).\n- [[bcb-res-494-498-2025]] — pacote: autorização prévia de IPs, requisitos para PSTI, seguro obrigatório de responsabilidade civil.\n\n## Pendências de fichamento\n\n- Resolução BCB nº 85/2021 (norma base alterada) — ainda não fichada.\n\n## Relações\n\n[[hub-pix-med]] · [[hub-anpd-lgpd]] · [[hub-matriz-prazos]]\n"}], "resumo": {"fichas": 51, "fichadas": 26, "a_fichar": 25}, "cartoes": [{"id": "med2-prazo-obrigatorio", "norma": "Resolução BCB nº 493/2025", "pergunta": "A partir de que data a recuperação de valores do MED 2.0 passou a ser de implementação obrigatória, e para quais modalidades de participantes do Pix?", "resposta": "A partir de 2 de fevereiro de 2026, para os participantes nas modalidades provedor de conta transacional e liquidante especial (art. 121 do regulamento do Pix, na redação da Resolução BCB nº 493/2025; efeitos cf. art. 4º, I). A implementação facultativa foi possível desde 23 de novembro de 2025.", "fonte": "Resolução BCB nº 493/2025, arts. 4º, I e 121 (DOU 29/08/2025, S.1, p. 187)"}, {"id": "med2-o-que-e-recuperacao", "norma": "Resolução BCB nº 493/2025", "pergunta": "O que é a \"recuperação de valores\" criada pelo MED 2.0 e quem a instaura?", "resposta": "Procedimento de rastreamento, de bloqueio e de devolução de valores no âmbito do Pix decorrente de suspeita de fraude na transação (art. 54, XII do regulamento do Pix). É instaurada pelo PSP do pagador, após reclamação do usuário, mediante fundada suspeita de fraude (art. 78-N).", "fonte": "Resolução BCB nº 493/2025 (DOU 29/08/2025), regulamento do Pix, arts. 54, XII e 78-N"}, {"id": "seguranca-cibernetica-adequacao", "norma": "Resolução BCB nº 538/2025", "pergunta": "Até quando as instituições em funcionamento devem se adequar às novas exigências de segurança cibernética da Resolução BCB nº 538/2025, e qual norma ela altera?", "resposta": "Até 1º de março de 2026 (art. 2º). Ela altera a Resolução BCB nº 85/2021 (política de segurança cibernética e contratação de processamento, armazenamento de dados e nuvem por IPs, corretoras e distribuidoras).", "fonte": "Resolução BCB nº 538/2025, art. 2º (DOU 22/12/2025, S.1, p. 448)"}, {"id": "anpd-prazo-comunicacao", "norma": "Resolução CD/ANPD nº 15/2024", "pergunta": "Qual o prazo para o controlador comunicar um incidente de segurança à ANPD e qual o termo inicial da contagem?", "resposta": "Três dias úteis, contados do conhecimento pelo controlador de que o incidente afetou dados pessoais, ressalvado prazo de legislação específica (art. 6º, caput e §1º, do Regulamento aprovado pela Resolução CD/ANPD nº 15/2024, que regulamenta o art. 48 da Lei nº 13.709/2018).", "fonte": "Resolução CD/ANPD nº 15/2024, art. 6º (DOU 26/04/2024, S.1, p. 114)"}, {"id": "anpd-registro-incidentes", "norma": "Resolução CD/ANPD nº 15/2024", "pergunta": "Incidentes de segurança que NÃO foram comunicados à ANPD precisam ser registrados? Por quanto tempo?", "resposta": "Sim. O controlador deve manter registro de todos os incidentes, inclusive dos não comunicados, por prazo mínimo de cinco anos contado da data do registro, com conteúdo mínimo (data de conhecimento, circunstâncias etc.).", "fonte": "Resolução CD/ANPD nº 15/2024, Regulamento de Comunicação de Incidente (DOU 26/04/2024)"}, {"id": "sumula-479-enunciado", "norma": "Súmula 479 do STJ", "pergunta": "Qual é o enunciado literal da Súmula 479 do STJ e qual a fronteira de defesa que ela deixa aberta?", "resposta": "\"As instituições financeiras respondem objetivamente pelos danos gerados por fortuito interno relativo a fraudes e delitos praticados por terceiros no âmbito de operações bancárias\" (Segunda Seção, j. 27/06/2012, DJe 1º/08/2012). A defesa gira em torno de caracterizar fortuito externo ou culpa exclusiva da vítima/terceiro (CDC, art. 14, §3º).", "fonte": "STJ, Súmula 479, Segunda Seção, DJe 1º/08/2012"}, {"id": "pacote-494-limite-pix", "norma": "Resoluções BCB nº 494-498/2025", "pergunta": "Qual limite por transação Pix foi imposto pela Resolução BCB nº 496/2025 e a quem ele se aplica?", "resposta": "R$ 15.000,00 por transação, aplicável a IPs não autorizadas e a participantes conectados à RSFN por meio de PSTI não credenciado. O limite é afastável mediante credenciamento do PSTI e relatório de asseguração de auditoria independente. (A Res. 497 impõe vedação análoga para TED.)", "fonte": "Resolução BCB nº 496/2025 (DOU Extra 169-A, 05/09/2025, S.1)"}, {"id": "pacote-498-seguro", "norma": "Resoluções BCB nº 494-498/2025", "pergunta": "Que exigência de seguro a Resolução BCB nº 498/2025 impõe aos PSTIs credenciados para acesso à RSFN?", "resposta": "Comprovação de contratação de seguro de responsabilidade civil e de riscos operacionais, com cobertura mínima definida pelo BCB, incluindo incidentes de fraude e de segurança cibernética (art. 3º, XIII, texto consolidado). O requisito sobreviveu à Resolução BCB 547/2026, que revogou o inciso XIV (plano de continuidade) e abrandou outros requisitos do credenciamento.", "fonte": "Resolução BCB nº 498/2025, art. 3º, XIII (DOU Extra 169-A, 05/09/2025; consolidado bcb.gov.br)"}, {"id": "cnj-615-estrutura", "norma": "Resolução CNJ nº 615/2025", "pergunta": "Como a Resolução CNJ nº 615/2025 classifica as soluções de IA no Judiciário e o que ela revogou?", "resposta": "Classifica por risco: alto risco (AR1-AR5 — ex.: valoração de provas, reconhecimento facial) e baixo risco (BR1-BR8), com supervisão humana, auditoria via Plataforma Sinapses (PDPJ-Br) e comunicação de eventos adversos em até 72h. Revogou integralmente a Resolução CNJ nº 332/2020.", "fonte": "Resolução CNJ nº 615/2025 (DJe/CNJ nº 54, 14/03/2025, p. 2-17)"}, {"id": "anpd-risco-relevante", "norma": "Resolução CD/ANPD nº 15/2024", "pergunta": "Quando um incidente envolvendo dados financeiros exige comunicação à ANPD?", "resposta": "Quando houver risco ou dano relevante: afetação significativa a interesses e direitos fundamentais E, cumulativamente, ao menos um critério do art. 5º — entre eles dados financeiros, dados sensíveis, dados de autenticação em sistemas ou dados em larga escala. Dado financeiro sozinho não basta: é preciso o requisito da afetação significativa.", "fonte": "Resolução CD/ANPD nº 15/2024, art. 5º do Regulamento (DOU 26/04/2024)"}], "trilha": {"titulo": "Trilha — do zero à referência em fraude e incidentes", "descricao": "Oito lições em quatro blocos. Cada uma começa com a explicação que você daria a um adolescente, desce ao detalhe técnico com fonte, e termina mostrando onde aquilo entra no ciclo Rastro (prontidão → war room → recuperação/defesa). Faça na ordem: cada lição usa a anterior.", "blocos": ["O tabuleiro", "O ataque e o resgate", "As regras do jogo", "O war room e a referência"], "licoes": [{"id": "l1-tabuleiro", "bloco": "O tabuleiro", "titulo": "1. O mapa do dinheiro instantâneo — quem é quem no Pix", "analogia": "Imagine o dinheiro como passageiros num metrô que funciona 24h e leva qualquer pessoa a qualquer estação em segundos. O **Pix** é esse metrô. Quem opera as estações são os **PSPs** (prestadores de serviço de pagamento): bancos e **instituições de pagamento** (as fintechs de conta digital). Quem desenhou o metrô, faz as regras e vigia tudo é o **Banco Central (BCB)**. Existe um catálogo gigante de endereços — o **DICT** — que traduz uma chave (celular, e-mail, CPF) na conta de destino. E os trilhos por onde as mensagens entre instituições correm formam a **RSFN**, a rede do sistema financeiro; algumas instituições nem se conectam direto aos trilhos: contratam uma empresa de tecnologia, o **PSTI**, para se conectar por elas.", "tecnica": "O arranjo Pix foi instituído pela Resolução BCB nº 1/2020, que aprova o seu regulamento (norma-base ainda não fichada no repositório — está na fila). Participantes atuam em modalidades distintas: **provedor de conta transacional** (mantém a conta do usuário) e **liquidante especial**, entre outras — a distinção importa porque as obrigações do MED 2.0 recaem sobre essas modalidades. O DICT tem manual operacional próprio, atualizado por instruções normativas (a IN BCB 752/2026, capturada pelo monitor, divulga a versão 8.4). O acesso à RSFN via PSTI passou a ser regulado com força em 2025, depois de incidentes na cadeia de tecnologia — é o pacote da lição 6.", "fontes": ["Resolução BCB nº 1/2020 (regulamento do Pix) — a fichar", "IN BCB 752/2026 (Manual DICT 8.4) — a fichar, capturada pelo monitor", "Ficha [[bcb-res-494-498-2025]] (PSTI e RSFN)"], "rastro": "Todo diagnóstico começa perguntando: o cliente é o quê nesse mapa? IP autorizada ou não? Provedor de conta transacional? Conecta-se à RSFN direto ou via PSTI? Cada resposta muda o conjunto de obrigações — e o tamanho da exposição.", "verificar": "Abra a ficha [[bcb-res-494-498-2025]] e identifique qual resolução do pacote trata do seu tipo de cliente.", "atencao": ""}, {"id": "l2-golpe", "bloco": "O tabuleiro", "titulo": "2. Anatomia de um golpe — engenharia social e contas-laranja", "analogia": "O golpista quase nunca 'hackeia o banco'. Ele hackeia a **pessoa**: liga fingindo ser o gerente, cria pânico ('sua conta foi invadida, transfira tudo para a conta segura'), ou vende um produto falso. A vítima mesma faz o Pix — é a **engenharia social**. Do outro lado, o dinheiro não para na conta do golpista: em minutos ele é fatiado e repassado por uma corrente de **contas-laranja** (contas de pessoas que alugam ou vendem seus dados), como uma nota roubada trocada de mão em mão até ninguém saber de onde veio. Isso se chama **pulverização** — e é uma corrida contra o relógio: cada minuto, o dinheiro está mais espalhado.", "tecnica": "Juridicamente, a engenharia social cria o problema central da responsabilidade: a transação foi autenticada pela própria vítima, então a discussão se desloca para saber se a instituição **deveria ter detectado e barrado** o padrão anômalo (horário, valor, destinatário novo, sequência rápida — sinais que os motores antifraude pontuam). A cadeia de laranjas é o que o rastreio multi-salto do MED 2.0 ataca (lição 3). E a fronteira entre 'falha de segurança do banco' e 'culpa exclusiva da vítima' é exatamente o campo de batalha da Súmula 479 (lição 7).", "fontes": ["Ficha [[bcb-res-493-2025]] (contexto do MED 2.0)", "Ficha [[stj-sumula-479]] (moldura de responsabilidade)"], "rastro": "No benchmark e no diagnóstico, a pergunta é dupla: que sinais o motor antifraude do cliente captura ANTES do Pix sair, e com que velocidade o time reage quando a vítima liga? As duas respostas viram prova no contencioso.", "verificar": "No simulador ('Fraude Pix na madrugada'), repare como a decisão 1 pune quem espera: a pulverização é o motivo.", "atencao": ""}, {"id": "l3-med", "bloco": "O ataque e o resgate", "titulo": "3. O resgate — MED e MED 2.0, o rastreio em múltiplos saltos", "analogia": "Pense num alarme de banco ligado à polícia da cidade inteira. Quando a vítima reporta o golpe, o PSP dela aciona o **MED** (Mecanismo Especial de Devolução): um pedido formal de congelar o dinheiro onde ele estiver. O MED original só conseguia congelar na PRIMEIRA conta de destino — se o dinheiro já tinha pulado adiante, acabou. O **MED 2.0** (Resolução BCB 493/2025) deu visão de raio-X: o sistema **segue os saltos** do dinheiro pela corrente de laranjas, congela o que encontrar em cada conta e devolve por partes — R$ 3 mil que sobraram numa conta, R$ 9 mil noutra. Não garante tudo de volta; garante que a velocidade do acionamento importa mais do que nunca.", "tecnica": "A Res. BCB 493/2025 define a **recuperação de valores** como procedimento de rastreamento, bloqueio e devolução decorrente de suspeita de fraude (art. 54, XII do regulamento do Pix). Instauração: pelo **PSP do pagador**, após **reclamação do usuário** e mediante **fundada suspeita de fraude** — requisitos cumulativos do art. 78-N; boletim de ocorrência NÃO é requisito. Datas (art. 121): facultativa desde **23/11/2025**, obrigatória desde **02/02/2026** para provedores de conta transacional e liquidantes especiais. O detalhamento operacional (número de saltos, janelas) mora no Manual do DICT, não na resolução.", "fontes": ["Ficha [[bcb-res-493-2025]] — Res. BCB 493/2025, arts. 54, XII, 78-N e 121 (DOU 29/08/2025, S.1, p. 187)"], "rastro": "É o coração do war room: o playbook precisa garantir canal de reclamação 24/7, formação documentada da 'fundada suspeita' em minutos e acionamento imediato. Cada passo com hora registrada — isso vira a prova de diligência da fase de defesa.", "verificar": "Roteiro socrático 'med2-rastreio' (5 perguntas) e os cartões de revisão do MED.", "atencao": "A data de 'produção plena em 11/6/2026' que circula na imprensa NÃO consta do texto oficial — está como NAO_CONFIRMADO na ficha. Não a use em entregável até haver fonte primária."}, {"id": "l4-anpd", "bloco": "O ataque e o resgate", "titulo": "4. O outro relógio — dados pessoais e a ANPD", "analogia": "No mesmo incidente, dois relógios correm em paralelo. O primeiro é o do dinheiro (lição 3). O segundo é o dos **dados**: se o golpe envolveu vazamento de informações (senha, CPF, cadastro), existe uma autoridade — a **ANPD** — que precisa ser avisada em até **3 dias úteis**. Mas atenção ao detalhe que derruba os desavisados: o relógio NÃO começa quando o hacker invadiu, nem quando o cliente ligou. Começa quando a empresa **toma conhecimento de que dados pessoais foram afetados**. E mesmo quando se decide NÃO avisar, é obrigatório escrever a decisão num 'livro de registro' e guardar por 5 anos — não registrar é como rasgar a prova da própria inocência.", "tecnica": "Resolução CD/ANPD nº 15/2024 (regulamenta o art. 48 da LGPD): comunicação em **3 dias úteis** contados do conhecimento pelo controlador de que o incidente afetou dados pessoais (art. 6º, caput e §1º). O dever só existe se houver **risco ou dano relevante** — teste CUMULATIVO do art. 5º: afetação significativa a direitos E ao menos um critério objetivo (dados sensíveis, de crianças/idosos, financeiros, de autenticação, sob sigilo, ou larga escala). Registro de TODOS os incidentes, inclusive não comunicados, por mínimo de **5 anos**, com conteúdo mínimo.", "fontes": ["Ficha [[anpd-res-cd-15-2024]] — Res. CD/ANPD 15/2024 (DOU 26/04/2024, S.1, p. 114)", "Lei nº 13.709/2018 (LGPD), art. 48"], "rastro": "No war room, a primeira hora inclui registrar formalmente QUANDO o conhecimento se formou — é o marco zero do prazo. A decisão comunicar/não comunicar, fundamentada por escrito, é das primeiras do playbook e prova central em fiscalização.", "verificar": "Roteiro socrático 'anpd-incidente' e a decisão 5 do simulador (a reviravolta da perícia testa exatamente o termo inicial).", "atencao": ""}, {"id": "l5-cyber", "bloco": "As regras do jogo", "titulo": "5. A muralha exigida — segurança cibernética (Res. 85/2021 + 538/2025)", "analogia": "O BCB não espera o ataque para cobrar: ele exige que cada instituição construa a muralha ANTES. A Resolução 85/2021 é o projeto da muralha — política de segurança cibernética formal, regras para usar computação em nuvem, plano para agir em crise. A Resolução 538/2025 veio depois dos ataques recentes e disse: a muralha precisa ficar mais alta, e vocês têm até **1º de março de 2026** para reformar. Entre os reforços: **testes de intrusão** (contratar alguém para tentar invadir você mesmo e documentar o que achou) e critérios escritos do que configura uma crise.", "tecnica": "Res. BCB 538/2025 (DOU 22/12/2025) altera a Res. BCB 85/2021; escopo: instituições de pagamento, corretoras/distribuidoras de TVM e corretoras de câmbio. Adequação até 1º/3/2026 (art. 2º). Amostra das obrigações: ampliação dos controles mínimos do art. 3º da Res. 85; documentação dos critérios de configuração de crise (art. 20, p.u.); testes de intrusão com resultados documentados e planos de correção (art. 22-A, III). O texto consolidado da Res. 85/2021 ainda não está fichado — leitura pendente.", "fontes": ["Ficha [[bcb-res-538-2025]] — Res. BCB 538/2025 (DOU 22/12/2025, S.1, p. 448)"], "rastro": "Pura prontidão: o gap entre o que a norma exige e o que o cliente tem É o produto do diagnóstico. E depois do incidente, a muralha documentada define a narrativa perante o BCB — e alimenta a tese de fortuito externo no contencioso.", "verificar": "Cartão 'seguranca-cibernetica-adequacao' na revisão espaçada.", "atencao": "A ficha da Res. 85/2021 consolidada está pendente — as obrigações completas exigem o texto-base, não só a alteração."}, {"id": "l6-perimetro", "bloco": "As regras do jogo", "titulo": "6. O cerco de 2025 — autorização, PSTI e seguro (pacote 494-498)", "analogia": "Depois de incidentes graves envolvendo empresas de tecnologia que conectavam fintechs aos trilhos do sistema, o BCB publicou NUM ÚNICO DIA (5/9/2025, edição extra do DOU) cinco resoluções que fecham o cerco: 1) toda instituição de pagamento passa a precisar de **crachá** (autorização prévia) para operar; 2) os requisitos do crachá ficaram mais duros; 3) quem ainda não tem crachá, ou se conecta por um PSTI sem credenciamento, só pode fazer Pix de até **R$ 15 mil** por transação; 4) o mesmo teto vale para TED; 5) o próprio **PSTI** agora precisa de credenciamento, governança de crise, monitoramento de fraude 24/7 e — a novidade que interessa ao seu nicho — **seguro obrigatório** cobrindo fraude e incidentes cibernéticos.", "tecnica": "Res. 494 (altera Res. 80/2021): autorização prévia; janela de protocolo para IPs pré-existentes de 1º a 31/5/2026. Res. 495 (altera Res. 81/2021): requisitos — capacitação de administradores, capital mínimo, sede física. Res. 496 (altera Res. 1/2020): janela de pedido 1º/1–1º/5/2026 para participantes do Pix; limite de R$ 15 mil afastável com PSTI credenciado + relatório de asseguração. Res. 497 (altera Res. 256/2022): trava análoga na TED. Res. 498 (nova): credenciamento do PSTI — diretores de segurança e riscos, comitê de crises, política de fraude 24/7, plano de saída, seguro de RC e riscos operacionais com cobertura mínima do BCB (art. 17, XIII).", "fontes": ["Ficha [[bcb-res-494-498-2025]] — DOU Extra 169-A, 05/09/2025, S.1"], "rastro": "É o mapa de exposição do cliente fintech/BaaS — e um gancho comercial: as janelas de autorização de 2026 são datas em que o cliente PRECISA de assessoria. O seguro obrigatório do PSTI cria um novo ator no war room: a seguradora.", "verificar": "Cartões 'pacote-494-limite-pix' e 'pacote-498-seguro'.", "atencao": "Os prazos calculados (180 dias, 4 meses) estão marcados como cômputo aritmético a conferir no texto integral."}, {"id": "l7-tribunal", "bloco": "As regras do jogo", "titulo": "7. O tribunal — Súmula 479, fortuito interno x externo e a onda consumerista", "analogia": "Regra de ouro do STJ desde 2012: se o golpe é um **risco do próprio negócio bancário** (o chamado 'fortuito interno' — cartão clonado, conta aberta por fraudador, falha do sistema), a instituição paga MESMO SEM TER CULPA. É responsabilidade objetiva: não adianta dizer 'fizemos tudo certo'. A saída da defesa é provar que o evento foi **fortuito externo** — algo fora do risco do negócio — ou **culpa exclusiva da vítima** (ela entregou a senha ao golpista fora do ambiente do banco). Depois de um incidente com milhares de vítimas, vem a **onda consumerista**: centenas de processos iguais, alguns legítimos, outros fabricados em escala por escritórios que pescam clientes — a **litigância predatória**.", "tecnica": "Súmula 479/STJ (Segunda Seção, j. 27/06/2012, DJe 1º/08/2012): 'As instituições financeiras respondem objetivamente pelos danos gerados por fortuito interno relativo a fraudes e delitos praticados por terceiros no âmbito de operações bancárias.' Base: CDC, art. 14 (precedente de origem: REsp 1.197.929/PR). A defesa opera no art. 14, §3º do CDC (culpa exclusiva da vítima/terceiro). A fronteira em golpes de engenharia social via Pix é o litígio contemporâneo — o mapeamento de acórdãos com número de processo é o próximo passo do dossiê. Para a resposta em escala com IA, a Res. CNJ 615/2025 baliza o que o próprio Judiciário considera uso auditável.", "fontes": ["Ficha [[stj-sumula-479]]", "Ficha [[cnj-res-615-2025]]", "CDC, art. 14"], "rastro": "Fecha o ciclo: tudo que as lições 3-6 mandam documentar existe para ESTE momento. Quem acionou o MED em minutos, comunicou a ANPD no prazo e tem a muralha em dia chega ao processo com a tese de fortuito externo de pé. E a detecção de padrões de litigância predatória (petições idênticas, procurações suspeitas) é onde a governança de IA do escritório entra.", "verificar": "Decisão 4 do simulador e cartão 'sumula-479-enunciado'.", "atencao": "Dossiê de jurisprudência pós-Pix ainda não montado — as fichas de acórdãos virão com número de processo, nunca de resumo de terceiros."}, {"id": "l8-warroom", "bloco": "O war room e a referência", "titulo": "8. O war room e o caminho para ser a referência", "analogia": "Agora junte tudo. Incidente detectado — quem você chama, em que ordem? O war room é uma sala (real ou virtual) com cadeiras definidas ANTES da crise: o **coordenador jurídico** (você — quem entende os dois relógios e fala com BCB, ANPD, seguradora e imprensa jurídica), o **time de fraude** do cliente (aciona o MED), o **CISO/TI**, e os **parceiros de tecnologia** que você traz: forense digital (imagem dos sistemas, cadeia de custódia das evidências), antifraude (telemetria dos dispositivos) e, se houver PSTI ou seguradora, os representantes deles. Ser 'a referência' não é saber tudo de tecnologia — é ser quem REGE a orquestra: sabe qual prazo vence primeiro, o que documentar e quem executa cada parte.", "tecnica": "A estrutura das 72h decorre das lições anteriores: (1ª hora) registrar o conhecimento, acionar recuperação de valores — art. 78-N; (manhã) apuração de dados pessoais e teste do art. 5º da Res. 15/2024, abertura do registro de incidente; (dia 1-3) decisão fundamentada de comunicar ANPD/titulares, preservação forense com cadeia de custódia, narrativa única para reguladores; (semana 1+) preparação da defesa consumerista com a trilha probatória. Os papéis e critérios de convocação devem estar num playbook assinado antes — é o entregável do retainer. A matriz de prazos consolidada ([[hub-matriz-prazos]]) é o instrumento de regência.", "fontes": ["Ficha [[hub-matriz-prazos]]", "Fichas [[bcb-res-493-2025]], [[anpd-res-cd-15-2024]], [[bcb-res-538-2025]], [[stj-sumula-479]]"], "rastro": "É o serviço inteiro: prontidão (benchmark IPR-72 + diagnóstico + playbook), war room (retainer com você na regência e parceiros de tecnologia contratados ou pré-acordados), recuperação/defesa (contencioso da onda + fiscalizações). O estudo contínuo — revisão espaçada diária, um socrático por semana, o simulador uma vez por mês — é o que mantém a autoridade técnica que sustenta o posicionamento público.", "verificar": "Rode o simulador completo tentando 10/10 e depois preencha o IPR-72 imaginando um cliente real.", "atencao": "Prazos operacionais internos do MED (janelas exatas de bloqueio/análise) dependem do Manual do DICT — fichar a IN 752/2026 antes de desenhar o playbook-modelo."}]}, "roteiros": [{"id": "anpd-incidente", "tema": "Comunicação de incidente à ANPD — Resolução CD/ANPD nº 15/2024", "fontes": "Resolução CD/ANPD nº 15/2024 (DOU 26/04/2024, S.1, p. 114); ficha anpd-res-cd-15-2024", "passos": [{"pergunta": "Nem todo incidente de segurança se comunica à ANPD. Qual é o teste do art. 5º do Regulamento para 'risco ou dano relevante'? Atenção à estrutura lógica do dispositivo.", "pontos": ["Estrutura CUMULATIVA: afetação significativa a interesses e direitos fundamentais E ao menos um critério objetivo", "Critérios: dados sensíveis; crianças/adolescentes/idosos; dados financeiros; autenticação em sistemas; sigilo legal/judicial/profissional; larga escala"], "gabarito": "O art. 5º exige cumulação: (1) o incidente pode afetar significativamente interesses e direitos fundamentais dos titulares E (2) envolve ao menos um critério objetivo — dados sensíveis, de crianças/adolescentes/idosos, financeiros, de autenticação, sob sigilo, ou em larga escala. Dado financeiro sozinho não dispara a comunicação: sem a afetação significativa, não há risco relevante."}, {"pergunta": "Qual é o prazo de comunicação e — a parte que decide casos — qual é o termo inicial da contagem?", "pontos": ["Três dias úteis (não corridos)", "Termo inicial: conhecimento pelo CONTROLADOR de que o incidente afetou DADOS PESSOAIS (art. 6º, §1º)", "Ressalva: prazo diverso em legislação específica"], "gabarito": "Três dias úteis, contados do conhecimento pelo controlador de que o incidente afetou dados pessoais (art. 6º, caput e §1º), ressalvado prazo de legislação específica. O relógio não corre da invasão, nem da detecção técnica pelo SOC: corre do momento em que o controlador sabe que dados pessoais foram afetados — por isso o war room precisa registrar com precisão QUANDO esse conhecimento se formou."}, {"pergunta": "O comitê decidiu NÃO comunicar. O trabalho acabou? O que a norma ainda exige e por quanto tempo?", "pontos": ["Registro obrigatório de TODOS os incidentes, inclusive os não comunicados", "Prazo mínimo de cinco anos da data do registro", "Conteúdo mínimo: data de conhecimento, descrição das circunstâncias etc.", "Função defensiva do registro em fiscalização e contencioso"], "gabarito": "Não. O controlador deve registrar todos os incidentes, inclusive os não comunicados, por no mínimo cinco anos da data do registro, com conteúdo mínimo (data de conhecimento, circunstâncias, avaliação). É a fundamentação documentada da decisão de não comunicar que protege a instituição em fiscalização da ANPD e na onda consumerista — a ausência de registro transforma uma decisão defensável em indício de ocultação."}]}, {"id": "med2-rastreio", "tema": "MED 2.0 — o mecanismo de recuperação de valores (rastreio em múltiplos saltos)", "fontes": "Resolução BCB nº 493/2025 (DOU 29/08/2025, S.1, p. 187) e material oficial BCB 'MED 2.0 — Circuito Pix' (Decem/Diseg); ficha bcb-res-493-2025", "
