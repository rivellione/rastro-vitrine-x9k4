segurança cibernética) e o diagnóstico de prontidão.\n\n## Lacunas\n\n- A Resolução BCB nº 85/2021 (norma base consolidada) ainda não foi fichada; a leitura das obrigações completas exige o texto consolidado, não apenas a alteração.\n- O rol exaustivo das alterações promovidas pela 538 foi verificado por amostra no DOU; conferência integral do texto consolidado pendente de leitura do operador.\n\n## Relações\n\n[[hub-seguranca-cibernetica]] · [[hub-matriz-prazos]] · [[bcb-res-494-498-2025]] · [[anpd-res-cd-15-2024]]\n"}, {"info": {"id": "bcb-res-546-2026", "titulo": "Resolução BCB nº 546, de 22 de janeiro de 2026 (dispensa de apuração de descumprimento — MED 2.0)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2026-01-23", "tags": "[pix, med, recuperacao-de-valores, fraude, apuracao-de-descumprimento, penalidades]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-546-2026.md", "quando": "2026-09-28"}, "meta": {"id": "bcb-res-546-2026", "tipo": "norma", "titulo": "Resolução BCB nº 546, de 22 de janeiro de 2026 (dispensa de apuração de descumprimento — MED 2.0)", "orgao": "BCB", "data_publicacao": "2026-01-23", "vigencia": "", "altera": "[\"Resolução BCB nº 1/2020 (regulamento anexo do arranjo Pix) — inclui o art. 113-A\"]", "fase_rastro": "[prontidao, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico]", "fonte_primaria": "https://pesquisa.in.gov.br/imprensa/servlet/INPDFViewer?jornal=515&pagina=72&data=23/01/2026&captchafield=firstAccess", "status": "fichado", "tags": "[pix, med, recuperacao-de-valores, fraude, apuracao-de-descumprimento, penalidades]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 546/2026 — dispensa de apuração na entrada do MED 2.0\n\nVerificada no inteiro teor oficial em 2026-09-28, em duas fontes: API de normativos do BCB (`https://www.bcb.gov.br/api/conteudo/app/normativos/exibenormativo?p1=Resolução%20BCB&p2=546`) e página do DOU (nº 16, sexta-feira, 23/1/2026, Seção 1, p. 72, código de autenticidade 05152026012300072). Os dois textos coincidem. Texto integral guardado em `normas/bcb/_texto-res-546-2026.txt`. Página legível no portal do BCB: `https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=546`.\n\n## Ementa\n\nEmenta oficial (literal): \"Altera o regulamento anexo à Resolução BCB nº 1, de 12 de agosto de 2020, que institui o arranjo de pagamentos Pix e aprova o seu regulamento.\" Aprovada pela Diretoria Colegiada em sessão de 20/1/2026, assinada em 22/1/2026 pelo Diretor de Organização do Sistema Financeiro e de Resolução e publicada no DOU de 23/1/2026, Seção 1, p. 72.\n\n## Vigência e prazos\n\nEntra em vigor na data da publicação (art. 2º), isto é, 23 de janeiro de 2026, dez dias antes do início da obrigatoriedade da recuperação de valores. A norma contém um único dispositivo material, o art. 113-A incluído no regulamento do Pix, com redação literal: \"Fica dispensada a instauração do processo de apuração de descumprimento a este Regulamento para os descumprimentos relacionados ao art. 121, ocorridos no período compreendido entre 2 de fevereiro de 2026 e 10 de maio de 2026.\"\n\nSão três datas distintas e nenhuma delas substitui a outra. A obrigação de implementar a recuperação de valores continua sendo de 2 de fevereiro de 2026, porque o art. 121 (incluído pela [[bcb-res-493-2025]]) não foi alterado pela Res. 546. O período coberto pela dispensa vai de 2 de fevereiro a 10 de maio de 2026, as duas datas escritas no texto. O dia 11 de maio de 2026 é o primeiro dia fora da dispensa: decorre do termo final literal e não aparece escrito na norma, de modo que deve ser citado como \"dia seguinte ao termo final do art. 113-A\", nunca como data textual.\n\n## Obrigações principais\n\nA resolução não cria obrigação para os participantes. Ela limita, por período determinado, a atuação sancionadora do BCB no âmbito do arranjo. O art. 113-A está inserido na Seção VI do regulamento consolidado, denominada \"Da dispensa de instauração do processo de apuração de descumprimento a este Regulamento para aplicação das penalidades previstas no art. 93, caput, incisos I e II\" (denominação dada pela [[bcb-res-506-2025]]). Na redação vigente do art. 93, o inciso I é a advertência e o inciso II é a multa; a exclusão está no inciso III. Diferentemente do art. 113, que condiciona a dispensa à cessação da prática e a outros requisitos, o art. 113-A não traz condição alguma em seu texto: basta que o descumprimento seja relacionado ao art. 121 e tenha ocorrido no período.\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: no diagnóstico, a pergunta deixa de ser apenas \"implementou até 2/2/2026?\" e passa a ter três respostas possíveis com consequências diferentes. Quem implementou até 2/2/2026 cumpriu no prazo. Quem implementou entre 2/2 e 10/5/2026 descumpriu o art. 121, mas o descumprimento desse intervalo não gera processo de apuração. Quem seguiu em descumprimento a partir de 11/5/2026 está exposto à apuração quanto ao período posterior, porque a dispensa alcança apenas descumprimentos \"ocorridos no período\". Recuperação e defesa: em defesa perante o BCB, o art. 113-A é o fundamento para delimitar a exposição pela data do descumprimento. Na frente consumerista o dispositivo não serve de escudo: o texto trata somente do processo de apuração do regulamento do Pix e nada dispõe sobre a responsabilidade perante o usuário; a parte adversa pode, ao contrário, invocar que a obrigação estava em vigor desde 2/2/2026.\n\n## Conexão comercial\n\nAlimenta o benchmark IMCI-Fraude (o item de maturidade de implementação do MED 2.0 passa a distinguir as três faixas de data) e o diagnóstico de prontidão (exposição sancionatória a partir de 11/5/2026).\n\n## Lacunas\n\n- \"Produção plena do MED 2.0 em 11/6/2026\": continua NAO_CONFIRMADO. A Res. 546 não contém essa data. Não há elemento em fonte primária que relacione \"11/6\" ao termo de 10/5/2026; não presumir que uma seja erro de grafia da outra.\n- Alcance da expressão \"descumprimentos relacionados ao art. 121\": NAO_CONFIRMADO se abrange apenas a falta de implementação da funcionalidade ou também falhas operacionais no procedimento de recuperação de valores (prazos do Manual Operacional do DICT). O texto não esclarece.\n- Penalidade de exclusão (art. 93, III): a denominação da Seção VI menciona apenas os incisos I e II do art. 93, enquanto o art. 113-A dispensa a instauração do processo de apuração sem ressalva. Ambiguidade sinalizada; não resolver por inferência.\n- Motivação da dispensa (voto ou exposição de motivos): NAO_CONFIRMADO. O campo de voto não veio preenchido na API para esta resolução.\n- Outras esferas (processo administrativo sancionador fora do regulamento do Pix, responsabilidade civil): a resolução não trata do tema. Qualquer afirmação sobre elas exige fonte própria.\n- Resolução BCB nº 1/2020 (regulamento consolidado, versão 42 na API em 2026-09-28): consultada para localizar os arts. 93, 113, 113-A e 121, mas ainda não fichada.\n\n## Relações\n\n[[bcb-res-493-2025]] · [[bcb-res-506-2025]] · [[hub-pix-med]] · [[hub-matriz-prazos]]\n"}, {"info": {"id": "bcb-res-552-2026", "titulo": "Resolução BCB nº 552, de 3 de março de 2026 (VASPs entram no perímetro de governança das IPs)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2026-03-05", "tags": "[ativos-virtuais, vasp, controles-internos, compliance, seguranca-cibernetica, auditoria-interna, ouvidoria, fraude, compartilhamento]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-552-2026.md", "quando": "2026-10-29"}, "meta": {"id": "bcb-res-552-2026", "tipo": "norma", "titulo": "Resolução BCB nº 552, de 3 de março de 2026 (VASPs entram no perímetro de governança das IPs)", "orgao": "BCB", "data_publicacao": "2026-03-05", "vigencia": "", "altera": "[\"Resolução BCB nº 28/2020\", \"Resolução BCB nº 51/2020\", \"Resolução BCB nº 65/2021\", \"Resolução BCB nº 85/2021\", \"Resolução BCB nº 93/2021\", \"Resolução BCB nº 155/2021\", \"Resolução BCB nº 260/2022\", \"Resolução BCB nº 343/2023\", \"Resolução BCB nº 432/2024\"]", "fase_rastro": "[prontidao]", "conexao_comercial": "[diagnostico]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=552", "status": "fichado", "tags": "[ativos-virtuais, vasp, controles-internos, compliance, seguranca-cibernetica, auditoria-interna, ouvidoria, fraude, compartilhamento]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 552/2026 — VASPs entram no perímetro de governança das IPs\n\nInteiro teor lido na fonte oficial (API exibenormativo, pelo navegador do app) em 2026-10-29; transcrição integral em `_texto-res-552-2026.txt`. DOU 5/3/2026, S.1, p. 84/85; vigor na publicação (art. 17). Fundamento: arts. 4º e 6º da Lei 14.478/2022 e arts. 1º e 2º do Decreto 11.563/2023. Status mantido como `a_fichar` porque as seções de aplicação e conexão comercial abaixo são propostas do assistente, não leitura do operador.\n\n## Ementa\n\nAltera as Resoluções BCB 28/2020, 51/2020, 65/2021, 85/2021, 93/2021, 155/2021, 260/2022, 343/2023 e 432/2024 \"para incluir em seus escopos de aplicação as sociedades prestadoras de serviços de ativos virtuais autorizadas a funcionar pelo Banco Central do Brasil\".\n\n## Vigência e prazos\n\nVigor em 5/3/2026, data da publicação (art. 17). Há um único prazo escalonado: o art. 14 insere o art. 13-A na Res. 343/2023, exigindo adequação do sistema de compartilhamento de fraude à atividade de ativos virtuais até 30/10/2026. A Res. 569/2026 reescreveu esse art. 13-A mantendo a data de 30/10/2026 para ativos virtuais e acrescentando 1º/12/2026 para a hipótese de bets (ver [[bcb-res-569-2026]]).\n\n## Obrigações principais\n\nA norma não cria obrigação material nova; estende às sociedades prestadoras de serviços de ativos virtuais (VASPs) autorizadas pelo BCB o mesmo pacote de governança que já vincula instituições de pagamento, consórcios, corretoras e distribuidoras. Dispositivo por dispositivo: ouvidoria (Res. 28, arts. 1º e 2º da 552); débito em conta pré-paga, com o art. 1º da Res. 51 reescrito para alcançar \"instituições financeiras e demais instituições autorizadas\" detentoras de contas pré-pagas (art. 3º); política de conformidade, com novo §2º no art. 2º da Res. 65 exigindo gestão integrada do risco de conformidade (arts. 4º e 5º); segurança cibernética e nuvem na Res. 85 (arts. 6º e 7º); auditoria interna na Res. 93 (arts. 8º e 9º); relacionamento com clientes na Res. 155 (arts. 10 e 11); sistemas de controles internos na Res. 260, inciso VI no art. 1º (arts. 12 e 13); compartilhamento de dados de fraude na Res. 343, novo inciso V no art. 2º e art. 13-A (art. 14); remuneração de administradores na Res. 432 (arts. 15 e 16).\n\n## Aplicação prática no ciclo Rastro (proposta — validar)\n\nProntidão: a partir de 30/10/2026 uma VASP autorizada responde ao mesmo diagnóstico de controles internos, compliance, cibersegurança e compartilhamento de fraude que uma IP, o que coloca exchanges e custodiantes dentro do universo de clientes do produto sem adaptação da matriz. Para o eixo de controles internos ([[matriz-controles-internos]]), a 552 fecha o mapa de escopo da Res. 260: a exclusão do art. 1º, parágrafo único, da Res. CMN 4.968 ([[cmn-res-4968-2021]]) remete à 260, e a 260 passa a cobrir IPs, consórcios, corretoras, distribuidoras, corretoras de câmbio e VASPs.\n\n## Conexão comercial (proposta — validar)\n\nBenchmark e diagnóstico: abre a prospecção para VASPs autorizadas e dá argumento de prazo (30/10/2026 para a Res. 343). Cruzar com `comercial/prospeccao/universo-fintechs-autorizadas-bcb-2026-08-20.csv` para saber quantas VASPs já constam da base.\n\n## Lacunas\n\n- O texto obtido é o da norma alteradora, não o consolidado das normas alteradas; as fichas de 28, 51, 65, 93, 155 e 432 não existem na base e seguem sem ficha própria.\n- Verificar na Res. 569/2026 se o art. 13-A da Res. 343 manteve exatamente a redação de 30/10/2026 para ativos virtuais (a ficha [[bcb-res-569-2026]] afirma que sim; conferir no consolidado).\n- Lista de VASPs já autorizadas pelo BCB em 2026: não levantada.\n\n## Relações\n\n[[bcb-res-260-2022]] · [[bcb-res-85-2021]] · [[bcb-res-343-2023]] · [[bcb-res-569-2026]] · [[cmn-res-4968-2021]] · [[matriz-controles-internos]] · [[hub-matriz-prazos]]\n\n## Fichamento (operador, 2026-10-29)\n\n### Aplicação prática no ciclo Rastro\n\nArt. 12.  A ementa da Resolução BCB nº 260, de 22 de novembro de 2022, publicada no Diário Oficial da União de 24 de novembro de 2022, passa a vigorar com as seguintes alterações:\n\"Dispõe sobre os sistemas de controles internos das administradoras de consórcio, das instituições de pagamento, das sociedades corretoras de títulos e valores mobiliários, das sociedades distribuidoras de títulos e valores mobiliários, das sociedades corretoras de câmbio e das sociedades prestadoras de serviços de ativos virtuais autorizadas a funcionar pelo Banco Central do Brasil.\" (NR)\nArt. 13.  A Resolução BCB nº 260, de 22 de novembro de 2022, publicada no Diário Oficial da União de 24 de novembro de 2022, passa a vigorar com as seguintes alterações:\n\"Art. 1º  ...................................................................................................................................\n.................................................................................................................................................\nIV - sociedades distribuidoras de títulos e valores mobiliários;\nV - sociedades corretoras de câmbio; e\nVI - sociedades prestadoras de serviços de ativos virtuais.\" (NR)\n\n### Lacunas\n\nNenhuma apontada no fichamento.\n"}, {"info": {"id": "bcb-res-569-2026", "titulo": "Resolução BCB nº 569, de 19 de maio de 2026 (bets no compartilhamento de fraude)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2026-05-21", "tags": "[fraude, compartilhamento, bets, apostas, pix]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-569-2026.md", "quando": "2026-07-14"}, "meta": {"id": "bcb-res-569-2026", "tipo": "norma", "titulo": "Resolução BCB nº 569, de 19 de maio de 2026 (bets no compartilhamento de fraude)", "orgao": "BCB", "data_publicacao": "2026-05-21", "vigencia": "", "altera": "[\"Resolução BCB nº 343/2023\"]", "fase_rastro": "[prontidao, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=569", "status": "fichado", "tags": "[fraude, compartilhamento, bets, apostas, pix]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 569/2026 — bets ilegais entram no sistema de fraude\n\nVerificada no inteiro teor oficial (API BCB) em 2026-07-14. DOU 21/5/2026, S.1, p. 114; vigor na publicação.\n\n## O que altera na Res. 343/2023\n\n- Inclui o art. 1º-A: indícios de fraude passam a incluir \"os indícios de atuação de pessoas naturais ou jurídicas como operadoras de apostas não autorizadas\" (Lei 14.790/2023, art. 24-A, I).\n- Inclui o inciso VI no art. 2º (serviços financeiros/de pagamento a operadoras não autorizadas) e estende a ele o rol de serviços do §1º (Pix, TED etc.).\n- Inclui o §4º no art. 3º: nesse caso, o \"fraudador\" identificado é a própria operadora de apostas.\n- Reescreve o art. 13-A: adequação até 30/10/2026 para ativos virtuais (herdado da Res. 552/2026) e até 1º/12/2026 para a hipótese de bets.\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: clientes fintech/BaaS que processam pagamentos precisam, até 1º/12/2026, de mecanismo para identificar e registrar operadoras de apostas não autorizadas — novo item de diagnóstico (e novo risco: prestar serviço a operadora ilegal agora gera marcação na base interbancária). Defesa: a qualificação de \"operadora não autorizada\" tem consequências de desbancarização — potencial contencioso de marcados contestando a qualificação.\n\n## Lacunas\n\n- Critérios para identificar \"operadora não autorizada\" (lista do Ministério da Fazenda/SPA?): não especificados na resolução — verificar operacionalização antes de aconselhar.\n\n## Relações\n\n[[bcb-res-343-2023]] · [[resolucao-conjunta-6-2023]] · [[hub-matriz-prazos]]\n"}, {"info": {"id": "bcb-res-587-2026", "titulo": "Resolução BCB nº 587, de 18 de setembro de 2026 (marcação de fundada suspeita de fraude: responsável, cancelamento, prazo, comunicação; recurso contra decisões do BCB no Pix; comunicação de incidente de dados a titulares)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2026-09-21", "tags": "[pix, fraude, marcacao, dict, notificacao-de-infracao, devido-processo, recurso, incidente-de-seguranca, dados-pessoais]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-587-2026.md", "quando": "2026-10-06"}, "meta": {"id": "bcb-res-587-2026", "tipo": "norma", "titulo": "Resolução BCB nº 587, de 18 de setembro de 2026 (marcação de fundada suspeita de fraude: responsável, cancelamento, prazo, comunicação; recurso contra decisões do BCB no Pix; comunicação de incidente de dados a titulares)", "orgao": "BCB", "data_publicacao": "2026-09-21", "vigencia": "", "altera": "[\"Resolução BCB nº 1/2020 (art. 3º, §15)\", \"Regulamento anexo à Res. BCB nº 1/2020 (arts. 3º, 11-AA, 11-B, 11-C, 11-S, 24, 25-B, 31, 32, 39, 40, 41-A, 56, 68, 70, 78-HA, 78-HB, 78-HC, 78-HD, 89, 100-A)\", \"Resolução BCB nº 507/2025, anexo I, art. 26\"]", "revoga": "[\"Regulamento do Pix: art. 24, §§2º e 4º; art. 31, §1º, II\", \"Res. BCB 507/2025, anexo I, art. 26, §2º\"]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico, retainer, adversarial]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=587", "status": "fichado", "tags": "[pix, fraude, marcacao, dict, notificacao-de-infracao, devido-processo, recurso, incidente-de-seguranca, dados-pessoais]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 587/2026 — a marcação de fraude ganha responsável, rito de cancelamento, prazo e comunicação\n\nVerificada no inteiro teor em 2026-10-06 na API de normativos do BCB (`https://www.bcb.gov.br/api/conteudo/app/normativos/exibenormativo?p1=Resolução%20BCB&p2=587`), campo DOU: \"Publicada no DOU de 21/9/2026, Seção 1, p. 195/196\". Aprovada pela Diretoria Colegiada em sessão de 17/9/2026; assinada em 18/9/2026 pelo Diretor de Organização do Sistema Financeiro e de Resolução. Extrato literal dos dispositivos do escopo Rastro em `normas/bcb/_texto-res-587-2026.txt`. A página do DOU não foi conferida nesta sessão (segunda fonte pendente).\n\n## Ementa\n\nLiteral: \"Altera a Resolução BCB nº 1, de 12 de agosto de 2020, que institui o arranjo de pagamentos Pix e aprova o seu Regulamento, para ajustar dispositivo relacionado aos critérios de participação no Pix; altera o regulamento anexo à Resolução BCB nº 1, de 12 de agosto de 2020, que disciplina o funcionamento do arranjo de pagamentos Pix, para: admitir a iniciação de transações relativas ao produto Pix Automático em conta-salário, instituir a cobrança híbrida, ajustar dispositivo referente ao Pix Saque, ajustar e revogar dispositivos que fazem referência a dispositivo já revogado, inserir dispositivo relativo aos requisitos e aos procedimentos para participação no Pix, ajustar o dispositivo relativo à perda da condição de participante do Pix, atribuir nova obrigação aos participantes do Pix, inserir e ajustar dispositivos que tratam da marcação de fundada suspeita de fraude transacional e inserir dispositivo para disciplinar os recursos interpostos contra decisões do Banco Central do Brasil no âmbito do Pix; e altera o anexo I à Resolução BCB nº 507, de 26 de setembro de 2025, que estabelece o rito de apuração de descumprimento do Regulamento do Pix e os parâmetros para a aplicação de penalidades, para ajustar o prazo para desligamento do Pix de instituição à qual for aplicada penalidade de exclusão.\"\n\n## Dispositivos do escopo Rastro (literal, do art. 2º)\n\nArt. 32, VIII (vigência 1º/2/2027): \"comunicar aos titulares de contas transacionais providas pelo participante que sejam pessoas naturais a ocorrência de incidente de segurança com dados pessoais envolvendo banco de dados relacionado a componente ou a infraestrutura do Pix, mesmo que o participante provedor da conta não seja o responsável pelo incidente e ainda que o incidente de segurança não possa acarretar risco ou dano relevante aos titulares, nos termos definidos pelo Banco Central do Brasil em documento específico;\"\n\nArt. 32, IX: \"possuir mecanismos de monitoramento e de ação contra usuários recebedores que enviem instruções de pagamento indevidas no âmbito do produto Pix Automático ou que enviem ofertas excessivas requisitando autorização para inclusão de transações no Pix Automático; e\"\n\nArt. 32, X: \"divulgar o Mecanismo Especial de Devolução, de que trata o Capítulo XI, Seção II, com foco no público vulnerável, em seus canais de publicidade e de atendimento, por meio de informação clara e acessível.\"\n\nArt. 56, §3º: \"O participante do Pix deve rejeitar pedido de registro de chave Pix em caso de usuário ou de conta transacional associados a uma notificação de infração aceita pelo próprio participante ou a uma notificação de infração para marcação de fundada suspeita de fraude transacional criada no DICT por esse participante, nos termos do Capítulo XIII, Seção III, Subseção IX, devendo comunicar o motivo da rejeição ao usuário.\"\n\nArt. 68, §2º: \"O participante não deve solicitar a portabilidade de chave Pix no DICT caso o solicitante seja usuário associado a uma notificação de infração aceita por esse participante ou a uma notificação de infração para marcação de fundada suspeita de fraude transacional criada pelo próprio participante, nos termos do Capítulo XIII, Seção III, Subseção IX.\" Art. 70, §2º: mesma regra para a reivindicação de posse.\n\nArt. 78-HA: \"O participante pode criar uma notificação de infração para marcação de fundada suspeita de fraude transacional, que permite a marcação de CPF ou de CNPJ de seu cliente que esteja envolvido em uma transação Pix específica com fundada suspeita de fraude.\"\n\nArt. 78-HB: \"O participante que aceitar a notificação de infração, nos termos do art. 78-G, e o participante que criar a notificação de infração para marcação de fundada suspeita de fraude transacional, nos termos do art. 78-HA, são os responsáveis pela respectiva marcação de fundada suspeita de fraude registrada no DICT, vinculada ao número de inscrição no CPF ou no CNPJ, conforme o caso, e à chave Pix, se essa informação estiver disponível no momento do registro da referida marcação. Parágrafo único. O participante que criar a marcação de fundada suspeita de fraude deverá comunicar ao usuário a realização da marcação, informando, no mínimo, a data da marcação, a possibilidade de revisão da medida e o canal disponível para esclarecimentos e para solicitação de revisão.\" (parágrafo único com vigência em 1º/2/2027)\n\nArt. 78-HC: \"O participante responsável pela marcação de fundada suspeita de fraude no DICT é o responsável pelo eventual cancelamento da referida marcação, ressalvada a hipótese de cancelamento das funcionalidades de que tratam o art. 54, caput, inciso XII, e o art. 78-F, caput, pelo prestador de serviços de pagamento do usuário pagador. § 1º O participante responsável pela marcação de fundada suspeita de fraude deve assegurar aos usuários que sofreram a marcação a possibilidade de apresentação de pedido de cancelamento da marcação. § 2º Cabe ao participante responsável pela marcação de fundada suspeita de fraude a análise do pedido de que trata o § 1º, competindo-lhe decidir pela manutenção ou pelo cancelamento da marcação em até sete dias, contados a partir da data de recebimento do pedido. § 3º A marcação de fundada suspeita de fraude deverá ser cancelada se, após análise do caso, não subsistirem elementos que justifiquem a manutenção da fundada suspeita de fraude. § 4º O participante deverá manter registro dos fundamentos utilizados para a manutenção ou para o cancelamento da marcação de fundada suspeita de fraude.\"\n\nArt. 78-HD: \"A marcação de fundada suspeita de fraude permanecerá vinculada ao número de inscrição no CPF ou no CNPJ, conforme o caso, e à chave Pix, se essa informação estiver disponível no momento do registro da marcação, pelo prazo de cinco anos, contados a partir da data da realização do registro no DICT da referida marcação.\"\n\nArt. 89, §2º: \"O participante que aceitar uma notificação de infração ou que criar uma notificação de infração para marcação de fundada suspeita de fraude transacional deve rejeitar todas as transações Pix que tenham o usuário envolvido na notificação como pagador ou como recebedor, bem como a conta envolvida na notificação, salvo para a realização de transações referentes a devoluções, de que trata o Capítulo XI.\"\n\nArt. 100-A: \"As instituições poderão apresentar recurso contra as decisões proferidas pelo Banco Central do Brasil, na qualidade de instituidor do arranjo de pagamentos Pix. § 1º O recurso deverá: I - ser interposto no prazo de dez dias corridos, contado a partir da comunicação da decisão, ressalvados os prazos específicos estabelecidos neste Regulamento; e II - ser dirigido à autoridade que proferiu a decisão, que, se não a reconsiderar, o encaminhará à autoridade competente para julgamento em única e última instância. § 2º O recurso será recebido com efeito devolutivo. § 3º O recurso não terá efeito suspensivo, salvo se a autoridade recorrida ou a competente para julgá-lo, de ofício ou a pedido, lhe atribuir esse efeito diante de justo receio de prejuízo de difícil ou incerta reparação decorrente da execução da decisão.\"\n\nArt. 3º da resolução (Res. 507, anexo I, art. 26): \"Aplicada a penalidade de exclusão, em decisão definitiva, a instituição participante será desligada do Pix imediatamente após o recebimento da comunicação da decisão definitiva.\" (§2º revogado; §1º, III: comprovar ao BCB, quando solicitado, as medidas dos incisos I e II.)\n\nArt. 5º (vigência): I - 1º/2/2027 para arts. 11-AA, 11-B, 32, 39, 40, 41-A e 78-HB, parágrafo único; II - 1º/7/2027 para arts. 3º e 11-S; III - data da publicação para os demais.\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: o fluxo de marcação precisa de (a) canal de recebimento de pedido de cancelamento, (b) alçada e roteiro de decisão em sete dias, (c) registro dos fundamentos (modelo 13.10 do livro), (d) minuta de comunicação da marcação ao usuário, pronta antes de 1º/2/2027, e (e) relógio de cinco anos para expurgo. O roteiro do teste de risco relevante da LGPD ganha a pergunta sobre banco de dados ligado a componente ou infraestrutura do Pix (art. 32, VIII), cujo prazo e forma dependem de documento específico do BCB ainda não publicado.\n\nWar room: quem aceita notificação de infração assume a responsabilidade pela marcação e pelo rito de cancelamento; o termo de fundada suspeita (modelo 13.2) é o lastro que a decisão do sétimo dia vai exigir. Recurso do art. 100-A contra decisões do BCB no arranjo: dez dias corridos, efeito devolutivo.\n\nDefesa: no polo passivo, novos fundamentos de ação do marcado (pedido não respondido em sete dias, indeferimento sem fundamento registrado, marcação não comunicada a partir de 2027). No polo ativo, a marcação alheia mantida sem fundamento é indício de falha do outro prestador. O rito não alcança o sistema de compartilhamento de indícios da Resolução Conjunta 6/2023 nem o terceiro não cliente.\n\n## Conexão comercial\n\nBenchmark e diagnóstico (novo item: fluxo de cancelamento em sete dias com evidência); retainer (revisão do playbook por gatilho normativo antes de 1º/2/2027); adversarial (ações de marcados).\n\n## Lacunas\n\n- Documento específico do art. 32, VIII (prazo, forma e conteúdo da comunicação aos titulares): NAO_CONFIRMADO; não publicado até 6/10/2026.\n- Art. 39-C (critérios mínimos de fundada suspeita): não alterado nem publicado por esta resolução; continua NAO_CONFIRMADO.\n- Página do DOU de 21/9/2026 (Seção 1, p. 195-196) não conferida como segunda fonte.\n- Interação entre o cancelamento no DICT (art. 78-HC) e a exclusão em 24 horas no sistema de indícios (Res. 343, art. 4º): a norma não a disciplina; tratada no livro como obrigação paralela, não como decorrência textual.\n- Motivação (voto): campo não preenchido na API.\n\n## Relações\n\n[[bcb-res-506-2025]] · [[bcb-res-493-2025]] · [[bcb-res-343-2023]] · [[resolucao-conjunta-6-2023]] · [[bcb-res-142-2021]] · [[anpd-res-cd-15-2024]] · [[hub-pix-med]] · [[hub-matriz-prazos]]\n"}, {"info": {"id": "bcb-res-65-2021", "titulo": "Resolução BCB nº 65, de 26 de janeiro de 2021 (política de conformidade — IPs, consórcios, corretoras, DTVM, câmbio e VASPs)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2021-01-28", "tags": "[compliance, conformidade, instituicao-de-pagamento, vasp, controles-internos]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-65-2021.md", "quando": "2026-11-05"}, "meta": {"id": "bcb-res-65-2021", "tipo": "norma", "titulo": "Resolução BCB nº 65, de 26 de janeiro de 2021 (política de conformidade — IPs, consórcios, corretoras, DTVM, câmbio e VASPs)", "orgao": "BCB", "data_publicacao": "2021-01-28", "vigencia": "", "altera": "[\"Circular nº 3.865/2017 (revogada)\"]", "fase_rastro": "[]", "conexao_comercial": "[diagnostico]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=65", "status": "fichado", "tags": "[compliance, conformidade, instituicao-de-pagamento, vasp, controles-internos]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 65/2021 — política de conformidade das instituições reguladas pelo BCB\n\nFicha criada em 2026-10-29 a partir do inteiro teor lido no endpoint oficial do BCB pelo navegador do app (texto em `normas/bcb/_texto-res-65-2021.txt`). Ementa, vigência e obrigações são transcrição; aplicação e conexão comercial são propostas do assistente, a validar pelo operador, por isso o status permanece `a_fichar`.\n\n## Ementa\n\nEmenta vigente (redação da Res. BCB 552/2026): \"Dispõe sobre a política de conformidade (compliance) das administradoras de consórcio, das instituições de pagamento, das sociedades corretoras de títulos e valores mobiliários, das sociedades distribuidoras de títulos e valores mobiliários, das sociedades corretoras de câmbio e das sociedades prestadoras de serviços de ativos virtuais autorizadas a funcionar pelo Banco Central do Brasil.\" DOU 28/1/2021, S.1, p. 52/53. Par da Res. CMN 4.595/2017, que exclui IPs e consórcios (art. 1º, parágrafo único).\n\n## Vigência e prazos\n\nVigor em 1º/3/2021 (art. 13). Corretoras, DTVM e câmbio entram em 1º/3/2024 (Res. BCB 368/2024); VASPs em 5/3/2026 (Res. BCB 552/2026). Art. 8º (remuneração da função de conformidade) revogado em 1º/1/2025 pela Res. BCB 432/2024. Relatório anual da função de conformidade (art. 7º, V) com guarda de cinco anos (art. 11, II).\n\n## Obrigações principais\n\nPolítica de conformidade proporcional, para gerir o risco de conformidade, definido no art. 2º, §1º, como possibilidade de sanções, perdas, danos de reputação e outros por descumprimento do arcabouço legal, infralegal, recomendações de reguladores e autorregulação; o §2º (redação da 552) exige gestão integrada com os demais riscos. Política única por conglomerado admitida (art. 3º) e aprovada pelo conselho (art. 4º). Conteúdo mínimo no art. 5º: objetivo e escopo; divisão de responsabilidades evitando conflito com áreas de negócio; pessoal suficiente e treinado; posição da unidade, quando constituída; independência e autoridade; recursos; livre acesso a informações; canais de comunicação com diretoria, conselho e comitê de auditoria; coordenação com gerenciamento de riscos e auditoria interna. Unidade de conformidade segregada da auditoria interna (art. 6º). Responsáveis pela função devem testar aderência, dar suporte à administração, capacitar empregados e terceirizados relevantes, acompanhar pontos do relatório do auditor independente, elaborar relatório anual e reportar ao conselho (art. 7º); especialistas podem ser contratados sem transferir a responsabilidade do conselho (parágrafo único). Deveres do conselho no art. 9º; sem conselho, diretoria ou administradores (art. 10). Documentação e relatório à disposição do BCB (art. 11).\n\n## Aplicação prática no ciclo Rastro (proposta — validar)\n\nProntidão: a função de conformidade é a segunda linha que testa o sistema de controles internos da Res. 260; o relatório anual do art. 7º, V, é evidência exigível no diagnóstico. A contratação de especialistas (art. 7º, parágrafo único) é a porta normativa para o escritório executar testes de aderência sem assumir a função, respeitada a regra de segregação da matriz.\n\n## Conexão comercial (proposta — validar)\n\nDiagnóstico (política existe? está aprovada pelo conselho? há relatório anual? a função é segregada da auditoria interna?) e retainer (teste anual de aderência e relatório).\n\n## Lacunas\n\n- Página do DOU conferida só pela API (campo DOU).\n- Procedimentos simplificados para pequenas instituições, que a Res. CMN 4.595 autoriza o BCB a baixar (art. 13, II), não localizados para IPs.\n\n## Relações\n\n[[cmn-res-4595-2017]] · [[bcb-res-260-2022]] · [[bcb-res-93-2021]] · [[bcb-res-552-2026]] · [[escopo-controles-internos]] · [[matriz-controles-internos]]\n\n## Texto oficial (extração automática, 2026-11-02)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** Publicada no DOU de 28/1/2021, Seção 1, p. 52/53.\n**Ementa oficial:** Dispõe sobre a política de conformidade (compliance) das administradoras de consórcio, das instituições de pagamento, das sociedades corretoras de títulos e valores mobiliários, das sociedades distribuidoras de títulos e valores mobiliários e das sociedades corretoras de câmbio autorizadas a funcionar pelo Banco Central do Brasil.\n\n### Vigência (dispositivos transcritos)\n\n- Art. 13.  Esta Resolução entra em vigor em 1º de março de 2021. Otávio Ribeiro Damaso Diretor de Regulação\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 13/11/2024 · 1º\nde março de 2021 · 25/1/2024 · 26 DE JANEIRO DE 2021 · 26 de janeiro\nde 2021 · 3/3/2026 · 7 de dezembro de 2017 · 8 de\noutubro de 2008 · 9 de outubro de\n2013\n\n### Normas alteradas ou revogadas\n\n- revogada a Circular nº 3.865,\n\n### Dispositivos que tocam o escopo Rastro\n\n- Art. 2º  As instituições mencionadas no art. 1º devem implementar e manter política de conformidade compatível com a natureza, o porte, a complexidade, a estrutura, o perfil de risco e o modelo de negócio, de forma a assegurar o efetivo gerenciamento do seu risco de conformidade.  (Redação dada, a partir de 1º/3/2024, pela Resolução BCB nº 368, de 25/1/2024.) Parágrafo único.  Para fins desta Resolução, considera-se risco de conformidade a possibilidade de a administradora de consórcio ou a instituição de pagamento sofrer sanções legais ou administrativas, perdas financeiras, danos de reputaçã\n\n- Art. 5º  A política de conformidade deve definir, no mínimo: I - o objetivo e o escopo da função de conformidade; II - a divisão clara das responsabilidades das pessoas envolvidas na função de conformidade, de modo a evitar eventuais conflitos de interesses, principalmente com as áreas de negócios; III - a alocação de pessoal em quantidade suficiente, adequadamente treinado e com experiência necessária para o exercício das atividades relacionadas com a função de conformidade; IV - a posição, na estrutura organizacional, da unidade específica responsável pela função de conformidade, quando cons\n\n- Art. 7º  Os responsáveis pela execução das atividades relacionadas com a função de conformidade, independentemente da existência de unidade específica, devem: I - testar e avaliar a aderência da administradora de consórcio ou da instituição de pagamento ao arcabouço legal, à regulamentação infralegal, às recomendações dos órgãos de supervisão e, quando aplicáveis, aos códigos de ética, de conduta e outros regulamentos que estejam obrigadas a observar; I - testar e avaliar a aderência da instituição mencionada no art. 1º ao arcabouço legal, à regulamentação infralegal, às recomendações dos órgã\n\n- Art. 9º  O conselho de administração deve, além do previsto no art. 4º desta Resolução: I - assegurar: a) a adequada gestão da política de conformidade; b) a efetividade e a continuidade da aplicação da política de conformidade; c) a comunicação da política de conformidade a todos os empregados e prestadores de serviços terceirizados relevantes; e d) a disseminação de padrões de integridade e conduta ética como parte da cultura da administradora de consórcio ou instituição de pagamento; d) a disseminação de padrões de integridade e conduta ética como parte da cultura da instituição;  (Redação \n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n\n## Fichamento (operador, 2026-11-05)\n\n### Aplicação prática no ciclo Rastro\n\nA Res. BCB 65/2021 impõe a política de conformidade e a função de compliance\n\n### Lacunas\n\nNenhuma apontada no fichamento.\n"}, {"info": {"id": "bcb-res-80-2021", "titulo": "Resolução BCB nº 80, de 25 de março de 2021 (autorização e funcionamento das instituições de pagamento — consolidada) — A FICHAR", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2021-03-25", "tags": "[instituicao-de-pagamento, autorizacao, governanca, itp]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-80-2021.md", "quando": "2026-11-02"}, "meta": {"id": "bcb-res-80-2021", "tipo": "norma", "titulo": "Resolução BCB nº 80, de 25 de março de 2021 (autorização e funcionamento das instituições de pagamento — consolidada) — A FICHAR", "orgao": "BCB", "data_publicacao": "2021-03-25", "vigencia": "", "altera": "[]", "fase_rastro": "[]", "conexao_comercial": "[benchmark]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=80", "status": "fichado", "tags": "[instituicao-de-pagamento, autorizacao, governanca, itp]", "confidencial": "false"}, "corpo": "\n## Por que esta norma entra na base (triagem de 2026-10-26)\n\nRegime de autorização e funcionamento das IPs, inclusive a modalidade iniciadora de transação de pagamento; alterada pela Res. BCB 494/2025 (já fichada em bloco). Base do enquadramento (dimensão R do método).\n\n## Ementa\n\nNAO_CONFIRMADO — transcrever do texto oficial (fonte_primaria). Nada abaixo pode ser preenchido por inferência.\n\n## Vigência e prazos\n\nNAO_CONFIRMADO\n\n## Obrigações principais\n\nNAO_CONFIRMADO\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: eixo de controles internos (ver [[matriz-controles-internos]]). Detalhar após fichamento.\n\n## Conexão comercial\n\nDiagnóstico de controles internos. Detalhar após fichamento.\n\n## Lacunas\n\nFicha criada como stub de triagem: todo o conteúdo normativo está pendente de leitura do inteiro teor. Fontes secundárias usadas só para justificar a inclusão.\n\n## Relações\n\n[[matriz-controles-internos]] · [[bcb-res-85-2021]] · [[bcb-res-494-498-2025]]\n\n## Texto oficial (extração automática, 2026-10-29)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** Publicada no DOU de 29/3/2021, Seção 1, p. 69-71.\n**Ementa oficial:** Disciplina a constituição e o funcionamento das instituições de pagamento, estabelece os parâmetros para ingressar com pedidos de autorização de funcionamento por parte dessas instituições e dispõe sobre a prestação de serviços de pagamento por outras instituições autorizadas a funcionar pelo Banco Central do Brasil.\n\n### Vigência (dispositivos transcritos)\n\n- Art. 27.  Esta Resolução entra em vigor em 3 de maio de 2021. Otávio Ribeiro Damaso Diretor de Regulação ​\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 10 de janeiro de 2002 · 14/10/2021 · 15 de dezembro de\n2020 · 15 de dezembro de 1976 · 16 de março de 2016 · 16/11/2022 · 17 de\nmaio de 2018 · 18 de dezembro de\n2019 · 1º de janeiro de\n2026 · 1º de janeiro de 2022 · 1º de janeiro de 2025 · 1º de janeiro de 2026\n\n### Normas alteradas ou revogadas\n\n- Revogado pela Resolução BCB nº 494, de 5/9/2025\n- Revogado pela Resolução Conjunta nº 14, de 3/11/2025\n- alterada pela Resolução BCB nº 407, de 2/8/2024\n\n### Dispositivos que tocam o escopo Rastro\n\n- Art. 2º  O disposto nesta Resolução não se aplica às instituições de pagamento que, nos termos da regulamentação que disciplina a prestação de serviços de pagamento no âmbito dos arranjos de pagamento integrantes do Sistema de Pagamentos Brasileiro: I - participem exclusivamente de arranjos de pagamento de propósito limitado; ou  II - prestem serviços de pagamento exclusivamente no âmbito de programa destinado a conceder benefícios a pessoas naturais em função de relações de trabalho, de prestação de serviços ou similares, instituído por lei ou por ato do Poder Executivo federal, estadual ou m\n\n- Art. 3º  As instituições de pagamento são classificadas nas seguintes modalidades, de acordo com os serviços de pagamento prestados: I - emissor de moeda eletrônica: instituição de pagamento que gerencia conta de pagamento de usuário final, do tipo pré-paga, disponibiliza transação de pagamento que envolva o ato de pagar ou transferir, com base em moeda eletrônica previamente aportada nessa conta, converte tais recursos em moeda física ou escritural, ou vice-versa, podendo habilitar a aceitação da moeda eletrônica com a liquidação em conta de pagamento por ela gerenciada; II - emissor de instr\n\n- Art. 4º  É vedado à instituição de pagamento, na prestação do serviço de iniciação de transação de pagamento: I - armazenar o conjunto de dados relacionados com as credenciais dos usuários finais suficiente para autenticar a transação de pagamento perante a instituição detentora da conta; II - exigir do usuário final quaisquer outros dados além dos necessários para prestar o serviço de iniciação da transação de pagamento;  III - utilizar, armazenar ou acessar os dados para outra finalidade que não seja a prestação do serviço de iniciação de transação de pagamento expressamente solicitado pelo \n\n- Art. 4º-A  A instituição de pagamento que presta serviço de iniciação de transação de pagamento poderá executar, como atividade especial, no âmbito do  Open Finance , serviço de iniciação de transação de pagamento sem o redirecionamento para outros ambientes ou sistemas eletrônicos, inclusive de outras instituições, observado o disposto em regulamentação específica.  (Incluído pela Resolução BCB nº 407, de 2/8/2024.) Parágrafo único.  A instituição mencionada no  caput  deve comunicar ao Banco Central do Brasil, com noventa dias de antecedência, sua intenção de iniciar a execução, no âmbito do\n\n- Art. 5º  A instituição de pagamento deve ser constituída como sociedade empresária limitada ou anônima e ter por objeto social principal ao menos uma das atividades listadas no art. 6º, inciso III, da Lei nº 12.865, de 9 de outubro de 2013. § 1º  É vedada a constituição de instituição de pagamento como sociedade empresária na qual figure sócio único. § 1º  É vedada a constituição de instituição de pagamento na qual figure pessoa natural como sócio único.   (Redação dada, a partir de 1º/12/2022, pela Resolução BCB nº 257, de 16/11/2022.) § 2º  Admite-se a execução de outras atividades pela inst\n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n\n## Fichamento (operador, 2026-11-02)\n\n### Aplicação prática no ciclo Rastro\n\nA Res. BCB 80/2021 define as modalidades de instituição de pagamento (emissor de moeda eletrônica, emissor de instrumento pós-pago, credenciador e iniciador de transação de pagamento) e as condições de autorização e funcionamento\n\n### Lacunas\n\nNenhuma apontada no fichamento.\n"}, {"info": {"id": "bcb-res-81-2021", "titulo": "Resolução BCB nº 81, de 25 de março de 2021 (processos de autorização das IPs — consolidada) — A FICHAR", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2021-03-25", "tags": "[instituicao-de-pagamento, autorizacao, idoneidade]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-81-2021.md", "quando": "2026-11-03"}, "meta": {"id": "bcb-res-81-2021", "tipo": "norma", "titulo": "Resolução BCB nº 81, de 25 de março de 2021 (processos de autorização das IPs — consolidada) — A FICHAR", "orgao": "BCB", "data_publicacao": "2021-03-25", "vigencia": "", "altera": "[]", "fase_rastro": "[]", "conexao_comercial": "[benchmark]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=81", "status": "fichado", "tags": "[instituicao-de-pagamento, autorizacao, idoneidade]", "confidencial": "false"}, "corpo": "\n## Por que esta norma entra na base (triagem de 2026-10-26)\n\nRequisitos dos processos de autorização; alterada pela Res. BCB 495/2025 (sede física, idoneidade dos administradores para fraude e cibersegurança). Base do cenário de perímetro regulatório.\n\n## Ementa\n\nNAO_CONFIRMADO — transcrever do texto oficial (fonte_primaria). Nada abaixo pode ser preenchido por inferência.\n\n## Vigência e prazos\n\nNAO_CONFIRMADO\n\n## Obrigações principais\n\nNAO_CONFIRMADO\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: eixo de controles internos (ver [[matriz-controles-internos]]). Detalhar após fichamento.\n\n## Conexão comercial\n\nDiagnóstico de controles internos. Detalhar após fichamento.\n\n## Lacunas\n\nFicha criada como stub de triagem: todo o conteúdo normativo está pendente de leitura do inteiro teor. Fontes secundárias usadas só para justificar a inclusão.\n\n## Relações\n\n[[matriz-controles-internos]] · [[bcb-res-85-2021]] · [[bcb-res-494-498-2025]]\n\n## Texto oficial (extração automática, 2026-10-29)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** Publicada no DOU de 29/3/2021, Seção 1, p. 71/72.\n**Ementa oficial:** Disciplina os processos de autorização relacionados ao funcionamento das instituições de pagamento e à prestação de serviços de pagamento por parte de outras instituições autorizadas a funcionar pelo Banco Central do Brasil.\n\n### Vigência (dispositivos transcritos)\n\n- Nenhum dispositivo de vigência localizado automaticamente. Conferir no texto.\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 22/3/2022 · 25 DE MARÇO DE 2021 · 25 de\nmarço de 2021 · 3 de maio de 2021 · 4 de novembro de 2013 · 5 de setembro de 2025 · 5/9/2025 · 9 de outubro de 2013\n\n### Normas alteradas ou revogadas\n\n- Revogado pela Resolução BCB nº 495,\n\n### Dispositivos que tocam o escopo Rastro\n\n- Art. 2º  São requisitos para as autorizações referidas no art. 1º: I - capacidade econômico-financeira dos controladores, de forma isolada ou em conjunto, compatível com o capital necessário à estruturação e à operação da instituição, bem como às contingências decorrentes da dinâmica do mercado; II - origem lícita dos recursos utilizados na integralização do capital social, na aquisição de controle e de participação qualificada; III - sustentabilidade do modelo de negócio do empreendimento; IV - compatibilidade da infraestrutura de tecnologia da informação com a complexidade e os riscos do neg\n\n- Art. 3º  Dependem de autorização do Banco Central do Brasil: I - o funcionamento da instituição de pagamento, condicionado ao cumprimento dos requisitos previstos no art. 2º; II - a prestação de serviços de pagamento por outras instituições autorizadas a funcionar pelo Banco Central do Brasil, condicionada ao cumprimento dos requisitos previstos nos incisos III, IV, V e IX do art. 2º; III - a atuação de instituição iniciadora de transação de pagamento em nova modalidade de serviço de pagamento, condicionada ao cumprimento dos requisitos previstos nos incisos III, VII e IX do art. 2º; IV - a tr\n\n- Art. 6º  Para os fins desta Resolução, entende-se como: I - controlador: pessoa que, individualmente ou em conjunto com demais integrantes de grupo de controle de que participe, detenha direitos de sócio correspondentes à maioria do capital votante de sociedade anônima ou a 75% (setenta e cinco por cento) do capital social de sociedade limitada: a) no caso de pessoa natural, de forma direta ou indireta; ou b) no caso de pessoa jurídica, de forma direta ou, se de forma indireta, desde que figure no último nível dos ramos da cadeia de controle da instituição de pagamento e seus controladores não\n\n- Art. 7º  A participação societária direta que implique controle das instituições de pagamento somente pode ser exercida por: I - pessoas naturais; II - instituições autorizadas a funcionar pelo Banco Central do Brasil; III - instituições financeiras ou assemelhadas sediadas no exterior; ou IV - pessoas jurídicas sediadas no País que tenham por objeto social exclusivo a participação societária em instituições autorizadas a funcionar pelo Banco Central do Brasil. Parágrafo único.  Admite-se a participação no controle das instituições de pagamento de pessoas sem fins lucrativos que, na data de en\n\n- Art. 8º  A autorização para transferência ou alteração de controle em instituição de pagamento mencionada no inciso IV do art. 3º abrange qualquer alteração, direta ou indireta, no grupo de controle, que possa implicar mudança do quadro de pessoas que exercem a efetiva gestão dos negócios da instituição de pagamento, decorrentes de: I - acordo de acionistas ou quotistas; II - herança e atos de disposição de vontade, a exemplo de doação, adiantamento da legítima e constituição de usufruto; e III - ato, isolado ou em conjunto, de qualquer pessoa, natural ou jurídica, ou grupo de pessoas represen\n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n\n## Fichamento (operador, 2026-11-03)\n\n### Aplicação prática no ciclo Rastro\n\nRes. BCB 81/2021 descreve os processos de autorização em si\n\n### Lacunas\n\nNenhuma apontada no fichamento.\n"}, {"info": {"id": "bcb-res-85-2021", "titulo": "Resolução BCB nº 85, de 8 de abril de 2021 (segurança cibernética — texto consolidado)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2021-04-12", "tags": "[seguranca-cibernetica, instituicao-de-pagamento, nuvem, psti, comunicacao-bcb, crise]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-85-2021.md", "quando": "2026-07-14"}, "meta": {"id": "bcb-res-85-2021", "tipo": "norma", "titulo": "Resolução BCB nº 85, de 8 de abril de 2021 (segurança cibernética — texto consolidado)", "orgao": "BCB", "data_publicacao": "2021-04-12", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico, retainer, adversarial]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=85", "status": "fichado", "tags": "[seguranca-cibernetica, instituicao-de-pagamento, nuvem, psti, comunicacao-bcb, crise]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 85/2021 — a norma-base de segurança cibernética (consolidada)\n\nFichada a partir do texto INTEGRAL CONSOLIDADO (versão 4) obtido da API oficial do BCB em 2026-07-14, já incorporando as Resoluções BCB 368/2024, 538/2025 e 552/2026.\n\n## Ementa\n\nEmenta vigente (literal, redação da Res. BCB 552/2026): \"Dispõe sobre a política de segurança cibernética e sobre os requisitos para a contratação de serviços de processamento e armazenamento de dados e de computação em nuvem a serem observados pelas instituições de pagamento, pelas sociedades corretoras de títulos e valores mobiliários, pelas sociedades distribuidoras de títulos e valores mobiliários, pelas sociedades corretoras de câmbio e pelas sociedades prestadoras de serviços de ativos virtuais autorizadas a funcionar pelo Banco Central do Brasil.\" DOU 12/4/2021, S.1, p. 66/67; vigor em 1º/8/2021 (art. 27).\n\n## O ACHADO CENTRAL — comunicação de incidentes ao BCB SEM prazo fixado\n\nArt. 20, III (literal, redação da Res. 368/2024): \"a comunicação tempestiva ao Banco Central do Brasil das ocorrências de incidentes relevantes e das interrupções dos serviços relevantes, citados no inciso I, que configurem situação de crise pela instituição mencionada no art. 1º, bem como das providências para o reinício das suas atividades.\" Parágrafo único: \"As instituições [...] devem estabelecer e documentar os critérios que configurem a situação de crise de que trata o inciso III do caput.\"\n\nTrês consequências: (1) o padrão é \"tempestiva\" — NENHUM prazo em horas/dias em todo o texto consolidado; (2) o gatilho é incidente relevante QUE CONFIGURE CRISE; (3) a régua é autorregulada: a instituição define os parâmetros de relevância (art. 3º, V, \"d\") e os critérios de crise (art. 20, p.u.), com guarda documental de 5 anos (art. 23, IX). Contraste: a comunicação de CONTRATAÇÃO de serviço relevante tem prazo de 10 dias (art. 15, §2º).\n\n## Obrigações principais (redação vigente)\n\n- Política de segurança cibernética (art. 3º) com rol mínimo de 14 controles no §2º (redação 538/2025): autenticação, criptografia, prevenção/detecção de intrusão, prevenção de vazamentos, antimalware, rastreabilidade, backup, gestão de vulnerabilidades, controles de acesso, configuração segura, proteção de rede, certificados digitais, segurança de APIs/interfaces, e inteligência cibernética (monitoramento incl. Deep/Dark Web e grupos privados).\n- Art. 3º-A (538/2025) — requisitos RSFN/Pix/STR: MFA para acesso administrativo, isolamento físico e lógico dos ambientes Pix e STR (instância dedicada em nuvem), monitoramento de credenciais do SPI, validação de integridade antes da assinatura, e a alínea-chave \"f\": \"vedação do acesso de empresas prestadoras de serviços a terceiros às chaves privadas associadas a certificados digitais utilizados pela instituição para a assinatura de mensagens\" — o vetor exato dos incidentes C&M/Sinqia, agora vedado expressamente.\n- Plano de ação e resposta a incidentes (arts. 6º-10): diretor designado responsável (art. 7º), relatório anual até 31/3 (art. 8º, incl. resultados de pentest — inciso V, 538/2025), aprovação pelo CA/diretoria (art. 9º), revisão mínima anual (art. 10).\n- Testes de intrusão (art. 22-A, 538/2025): periodicidade mínima anual, executor independente, resultados e planos de correção documentados.\n- Contratação de processamento/nuvem (arts. 11-17): due diligence documentada (art. 12, §2º); responsabilidade INDELEGÁVEL da contratante (art. 14: \"é responsável pela confiabilidade, pela integridade, pela disponibilidade, pela segurança e pelo sigilo\"); cláusulas obrigatórias (art. 17: segregação, portabilidade, acesso do BCB, notificação de subcontratação); comunicação da contratação em 10 dias (art. 15, §2º).\n- Art. 22-B (538/2025): o serviço de mensageria na RSFN (PSTI) é serviço RELEVANTE — arrasta todo o regime de contratação dos arts. 11-17.\n- Guarda documental de 5 anos (art. 23): política, plano, relatório anual, due diligence, contratos, critérios de crise, resultados de pentest.\n\n## Alterações incorporadas\n\nRes. BCB 368/2024 (corretoras/distribuidoras; efeitos 1º/3/2024) · Res. BCB 538/2025 (reforma técnica; adequação até 1º/3/2026 cf. [[bcb-res-538-2025]]) · Res. BCB 552/2026 (inclui VASPs — prestadoras de serviços de ativos virtuais; pendente de ficha própria).\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: os dois documentos autorregulados — parâmetros de relevância de incidente (art. 3º, V, \"d\") e critérios de crise (art. 20, p.u.) — são O item de auditoria: sem eles o cliente falha a norma E perde a defesa de tempestividade. Revisar contratos de PSTI contra art. 17 + 22-B; auditar guarda de chaves privadas (art. 3º-A, \"f\"). War room: o diretor do art. 7º comanda formalmente; configurada crise pelos critérios pré-documentados, comunicar o BCB com as providências de reinício. Defesa: art. 14 impede terceirizar a culpa ao PSTI perante o BCB — a tese defensiva se constrói sobre due diligence, cláusulas, pentests e critérios pré-existentes, tudo com guarda de 5 anos.\n\n## Lacunas\n\n- \"Incidente relevante\" e \"crise\" sem definição normativa (delegadas à instituição) — a régua do playbook deve preencher.\n- Res. BCB 552/2026 (VASPs) e Res. 368/2024: pendentes de ficha própria.\n- Regime sancionador: remete ao arcabouço geral (Leis 12.865/2013 e 13.506/2017 — paráfrase, conferir).\n\n## Relações\n\n[[bcb-res-538-2025]] · [[hub-seguranca-cibernetica]] · [[hub-matriz-prazos]] · [[bcb-res-494-498-2025]] · [[hub-catalogo-medidas]] · [[estudo-72h-aprofundamento]]\n"}, {"info": {"id": "bcb-res-93-2021", "titulo": "Resolução BCB nº 93, de 6 de maio de 2021 (auditoria interna — IPs, consórcios, corretoras, DTVM, câmbio e VASPs)", "orgao": "BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2021-05-10", "tags": "[auditoria-interna, instituicao-de-pagamento, vasp, controles-internos, governanca]", "grupo": "normas", "caminho": "normas/bcb/bcb-res-93-2021.md", "quando": "2026-11-02"}, "meta": {"id": "bcb-res-93-2021", "tipo": "norma", "titulo": "Resolução BCB nº 93, de 6 de maio de 2021 (auditoria interna — IPs, consórcios, corretoras, DTVM, câmbio e VASPs)", "orgao": "BCB", "data_publicacao": "2021-05-10", "vigencia": "", "altera": "[\"Circular nº 3.856/2017 (arts. 1º a 24 revogados)\"]", "fase_rastro": "[prontidao, recuperacao_defesa]", "conexao_comercial": "[diagnostico, retainer]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=93", "status": "a_fichar", "tags": "[auditoria-interna, instituicao-de-pagamento, vasp, controles-internos, governanca]", "confidencial": "false"}, "corpo": "\n# Resolução BCB nº 93/2021 — auditoria interna das instituições reguladas pelo BCB\n\nFicha criada em 2026-10-29 a partir do inteiro teor lido no endpoint oficial do BCB pelo navegador do app (texto em `normas/bcb/_texto-res-93-2021.txt`). Ementa, vigência e obrigações são transcrição; aplicação e conexão comercial são propostas do assistente, a validar pelo operador, por isso o status permanece `a_fichar`.\n\n## Ementa\n\nEmenta vigente (redação da Res. BCB 552/2026): \"Dispõe sobre a atividade de auditoria interna nas administradoras de consórcio, nas instituições de pagamento, nas sociedades corretoras de títulos e valores mobiliários, nas sociedades distribuidoras de títulos e valores mobiliários, nas sociedades corretoras de câmbio e nas sociedades prestadoras de serviços de ativos virtuais autorizadas a funcionar pelo Banco Central do Brasil.\" DOU 10/5/2021, S.1, p. 22/23. Par da Res. CMN 4.879/2020.\n\n## Vigência e prazos\n\nVigor em 1º/6/2021 (art. 25). Corretoras, DTVM e câmbio desde 1º/3/2024 (Res. BCB 368/2024); VASPs desde 5/3/2026 (Res. BCB 552/2026). Art. 9º (remuneração) revogado em 1º/1/2025 pela Res. BCB 432/2024. Plano anual e relatório anual de auditoria interna aprovados pelo conselho (art. 17, parágrafo único); guarda dos documentos por cinco anos (art. 23, II).\n\n## Obrigações principais\n\nAtividade de auditoria interna proporcional, com condições para avaliação independente da qualidade e efetividade dos sistemas de controles internos, gerenciamento de riscos e governança (art. 2º). Unidade própria ou do conglomerado, subordinada ao conselho (art. 3º); admitida terceirização a auditor independente não responsável pelas demonstrações financeiras ou a entidade de classe, salvo para quem deva ter comitê de auditoria (art. 3º, §§ 1º e 2º). Independência, continuidade, recursos, canais e pessoal (art. 4º); chefe nomeado pelo conselho com comunicação ao BCB (art. 5º); vedações aos auditores, inclusive envolver-se na implementação de controles internos (art. 8º). Escopo abrange todas as funções, inclusive terceirizadas e do conglomerado (art. 10); avaliação mínima: controles internos e governança, políticas de risco, sistemas de informação gerencial, conformidade normativa, salvaguarda de ativos e determinações do BCB (art. 11). Regulamento aprovado pelo conselho e comitê de auditoria (arts. 13 e 14). Documentos obrigatórios: plano anual baseado em risco, plano e papéis de trabalho por auditoria, relato de conclusões, relatório de acompanhamento das providências e relatório anual (art. 17). Deveres do conselho (arts. 18 e 19); responsabilidades indelegáveis (art. 22); padrões do BCB, CFC e IIA Brasil (art. 20).\n\n## Aplicação prática no ciclo Rastro (proposta — validar)\n\nProntidão: a auditoria interna é quem avalia o sistema de controles internos (art. 5º, V, b, da Res. 260 e art. 11, I, desta). O relatório anual e o relatório de acompanhamento (art. 17, III e IV) são a trilha documental que prova que a deficiência foi vista e tratada. Defesa: em incidente, o histórico de auditoria é o que demonstra diligência da administração perante o BCB e em juízo. A vedação do art. 8º, I, reforça a regra de segregação do produto: quem audita não implementa.\n\n## Conexão comercial (proposta — validar)\n\nDiagnóstico (existe função? subordinada ao conselho? plano anual baseado em risco? relatório de acompanhamento?) e retainer (revisão anual dos documentos do art. 17).\n\n## Lacunas\n\n- Norma de comitê de auditoria para IPs (referida no art. 3º, §2º) não identificada nesta rodada.\n\n## Relações\n\n[[cmn-res-4879-2020]] · [[bcb-res-260-2022]] · [[bcb-res-65-2021]] · [[bcb-res-552-2026]] · [[escopo-controles-internos]]\n\n## Texto oficial (extração automática, 2026-11-02)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** Publicada no DOU de 10/5/2021, Seção 1, p. 22/23.\n**Ementa oficial:** Dispõe sobre a atividade de auditoria interna nas administradoras de consórcio, nas instituições de pagamento, nas sociedades corretoras de títulos e valores mobiliários, nas sociedades distribuidoras de títulos e valores mobiliários e nas sociedades corretoras de câmbio autorizadas a funcionar pelo Banco Central do Brasil.\n\n### Vigência (dispositivos transcritos)\n\n- Nenhum dispositivo de vigência localizado automaticamente. Conferir no texto.\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 10 de novembro de 2017 · 13/11/2024 · 1º de junho de 2021 · 25/1/2024 · 3/3/2026 · 6 DE MAIO DE 2021 · 6 de maio de 2021 · 8 de outubro de 2008 · 9 de outubro de 2013\n\n### Normas alteradas ou revogadas\n\n- Revogado, a partir de 1º/1/2025, pela Resolução BCB nº 432, de\n\n### Dispositivos que tocam o escopo Rastro\n\n- Art. 3º  A atividade de auditoria interna deve ser realizada por unidade específica da administradora de consórcio ou da instituição de pagamento, ou de outra instituição autorizada a funcionar pelo Banco Central do Brasil integrante do mesmo conglomerado prudencial, diretamente subordinada ao conselho de administração.\n\n- Art. 3º  A atividade de auditoria interna deve ser realizada por unidade específica da instituição mencionada no art. 1º ou de outra instituição autorizada a funcionar pelo Banco Central do Brasil integrante do mesmo conglomerado prudencial, diretamente subordinada ao conselho de administração.  (Redação dada, a partir de 1º/3/2024, pela Resolução BCB nº 368, de 25/1/2024.) § 1º  A atividade de auditoria interna de que trata o  caput  poderá ser realizada: I - por auditor independente devidamente habilitado, na forma da regulamentação vigente, para prestar serviços de auditoria independente pa\n\n- Art. 8º  É vedado a membro da equipe de auditoria interna: I - envolver-se no desenvolvimento e implementação de medidas específicas relativas aos controles internos; e II - atuar na auditoria de atividades pelas quais tenham tido responsabilidade, antes de decorridos, no mínimo, doze meses.\n\n- Art. 10.  O escopo da atividade de auditoria interna deve considerar todas as funções da administradora de consórcio e da instituição de pagamento, incluindo as terceirizadas.\n\n- Art. 12.  O Banco Central do Brasil poderá determinar: I - a inclusão de trabalhos no escopo da auditoria interna e a execução de trabalhos específicos; e II - a adoção de medidas com vistas ao aperfeiçoamento dos processos de auditoria interna. CAPÍTULO III DO REGULAMENTO DA ATIVIDADE DE AUDITORIA INTERNA\n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n"}, {"info": {"id": "manual-tempos-pix", "titulo": "Manual de Tempos do Pix v7.0 + Guia MED v4.3 + Manual de Resolução de Disputas v5.0 (os tempos operacionais)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2025-08-28", "tags": "[pix, med, prazos-operacionais, ans, manual, dict]", "grupo": "normas", "caminho": "normas/bcb/manual-tempos-pix.md", "quando": "2026-07-15"}, "meta": {"id": "manual-tempos-pix", "tipo": "norma", "titulo": "Manual de Tempos do Pix v7.0 + Guia MED v4.3 + Manual de Resolução de Disputas v5.0 (os tempos operacionais)", "orgao": "BCB", "data_publicacao": "2025-08-28", "vigencia": "", "altera": "[]", "fase_rastro": "[war_room, prontidao, recuperacao_defesa]", "conexao_comercial": "[retainer, diagnostico, benchmark]", "fonte_primaria": "https://www.bcb.gov.br/content/estabilidadefinanceira/pix/Regulamento_Pix/IX_ManualdeTemposdoPix.pdf", "status": "fichado", "tags": "[pix, med, prazos-operacionais, ans, manual, dict]", "confidencial": "false"}, "corpo": "\n# Os tempos operacionais do MED — Manual de Tempos v7.0 e Guia MED v4.3\n\nFichada em 2026-07-15 com leitura dos três PDFs oficiais: Manual de Tempos do Pix v7.0 (35 p., divulgado pela IN BCB 654/2025 — pacote MED 2.0 de 28/8/2025), Guia de implementação dos procedimentos de devolução no Pix v4.3 (47 p., bcb.gov.br/content/estabilidadefinanceira/pix/Guia_MED.pdf) e Manual de Resolução de Disputas v5.0 (8 p.).\n\n## DISTINÇÃO METODOLÓGICA (o que separa o especialista)\n\nO Manual de Tempos fixa **ANS por percentil** (metas de nível de serviço: \"X% dos casos em Y tempo\"), não prazos peremptórios caso a caso. Citar \"o prazo é 6 horas\" sem a nuance do percentil é tecnicamente errado — e um advogado adverso que saiba disso desmonta a afirmação. O Guia MED é documento operacional-orientativo (não normativo em sentido estrito); o vínculo normativo dos fluxos está no regulamento do Pix e no Manual do DICT.\n\n## Os tempos (transcrições/valores literais)\n\n| Tempo | O quê | Natureza | Fonte |\n|---|---|---|---|\n| 30 min (1.800 s) | Da reclamação do usuário no canal à abertura da notificação de infração/recuperação de valores | ANS 95% | Manual de Tempos, 4.2.2.7 |\n| 180 s | Acknowledge da notificação de infração | ANS 95% | Manual de Tempos, 4.2.1.1 |\n| 7 dias | Envio do resultado da análise da notificação de infração (\"Aberta\" no DICT) | ANS 95% | Manual de Tempos, 4.2.1.6; Guia MED (7 dias corridos) |\n| 72 horas | PSP do pagador iniciar a etapa de devolução após a análise (estado ANALYSED) | Guia MED (literal: \"tem até 72 horas\") + conclusão automática cf. Manual DICT 20.1.6 | Guia MED v4.3; [[bcb-ingest-instrucao-normativa-bcb-752-2026-07-01]] |\n| 6 horas | Conclusão de cada solicitação de devolução por fundada suspeita de fraude (efetivação pelo PSP recebedor) | **ANS 99%** | Manual de Tempos, 4.2.1.8 |\n| 48 horas | Conclusão de devolução por falha operacional | ANS 95% | Manual de Tempos, 4.2.1.9 |\n| Até 72 horas | Bloqueio cautelar de valores pelo PSP do recebedor, em suspeita de fraude | Guia MED (literal) | Guia MED v4.3 |\n| Até 24 horas | Cadeia de devoluções sequenciais quando há 4 PSPs | Guia MED (síntese literal) | Guia MED v4.3 |\n\n## Aplicação prática no ciclo Rastro\n\nWar room: a régua completa do relógio do dinheiro — reclamação → 30 min p/ abrir → bloqueios imediatos → 7 dias de análise → 72h p/ iniciar devolução → 6h por devolução. Prontidão: os ANS viram metas de auditoria do fluxo sistêmico do cliente (o serviço 2 do catálogo — implementação operacional do MED — audita exatamente contra esta tabela). Defesa: a natureza de ANS-percentil é argumento defensivo contra alegação de \"prazo estourado\" em caso isolado; e ofensivo quando o padrão do PSP adverso está sistematicamente fora da meta.\n\n## Lacunas\n\n- Manuais são versionados (v7.0/v4.3/v5.0 em 2026-07-15): conferir a versão vigente antes de citar em peça; atualizações chegam por IN (monitor captura).\n- Fundamento normativo exato do bloqueio cautelar no regulamento do Pix (artigo): o Guia o descreve; localizar o artigo no regulamento consolidado da Res. 1/2020 antes de citar em peça.\n\n## Relações\n\n[[bcb-ingest-instrucao-normativa-bcb-752-2026-07-01]] · [[bcb-res-493-2025]] · [[hub-matriz-prazos]] · [[hub-pix-med]] · [[estudo-72h-aprofundamento]]\n"}, {"info": {"id": "resolucao-conjunta-1-2020", "titulo": "Resolução Conjunta CMN/BCB nº 1, de 4 de maio de 2020 (Open Finance — regulamento) — A FICHAR", "orgao": "CMN/BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2020-05-04", "tags": "[open-finance, consentimento, iniciacao-de-pagamento]", "grupo": "normas", "caminho": "normas/bcb/resolucao-conjunta-1-2020.md", "quando": "2026-10-29"}, "meta": {"id": "resolucao-conjunta-1-2020", "tipo": "norma", "titulo": "Resolução Conjunta CMN/BCB nº 1, de 4 de maio de 2020 (Open Finance — regulamento) — A FICHAR", "orgao": "CMN/BCB", "data_publicacao": "2020-05-04", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao]", "conexao_comercial": "[diagnostico]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20Conjunta&numero=1", "status": "a_fichar", "tags": "[open-finance, consentimento, iniciacao-de-pagamento]", "confidencial": "false"}, "corpo": "\n## Por que esta norma entra na base (triagem de 2026-10-26)\n\nRegulamento do Open Finance: participantes, consentimento, compartilhamento de dados e serviços de iniciação de pagamento. Base do novo tipo 'open-finance' do mapa. Texto consolidado a transcrever.\n\n## Ementa\n\nNAO_CONFIRMADO — transcrever do texto oficial (fonte_primaria). Nada abaixo pode ser preenchido por inferência.\n\n## Vigência e prazos\n\nNAO_CONFIRMADO\n\n## Obrigações principais\n\nNAO_CONFIRMADO\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: eixo de controles internos (ver [[matriz-controles-internos]]). Detalhar após fichamento.\n\n## Conexão comercial\n\nDiagnóstico de controles internos. Detalhar após fichamento.\n\n## Lacunas\n\nFicha criada como stub de triagem: todo o conteúdo normativo está pendente de leitura do inteiro teor. Fontes secundárias usadas só para justificar a inclusão.\n\n## Relações\n\n[[matriz-controles-internos]] · [[bcb-res-85-2021]] · [[bcb-res-494-498-2025]]\n\n## Texto oficial (extração automática, 2026-10-29)\n\nItem sem número de norma identificável: trata-se de notícia ou publicação institucional, não de ato normativo. Não há inteiro teor a extrair da base de normativos.\n\n### Pendente do operador\n\n- Triagem: relevante para o escopo Rastro (fichar) ou descartar?\n- Se relevante: abrir a fonte no link do frontmatter e registrar o que interessa\n"}, {"info": {"id": "resolucao-conjunta-15-2025", "titulo": "Resolução Conjunta CMN/BCB nº 15, de 28 de novembro de 2025 (portabilidade de crédito no Open Finance) — A FICHAR", "orgao": "CMN/BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2025-11-28", "tags": "[open-finance, portabilidade, contratacao-fraudulenta]", "grupo": "normas", "caminho": "normas/bcb/resolucao-conjunta-15-2025.md", "quando": "2026-10-29"}, "meta": {"id": "resolucao-conjunta-15-2025", "tipo": "norma", "titulo": "Resolução Conjunta CMN/BCB nº 15, de 28 de novembro de 2025 (portabilidade de crédito no Open Finance) — A FICHAR", "orgao": "CMN/BCB", "data_publicacao": "2025-11-28", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao]", "conexao_comercial": "[diagnostico]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20Conjunta&numero=15", "status": "a_fichar", "tags": "[open-finance, portabilidade, contratacao-fraudulenta]", "confidencial": "false"}, "corpo": "\n## Por que esta norma entra na base (triagem de 2026-10-26)\n\nAltera a Res. Conjunta 1/2020 para incluir a portabilidade de operações de crédito no Open Finance; prazo de processamento reduzido para três dias úteis (fonte secundária: Demarest, nov/2025). Amplia a superfície de contratação fraudulenta. NAO_CONFIRMADO até o texto oficial.\n\n## Ementa\n\nNAO_CONFIRMADO — transcrever do texto oficial (fonte_primaria). Nada abaixo pode ser preenchido por inferência.\n\n## Vigência e prazos\n\nNAO_CONFIRMADO\n\n## Obrigações principais\n\nNAO_CONFIRMADO\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: eixo de controles internos (ver [[matriz-controles-internos]]). Detalhar após fichamento.\n\n## Conexão comercial\n\nDiagnóstico de controles internos. Detalhar após fichamento.\n\n## Lacunas\n\nFicha criada como stub de triagem: todo o conteúdo normativo está pendente de leitura do inteiro teor. Fontes secundárias usadas só para justificar a inclusão.\n\n## Relações\n\n[[matriz-controles-internos]] · [[bcb-res-85-2021]] · [[bcb-res-494-498-2025]]\n\n## Texto oficial (extração automática, 2026-10-29)\n\nItem sem número de norma identificável: trata-se de notícia ou publicação institucional, não de ato normativo. Não há inteiro teor a extrair da base de normativos.\n\n### Pendente do operador\n\n- Triagem: relevante para o escopo Rastro (fichar) ou descartar?\n- Se relevante: abrir a fonte no link do frontmatter e registrar o que interessa\n"}, {"info": {"id": "resolucao-conjunta-18-2025", "titulo": "Resolução Conjunta CMN/BCB nº 18, de 28 de novembro de 2025 (política de qualidade das informações prestadas ao BCB)", "orgao": "CMN/BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2025-11-28", "tags": "[controles-internos, qualidade-de-dados, instituicao-de-pagamento, auditoria]", "grupo": "normas", "caminho": "normas/bcb/resolucao-conjunta-18-2025.md", "quando": "2026-10-29"}, "meta": {"id": "resolucao-conjunta-18-2025", "tipo": "norma", "titulo": "Resolução Conjunta CMN/BCB nº 18, de 28 de novembro de 2025 (política de qualidade das informações prestadas ao BCB)", "orgao": "CMN/BCB", "data_publicacao": "2025-11-28", "vigencia": "", "altera": "[\"Resolução CMN nº 4.968/2021 (revoga art. 5º, IV, i, e parágrafo único)\"]", "fase_rastro": "[prontidao]", "conexao_comercial": "[diagnostico]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20Conjunta&numero=18", "status": "fichado", "tags": "[controles-internos, qualidade-de-dados, instituicao-de-pagamento, auditoria]", "confidencial": "false"}, "corpo": "\n# Resolução Conjunta CMN/BCB nº 18/2025 — política de qualidade das informações prestadas ao BCB\n\nInteiro teor recebido de Fabio em 2026-10-29 (cópia da página oficial exibenormativo); transcrição em `_texto-res-conjunta-18-2025.txt`. Conferir número de página do DOU antes de citar. A triagem de 26/10 está confirmada no essencial, com uma correção de alcance: a norma vincula também as instituições de pagamento e as VASPs, porque é ato conjunto CMN/BCB cujo art. 1º fala em \"instituições financeiras e demais instituições autorizadas a funcionar pelo Banco Central do Brasil\" e cuja fundamentação cita a Lei 12.865/2013 (art. 9º, II) e a Lei 14.478/2022 (arts. 6º e 7º, III); o art. 12, parágrafo único, trata expressamente das VASPs em regime de adequação.\n\n## Ementa\n\n\"Dispõe sobre a política de qualidade das informações prestadas na esfera de atuação do Banco Central do Brasil pelas instituições financeiras e demais instituições autorizadas a funcionar pelo Banco Central do Brasil.\"\n\n## Vigência e prazos\n\nVigor em 1º/1/2026 (art. 14). Adequação até 31/12/2026 (art. 12); VASPs em regime de adequação do art. 9º da Lei 14.478 seguem o prazo da regulamentação própria (art. 12, parágrafo único). Relatório semestral de qualidade (art. 3º, V, b). Guarda de política e relatórios por cinco anos, contados, para a política, do fim da vigência de cada versão (art. 11).\n\n## Obrigações principais\n\nPolítica de qualidade das informações, proporcional e em documento único segregado (arts. 2º e 8º), medida em doze dimensões definidas no art. 2º, §2º (acessibilidade, acurácia, adaptabilidade, clareza, comparabilidade, completude, confiabilidade, consistência, integridade, rastreabilidade, relevância, tempestividade). Conteúdo mínimo no art. 3º: governança com atribuições e recursos; arquitetura de dados e TI com validação prévia e detecção de erros, inclusive em crise; documentação das etapas com dicionário de dados e trilhas de verificação; disseminação e responsabilização; testes específicos de qualidade antes do envio, com reconciliação contra sistemas internos, e relatório semestral submetido ao conselho (ou diretoria), ao comitê de auditoria e às auditorias; medidas saneadoras com prazo e plano de ação; avaliação pela auditoria interna; revisão periódica; alinhamento às demais políticas. Responsabilidades indelegáveis de conselho e diretoria (arts. 4º e 7º); diretor responsável designado perante o BCB (art. 5º); dever de comunicar ao BCB irregularidades não corrigidas, providências e planos de ação (art. 9º); poderes do BCB de fixar testes, níveis mínimos, rejeitar e mandar substituir informações e determinar novas divulgações (art. 10). Revoga a alínea i do inciso IV e o parágrafo único do art. 5º da Res. CMN 4.968 (art. 13); não revoga o dispositivo paralelo da Res. BCB 260 (art. 5º, IV, i), que segue vigente.\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: é o componente de informação do sistema de controles internos desdobrado em política própria, com entregáveis datados (política até 31/12/2026, relatório semestral, diretor designado). Para IP a obrigação é dupla: a alínea i da 260 continua e a política da Res. Conjunta 18 se soma. Recuperação e defesa: a rastreabilidade (art. 2º, §2º, X) e as trilhas de verificação (art. 3º, III, e) são o que a instituição exibe ao BCB e em juízo quando o dado reportado é contestado.\n\n## Conexão comercial\n\nDiagnóstico de controles internos (componente de informação) e retainer: o relatório semestral e a revisão anual da política pelo conselho são recorrências naturais do serviço.\n\n## Lacunas\n\n- Página do DOU não confirmada.\n- Critérios de remessa do relatório \"na forma definida pelo BCB\" (art. 3º, parágrafo único, II; art. 10, III): ato ainda não localizado.\n- O frontmatter desta ficha ainda carrega `entrada_em_vigor: NAO_CONFIRMADO`; corrigido abaixo.\n\n## Relações\n\n[[cmn-res-4968-2021]] · [[bcb-res-260-2022]] · [[bcb-res-552-2026]] · [[escopo-controles-internos]] · [[matriz-controles-internos]] · [[hub-matriz-prazos]]\n"}, {"info": {"id": "resolucao-conjunta-6-2023", "titulo": "Resolução Conjunta nº 6, de 23 de
