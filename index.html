        <button class="acao sec" id="ff-descartar">Descartar (fora do escopo)</button>
        <span id="ff-msg" class="dim"></span>
      </div>
    </div>` : ""}`;
    if (m.status === "a_fichar") $("#ff-gravar").onclick = async () => {
      const corpo = {
        id: m.id,
        conferi_fonte: $("#ff-conferi").checked,
        vigencia: $("#ff-vigencia").value,
        aplicacao: $("#ff-aplicacao").value,
        lacunas: $("#ff-lacunas").value,
        fases: [...document.querySelectorAll(".ff-fase:checked")].map(x=>x.value),
        conexoes: [...document.querySelectorAll(".ff-con:checked")].map(x=>x.value),
      };
      const r = await api("/api/ficha/fichar", corpo);
      if (r.erro) { $("#ff-msg").textContent = "⚠️ " + r.erro; return; }
      irPara("fichas", m.id);
    };
    if (m.status === "a_fichar") $("#ff-descartar").onclick = async () => {
      const motivo = prompt("Motivo do descarte (fica registrado):");
      if (motivo === null) return;
      const r = await api("/api/ficha/descartar", {id: m.id, motivo});
      if (r.erro) { $("#ff-msg").textContent = "⚠️ " + r.erro; return; }
      irPara("painel");
    };
    if (m.status === "a_fichar" && $("#ir-fichar"))
      $("#ir-fichar").onclick = () =>
        document.getElementById("form-fichar").scrollIntoView({behavior:"smooth"});
    if (m.status === "fichado" && $("#ir-reabrir"))
      $("#ir-reabrir").onclick = async () => {
        if (!confirm("Reabrir esta ficha para revisão? Ela volta ao status "
          + "\"a fichar\" para você corrigir e refichar.")) return;
        const r = await api("/api/ficha/reabrir", {id: m.id});
        if (r.erro) { alert("⚠️ " + r.erro); return; }
        irPara("fichas", m.id);
      };
    return;
  }
  const fichas = await api("/api/fichas");
  const render = filtro => {
    const fs = fichas.filter(f =>
      (f.titulo + f.tags + f.orgao + f.id).toLowerCase().includes(filtro.toLowerCase()));
    $("#lista-fichas").innerHTML = `
    <table><tr><th>Título</th><th>Órgão</th><th>Status</th><th>Data</th><th>Grupo</th></tr>
    ${fs.map(f => `<tr class="clicavel" onclick="irPara('fichas','${f.id}')">
      <td>${esc(f.titulo)}</td><td>${esc(f.orgao)}</td>
      <td class="status-${esc(f.status)}">${esc(f.status)}</td>
      <td>${esc(f.data_publicacao)}</td><td>${esc(f.grupo)}</td></tr>`).join("")}
    </table>`;
  };
  $("#main").innerHTML = `
  <div class="cartao">
    <input type="text" id="busca" placeholder="Filtrar por título, tag, órgão…">
    <div id="lista-fichas" style="margin-top:12px"></div>
  </div>`;
  $("#busca").addEventListener("input", e => render(e.target.value));
  render("");
};

/* ---------- mapa mental circular por tipo de fintech (frameworks/mapa-controles-fintech.json) */
async function carregarMapaControles(){
  try{ const r = await api("/api/mapa-controles"); if (r && r.tipos) return r; }catch(e){}
  const f = await api("/api/ficha?id=mapa-controles-fintech");
  const m = (f && f.corpo || "").match(/```json\n([\s\S]*?)\n```/);
  return m ? JSON.parse(m[1]) : null;
}
TELAS.mapafintech = async (arg) => {
  const d = await carregarMapaControles();
  if (!d){ $("#main").innerHTML = `<div class="cartao">Mapa não encontrado (frameworks/mapa-controles-fintech.json).</div>`; return; }
  const N = d.tipos.length, W = 470, H = 470, cx = W/2, cy = H/2, R = 178;
  const pos = d.tipos.map((t,i) => { const a = -Math.PI/2 + i*2*Math.PI/N; return {x: cx + R*Math.cos(a), y: cy + R*Math.sin(a), a}; });
  const classe = t => /4\.968/.test(t.regime) ? "if" : /260/.test(t.regime) ? "ip" : "fora";
  const seloTxt = t => ({if:"IF · 4.968", ip:"IP · 260", fora:"fora"})[classe(t)];
  const curva = p => { const mx = (cx + p.x)/2 + (p.y - cy)*0.12, my = (cy + p.y)/2 - (p.x - cx)*0.12; return `M${cx},${cy} Q${mx},${my} ${p.x},${p.y}`; };
  const svg = `<svg class="mapa-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de controles por tipo de fintech">
    <defs>
      <radialGradient id="gradNucleo" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#8E1A57"/><stop offset="1" stop-color="#4D0B2E"/></radialGradient>
      <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#69103F" flood-opacity=".18"/></filter>
    </defs>
    <circle class="anel" cx="${cx}" cy="${cy}" r="${R}"/><circle class="anel2" cx="${cx}" cy="${cy}" r="${R+28}"/>
    ${pos.map((p,i)=>`<path class="raio" data-i="${i}" d="${curva(p)}"/>`).join("")}
    <g class="centro"><circle class="halo" cx="${cx}" cy="${cy}" r="64"/><circle class="nucleo" cx="${cx}" cy="${cy}" r="52"/>
      <text x="${cx}" y="${cy-8}" text-anchor="middle" style="font-size:12px">Controles</text><text x="${cx}" y="${cy+7}" text-anchor="middle" style="font-size:12px">internos</text>
      <text x="${cx}" y="${cy+23}" text-anchor="middle" style="font-size:9px;font-weight:500;opacity:.85">4.968 × 260</text></g>
    ${d.tipos.map((t,i)=>{ const p = pos[i], ls = t.rotulo || [t.nome], c = classe(t), selo = seloTxt(t), sw = selo.length*5.4+12; return `<g class="no ${c}" data-i="${i}" tabindex="0">
      <circle class="bolha" cx="${p.x}" cy="${p.y}" r="44"/>
      <text class="sigla" x="${p.x}" y="${p.y-6}" text-anchor="middle">${esc(ls[0])}</text>
      <text class="nome" x="${p.x}" y="${p.y+8}" text-anchor="middle">${esc((ls[1]||"").length>22?(ls[1]||"").slice(0,21)+"…":(ls[1]||""))}</text>
      <rect class="selo-bg" x="${p.x-sw/2}" y="${p.y+15}" width="${sw}" height="14"/><text class="selo" x="${p.x}" y="${p.y+25}" text-anchor="middle">${esc(selo)}</text></g>`; }).join("")}
  </svg>`;
  $("#main").innerHTML = `<div class="mapa-wrap">
    <div class="cartao">${svg}
      <div class="mapa-legenda"><span class="l-ip">Instituição de pagamento e demais · Res. BCB 260</span><span class="l-if">Instituição financeira · Res. CMN 4.968</span><span class="l-fora">Fora das normas por força própria</span></div>
      <p class="dim" style="font-size:12px;margin:8px 0 0">Clique num tipo para abrir a lista exaustiva de controles. Fonte: <a class="wiki" data-ficha="escopo-controles-internos">escopo-controles-internos</a> e fichas das normas (29/10/2026).</p></div>
    <div class="cartao mapa-detalhe" id="mapa-detalhe"><h2 class="secao">${esc(d.titulo)}</h2><p>${esc(d.nota)}</p><p class="dim">Selecione um tipo no mapa.</p></div></div>`;
  const li = (disp, txt) => `<li><span class="disp">${esc(disp)}</span> ${esc(txt)}</li>`;
  const lista = arr => `<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  const mostrar = i => {
    const t = d.tipos[i];
    document.querySelectorAll(".mapa-svg .no").forEach(n=>n.classList.toggle("ativo", +n.dataset.i===i));
    document.querySelectorAll(".mapa-svg .raio").forEach(n=>n.classList.toggle("ativo", +n.dataset.i===i));
    history.replaceState(null, "", "#mapafintech/" + t.id);
    const base = d.componentes.map(([k, nome]) => `<details ${k==="atividades"||k==="riscos"?"open":""}><summary>${esc(nome)} <span class="dim">(${d.base[k].length})</span></summary><ul>${d.base[k].map(([a,b])=>li(a,b)).join("")}</ul></details>`).join("");
    const anti = Object.entries(t.controles_antifraude).map(([k,v]) => `<details open><summary>${esc(k)} <span class="dim">(${v.length})</span></summary>${lista(v)}</details>`).join("");
    const conexas = `<ul>${t.conexas.map(([s,n,id,o]) => `<li><b>${esc(s)}</b> — ${esc(n)} <a class="wiki" data-ficha="${esc(id)}">${esc(id)}</a><br><span class="dim">${esc(o)}</span></li>`).join("")}</ul>`;
    const nBase = Object.values(d.base).reduce((n,a)=>n+a.length,0), nAnti = Object.values(t.controles_antifraude).reduce((n,a)=>n+a.length,0);
    $("#mapa-detalhe").innerHTML = `
      <div class="cabec"><span class="sig">${esc((t.rotulo||[t.nome])[0])}</span><h2 class="secao" style="margin:0">${esc(t.nome)}</h2></div><p>${esc(t.resumo)}</p>
      <div class="kpis"><div><b>${nBase}</b><span>itens do sistema de controles internos</span></div><div><b>${nAnti}</b><span>controles antifraude e continuidade</span></div><div><b>${t.conexas.length}</b><span>sistemas conexos</span></div><div><b>${t.prazos.length}</b><span>prazos</span></div></div>
      <h3>Enquadramento</h3><p>${esc(t.enquadramento)}</p>
      <p><span class="tag">Regime: ${esc(t.regime)}</span> <a class="wiki" data-ficha="${esc(t.regime_id)}">${esc(t.regime_id)}</a></p>
      <p><span class="tag">Norma de riscos: ${esc(t.riscos_norma)}</span> <a class="wiki" data-ficha="${esc(t.riscos_id)}">${esc(t.riscos_id)}</a></p>
      <h3>1 · Sistema de controles internos — itens exaustivos (${nBase})</h3>
      ${/fora|Nenhuma/.test(t.regime) ? `<p class="dim">Não se aplica por força própria a este tipo; os itens abaixo são os que o parceiro regulado tem de evidenciar e, por contrato, repassar.</p>` : ""}${base}
      <h3>2 · Controles antifraude e de continuidade da norma de riscos</h3>${anti}
      <h3>3 · Sistemas conexos (${t.conexas.length})</h3>${conexas}
      <h3>4 · Diretores e designações perante o BCB</h3>${lista(t.diretores)}
      <h3>5 · Prazos</h3>${lista(t.prazos)}
      <h3>6 · Notas de diagnóstico</h3>${lista(t.notas)}
      <h3>Fontes</h3><p>${t.fontes.map(f=>`<a class="wiki" data-ficha="${esc(f)}">${esc(f)}</a>`).join(" · ")}</p>`;
    $("#mapa-detalhe").scrollIntoView({behavior:"smooth", block:"start"});
  };
  document.querySelectorAll(".mapa-svg .no").forEach(n => {
    n.addEventListener("click", () => mostrar(+n.dataset.i));
    n.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); mostrar(+n.dataset.i); } });
  });
  if (arg){ const i = d.tipos.findIndex(t=>t.id===arg); if (i>=0) mostrar(i); }
};

/* ---------- caso real (gerador de passo a passo do war room) */
function somaDiasUteis(data, n){
  const d = new Date(data);
  let uteis = 0;
  while (uteis < n){
    d.setDate(d.getDate()+1);
    if (d.getDay() !== 0 && d.getDay() !== 6) uteis++;
  }
  return d;
}

/* ---------- IPR-72 */
TELAS.ipr72 = async () => {
  const f = await api("/api/ipr72");
  $("#main").innerHTML = `
  <div class="cartao"><h2 class="secao">${esc(f.titulo)}</h2>
    <p class="dim">Versão ${esc(f.versao)}</p>
    <div class="aviso"><b>CONTEÚDO CONFIDENCIAL</b> — protótipo interno: pesos,
    fórmula e régua são segredo de negócio. Não apresentar a cliente sem decisão
    expressa. Documento conceitual na ficha <a class="wiki" data-ficha="metodologia-proprietaria">metodologia-proprietaria</a>.</div>
    <p>Responda pensando num cliente concreto (ou na própria tese). Níveis:</p>
    <ul>${f.niveis.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>
  </div>
  <form id="quiz">
  ${f.dimensoes.map(d=>`<div class="cartao"><h2 class="secao">${esc(d.nome)}
      <span class="chip">peso ${d.peso}%</span></h2>
    ${d.perguntas.map(p=>`<p style="margin-bottom:4px"><b>${esc(p.texto)}</b><br>
      <span class="dim">Âncora: ${esc(p.fonte)}</span></p>
      <div class="linha-botoes">${[1,2,3,4].map(n=>`
        <label><input type="radio" name="${p.id}" value="${n}" required> ${n}</label>`).join("")}
      </div>`).join("")}
  </div>`).join("")}
  <div class="linha-botoes"><button class="acao" type="submit">Calcular score</button></div>
  </form><div id="resultado"></div>`;
  $("#quiz").onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    let score = 0; const porDim = [];
    f.dimensoes.forEach(d => {
      const media = d.perguntas.reduce((s,p)=>s + +fd.get(p.id), 0) / d.perguntas.length;
      const nota = (media - 1) / 3 * 100;           // nível 1→0, nível 4→100
      porDim.push({nome: d.nome, nota, peso: d.peso,
        fraca: d.perguntas.filter(p=>+fd.get(p.id)<=2)});
      score += nota * d.peso / 100;
    });
    score = Math.round(score);
    const faixa = f.faixas.find(x => score <= x.ate);
    porDim.sort((a,b)=>a.nota-b.nota);
    $("#resultado").innerHTML = `
    <div class="cartao"><h2 class="secao">Score IPR-72: ${score}/100 — ${esc(faixa.rotulo)}</h2>
      <p>${esc(faixa.leitura)}</p>
      ${porDim.map(d=>`<p style="margin:6px 0"><b>${esc(d.nome)}</b> — ${Math.round(d.nota)}/100
        <span class="chip">peso ${d.peso}%</span></p>
        <div style="background:var(--chip);border-radius:8px;height:8px;max-width:520px">
          <div style="background:${d.nota<40?"var(--ruim)":d.nota<70?"var(--meio)":"var(--ok)"};
            height:8px;border-radius:8px;width:${Math.max(2,d.nota)}%"></div></div>`).join("")}
      ${porDim[0].fraca.length ? `<div class="aviso" style="margin-top:14px">
        <b>Prioridades (respostas nível 1-2 na dimensão mais fraca):</b>
        <ul>${porDim[0].fraca.map(p=>`<li>${esc(p.texto)}<br>
          <span class="dim">Âncora: ${esc(p.fonte)}</span></li>`).join("")}</ul></div>` : ""}
      <p class="dim">Protótipo v0.1: régua não calibrada — validar em 3-5 casos antes de uso comercial.</p>
    </div>`;
    $("#resultado").scrollIntoView({behavior:"smooth"});
  };
};

/* ---------- simulador */
TELAS.simulador = async (cid) => {
  if (!cid){
    const cs = await api("/api/cenarios");
    $("#main").innerHTML = `<div class="cartao"><h2 class="secao">Cenários de incidente</h2>
    ${cs.map(c=>`<button class="opcao" onclick="irPara('simulador','${c.id}')">
      <b>${esc(c.titulo)}</b><br><span class="dim">${esc(c.id)}</span></button>`).join("")}
    <p class="dim">O relógio do caso avança conforme as suas escolhas. Ao final,
    cada decisão é avaliada contra a matriz de obrigações, com a fonte.</p></div>`;
    return;
  }
  const cen = await api("/api/cenario?id=" + encodeURIComponent(cid));
  let relogio = new Date(cen.inicio), idx = 0;
  const historico = []; const t0 = Date.now();
  const fmt = d => d.toLocaleString("pt-BR",
    {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
  const mostra = () => {
    const p = cen.decisoes[idx];
    if (p.quando){ const q = new Date(p.quando); if (q > relogio) relogio = q; }
    $("#main").innerHTML = `
    <div class="linha-botoes"><button class="acao sec" onclick="irPara('simulador')">← cenários</button>
      <span class="relogio">🕐 ${fmt(relogio)}</span>
      <span class="rotulo">Decisão ${idx+1}/${cen.decisoes.length}</span></div>
    ${idx===0?`<div class="cartao"><b>${esc(cen.titulo)}</b><p>${esc(cen.contexto)}</p></div>`:""}
    <div class="cartao"><p><b>${esc(p.situacao)}</b></p>
      ${p.opcoes.map((o,n)=>`<button class="opcao" data-n="${n}">${esc(o.texto)}</button>`).join("")}
    </div>`;
    document.querySelectorAll(".opcao").forEach(b => b.onclick = () => {
      const o = p.opcoes[+b.dataset.n];
      relogio = new Date(relogio.getTime() + o.custo_minutos*60000);
      historico.push({o, quando: new Date(relogio)});
      idx++;
      if (idx < cen.decisoes.length) mostra(); else fim();
    });
  };
  const fim = () => {
    const nota = {correta:2, parcial:1, errada:0};
    const rot = {correta:"CORRETA", parcial:"PARCIAL", errada:"ERRADA"};
    const obtido = historico.reduce((s,h)=>s+nota[h.o.avaliacao],0);
    const verifs = (cen.verificacoes_finais||[]).map(v => {
      const ok = relogio <= new Date(v.limite);
      return `<div class="cartao ${ok?"fb-correta":"fb-errada"}">
        <b>${ok?"DENTRO DO PRAZO":"PRAZO ESTOURADO"}</b> — ${esc(v.descricao)}<br>
        <span class="dim">limite ${fmt(new Date(v.limite))} · caso encerrado às ${fmt(relogio)}
        · Fonte: ${esc(v.fonte)}</span></div>`;
    }).join("");
    $("#main").innerHTML = `
    <div class="cartao"><h2 class="secao">Relatório — ${esc(cen.titulo)}</h2>
    <p><b>Pontuação: ${obtido}/${historico.length*2}</b> ·
      tempo real de decisão: ${Math.round((Date.now()-t0)/1000)}s ·
      relógio final do caso: ${fmt(relogio)}</p></div>
    ${historico.map((h,n)=>`<div class="cartao fb-${h.o.avaliacao}">
      <div class="rotulo">Decisão ${n+1} — ${rot[h.o.avaliacao]}</div>
      <p><b>${esc(h.o.texto)}</b></p><p>${esc(h.o.feedback)}</p>
      <p class="dim">Fonte: ${esc(h.o.fonte)}</p></div>`).join("")}
    ${verifs}
    <div class="linha-botoes">
      <button class="acao sec" onclick="irPara('simulador','${cen.id}')">Repetir cenário</button>
      <button class="acao sec" onclick="irPara('matriz')">Rever matriz de prazos</button>
    </div>`;
  };
  mostra();
};

    $("#rodar").disabled = true;
    $("#saida").innerHTML = `<p class="dim">Consultando BCB e ANPD… (até 1-2 min)</p>`;
    try{
      const r = await api("/api/monitorar",
        {desde: $("#desde").value.trim(), dry_run: $("#dry").checked});
      $("#saida").innerHTML = `<pre class="saida">${esc(r.saida)}</pre>` +
        (r.ok ? `<p class="dim">Concluído. Novos itens aparecem no
          <a class="wiki" onclick="irPara('painel')">Painel</a> como “a fichar”.</p>`
        : `<p class="status-a_fichar">O monitor retornou erro — ver saída acima.</p>`);
    } catch(e){
      $("#saida").innerHTML = `<p class="status-a_fichar">Falha: ${esc(e.message)}</p>`;
    }
    $("#rodar").disabled = false;
  };
};

/* rota inicial via hash: #trilha, #ipr72, #fichas/bcb-res-493-2025 … */
const [hAba, hArg] = location.hash.slice(1).split("/");
if (TELAS[hAba]) { abaAtual = hAba; nav(); TELAS[hAba](hArg || undefined); }
else { nav(); TELAS.painel(); }
</script>
