<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rastro — Conhecimento (versão pública)</title>
<style>
:root{
  --bg:#F2F0F1; --painel:#FFFFFF; --tinta:#2A2430; --suave:#6B6570;
  --marca:#69103F; --marca2:#8E1A57; --verde:#7A9A12; --linha:#E4DEE2;
  --ok:#7A9A12; --meio:#B26A00; --ruim:#B00020; --chip:#F4EEF1;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 Arial,"Helvetica Neue",Helvetica,sans-serif;
  background:var(--bg);color:var(--tinta)}
header{background:linear-gradient(135deg,#5C0D36 0%,#69103F 55%,#7C1A4C 100%);
  color:#fff;padding:16px 26px;display:flex;align-items:center;gap:18px;
  flex-wrap:wrap}
header .logo{height:34px;width:auto}
header h1{font-size:19px;margin:0;letter-spacing:1.5px;font-weight:700;
  border-left:1px solid rgba(255,255,255,.35);padding-left:18px}
header h1 b{color:var(--verde);font-weight:700}
header small{opacity:.8;letter-spacing:.5px;font-size:12.5px}
nav{display:flex;gap:5px;background:#5C0D36;padding:9px 22px 11px;flex-wrap:wrap}
nav button{border:1px solid transparent;background:rgba(255,255,255,.07);color:#EAD7E2;
  padding:7px 15px;border-radius:6px;cursor:pointer;font-size:13.5px;
  transition:all .15s}
nav button:hover{border-color:var(--verde);color:#fff}
nav button.ativo{background:#fff;color:var(--marca);font-weight:700}
main{max-width:1080px;margin:22px auto;padding:0 18px}
.cartao{background:var(--painel);border:1px solid var(--linha);border-radius:12px;
  padding:18px 22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(105,16,63,.05)}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--painel);border:1px solid var(--linha);
  border-radius:12px;padding:16px 18px;text-align:center;position:relative;overflow:hidden;
  box-shadow:0 1px 3px rgba(105,16,63,.05)}
.kpi::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--marca),transparent)}
.kpi b{display:block;font-size:34px;color:var(--marca);font-variant-numeric:tabular-nums;
  font-weight:800;letter-spacing:-.5px}
.kpi b.laranja{color:var(--marca)} .kpi b.verde{color:var(--ok)} .kpi b.ambar{color:var(--meio)}
.donut{width:150px;height:150px;border-radius:50%;margin:6px auto;
  display:flex;align-items:center;justify-content:center}
.donut>div{width:96px;height:96px;border-radius:50%;background:var(--painel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;font-size:22px}
.barra-h{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.barra-h .trilho{flex:1;background:var(--chip);border-radius:6px;height:14px;overflow:hidden}
.barra-h .valor{height:14px;border-radius:6px;background:linear-gradient(90deg,#69103F,#A83A72)}
.graficos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.chip{display:inline-block;background:var(--chip);border-radius:20px;
  padding:1px 10px;font-size:12px;color:var(--suave);margin:1px 3px 1px 0}
.status-fichado{color:var(--ok);font-weight:600}
.status-a_fichar{color:var(--meio);font-weight:600}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--linha);padding:7px 9px;text-align:left;
  vertical-align:top}
th{font-size:12px;text-transform:uppercase;color:var(--suave);letter-spacing:.5px}
tr.clicavel{cursor:pointer}
tr.clicavel:hover{background:#FAF4F7}
button.acao{border:0;background:var(--marca);color:#fff;padding:9px 18px;
  border-radius:8px;cursor:pointer;font-size:14px;font-weight:700}
button.acao:hover{filter:brightness(1.12)}
button.acao.sec{background:transparent;color:var(--marca);border:1px solid var(--marca)}
button.acao:disabled{opacity:.5;cursor:default}
input[type=text],input[type=datetime-local],textarea,select{width:100%;
  border:1px solid var(--linha);border-radius:8px;padding:9px 11px;font:inherit;
  background:#fff;color:var(--tinta)}
textarea{min-height:90px;resize:vertical}
.md h1{font-size:22px;border-bottom:2px solid var(--linha);padding-bottom:6px}
.md h2{font-size:17px;color:var(--marca);margin-top:22px}
.md table{margin:10px 0}
.md code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:13px}
.md pre{background:#2A2430;color:#e6edf3;padding:14px;border-radius:10px;
  overflow-x:auto;font-size:13px;border:1px solid var(--linha)}
.md pre code{background:none;color:inherit;padding:0}
/* ---------- mapa circular por tipo de fintech */
.mapa-wrap{display:grid;grid-template-columns:minmax(320px,470px) 1fr;gap:16px;align-items:start}
@media(max-width:980px){.mapa-wrap{grid-template-columns:1fr}}
.mapa-svg{width:100%;height:auto;display:block;font-family:inherit}
.mapa-svg .anel{fill:none;stroke:#E9DFE5;stroke-width:14;opacity:.55}
.mapa-svg .anel2{fill:none;stroke:#F3EBEF;stroke-width:1}
.mapa-svg .raio{stroke:#D9CBD3;stroke-width:1.4;fill:none;transition:all .2s}
.mapa-svg .raio.ativo{stroke:var(--marca2);stroke-width:3}
.mapa-svg .centro .halo{fill:var(--marca);opacity:.12}
.mapa-svg .centro .nucleo{fill:url(#gradNucleo);stroke:none;filter:url(#sombra)}
.mapa-svg .centro text{fill:#fff;font-weight:700;pointer-events:none}
.mapa-svg .no{cursor:pointer;transition:transform .18s ease;transform-box:fill-box;transform-origin:center}
.mapa-svg .no:hover,.mapa-svg .no.ativo{transform:scale(1.07)}
.mapa-svg .no .bolha{stroke-width:2.2;filter:url(#sombra);transition:all .18s}
.mapa-svg .no.if .bolha{fill:#FBF3F7;stroke:#8E1A57}
.mapa-svg .no.ip .bolha{fill:#FFFFFF;stroke:#69103F}
.mapa-svg .no.fora .bolha{fill:#F6F4F5;stroke:#9A8C93;stroke-dasharray:5 4}
.mapa-svg .no.ativo .bolha{fill:var(--marca)!important;stroke:var(--marca)!important;stroke-dasharray:none!important}
.mapa-svg .no .sigla{font-size:13px;font-weight:800;fill:var(--marca);letter-spacing:.3px;pointer-events:none}
.mapa-svg .no .nome{font-size:9.5px;font-weight:600;fill:#4A3A43;pointer-events:none}
.mapa-svg .no.fora .sigla{fill:#6E6066}
.mapa-svg .no.ativo .sigla,.mapa-svg .no.ativo .nome{fill:#fff}
.mapa-svg .no .selo{font-size:8.5px;font-weight:700;fill:#fff;pointer-events:none}
.mapa-svg .no .selo-bg{rx:7;ry:7}
.mapa-svg .no.if .selo-bg{fill:#8E1A57} .mapa-svg .no.ip .selo-bg{fill:#69103F} .mapa-svg .no.fora .selo-bg{fill:#9A8C93}
.mapa-svg .no.ativo .selo-bg{fill:#fff} .mapa-svg .no.ativo .selo{fill:var(--marca)}
.mapa-legenda{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 0;font-size:12px;color:var(--suave)}
.mapa-legenda span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid}
.mapa-legenda .l-if::before{background:#FBF3F7;border-color:#8E1A57}
.mapa-legenda .l-ip::before{background:#fff;border-color:#69103F}
.mapa-legenda .l-fora::before{background:#F6F4F5;border-color:#9A8C93;border-style:dashed}
.mapa-detalhe h3{margin:18px 0 6px;font-size:13px;color:var(--marca);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--linha);padding-bottom:4px}
.mapa-detalhe details{border:1px solid var(--linha);border-radius:10px;padding:7px 12px;margin:6px 0;background:#fff}
.mapa-detalhe details[open]{border-color:#D9C7D0;background:#FDFBFC}
.mapa-detalhe summary{cursor:pointer;font-weight:600;color:var(--marca2)}
.mapa-detalhe ul{margin:6px 0 4px 18px;padding:0} .mapa-detalhe li{margin:4px 0;font-size:13px;line-height:1.45}
.mapa-detalhe .disp{display:inline-block;min-width:118px;color:var(--suave);font-size:12px;font-variant-numeric:tabular-nums}
.mapa-detalhe .tag{display:inline-block;background:#FAF4F7;border:1px solid #E4D3DB;border-radius:999px;padding:3px 10px;font-size:11.5px;margin:2px 6px 2px 0;color:var(--marca)}
.mapa-detalhe .cabec{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mapa-detalhe .cabec .sig{background:var(--marca);color:#fff;border-radius:10px;padding:6px 12px;font-weight:800;font-size:15px}
.mapa-detalhe .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.mapa-detalhe .kpis div{background:#FAF4F7;border-radius:10px;padding:8px 10px;text-align:center}
.mapa-detalhe .kpis b{display:block;font-size:22px;color:var(--marca);font-variant-numeric:tabular-nums}
.mapa-detalhe .kpis span{font-size:11px;color:var(--suave)}
a.wiki{color:var(--marca2);text-decoration:none;border-bottom:1px dashed var(--marca2);
  cursor:pointer}
.aviso{background:#FBF3E5;border:1px solid #E7D3A8;border-radius:10px;
  padding:10px 14px;margin:10px 0;font-size:14px;color:#7A5A10}
.fb-correta{border-left:5px solid var(--ok)}
.fb-parcial{border-left:5px solid var(--meio)}
.fb-errada{border-left:5px solid var(--ruim)}
.relogio{font-variant-numeric:tabular-nums;background:var(--marca);color:#fff;
  border-radius:8px;padding:4px 12px;font-size:15px;font-weight:800}
.opcao{display:block;width:100%;text-align:left;background:#fff;color:var(--tinta);
  border:1px solid var(--linha);border-radius:10px;padding:11px 14px;margin:7px 0;
  cursor:pointer;font:inherit;transition:all .15s}
.opcao:hover{border-color:var(--marca);background:#FAF4F7}
pre.saida{background:#2A2430;color:#e6edf3;padding:14px;border-radius:10px;
  white-space:pre-wrap;font-size:13px;max-height:420px;overflow:auto;
  border:1px solid var(--linha)}
.rotulo{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--suave)}
.dim{color:var(--suave);font-size:13px}
h2.secao{margin:4px 0 14px}
.linha-botoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.grade2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.mini{background:var(--chip);border:1px solid var(--linha);border-radius:10px;padding:12px 14px}
.mini ul{font-size:14px}
button.acao.sec.ativo{background:var(--marca);color:#fff;font-weight:700}
#form-fichar{display:none !important}
#ir-fichar,#ir-reabrir{display:none !important}
.badge-pub{background:var(--chip);border:1px solid var(--linha);color:var(--suave);border-radius:20px;padding:2px 12px;font-size:12px}
</style>
</head>

com a EGI — INGESTÃO AUTOMÁTICA", "orgao": "ANPD", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2026-09-16", "tags": "[protecao de dados]", "grupo": "normas", "caminho": "normas/anpd/anpd-ingest-servidores-da-anpd-participam-de-curso-de-formacao-promovido-em-parcer.md", "quando": "2026-11-05"}, "meta": {"id": "anpd-ingest-servidores-da-anpd-participam-de-curso-de-formacao-promovido-em-parcer", "tipo": "norma", "titulo": "Servidores da ANPD participam de curso de formação promovido em parceria com a EGI — INGESTÃO AUTOMÁTICA", "orgao": "ANPD", "data_publicacao": "2026-09-16", "fonte_primaria": "https://www.gov.br/anpd/pt-br/assuntos/noticias/servidores-anpd-curso-formacao-egi", "status": "a_fichar", "tags": "[protecao de dados]", "confidencial": "false"}, "corpo": "\n## Descrição (retornada pelo portal — fonte: notícias; conferir no texto oficial/DOU)\n\nCurso presencial reuniu mais de 40 participantes para discutir os desafios técnicos e políticos da Internet e suas relações com a proteção de dados e os direitos fundamentais\n\n## Texto oficial (extração automática, 2026-11-05)\n\nItem sem número de norma identificável: trata-se de notícia ou publicação institucional, não de ato normativo. Não há inteiro teor a extrair da base de normativos.\n\n### Pendente do operador\n\n- Triagem: relevante para o escopo Rastro (fichar) ou descartar?\n- Se relevante: abrir a fonte no link do frontmatter e registrar o que interessa\n"}, {"info": {"id": "anpd-res-cd-15-2024", "titulo": "Resolução CD/ANPD nº 15, de 24 de abril de 2024 (comunicação de incidente)", "orgao": "ANPD", "tipo": "norma", "status": "fichado", "data_publicacao": "2024-04-26", "tags": "[anpd, lgpd, incidente, comunicacao, protecao-de-dados]", "grupo": "normas", "caminho": "normas/anpd/anpd-res-cd-15-2024.md", "quando": "2026-07-03"}, "meta": {"id": "anpd-res-cd-15-2024", "tipo": "norma", "titulo": "Resolução CD/ANPD nº 15, de 24 de abril de 2024 (comunicação de incidente)", "orgao": "ANPD", "data_publicacao": "2024-04-26", "vigencia": "", "altera": "[\"Resolução CD/ANPD nº 2/2022, art. 14, II (agentes de pequeno porte)\"]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[benchmark, diagnostico, retainer, adversarial]", "fonte_primaria": "https://pesquisa.in.gov.br/imprensa/servlet/INPDFViewer?jornal=515&pagina=114&data=26/04/2024&captchafield=firstAccess", "status": "fichado", "tags": "[anpd, lgpd, incidente, comunicacao, protecao-de-dados]", "confidencial": "false"}, "corpo": "\n# Resolução CD/ANPD nº 15/2024 — comunicação de incidente de segurança\n\n## Ementa\n\nEmenta oficial (literal): \"Aprova o Regulamento de Comunicação de Incidente de Segurança.\" Editada pelo Conselho Diretor da ANPD com fundamento no art. 55-J, XIII, da Lei nº 13.709/2018 (LGPD), regulamentando o art. 48. Publicada no DOU de 26/04/2024, Seção 1, p. 114. Vigência na data da publicação (art. 3º).\n\n## Vigência e prazos\n\nEm vigor desde 26/04/2024, sem cronograma escalonado. O prazo operacional central: a comunicação de incidente à ANPD deve ser realizada pelo controlador em três dias úteis, contados do conhecimento pelo controlador de que o incidente afetou dados pessoais (art. 6º, caput e §1º do Regulamento), ressalvada a existência de prazo em legislação específica. Mesmo prazo para a comunicação aos titulares afetados, quando exigida.\n\n## Obrigações principais\n\nComunicar à ANPD e aos titulares os incidentes que possam acarretar risco ou dano relevante. Risco relevante (art. 5º): afetação significativa de interesses e direitos fundamentais e, cumulativamente, ao menos um critério — dados sensíveis; dados de crianças, adolescentes ou idosos; dados financeiros; dados de autenticação em sistemas; dados sob sigilo legal, judicial ou profissional; ou dados em larga escala. Obrigação de registrar todos os incidentes, inclusive os não comunicados, por prazo mínimo de cinco anos contado da data do registro, com conteúdo mínimo (data de conhecimento, descrição das circunstâncias etc.).\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: existência de procedimento interno de avaliação de risco relevante e de livro de registro de incidentes — itens do benchmark. War room: o relógio de três dias úteis começa a correr no conhecimento do controlador; a decisão comunicar/não comunicar (com fundamentação registrada) é das primeiras do playbook de 72h. Recuperação/defesa: o registro de incidentes e a comunicação tempestiva (ou a fundamentação da não comunicação) são provas centrais na onda consumerista e em eventual fiscalização da ANPD.\n\n## Conexão comercial\n\nAlimenta todos os degraus: benchmark (bloco ANPD), diagnóstico (procedimento de avaliação de risco), retainer (execução da comunicação no war room) e adversarial (defesa em fiscalização e contencioso).\n\n## Lacunas\n\n- Formulário/canal de comunicação e eventuais orientações complementares da ANPD (perguntas frequentes, guia de comunicação): não fichados.\n- Interação com prazos setoriais do BCB (comunicação de incidente relevante ao BCB pela regulação de segurança cibernética): mapear na matriz de prazos — ver [[hub-matriz-prazos]].\n\n## Relações\n\n[[hub-anpd-lgpd]] · [[hub-matriz-prazos]] · [[bcb-res-538-2025]]\n"}, {"info": {"id": "bcb-carta-circular-4001-2020", "titulo": "Carta Circular BCB nº 4.001, de 29 de janeiro de 2020 (relação de operações e situações com indícios de LD/FT para fins da Circular 3.978 — consolidada, versão 4)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2020-01-31", "tags": "[pld-ft, coaf, indicios, monitoramento, kyc, insider]", "grupo": "normas", "caminho": "normas/bcb/bcb-carta-circular-4001-2020.md", "quando": "2026-11-05"}, "meta": {"id": "bcb-carta-circular-4001-2020", "tipo": "norma", "titulo": "Carta Circular BCB nº 4.001, de 29 de janeiro de 2020 (relação de operações e situações com indícios de LD/FT para fins da Circular 3.978 — consolidada, versão 4)", "orgao": "BCB", "data_publicacao": "2020-01-31", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao, war_room]", "conexao_comercial": "[diagnostico, retainer]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Carta%20Circular&numero=4001", "status": "fichado", "tags": "[pld-ft, coaf, indicios, monitoramento, kyc, insider]", "confidencial": "false"}, "corpo": "\n# Carta Circular BCB nº 4.001/2020 — o catálogo de indícios (texto consolidado)\n\nLida em 5/11/2026 na versão consolidada 4 do BCB (`C_Circ_4001_v4_L.pdf`, Attachments/50911), que incorpora a Carta Circular 4.037/2020, a IN BCB 461/2024 (incisos XVIII e XIX, ouro) e a IN BCB 732/2026 (alínea \"o\" do inciso I, emendas parlamentares). DOU de 31/1/2020, Seção 1, p. 92/93. Em vigor desde 1º/10/2020, quando revogou a Carta Circular 3.542/2012 (art. 2º, redação da CC 4.037/2020). Texto integral em `normas/bcb/_texto-carta-circ-4001-2020.txt`. Expedida pelo Decon com base no Regimento Interno; é ato de orientação que concretiza o art. 39 da Circular 3.978.\n\n## Ementa\n\nLiteral: \"Divulga relação de operações e situações que podem configurar indícios de ocorrência dos crimes de 'lavagem' ou ocultação de bens, direitos e valores, de que trata a Lei nº 9.613, de 3 de março de 1998, e de financiamento ao terrorismo, previstos na Lei nº 13.260, de 16 de março de 2016, passíveis de comunicação ao Conselho de Controle de Atividades Financeiras (Coaf).\"\n\n## Como funciona (art. 1º, caput e §§ 1º e 2º)\n\nAs operações e situações listadas \"exemplificam a ocorrência de indícios de suspeita para fins dos procedimentos de monitoramento e seleção previstos na Circular nº 3.978\". É lista exemplificativa, não taxativa. Duas regras de aplicação, literais:\n\n> § 1º As operações ou as situações referidas no caput devem ser comunicadas, nos termos da referida Circular, somente nos casos em que os indícios forem confirmados ao término da execução dos procedimentos de análise de operações e situações suspeitas.\n> § 2º Os procedimentos referidos no § 1º devem considerar todas as informações disponíveis, inclusive aquelas obtidas por meio dos procedimentos destinados a conhecer clientes, funcionários, parceiros e prestadores de serviços terceirizados.\n\nOu seja: indício seleciona; só a análise concluída (art. 43 da Circular) comunica.\n\n## Os grupos de situações (art. 1º, incisos)\n\nDezenove grupos. Os que tocam diretamente os cenários da matriz de incidentes:\n\n- **III, identificação e qualificação de clientes**: resistência a fornecer informação; informação falsa ou de difícil verificação; abertura e movimentação por procurador; \"cadastramento de várias contas em uma mesma data, ou em curto período, com depósitos de valores idênticos ou aproximados, ou com outros elementos em comum, tais como origem dos recursos, titulares, procuradores, sócios, endereço, número de telefone\" (\"f\"); impossibilidade de identificar o beneficiário final (\"g\"); mesmo endereço por pessoas sem relação demonstrada (\"i\"); \"registro de mesmo endereço de e-mail ou de Internet Protocol (IP) por diferentes pessoas\" (\"k\", transcrição parcial; conferir no texto integral).\n- **IV, movimentação de contas de depósito e de pagamento em moeda nacional**: movimentação incompatível com patrimônio, atividade ou capacidade financeira (\"a\"); valores arredondados ou pouco abaixo do limite de notificação (\"b\"); movimentação de alto valor, contumaz, em benefício de terceiros (\"c\"); numerosas contas de um mesmo cliente para acolher depósitos (\"d\"); quantia significativa em conta até então pouco movimentada (\"e\"); mudança repentina e injustificada na forma de movimentação (\"i\"); indução de funcionários a não seguir procedimentos (\"j\").\n- **XIII, funcionários, parceiros e prestadores**: alteração inusitada no padrão de vida (\"a\"); negócio feito de modo diverso do procedimento formal da instituição (\"c\"); \"fornecimento de auxílio ou informações, remunerados ou não, a cliente em prejuízo do programa de prevenção à lavagem de dinheiro e ao financiamento do terrorismo da instituição, ou de auxílio para estruturar ou fracionar operações, burlar limites regulamentares ou operacionais\" (\"d\").\n- Demais grupos: I (espécie em moeda nacional, com a alínea \"o\" sobre emendas parlamentares, IN 732/2026), II (espécie e pré-pagos em moeda estrangeira), V e VI (investimento e crédito no País), VII a XII (recursos de origem específica, consórcios, pessoas suspeitas de terrorismo, atividades internacionais, crédito e investimento externos), XIV (campanhas eleitorais), XV (bens não de uso e outros ativos não financeiros), XVI (contas em moeda estrangeira), XVII (municípios em regiões de risco), XVIII e XIX (ouro, IN 461/2024). Títulos completos no texto integral.\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: as regras do motor de monitoramento do cliente devem ser cotejadas com os incisos III, IV e XIII; a pergunta jurídica é se a instituição consegue mostrar, por escrito, qual alínea gerou cada seleção e qual análise a encerrou. War room: a conta-laranja cai em III, \"f\", e IV, \"c\" a \"e\"; o insider, em XIII; a fraude de onboarding, em III, \"a\" a \"c\". Esses enquadramentos vão para o dossiê do art. 43, § 2º, da Circular, não para a ata do war room aberta ao cliente (art. 50 da Circular: sem ciência aos envolvidos). Retainer: alterações por instrução normativa (como a IN 732/2026) exigem revisão das regras de seleção; o monitor do repositório captura as INs.\n\n## Lacunas\n\n- Alíneas transcritas parcialmente a partir do extrato; o inciso III, \"k\", está truncado nesta ficha e deve ser lido no `_texto` antes de citação em peça.\n- Títulos completos dos incisos VII a XII e XV não transcritos aqui.\n- A IN BCB 461/2024 e a IN BCB 732/2026 não têm ficha própria.\n\n## Relações\n\n[[bcb-circular-3978-2020]] · [[lei-9613-1998]] · [[questionario-adequacao]] · [[bcb-res-343-2023]] · [[bcb-res-142-2021]] · [[hub-matriz-prazos]]\n"}, {"info": {"id": "bcb-circular-3978-2020", "titulo": "Circular BCB nº 3.978, de 23 de janeiro de 2020 (PLD/FT: política, avaliação interna de risco, conhecimento de clientes, monitoramento e comunicação ao Coaf — consolidada, versão 6)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2020-01-24", "tags": "[pld-ft, coaf, kyc, kye, onboarding, controles-internos, instituicao-de-pagamento, instituicao-financeira, prazos, guarda]", "grupo": "normas", "caminho": "normas/bcb/bcb-circular-3978-2020.md", "quando": "2026-11-05"}, "meta": {"id": "bcb-circular-3978-2020", "tipo": "norma", "titulo": "Circular BCB nº 3.978, de 23 de janeiro de 2020 (PLD/FT: política, avaliação interna de risco, conhecimento de clientes, monitoramento e comunicação ao Coaf — consolidada, versão 6)", "orgao": "BCB", "data_publicacao": "2020-01-24", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[diagnostico, retainer, adversarial]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Circular&numero=3978", "status": "fichado", "tags": "[pld-ft, coaf, kyc, kye, onboarding, controles-internos, instituicao-de-pagamento, instituicao-financeira, prazos, guarda]", "confidencial": "false"}, "corpo": "\n# Circular BCB nº 3.978/2020 — a camada PLD/FT do diagnóstico (texto consolidado)\n\nLida em 5/11/2026 na versão consolidada 6 publicada pelo BCB (arquivo `Circ_3978_v6_L.pdf`, Attachments/50905 da base de normativos), que incorpora a Circular 4.005/2020, as Resoluções BCB 119/2021, 282/2022, 344/2023 e 591/2026 (esta revogou a Res. BCB 588/2026, de 23/9/2026, antes de produzir efeitos). DOU de 24/1/2020, Seção 1, p. 24-28. Texto integral em `normas/bcb/_texto-circ-3978-2020.txt`. Atenção de método: o endpoint `exibenormativo` devolve o texto ORIGINAL de 2020; a versão consolidada só está no PDF listado no campo `Documentos` da própria API.\n\nEsta ficha substitui o stub descartado em 29/10/2026 com o motivo \"fora do escopo\": o descarte foi um erro de triagem automática (o extrator não reconheceu o número da norma e tratou o item como notícia). A norma está dentro do escopo: é a \"regulação própria\" a que remetem o art. 5º, III, \"j\", da Res. BCB 260/2022 e da Res. CMN 4.968/2021 ([[escopo-controles-internos]], linha A27).\n\n## Por que esta norma entra na base\n\nTrês razões, todas jurídicas. Primeira: o acervo documental de PLD (política, avaliação interna de risco, manual de conhecimento do cliente, manual de monitoramento, dossiês, relatório de efetividade) é a prova da \"diligência na abertura e manutenção da conta\" que decide a responsabilidade do recebedor (REsp 2.124.423, 3ª Turma, rel. Nancy Andrighi), e o diagnóstico precisa pedi-lo pelo artigo. Segunda: a norma cria relógios próprios (45 dias de seleção, 45 dias de análise, dia útil seguinte para comunicar ao Coaf, 31/3 para o relatório anual, 10 anos de guarda) que não estavam na matriz de prazos. Terceira: no war room, a fraude é também \"operação ou situação suspeita\" (art. 38, § 1º), e a comunicação ao Coaf tem regime de sigilo próprio (art. 50) que não se confunde com a comunicação ao cliente barrado (Res. 142, art. 2º-A) nem com o registro de indício (Res. 343).\n\n## Ementa\n\nLiteral: \"Dispõe sobre a política, os procedimentos e os controles internos a serem adotados pelas instituições autorizadas a funcionar pelo Banco Central do Brasil visando à prevenção da utilização do sistema financeiro para a prática dos crimes de 'lavagem' ou ocultação de bens, direitos e valores, de que trata a Lei nº 9.613, de 3 de março de 1998, e de financiamento do terrorismo, previsto na Lei nº 13.260, de 16 de março de 2016.\"\n\n## A quem se aplica (art. 1º)\n\n\"Instituições autorizadas a funcionar pelo Banco Central do Brasil.\" Alcança, portanto, a instituição financeira e a instituição de pagamento autorizada; o art. 47, I, menciona expressamente as instituições de pagamento. A IP que opera sem autorização não é alcançada por força própria; o art. 60 trata dela pelo outro lado, como \"terceiro não sujeito a autorização\" contratado por participante de arranjo, impondo à instituição autorizada cinco diligências (informações sobre atividade e reputação; verificação de investigação ou ação de supervisor por LD/FT; licença do instituidor do arranjo; conhecer os controles PLD do terceiro; dar ciência do contrato ao diretor do art. 9º). Não foi identificada, nesta base, norma de PLD exclusiva para IPs: o regime é único.\n\n## Vigência e prazos\n\nEm vigor desde 1º/10/2020 (art. 70, redação da Circular 4.005/2020). Relógios literais:\n\n- Monitoramento e seleção: \"não pode exceder o prazo de quarenta e cinco dias, contados a partir da data de ocorrência da operação ou da situação\" (art. 39, parágrafo único).\n- Análise: \"não pode exceder o prazo de quarenta e cinco dias, contados a partir da data da seleção\" (art. 43, § 1º); formalizada em dossiê \"independentemente da comunicação ao Coaf\" (§ 2º).\n- Decisão de comunicar: fundamentada no dossiê, registrada nele e tomada \"até o final do prazo de análise\" (art. 48, § 1º, I a III).\n- Comunicação ao Coaf: \"até o dia útil seguinte ao da decisão de comunicação\" (art. 48, § 2º).\n- Operações específicas (art. 49, redação da Res. 591/2026): comunicar até o dia útil seguinte à ocorrência (§ 1º) depósito, aporte ou saque em espécie ≥ R$ 50.000,00 (I); pagamentos, recebimentos e transferências contra pagamento em espécie ≥ R$ 50.000,00 (II); provisionamento de saque ≥ R$ 50.000,00 (III); câmbio com entrega ou recebimento de moeda estrangeira em espécie ≥ US$ 10.000,00 (IV); \"transferências de ativos virtuais para ou de carteiras autocustodiadas de valor igual ou superior ao equivalente a US$10.000,00\" (V). As operações dos incisos IV e V contratadas entre 1º/10 e 31/12/2026 são comunicadas \"no primeiro dia útil de janeiro de 2027\" (§ 2º).\n- Alteração ou cancelamento de comunicação após o quinto dia útil seguinte ao da realização: com justificativa (art. 51).\n- Relatório de avaliação de efetividade: anual, data-base 31/12, encaminhado até 31/3 ao comitê de auditoria, quando houver, e ao conselho de administração ou diretoria (art. 62, § 2º).\n- Guarda: dez anos, à disposição do BCB (art. 67), para informações de conhecimento do cliente (contados do primeiro dia do ano seguinte ao término do relacionamento), de funcionários, parceiros e prestadores (do encerramento da relação contratual), registros de operações dos arts. 28 a 37 (do primeiro dia do ano seguinte ao da operação) e o dossiê do art. 43, § 2º (sem termo inicial próprio no texto).\n\nNota de leitura, sem conciliação nesta base: a Lei 9.613, art. 11, II, fixa \"24 (vinte e quatro) horas\" para a comunicação ao Coaf; a Circular estrutura o fluxo em seleção, análise, decisão e comunicação no dia útil seguinte à decisão. Nenhuma fonte lida relaciona os dois textos. Citar cada um pelo que diz, sem somar nem substituir.\n\n## Obrigações principais (artigos transcritos ou conferidos)\n\n**Política e governança (arts. 2º a 9º).** Política de PLD/FT compatível com os perfis de risco de clientes, instituição, operações e produtos, e de funcionários, parceiros e prestadores (art. 2º); documentada, aprovada pelo conselho de administração ou, se inexistente, pela diretoria, e mantida atualizada (art. 7º); estrutura de governança (art. 8º); diretor responsável indicado formalmente ao BCB, que pode acumular funções sem conflito de interesses (art. 9º).\n\n**Avaliação interna de risco (art. 10).** Identificar e mensurar o risco de uso de produtos e serviços para LD/FT, considerando no mínimo os perfis de risco dos clientes, da instituição (modelo de negócio e área geográfica), das operações e produtos \"abrangendo todos os canais de distribuição e a utilização de novas tecnologias\" e das atividades de funcionários, parceiros e prestadores (§ 1º); probabilidade e magnitude dos impactos financeiro, jurídico, reputacional e socioambiental (§ 2º); categorias de risco com controles reforçados e simplificados (§ 3º).\n\n**Conhecer o cliente (arts. 13 a 27).** Procedimentos de identificação, qualificação e classificação, com medidas reforçadas para maior risco, formalizados em manual específico aprovado pela diretoria (art. 13, §§ 1º a 3º). Identificação deve \"verificar e validar a identidade do cliente\", inclusive \"mediante confrontação dessas informações com as disponíveis em bancos de dados de caráter público e privado\"; mínimo de nome e CPF, ou denominação e CNPJ (art. 16, redação da Res. 119/2021). Qualificação com residência ou sede e capacidade financeira, \"incluindo a renda, no caso de pessoa natural, ou o faturamento, no caso de pessoa jurídica\" (art. 18, § 1º). Dispensa de qualificação e classificação para crédito em programa público de renegociação, sob condições cumulativas (art. 23-A, Res. 344/2023).\n\n**Registros (art. 28, redação da Res. 282/2022).** Registro de todas as operações, inclusive saques, depósitos, aportes, pagamentos, recebimentos, transferências e câmbio, com tipo, valor, data, nome e CPF/CNPJ do titular e do beneficiário, e canal utilizado.\n\n**Monitoramento, seleção e análise (arts. 38 a 47).** Procedimentos para identificar e dispensar especial atenção a operações e situações suspeitas, inclusive propostas (art. 38); hipóteses de seleção do art. 39, I, entre elas o artifício para burlar identificação e registro (\"a\"), a incompatibilidade com a capacidade financeira (\"c\"), a impossibilidade de identificar o beneficiário final (\"f\") e a impossibilidade de manter o cadastro atualizado (\"h\"). Análise formalizada em dossiê (art. 43); vedada a contratação de terceiros para a análise e a análise no exterior, admitidos serviços auxiliares (art. 44); recursos e competências no País (art. 45); contratação de nuvem para monitoramento sujeita à regulação de segurança cibernética (art. 47: o texto consolidado ainda remete à Circular 3.909/2018 e à Resolução CMN 4.658/2018; conferir a sucessão normativa em [[bcb-res-85-2021]]).\n\n**Comunicação ao Coaf (arts. 48 a 52).** Ver \"Vigência e prazos\". Art. 50: as comunicações dos arts. 48 e 49 são feitas \"sem dar ciência aos envolvidos ou a terceiros\". Comunicação centralizada no conglomerado admitida, com opção formalizada em ata (art. 52).\n\n**Conhecer funcionários, parceiros e prestadores (arts. 56 a 58).** Procedimentos de identificação e qualificação, formalizados em documento específico aprovado pela diretoria e mantido atualizado (art. 57); classificação das atividades nas categorias de risco da avaliação interna (art. 58).\n\n**Mecanismos de controle e efetividade (arts. 61 e 62).** Processos, testes e trilhas de auditoria, métricas e indicadores, identificação e correção de deficiências, com testes periódicos pela auditoria interna (art. 61); relatório anual de efetividade (art. 62).\n\n**Documentos à disposição do BCB (art. 66).** Entre outros: a política (I); as atas de opção (II e VI); a avaliação interna de risco com documentação de suporte (IV) e suas versões anteriores (VIII); o relatório de efetividade (VII) e versões anteriores (XII); o manual de conhecimento do cliente (IX); o manual de monitoramento, seleção e análise (X); o documento de conhecimento de funcionários, parceiros e prestadores (XI).\n\n## Aplicação prática no ciclo Rastro\n\n**Prontidão (Acervo e Tempo do Método RASTRO).** Os documentos do art. 66 e os prazos acima entram no inventário documental obrigatório (manual, cap. 4) e na matriz de prazos do cliente (cap. 5). O GAP jurídico pergunta pelo artigo: existe o manual do art. 13, § 2º, aprovado pela diretoria; existe o dossiê do art. 43, § 2º, para cada seleção; o relatório do art. 62 foi encaminhado até 31/3. Bloco L do [[questionario-adequacao]].\n\n**War room (Operação).** Conta-laranja e recursos de origem fraudulenta: a conta e as operações são \"situação suspeita\" (art. 38, § 1º; Carta Circular 4.001, art. 1º, III e IV) e entram no fluxo de seleção, análise e decisão, com dossiê. A comunicação ao Coaf, se houver, não se revela ao cliente, ao reclamante nem a terceiros (art. 50): o roteiro de atendimento à vítima e a resposta ao cliente barrado (Res. 142, art. 2º-A, § 3º) não podem mencioná-la. São três atos distintos, com três regimes: registro de indício no sistema de compartilhamento (Res. 343, 24 horas), rejeição ou marcação com comunicação ao titular (Res. 142) e comunicação ao Coaf (sigilosa). Insider: conduta do art. 1º, XIII, da Carta Circular 4.001, e reclassificação de risco (art. 58). VASP: transferência de ou para carteira autocustodiada ≥ US$ 10 mil comunicada até o dia útil seguinte (art. 49, V), além da retenção cautelar de 24 horas da Res. 584/2026 a partir de 1º/1/2027.\n\n**Defesa (Sustentação e Responsabilidade).** O manual de conhecimento do cliente, os registros do art. 28 e o dossiê do art. 43 são a prova documental da diligência do recebedor (REsp 2.124.423). O dossiê é documento exibível (CPC, arts. 396 a 404): seu conteúdo deve ser redigido com a consciência de que será lido em juízo, e a decisão de não comunicar deve estar fundamentada nele (art. 48, § 1º, I e II). Comunicações de boa-fé não acarretam responsabilidade civil ou administrativa (Lei 9.613, art. 11, § 2º).\n\n**Responsabilidade pessoal.** As sanções da Lei 9.613, art. 12, alcançam também \"os administradores das pessoas jurídicas\"; o diretor do art. 9º é o primeiro exposto. Cabe ao plano preventivo dizer isso ao conselho.\n\n## Conexão comercial\n\nDiagnóstico: Bloco L do questionário e checklist documental do cap. 4 do manual. Retainer: calendário anual (relatório até 31/3; revisão da avaliação interna de risco). Adversarial: dossiê e manual de KYC como prova de diligência; comunicação sigilosa como ponto de atenção em toda resposta a cliente.\n\n## Lacunas\n\n- Não transcritos nesta ficha (texto integral disponível no `_texto`): arts. 3º a 6º, 11, 12, 14, 15, 17, 19 a 27, 29 a 37, 40 a 42, 46, 53 a 55, 59, 63 a 65 e 69.\n- Normas vinculadas não lidas: IN BCB 761/2026 (medidas reforçadas para clientes, correspondentes e parceiros em países com deficiências estratégicas segundo o Gafi; ementa conferida, texto em `_texto-in-761-2026.txt`), INs BCB 406/2023, 636/2025, 693/2025 e 739/2026, Resoluções BCB 1/2020, 277/2022, 337/2023, 499/2025, 521/2025, 539/2025, 561/2026 e 575/2026.\n- A relação entre as 24 horas da Lei 9.613, art. 11, II, e o fluxo de 45 + 45 dias e dia útil seguinte da Circular não foi conciliada por fonte lida.\n- Vinculação administrativa atual do Coaf: ver lacuna em [[lei-9613-1998]].\n\n## Relações\n\n[[lei-9613-1998]] · [[bcb-carta-circular-4001-2020]] · [[lcp-105-2001]] · [[bcb-res-260-2022]] · [[cmn-res-4968-2021]] · [[escopo-controles-internos]] · [[questionario-adequacao]] · [[bcb-res-142-2021]] · [[bcb-res-343-2023]] · [[resolucao-conjunta-6-2023]] · [[bcb-res-584-2026]] · [[bcb-res-85-2021]] · [[hub-matriz-prazos]] · [[manual-servico-juridico]] · [[matriz-do-servico]] · [[dossie-pix-fortuito]]\n"}, {"info": {"id": "bcb-in-761-2026", "titulo": "Instrução Normativa BCB nº 761, de 9 de julho de 2026 (medidas reforçadas de PLD/FT para clientes, correspondentes e parceiros em países com deficiências estratégicas segundo o Gafi)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2026-07-14", "tags": "[pld-ft, gafi, medidas-reforcadas, kyc, parceiros, correspondentes, instrucao-normativa]", "grupo": "normas", "caminho": "normas/bcb/bcb-in-761-2026.md", "quando": "2026-11-05"}, "meta": {"id": "bcb-in-761-2026", "tipo": "norma", "titulo": "Instrução Normativa BCB nº 761, de 9 de julho de 2026 (medidas reforçadas de PLD/FT para clientes, correspondentes e parceiros em países com deficiências estratégicas segundo o Gafi)", "orgao": "BCB", "data_publicacao": "2026-07-14", "vigencia": "", "altera": "[]", "fase_rastro": "[prontidao]", "conexao_comercial": "[diagnostico, retainer]", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=761", "status": "fichado", "tags": "[pld-ft, gafi, medidas-reforcadas, kyc, parceiros, correspondentes, instrucao-normativa]", "confidencial": "false"}, "corpo": "\n# IN BCB nº 761/2026 — as medidas reforçadas para jurisdições do Gafi\n\nLida em 5/11/2026 no inteiro teor da API de normativos do BCB (texto da IN e da Nota 603/2026-BCB/Denor que a fundamenta). DOU de 14/7/2026, Seção 1, p. 149. Em vigor na data da publicação (art. 4º). Texto integral em `normas/bcb/_texto-in-761-2026.txt`. Ato do Chefe do Denor com base nos arts. 9º, 10, 13, 18, 39, 56 e 59 da Circular 3.978/2020.\n\n## Ementa\n\nLiteral: \"Divulga orientações sobre as medidas reforçadas a serem observadas pelas instituições autorizadas a funcionar pelo Banco Central do Brasil na aplicação do disposto na Circular nº 3.978, de 23 de janeiro de 2020, no caso de operações e situações que envolvam clientes, instituições financeiras correspondentes e parceiros estabelecidos em países e territórios com deficiências estratégicas na implementação das recomendações do Grupo de Ação Financeira (Gafi).\"\n\n## O que diz\n\n**Objeto (art. 1º).** Orientações para operações e relações de negócio com clientes, instituições financeiras correspondentes e parceiros \"localizados em países ou territórios com deficiências estratégicas na implementação das recomendações do Grupo de Ação Financeira (Gafi), conforme listas e orientações divulgadas por aquele organismo\".\n\n**Enquadramento (art. 2º).** As medidas reforçadas do art. 13, § 1º, I, da Circular 3.978 incluem os procedimentos e controles relativos a essas operações e relações; a definição abrange \"a avaliação interna de risco, os procedimentos destinados a conhecer os clientes, o monitoramento, a seleção e a análise de operações e situações suspeitas e os procedimentos destinados a conhecer seus parceiros e prestadores de serviços terceirizados situados naqueles países ou territórios\" (parágrafo único).\n\n**Medidas mínimas (art. 3º).** I obtenção, verificação e validação de informações adicionais sobre a qualificação de clientes, correspondentes e parceiros; II análise complementar do fundamento econômico ou legal da operação e da natureza da relação de negócio; III para parceiros e correspondentes com riscos inaceitáveis ou não mitigáveis, avaliação da viabilidade do início ou da continuidade da relação \"realizada pelo diretor responsável referido no art. 9º da Circular nº 3.978\" e imposição de limites operacionais; IV para clientes nessa situação, avaliação da viabilidade do início da relação e limites operacionais; V monitoramento reforçado das operações; VI aumento da frequência de atualização cadastral; VII \"registro das análises, conclusões e decisões adotadas, incluindo documentação detalhada de suporte à decisão\".\n\n**Motivação (Nota 603/2026-BCB/Denor).** Atende apontamento do Relatório de Avaliação Mútua do Brasil de 2023 (Gafi); segundo a nota, a IN \"não cria obrigações autônomas apartadas da Circular nº 3.978, de 2020, nem altera o regime sancionador aplicável\", e a análise de impacto regulatório foi dispensada por se tratar de convergência a padrão internacional (Decreto 10.411/2020, art. 4º, VI).\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: entra no Bloco L do questionário como desdobramento da pergunta sobre conhecer clientes e parceiros (L02 e L08): a fintech que opera remessas, câmbio, ativos virtuais ou BaaS com parceiro no exterior precisa mostrar o cotejo com as listas do Gafi, o parecer do diretor do art. 9º quando o risco for inaceitável e o registro documentado da decisão (art. 3º, VII). Acervo: é documento novo no inventário do manual, cap. 4, dentro da linha do manual de conhecimento do cliente. Retainer: as listas do Gafi mudam a cada plenária; o monitoramento das listas é rotina do plano vivo.\n\n## Lacunas\n\n- As listas do Gafi (jurisdições sob monitoramento reforçado e de alto risco) não são reproduzidas na IN; conferir a lista vigente na fonte do Gafi antes de qualquer afirmação sobre país específico.\n- Interação com a IN BCB 406/2023 e demais INs vinculadas à Circular 3.978: não lidas.\n\n## Relações\n\n[[bcb-circular-3978-2020]] · [[bcb-carta-circular-4001-2020]] · [[lei-9613-1998]] · [[questionario-adequacao]] · [[manual-servico-juridico]]\n"}, {"info": {"id": "bcb-ingest-comunicado-45882-2026-09-04", "titulo": "Comunicado N° 45.882 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2026-09-04", "tags": "[sociedade de credito direto]", "grupo": "normas", "caminho": "normas/bcb/bcb-ingest-comunicado-45882-2026-09-04.md", "quando": "2026-11-05"}, "meta": {"id": "bcb-ingest-comunicado-45882-2026-09-04", "tipo": "norma", "titulo": "Comunicado N° 45.882 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "data_publicacao": "2026-09-04", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Comunicado&numero=45882", "status": "a_fichar", "tags": "[sociedade de credito direto]", "confidencial": "false"}, "corpo": "\n## Ementa (retornada pela API do BCB — conferir no texto oficial)\n\n<div class=\"ExternalClass510E08D18DFC48239C4E4A008399FCA1\">Divulga nome de pessoa com interesse em assumir a condição de controlador de Sociedade de Crédito Direto, conforme consta do pedido de autorização para funcionamento de 30 de setembro de 2025\n</div>\n\n## Texto oficial (extração automática, 2026-11-05)\n\nEsta espécie normativa não expõe inteiro teor na API de normativos do BCB. A ementa capturada acima corresponde ao conteúdo divulgado; para o texto completo, abrir a fonte primária no link do frontmatter.\n\n### Pendente do operador\n\n- Triagem: o ato entra no escopo Rastro ou deve ser descartado?\n- Se entrar: aplicação prática e conexão comercial\n"}, {"info": {"id": "bcb-ingest-comunicado-45942-2026-09-15", "titulo": "Comunicado N° 45.942 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "tipo": "norma", "sta zação de análise de impacto regulatório (AIR) para a edição de atos normativos de interesse geral produzidos pelos órgãos e entidades da administração pública federal direta e indireta.                         Todavia, em linha com o Voto 280/2021–BCB, de 10 de novembro de 2021, o Regulamento do Pix, bem como os documentos que o integram, detalham ou complementam, não se caracterizam c\n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n"}, {"info": {"id": "bcb-ingest-instrucao-normativa-bcb-752-2026-07-01", "titulo": "IN BCB nº 752, de 1º/7/2026 — Manual Operacional do DICT v8.4 (prazos do MED 2.0)", "orgao": "BCB", "tipo": "norma", "status": "fichado", "data_publicacao": "2026-07-02", "tags": "[pix, dict, med, recuperacao-de-valores, prazos-operacionais]", "grupo": "normas", "caminho": "normas/bcb/bcb-ingest-instrucao-normativa-bcb-752-2026-07-01.md", "quando": "2026-07-14"}, "meta": {"id": "bcb-ingest-instrucao-normativa-bcb-752-2026-07-01", "tipo": "norma", "titulo": "IN BCB nº 752, de 1º/7/2026 — Manual Operacional do DICT v8.4 (prazos do MED 2.0)", "orgao": "BCB", "data_publicacao": "2026-07-02", "vigencia": "", "altera": "[\"Revoga a IN BCB nº 742, de 9/6/2026\"]", "fase_rastro": "[war_room, prontidao]", "conexao_comercial": "[retainer, diagnostico, benchmark]", "fonte_primaria": "https://www.bcb.gov.br/content/estabilidadefinanceira/pix/Regulamento_Pix/X_ManualOperacionaldoDICT.pdf", "status": "fichado", "tags": "[pix, dict, med, recuperacao-de-valores, prazos-operacionais]", "confidencial": "false"}, "corpo": "\n# IN BCB 752/2026 — Manual do DICT v8.4: os prazos operacionais do MED 2.0\n\nIN publicada no DOU de 2/7/2026 (S.1, p. 113-116), divulgando a versão 8.4 do Manual Operacional do DICT; revoga a IN 742/2026. Fichada com leitura direta do PDF oficial (bcb.gov.br, 145 p.) em 2026-07-14 — capítulo 20, \"Fluxo de Recuperação de Valores\" (instauração → rastreamento → priorização → bloqueio → análise → devolução).\n\n## Os prazos operacionais (transcrições do Manual)\n\n- **Instauração: imediata, sem prazo em horas** — \"A abertura da Recuperação de Valores deve ocorrer de forma imediata, logo após a identificação da suspeita de fraude ou o recebimento da reclamação por parte do usuário\" (seção 20). A análise de mérito vem DEPOIS da instauração.\n- **Janela de contestação da transação**: pacs.008 (transação Pix) até **80 dias corridos**; pacs.004 (devolução) até **30 dias corridos** (seção 20.1.1).\n- **Bloqueio pela cadeia: imediato** — os participantes notificados \"deverão bloquear imediatamente os recursos solicitados nas contas de seus usuários, até o limite do saldo disponível\", com novos bloqueios à medida que entrarem recursos (seção 20.1.4).\n- **Análise da notificação de infração: 7 dias** (Manual de Tempos do Pix, cf. seção 20/p. 119).\n- **Início da devolução: 72 horas** após encerrada a análise — \"o participante recuperador tem até 72 horas para iniciar a etapa de devolução\"; o DICT conclui automaticamente (COMPLETED) a recuperação cuja devolução não for iniciada no prazo (seção 20.1.6). Devoluções sequenciais na ordem definida pelo DICT.\n- **Saltos: SEM número fixo** — profundidade é parâmetro do PSP recuperador na instauração (MaxHops); critérios mínimos de rastreabilidade serão comunicados pelo BCB fora do Manual (seção 20.1.2).\n- Regras de fecho: uma única Recuperação de Valores por transação; cancelamento impede reabertura (20.1.1); desbloqueio só após rejeição da NI, conclusão da devolução ou encerramento (20.1.7); as NIs do escopo do MED correm dentro da Recuperação de Valores (abertas automaticamente pelo DICT).\n\n## Aplicação prática no ciclo Rastro\n\nWar room: o playbook agora tem números — instauração imediata (o \"espera o jurídico de manhã\" viola o Manual), 7 dias de análise, 72h para iniciar a devolução sob pena de conclusão automática do procedimento (perda operacional irreversível: monitorar esse relógio é tarefa do coordenador). Prontidão: a janela de 80 dias corridos de contestação define até quando um cliente lesado ainda alcança o MED — pergunta de triagem de novos casos. Benchmark: aderência do fluxo interno do cliente a cada etapa/prazo do capítulo 20.\n\n## Lacunas\n\n- Prazo para o PSP recebedor EFETIVAR cada devolução após a solicitação: remetido ao \"Manual de Tempos do Pix\" (documento apartado, não lido) — NAO_CONFIRMADO; fichar o Manual de Tempos.\n- Critérios mínimos de rastreabilidade (e do art. 39-C da Res. 506): comunicados fora do Manual — monitorar.\n- O Manual é versionado (v8.4 revoga v8.3 da IN 742): revisões futuras chegam pelo monitor; conferir versão vigente antes de citar em peça.\n\n## Relações\n\n[[bcb-res-493-2025]] · [[bcb-res-506-2025]] · [[hub-pix-med]] · [[hub-matriz-prazos]] · [[estudo-72h-aprofundamento]]\n"}, {"info": {"id": "bcb-ingest-instrucao-normativa-bcb-766-2026-07-27", "titulo": "Instrução Normativa BCB N° 766 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2026-07-27", "tags": "[pix, dict]", "grupo": "normas", "caminho": "normas/bcb/bcb-ingest-instrucao-normativa-bcb-766-2026-07-27.md", "quando": "2026-07-29"}, "meta": {"id": "bcb-ingest-instrucao-normativa-bcb-766-2026-07-27", "tipo": "norma", "titulo": "Instrução Normativa BCB N° 766 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "data_publicacao": "2026-07-27", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=766", "status": "a_fichar", "tags": "[pix, dict]", "confidencial": "false"}, "corpo": "\n## Ementa (retornada pela API do BCB — conferir no texto oficial)\n\nDivulga a versão 8.5 do Manual Operacional do Diretório de Identificadores de Contas Transacionais (DICT), que compõe o Regulamento doDICT.pdf\n\n- Art. 3º  Esta Instrução Normativa entra em vigor: I - em 10 de agosto de 2026, para as alterações das seções 10.1 e 20.1.5; e II - em 1º de setembro de 2026, para as alterações das seções 20.1.1, 20.1.9 e 20.2 e para a revogação de que trata o art. 2º. RICARDO TEIXEIRA LEITE MOURÃO   ANEXO À INSTRUÇÃO NORMATIVA BCB Nº 766, DE 27 DE JULHO DE 2026 Manual Operacional do Diretório de Identificadores de Contas Transacionais (DICT) Histórico de revisão                                                                               Data       Versão       Descrição das alterações         11/8/2020     \n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n"}, {"info": {"id": "bcb-ingest-instrucao-normativa-bcb-767-2026-07-30", "titulo": "Instrução Normativa BCB N° 767 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2026-07-30", "tags": "[dict]", "grupo": "normas", "caminho": "normas/bcb/bcb-ingest-instrucao-normativa-bcb-767-2026-07-30.md", "quando": "2026-08-03"}, "meta": {"id": "bcb-ingest-instrucao-normativa-bcb-767-2026-07-30", "tipo": "norma", "titulo": "Instrução Normativa BCB N° 767 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "data_publicacao": "2026-07-30", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=767", "status": "a_fichar", "tags": "[dict]", "confidencial": "false"}, "corpo": "\n## Ementa (retornada pela API do BCB — conferir no texto oficial)\n\nAltera a Instrução Normativa BCB nº 766, de 27 de julho de 2026, que divulga a versão 8.5 do Manual Operacional do Diretório de Identificadores de Contas Transacionais (DICT), para alterar a entrada em vigor de alguns dispositivos.\n\n## Texto ofici  13/10/2020 · 14/03/2025 · 17/9/2021 · 19 DE AGOSTO DE 2026 · 21 de setembro de 2023 · 22/3/2021\n\n### Normas alteradas ou revogadas\n\n- revogada a Instrução Normativa BCB nº 658, de 5 de setembro de 2025\n\n### Dispositivos que tocam o escopo Rastro\n\n- Art. 1º  Esta Instrução Normativa divulga a versão 2.10.0 do Manual de Padrões para Iniciação do Pix, que compõe o Regulamento do Pix, conforme art. 2º do Regulamento anexo à Resolução BCB  nº 1, de 12 de agosto de 2020. Parágrafo único. O Manual de Padrões para Iniciação do Pix está disponível no endereço eletrônico do Banco Central do Brasil na internet, na página destinada aos manuais que compõem o Regulamento  do Pix: https://www.bcb.gov.br/content/estabilidadefinanceira/pix/Regulamento_Pix/II_ManualdePadroesparaIniciacaodoPix.pdf.\n\n- Art. 3º  Esta Instrução Normativa entra em vigor na data de sua publicação. Ricardo Teixeira Leite Mourão     ANEXO À INSTRUÇÃO NORMATIVA BCB Nº 769 DE 19 DE AGOSTO DE 2026 Manual de Padrões para Iniciação do Pix Versão 2.10.0 Histórico de revisão Data Versão Descrição das alterações 11/8/2020 1.0 Versão inicial 23/9/2020 1.1 Ajustes nas definições nos campos do  payload , especialmente na semântica do campo txid .  Incluídos os Anexos I e II, tratando dos Conceitos de Negócio da API Pix e das suas especificações técnicas. 13/10/2020 2.0 Seção 1.5.2: incluídas explicações sobre caracteres perm\n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n"}, {"info": {"id": "bcb-ingest-instrucao-normativa-bcb-774-2026-09-03", "titulo": "Instrução Normativa BCB N° 774 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2026-09-03", "tags": "[pix]", "grupo": "normas", "caminho": "normas/bcb/bcb-ingest-instrucao-nor ut , inciso IV, do Regulamento anexo à Resolução BCB nº 1, de\n\n- Art. 1º  Esta Instrução Normativa divulga a versão 7.4 do documento “ Requisitos Mínimos para a Experiência do Usuário ”, que compõe o Regulamento do Pix, conforme art. 2º do Regulamento anexo à Resolução BCB nº 1, de 12 de agosto de 2020. Parágrafo único.  O documento “Requisitos Mínimos para a Experiência do Usuário” está disponível no endereço eletrônico do Banco Central do Brasil na internet, na página destinada aos manuais que compõem o Regulamento do Pix:  https://www.bcb.gov.br/content/estabilidadefinanceira/pix/Regulamento_Pix/IV_RequisitosMinimosparaExperienciadoUsuario.pdf\n\n- Art. 3º  Esta Instrução Normativa entra em vigor em 1º de março de 2027. RICARDO TEIXEIRA LEITE MOURÃO   ANEXO À INSTRUÇÃO NORMATIVA BCB Nº 774, DE 3 DE SETEMBRO DE 2026 Requisitos Mínimos para a Experiência do Usuário Versão 7.4 Histórico de revisão         Data       Versão       Descrição  das alterações         09/2026           7.4       • Capítulo  02:   - Página 07  – item 10 (novo): inclusão de mensagem obrigatória para informar ao usuário  quando uma transação Pix não puder ser realizada em razão de marcação de  fundada suspeita de fraude transacional.   - Página 10  – item 15: exclus\n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n"}, {"info": {"id": "bcb-ingest-instrucao-normativa-bcb-777-2026-09-18", "titulo": "Instrução Normativa BCB N° 777 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2026-09-18", "tags": "[pix]", "grupo": "normas", "caminho": "normas/bcb/bcb-ingest-instrucao-normativa-bcb-777-2026-09-18.md", "quando": "2026-09-21"}, "meta": {"id": "bcb-ingest-instrucao-normativa-bcb-777-2026-09-18", "tipo": "norma", "t ublicação institucional, não de ato normativo. Não há inteiro teor a extrair da base de normativos.\n\n### Pendente do operador\n\n- Triagem: relevante para o escopo Rastro (fichar) ou descartar?\n- Se relevante: abrir a fonte no link do frontmatter e registrar o que interessa\n"}, {"info": {"id": "bcb-ingest-resolucao-bcb-576-2026-06-23", "titulo": "Resolução BCB N° 576 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2026-06-23", "tags": "[instituicoes de pagamento]", "grupo": "normas", "caminho": "normas/bcb/bcb-ingest-resolucao-bcb-576-2026-06-23.md", "quando": "2026-07-29"}, "meta": {"id": "bcb-ingest-resolucao-bcb-576-2026-06-23", "tipo": "norma", "titulo": "Resolução BCB N° 576 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "data_publicacao": "2026-06-23", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=576", "status": "a_fichar", "tags": "[instituicoes de pagamento]", "confidencial": "false"}, "corpo": "\n## Ementa (retornada pela API do BCB — conferir no texto oficial)\n\n  Dispõe sobre a política de sucessão de administradores das administradoras de consórcio, das sociedades corretoras de títulos e valores mobiliários, das sociedades distribuidoras de títulos e valores mobiliários, das sociedades corretoras de câmbio, das sociedades prestadoras de serviços de ativos virtuais e das instituições de pagamento.\n\n## Texto oficial (extração automática, 2026-07-29)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** Publicado no DOU de 25/06/2026, Seção 1, p. 214/215.\n**Ementa oficial:** Dispõe sobre a política de sucessão de administradores das administradoras de consórcio, das sociedades corretoras de títulos e valores mobiliários, das sociedades distribuidoras de títulos e valores mobiliários, das sociedades corretoras de câmbio, das sociedades prestadoras de serviços de ativos virtuais e das instituições de pagamento.\n\n### Vigência (dispositivos transcritos)\n\n- Art. 7º  Esta Resolução entra em vigor em 1º de janeiro de 2027. GILNEU FRANCISCO ASTOLFI VIVAN Diretor de Regulação\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 13 de junho de 2023 · 14 de julho de 1965 · 1º de janeiro de 2027 · 21\nde dezembro de 2022 · 23 DE JUNHO\nDE 2026 · 23 de junho de 2026 · 8 de outubro de 2008 · 9 de outubro de 2013\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n"}, {"info": {"id": "bcb-ingest-resolucao-bcb-584-2026-08-07", "titulo": "Resolução BCB N° 584 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2026-08-07", "tags": "[instituicoes de pagamento, fraude]", "grupo": "normas", "caminho": "normas/bcb/bcb-ingest-resolucao-bcb-584-2026-08-07.md", "quando": "2026-08-10"}, "meta": {"id": "bcb-ingest-resolucao-bcb-584-2026-08-07", "tipo": "norma", "titulo": "Resolução BCB N° 584 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "data_publicacao": "2026-08-07", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=584", "status": "a_fichar", "tags": "[instituicoes de pagamento, fraude]", "confidencial": "false"}, "corpo": "\n## Ementa (retornada pela API do BCB — conferir no texto oficial)\n\n\nAltera a Resolução BCB nº 142, de 23 de setembro de 2021, que dispõe sobre procedimentos e controles para prevenção de fraudes na prestação de serviços de pagamento a serem adotados pelas instituições financeiras, demais instituições autorizadas a funcionar pelo Banco Central do Brasil e instituições de pagamento integrantes do Sistema de Pagamentos Brasileiro – SPB.\n\n## Texto oficial (extração automática, 2026-08-10)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** NAO_CONFIRMADO\n**Ementa oficial:** Altera a Resolução BCB nº 142, de 23 de setembro de 2021, que dispõe sobre procedimentos e controles para prevenção de fraudes na prestação de serviços de pagamento a serem adotados pelas instituições financeiras, demais instituições autorizadas a funcionar pelo Banco Central do Brasil e instituições de pagamento integrantes do Sistema de Pagamentos Brasileiro – SPB.\n\n### Vigência (dispositivos transcritos)\n\n- Art. 3º  Esta Resolução entra em vigor em 1º de janeiro de 2027. \n GILNEU FRANCISCO ASTOLFI VIVAN \n Diretor de Regulação\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 10 de novembro de 2025 · 13 de junho de 2023 · 1º de janeiro de 2027 · 21 de dezembro de 2022 · 23 de setembro de 2021 · 24 de setembro de 2021 · 6 de agosto de 2026 · 9 de outubro\n de 2013\n\n### Dispositivos que tocam o escopo Rastro\n\n- Art. 1º  A ementa da Resolução BCB nº 142, de 23 de setembro de 2021, publicada no Diário Oficial da União de 24 de setembro de 2021, passa a vigorar com as seguintes alterações: \n \"Dispõe sobre procedimentos e controles para prevenção de fraudes na prestação de serviços de pagamento e na prestação de serviços de ativos virtuais.\" (NR)\n\n- Art. 1º  Esta Resolução dispõe sobre procedimentos e controles para prevenção de fraudes na prestação de serviços de pagamento e na prestação de serviços de ativos virtuais a serem adotados\n  pelas instituições financeiras e demais instituições autorizadas a funcionar pelo Banco Central do Brasil, sociedades prestadoras de serviços de ativos virtuais e instituições de pagamento integrantes do Sistema de Pagamentos Brasileiro – SPB. \n Parágrafo único.  O disposto nesta Resolução aplica-se também às sociedades prestadoras de serviços de ativos virtuais em fase de adequação, nos termos do art. 88\n\n- Art. 2º-B  As instituições referidas no art. 1º, quando prestarem serviços de ativos virtuais ou executarem transações de pagamento relacionadas à prestação desses serviços, somente podem executar\n  ordens de transferência desses ativos vinte e quatro horas após o recebimento dos respectivos recursos de aporte na carteira, em reais ou na forma de ativos virtuais, quando a transferência tiver por destino: \n I - entidade constituída no exterior que desempenhe atividades no mercado de ativos virtuais; ou \n II - carteira autocustodiada, conforme definida nos termos de regulamentação específica. \n \n\n- Art. 4º  As instituições mencionadas no art. 1º devem manter registros diários detalhando as ocorrências de fraudes ou de tentativas de fraude na prestação de serviços de pagamento e de serviços\n  de ativos virtuais, discriminando inclusive as medidas corretivas adotadas. \n ......................................................\" (NR) \n \"\n\n- Art. 6º-A  O Banco Central do Brasil poderá, entre outras medidas, no desempenho de suas atribuições legais: \n I - definir a periodicidade, o conteúdo mínimo e os procedimentos operacionais para a remessa da documentação de que trata o art. 2º-B, §§ 6º e 7º; e \n II - a qualquer tempo, quanto a instituição específica ou a conjunto de instituições, desde que constatada a inobservância do disposto nesta Resolução, impor: \n a) a observância de prazo superior àquele de vinte e quatro horas previsto no art. 2º-B,  caput ; \n b) a observância do procedimento de que trata o art. 2º-B em operações de va\n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n"}, {"info": {"id": "bcb-ingest-resolucao-bcb-587-2026-09-18", "titulo": "Resolução BCB N° 587 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2026-09-18", "tags": "[pix, fraude]", "grupo": "normas", "caminho": "normas/bcb/bcb-ingest-resolucao-bcb-587-2026-09-18.md", "quando": "2026-09-21"}, "meta": {"id": "bcb-ingest-resolucao-bcb-587-2026-09-18", "tipo": "norma", "titulo": "Resolução BCB N° 587 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "data_publicacao": "2026-09-18", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=587", "status": "a_fichar", "tags": "[pix, fraude]", "confidencial": "false"}, "corpo": "\n## Ementa (retornada pela API do BCB — conferir no texto oficial)\n\nAltera a Resolução BCB nº 1, de 12 de agosto de 2020, que institui o arranjo de pagamentos Pix e aprova o seu Regulamento, para ajustar dispositivo relacionado aos critérios de participação no Pix; altera o regulamento anexo à Resolução BCB nº 1, de 12 de agosto de 2020, que disciplina o funcionamento do arranjo de pagamentos Pix, para: admitir a iniciação de transações relativas ao produto Pix Automático em conta-salário, instituir a cobrança híbrida, ajustar dispositivo referente ao Pix Saque, ajustar e revogar dispositivos que fazem referência a dispositivo já revogado, inserir dispositivo relativo aos requisitos e aos procedimentos para participação no Pix, ajustar o dispositivo relativo à perda da condição de participante do Pix, atribuir nova obrigação aos participantes do Pix, inserir e ajustar dispositivos que tratam da marcação de fundada suspeita de fraude transacional e inserir dispositivo para disciplinar os recursos interpostos contra decisões do Banco Central do Brasil no âmbito do Pix; e altera o anexo I à Resolução BCB nº 507, de 26 de setembro de 2025, que estabelece o rito de apuração de descumprimento do Regulamento do Pix e os parâmetros para a aplicação de penalidades, para ajustar o prazo para desligamento do Pix de instituição à qual for aplicada penalidade de exclusão.\n\n## Texto oficial (extração automática, 2026-09-21) "id": "bcb-ingest-resolucao-bcb-597-2026-09-30", "tipo": "norma", "titulo": "Resolução BCB N° 597 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "data_publicacao": "2026-09-30", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=597", "status": "a_fichar", "tags": "[pix]", "confidencial": "false"}, "corpo": "\n## Ementa (retornada pela API do BCB — conferir no texto oficial)\n\n\nAltera o regulamento anexo à Resolução BCB nº 1, de 12 de agosto de 2020, que institui o arranjo de pagamentos Pix e aprova o seu Regulamento, para prever a vedação de processar, liquidar ou viabilizar transações destinadas a loterias de aposta de quota fixa, de que trata o art. 14 da Medida Provisória nº 1.394, de 25 de setembro de 2026.\n\n## Texto oficial (extração automática, 2026-10-01)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** NAO_CONFIRMADO\n**Ementa oficial:** Altera o regulamento anexo à Resolução BCB nº 1, de 12 de agosto de 2020, que institui o arranjo de pagamentos Pix e aprova o seu Regulamento, para prever a vedação de processar, liquidar ou viabilizar transações destinadas a loterias de aposta de quota fixa, de que trata o art. 14 da Medida Provisória nº 1.394, de 25 de setembro de 2026.\n\n### Vigência (dispositivos transcritos)\n\n- Art. 2º  Esta Resolução entra em vigor na data de sua publicação. \n GILNEU FRANCISCO ASTOLFI VIVAN \n Diretor de Organização do Sistema Financeiro e de Resolução\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 12 de agosto de 2020 · 13 de agosto de 2020 · 21 de dezembro de 2018 · 25 de setembro de 2026 · 27 de março de 2001 · 28 de agosto de 2019 · 30 de setembro de 2026 · 31 de dezembro de 1964 · 4 de novembro de 2013 · 9 de outubro de 2013\n\n### Dispositivos que tocam o escopo Rastro\n\n- A Diretoria Colegiada do Banco Central do Brasil, em sessão realizada em 30 de setembro de 2026, com base no art. 10,\n caput , inciso IV, da Lei nº 4.595, de 31 de dezembro de 1964, no art. 10 da Lei nº 10.214, de 27 de março de 2001, nos arts. 6º, 7º, 9º, 10, 14 e 15 da Lei nº 12.865, de 9 de outubro de 2013, na Resolução nº 4.282, de 4 de novembro de 2013, no Comunicado\n  nº 32.927, de 21 de dezembro de 2018, no Comunicado nº 34.085, de 28 de agosto de 2019, e tendo em vista o disposto no art. 14 da Medida Provisória nº 1.394, de 25 de setembro de 2026, \n R E S O L V E :\n\n- Art. 32.  ................................................. \n ............................................................ \n IX - possuir mecanismos de monitoramento e de ação contra usuários recebedores que enviem instruções de pagamento indevidas no âmbito do produto Pix Automático ou que enviem ofertas excessivas\n  requisitando autorização para inclusão de transações no Pix Automático; \n X - divulgar o Mecanismo Especial de Devolução, de que trata o Capítulo XI, Seção II, com foco no público vulnerável, em seus canais de publicidade e de atendimento, por meio de informação clara\n  e acessív\n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n"}, {"info": {"id": "bcb-ingest-resolucao-bcb-601-2026-10-23", "titulo": "Resolução BCB N° 601 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2026-10-23", "tags": "[instituicoes de pagamento]", "grupo": "normas", "caminho": "normas/bcb/bcb-ingest-resolucao-bcb-601-2026-10-23.md", "quando": "2026-10-26"}, "meta": {"id": "bcb-ingest-resolucao-bcb-601-2026-10-23", "tipo": "norma", "titulo": "Resolução BCB N° 601 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "data_publicacao": "2026-10-23", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=601", "status": "a_fichar", "tags": "[instituicoes de pagamento]", "confidencial": "false"}, "corpo": "\n## Ementa (retornada pela API do BCB — conferir no texto oficial)\n\n\n  Dispõe sobre a implementação do Painel de Dívidas Consolidadas pelas instituições financeiras, instituições de pagamento, sociedades distribuidoras de títulos e valores mobiliários, sociedades corretoras de títulos e valores mobiliários e sociedades corretoras de câmbio.\n\n## Texto oficial (extração automática, 2026-10-26)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** NAO_CONFIRMADO\n**Ementa oficial:** Dispõe sobre a implementação do Painel de Dívidas Consolidadas pelas instituições financeiras, instituições de pagamento, sociedades distribuidoras de títulos e valores mobiliários, sociedades corretoras de títulos e valores mobiliários e sociedades corretoras de câmbio.\n\n### Vigência (dispositivos transcritos)\n\n- Art. 12.  Esta Resolução entra em vigor: \n I - na data de sua publicação, em relação ao disposto nos arts. 10 e 11; e \n II - em 1º de julho de 2027, em relação aos demais dispositivos. \n GILNEU FRANCISCO ASTOLFI VIVAN \n Diretor de Regulação\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 14 de julho de 1965 · 1º de julho de 2027 · 21 de dezembro de 2023 · 23 de outubro de 2026 · 24 de março de 2022 · 30 de setembro de 2021 · 31 de dezembro de 1964 · 4 de maio de 2020 · 4 de maio de 2026 · 4 de novembro de 2025 · 9 de outubro de 2013\n\n### Dispositivos que tocam o escopo Rastro\n\n- Art. 3º  As instituições de que trata o art. 1º devem disponibilizar e fornecer Painel de Dívidas Consolidadas, que deve apresentar, no mínimo, os seguintes dados e informações sobre as obrigações\n  financeiras do cliente que tenha contratado, na instituição, alguma operação referida no art. 4º: \n \n I - consolidação de obrigações financeiras; \n \n II - detalhamento das dívidas; \n \n III - comprometimento da capacidade mensal de pagamento; \n \n IV - simulação de custos de contratação do crédito; e \n \n V - alertas de risco. \n § 1º  Os dados e as informações do Painel de Dívidas Consolidadas referid\n\n- Art. 8º  As instituições referidas no art. 1º devem manter à disposição do Banco Central do Brasil, pelo prazo mínimo de cinco anos, os dados, registros e documentação relativos aos procedimentos\n  referidos nesta Resolução. \n Parágrafo único.  Caso sejam constatados indícios de endividamento desproporcional com base na consolidação de obrigações financeiras de um cliente no Painel de Dívidas Consolidadas, a documentação\n  referida no  caput  deve estar acompanhada de documentação adicional, contendo as medidas efetivamente adotadas para o tratamento da situação por parte da instituição, nos t\n\n- Art. 10.  O Banco Central do Brasil poderá adotar medidas complementares necessárias à execução do disposto nesta Resolução, podendo estabelecer: \n I - o detalhamento dos dados e das informações do Painel de Dívidas Consolidadas; e \n II - outros aspectos e requisitos necessários à implementação do Painel de Dívidas Consolidadas, em especial nas operações de crédito sob administração ou controle das instituições de que\n  trata o art. 1º, bem como aquelas vinculadas a operações cursadas no âmbito de arranjos de pagamento.\n\n\n### Pendente do operador\n\n- Validar a transcrição acima na fonte primária (link no frontmatter)\n- Aplicação prática no ciclo Rastro (prontidão / war room / defesa)\n- Conexão comercial (benchmark / diagnóstico / retainer / adversarial)\n- Lacunas e o que ficou por confirmar\n"}, {"info": {"id": "bcb-ingest-resolucao-bcb-603-2026-10-23", "titulo": "Resolução BCB N° 603 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "tipo": "norma", "status": "a_fichar", "data_publicacao": "2026-10-23", "tags": "[pix]", "grupo": "normas", "caminho": "normas/bcb/bcb-ingest-resolucao-bcb-603-2026-10-23.md", "quando": "2026-10-26"}, "meta": {"id": "bcb-ingest-resolucao-bcb-603-2026-10-23", "tipo": "norma", "titulo": "Resolução BCB N° 603 — INGESTÃO AUTOMÁTICA", "orgao": "BCB", "data_publicacao": "2026-10-23", "fonte_primaria": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=603", "status": "a_fichar", "tags": "[pix]", "confidencial": "false"}, "corpo": "\n## Ementa (retornada pela API do BCB — conferir no texto oficial)\n\n\n Altera o regulamento anexo à Resolução BCB nº 1, de 12 de agosto de 2020, que institui o arranjo de pagamentos Pix e aprova o seu Regulamento, para disciplinar a oferta de crédito durante a iniciação de uma transação Pix.\n\n## Texto oficial (extração automática, 2026-10-26)\n\nTranscrição da fonte oficial do BCB. Nada aqui foi interpretado: cabe ao operador ler, validar e classificar.\n\n**Publicação:** NAO_CONFIRMADO\n**Ementa oficial:** Altera o regulamento anexo à Resolução BCB nº 1, de 12 de agosto de 2020, que institui o arranjo de pagamentos Pix e aprova o seu Regulamento, para disciplinar a oferta de crédito durante a iniciação de uma transação Pix.\n\n### Vigência (dispositivos transcritos)\n\n- Art. 2º  Esta Resolução entra em vigor em 1º de julho de 2027. \n GILNEU FRANCISCO ASTOLFI VIVAN \n Diretor de Organização do Sistema Financeiro e de Resolução\n\n### Datas citadas no texto (candidatas a cronograma)\n\n- 12 de agosto de 2020 · 13 de agosto de 2020 · 1º de julho de 2027 · 21 de dezembro de 2018 · 21 de dezembro de 2023 · 23 de outubro de 2026 · 24 de março de 2022 · 27 de março de 2001 · 28 de agosto de 2019 · 31 de dezembro de 1964 · 4 de novembro de 2013 · 9 de outubro de 2013\n\n### Dispositivos que tocam o escopo Rastro\n\n- Art. 7º-A  A oferta de crédito ao usuário pagador durante a iniciação de uma transação Pix deve ser feita exclusivamente em conformidade com o disposto no Capítulo V, Seção V, deste Regulamento. \n \n Parágrafo único.  O disposto no  caput  não impede a realização de uma transação Pix mediante utilização do cheque especial vinculado à conta de depósitos à vista.” (NR) \n “ Seção V \n \n Da oferta de crédito durante a iniciação de um Pix\n\n- Art. 15-D.  A oferta de crédito ao usuário pagador durante a iniciação de uma transação Pix consiste na disponibilização de recursos decorrentes de operação de crédito para a realização da transação. \n § 1º  A transação Pix associada à operação de crédito é efetivada de forma imediata e integral ao usuário recebedor, independentemente do número de parcelas e do prazo de pagamento contratados\n  pelo usuário pagador. \n § 2º  A operação de crédito associada à transação Pix deve ser contratada de forma simultânea à realização da transação e fica condicionada à liquidação da transação. \n § 3º  O va\n\n- Art. 15-E.  A operação de crédito de que trata o art. 15-D pode ser ofertada pelo participante prestador de serviços de pagamento do usuário pagador: \n I - diretamente; \n II - por meio de parceria, nos termos do art. 90-D deste Regulamento; ou \n III - por meio do estabelecimento de relação contratual com terceiros, nos termos do art. 90 deste Regulamento. \n § 1º  A oferta de que trata o\n caput  somente pode ser realizada por participante na modalidade provedor de conta transacional autorizado a funcionar pelo Banco Central do Brasil. \n § 2º  Em qualquer das hipóteses previstas no\n caput , o cr\n\n- Art. 15-F.  A oferta de crédito durante a iniciação de uma transação Pix está condicionada à prévia autorização pelo usuário pagador. \n § 1º  A autorização de que trata o\n caput  produz efeito vinte e quatro horas após a manifestação de vontade do usuário pagador. \n § 2º  O usuário pagador pode, a qualquer tempo e com efeito imediato, retirar a autorização concedida para a oferta de crédito durante a iniciação de uma transação Pix.” (NR) \n “\n\n- Art. 15-G.  A oferta de crédito durante a iniciação de uma transação Pix é facultativa. \n Parágrafo único.  A oferta do crédito pode ser limit
