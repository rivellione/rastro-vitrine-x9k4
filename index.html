janeiro de 2027.\n\n### Art. 50 (sigilo das comunicações)\n\n> Art. 50. As instituições referidas no art. 1º devem realizar as comunicações mencionadas nos arts. 48 e 49 sem dar ciência aos envolvidos ou a terceiros.\n\n### Art. 67 (guarda de dez anos)\n\n> Art. 67. As instituições referidas no art. 1º devem manter à disposição do Banco Central do Brasil e conservar pelo período mínimo de dez anos:\n> I - as informações coletadas nos procedimentos destinados a conhecer os clientes de que tratam os arts. 13, 16 e 18, contado o prazo referido no caput a partir do primeiro dia do ano seguinte ao término do relacionamento com o cliente;\n> II - as informações coletadas nos procedimentos destinados a conhecer os funcionários, parceiros e prestadores de serviços terceirizados de que trata o art. 56, contado o prazo referido no caput a partir da data de encerramento da relação contratual;\n> III - as informações e registros de que tratam os arts. 28 a 37, contado o prazo referido no caput a partir do primeiro dia do ano seguinte ao da realização da operação; e\n> IV - o dossiê referido no art. 43, § 2º.\n\n## M. Carta Circular BCB 4.001/2020 (indícios; texto consolidado, versão 4)\n\n### Art. 1º, § 1º (só a análise concluída comunica)\n\n> § 1º As operações ou as situações referidas no caput devem ser comunicadas, nos termos da referida Circular, somente nos casos em que os indícios forem confirmados ao término da execução dos procedimentos de análise de operações e situações suspeitas.\n\n### Art. 1º, XIII, \"d\" (funcionários, parceiros e prestadores)\n\n> d) fornecimento de auxílio ou informações, remunerados ou não, a cliente em prejuízo do programa de prevenção à lavagem de dinheiro e ao financiamento do terrorismo da instituição, ou de auxílio para estruturar ou fracionar operações, burlar limites regulamentares ou operacionais.\n\n## N. Lei Complementar 105/2001 (sigilo; Planalto, 5/11/2026)\n\n### Art. 1º, § 3º, I, IV e V (o que não viola o sigilo)\n\n> § 3º Não constitui violação do dever de sigilo:\n> I – a troca de informações entre instituições financeiras, para fins cadastrais, inclusive por intermédio de centrais de risco, observadas as normas baixadas pelo Conselho Monetário Nacional e pelo Banco Central do Brasil;\n> IV – a comunicação, às autoridades competentes, da prática de ilícitos penais ou administrativos, abrangendo o fornecimento de informações sobre operações que envolvam recursos provenientes de qualquer prática criminosa;\n> V – a revelação de informações sigilosas com o consentimento expresso dos interessados;\n\n### Art. 3º, caput (informações ordenadas pelo Judiciário)\n\n> Art. 3º Serão prestadas pelo Banco Central do Brasil, pela Comissão de Valores Mobiliários e pelas instituições financeiras as informações ordenadas pelo Poder Judiciário, preservado o seu caráter sigiloso mediante acesso restrito às partes, que delas não poderão servir-se para fins estranhos à lide.\n\n### Art. 10 (crime de quebra de sigilo)\n\n> Art. 10. A quebra de sigilo, fora das hipóteses autorizadas nesta Lei Complementar, constitui crime e sujeita os responsáveis à pena de reclusão, de um a quatro anos, e multa, aplicando-se, no que couber, o Código Penal, sem prejuízo de outras sanções cabíveis.\n> Parágrafo único. Incorre nas mesmas penas quem omitir, retardar injustificadamente ou prestar falsamente as informações requeridas nos termos desta Lei Complementar.\n\n## O. O que não está neste glossário e por quê\n\n- Res. BCB 538/2025 e 494 a 498/2025: os dispositivos relevantes já estão incorporados ao texto consolidado da Res. 85 transcrito acima; o pacote 494-498 tem ficha própria ([[bcb-res-494-498-2025]]).\n- Res. CNJ 615/2025 e Recomendação CNJ 159/2024: fichadas, sem transcrição literal neste glossário; entram na frente de litigância abusiva, não no diagnóstico de controles.\n- Fundamentos processuais do eixo de determinações judiciais (multa por descumprimento de ordem, dever de colaboração de terceiro): pendentes de ficha; não transcrever antes de conferir.\n- Manual Operacional do DICT e Manual de Tempos do Pix: documentos técnicos do Regulamento do Pix; os tempos são ANS por percentil, não prazos peremptórios ([[manual-tempos-pix]]).\n\n## Relações\n\n[[diagnostico-revisao-juridica]] · [[plano-de-contingencia]] · [[hub-matriz-prazos]] · [[hub-catalogo-medidas]] · [[estudo-72h-aprofundamento]] · [[lei-9613-1998]] · [[bcb-circular-3978-2020]] · [[bcb-carta-circular-4001-2020]] · [[lcp-105-2001]]\n"}, {"info": {"id": "hub-anpd-lgpd", "titulo": "Hub — ANPD e LGPD", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "", "tags": "[hub, anpd, lgpd, incidente]", "grupo": "hubs", "caminho": "hubs/hub-anpd-lgpd.md", "quando": "2026-07-03"}, "meta": {"id": "hub-anpd-lgpd", "tipo": "conceito", "titulo": "Hub — ANPD e LGPD", "status": "fichado", "tags": "[hub, anpd, lgpd, incidente]", "confidencial": "false"}, "corpo": "\n# Hub — ANPD e LGPD\n\nNó estrutural do tema proteção de dados: obrigações da Lei nº 13.709/2018 (LGPD) e regulamentos da ANPD relevantes para incidentes de segurança em fintechs.\n\n## Unidades\n\n- [[anpd-res-cd-15-2024]] — regulamento de comunicação de incidente de segurança (art. 48 da LGPD).\n\n## Pendências de fichamento\n\n- Lei nº 13.709/2018 (LGPD), arts. 46–52 — ainda não fichada como unidade própria.\n- Resolução CD/ANPD nº 4/2023 (dosimetria de sanções) — ainda não fichada.\n\n## Relações\n\n[[hub-seguranca-cibernetica]] · [[hub-matriz-prazos]] · [[hub-jurisprudencia-consumerista]]\n"}, {"info": {"id": "hub-catalogo-medidas", "titulo": "Hub — Catálogo de medidas do war room (arsenal consolidado)", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "", "tags": "[hub, war-room, medidas, arsenal]", "grupo": "hubs", "caminho": "hubs/hub-catalogo-medidas.md", "quando": "2026-07-23"}, "meta": {"id": "hub-catalogo-medidas", "tipo": "conceito", "titulo": "Hub — Catálogo de medidas do war room (arsenal consolidado)", "status": "fichado", "tags": "[hub, war-room, medidas, arsenal]", "confidencial": "false"}, "corpo": "\n# Catálogo de medidas — o arsenal do war room\n\nConsolidação de TODAS as frentes de ação disponíveis num incidente de fraude, organizadas por natureza. Complementa a [[hub-matriz-prazos]] (que diz *quando*) dizendo *o quê* e *com que fundamento*. Fundamentos marcados \"conferir\" devem ser validados na fonte antes de constar em minuta.\n\n## A. Frente administrativa-regulatória (primeiras horas)\n\n- Acionamento da recuperação de valores / MED 2.0 — rastreio, bloqueio em cadeia e devolução ([[bcb-res-493-2025]], arts. 54, XII e 78-N). Requisitos: reclamação do usuário + fundada suspeita, documentados com hora.\n- Comunicação de incidente relevante ao BCB — obrigação da Res. BCB 85/2021 (norma-base ainda não fichada — prazo e forma: PENDENTE de verificação).\n- Interlocução com os PSPs da cadeia (recebedor e saltos seguintes) pelos canais do arranjo Pix.\n- Registro interno de crise conforme critérios documentados ([[bcb-res-538-2025]], art. 20, p.u.).\n\n## B. Frente de proteção de dados (relógio de 3 dias úteis)\n\n- Registro formal do momento do conhecimento (marco zero — [[anpd-res-cd-15-2024]], art. 6º, §1º).\n- Teste de risco relevante (art. 5º: afetação significativa + critério objetivo) com decisão fundamentada por escrito.\n- Comunicação à ANPD e aos titulares, quando devida; registro de TODOS os incidentes por 5 anos, mesmo sem comunicação.\n- Avaliação de comunicação a outros controladores/operadores afetados na cadeia (fundamento contratual/LGPD — analisar caso a caso).\n\n## C. Frente cível (recuperação e contenção)\n\n- Tutela de urgência cautelar para bloqueio judicial de valores na cadeia de contas-laranja (arresto/sequestro), complementando o alcance administrativo do MED.\n- Produção antecipada de provas (CPC, art. 381) — cristalizar logs, telemetria e perícia antes do perecimento.\n- Exibição de documentos contra PSPs recebedores (dados KYC das contas de destino) — conferir cabimento e via na minuta.\n- Ação de ressarcimento contra fraudador e titulares de contas-laranja; desconsideração/extensão quando pessoa jurídica de fachada.\n- Ação de regresso contratual contra PSTI/prestador de tecnologia comprometido.\n- Ata notarial de páginas, perfis e conversas fraudulentas (prova de autenticidade).\n\n## D. Frente criminal\n\n- Notícia-crime por fraude eletrônica (CP, art. 171, §2º-A, incluído pela Lei nº 14.155/2021).\n- Invasão de dispositivo informático (CP, art. 154-A), organização criminosa (Lei nº 12.850/2013) e lavagem (Lei nº 9.613/1998), conforme o caso — conferir enquadramentos na minuta.\n- Representação e cooperação com PF/polícias civis (laboratórios de cibercrime); é a via para quebras de sigilo que o cível não alcança.\n- Sindicância interna quando houver suspeita de insider (vetor do caso C&M) — interface trabalhista e criminal, com cadeia de custódia da apuração.\n\n## E. Ofícios e extrajudicial (velocidade sem juiz)\n\n- Ofícios/notificações a PSPs recebedores: preservação de logs e KYC, bloqueio cautelar voluntário.\n- Notificações a plataformas (Meta/WhatsApp, Telegram, marketplaces) para remoção de perfis e anúncios fraudulentos (takedown) e preservação de dados (Marco Civil, art. 13 e ss. — conferir na minuta).\n- Registro.br / provedores de hospedagem: derrubada de domínios e páginas clonadas.\n- Operadoras de telecom: preservação de registros vinculados a linhas usadas no golpe (via ofício judicial, em regra).\n- Aviso de sinistro à seguradora (própria e/ou do PSTI — [[bcb-res-494-498-2025]], Res. 498, art. 17, XIII) nos prazos da apólice.\n\n## F. Inteligência e pesquisa (pré-incidente, incidente e atribuição)\n\nVer o modelo das três camadas em [[camadas-da-fraude]]: esta frente deixa de ser só forense pós-incidente e passa a cobrir também vigilância ANTES do golpe e atribuição da estrutura criminosa.\n\n- Vigilância PRÉ-incidente (camada 2): monitoramento contínuo de exposição do cliente — dados/credenciais à venda em fóruns e dark web, menções, kits de golpe — antes de o incidente se consumar (parceiro de threat intelligence).\n- OSINT sobre beneficiários das contas de destino (vínculos societários, padrões de laranja).\n- Análise de vínculos entre contas/incidentes (grafo de reincidência — insumo para predatória e para o criminal).\n- Rastreamento de conversão em cripto (chain analysis, com parceiro especializado) quando os valores saem do Pix.\n- ATRIBUIÇÃO (camada 3): identificar a estrutura por trás (fraud-as-a-service) — o que transforma bloqueio de laranja em persecução criminal real e recuperação com alcance. Parceiro técnico coordenado juridicamente; parceiro em avaliação em parceiro técnico em avaliação.\n\n## G. Apoio técnico externo (forense, DFIR, hackers éticos)\n\n- Forense digital: imagem de sistemas e dispositivos, preservação com cadeia de custódia, laudo pericial.\n- DFIR (resposta a incidente): contenção, erradicação, análise de vetor — o par técnico do war room jurídico.\n- Apuração de INSIDER (camada 2): quando a origem é interna, investigação simultânea trabalhista + criminal + forense, com cadeia de custódia reforçada (a prova precisa sobreviver às duas jurisdições).\n- Antifraude/telemetria: reconstrução dos sinais pré-transação (device, geolocalização, biometria comportamental) para a tese de fortuito externo.\n- Pentest/red team pós-incidente: fechar o vetor e documentar correção ([[bcb-res-538-2025]], art. 22-A — testes com planos de correção).\n\n## H. Comunicação de crise e stakeholders\n\n- Narrativa única e controlada para BCB, ANPD, seguradora, clientes, imprensa e investidores — inconsistência entre canais vira prova adversa.\n- Roteiro de atendimento às vítimas (o que dizer e o que não prometer) — reduz a onda consumerista e a predatória.\n\n## I. Frente consumerista (a onda — fase recuperação/defesa)\n\n- Contestação estruturada na tese fortuito externo/culpa exclusiva ([[stj-sumula-479]]; CDC, art. 14, §3º) com o dossiê probatório das frentes A-G.\n- Triagem de litigância predatória (petições clonadas, procurações viciadas) e impugnações concentradas; uso de IA governada ([[cnj-res-615-2025]]).\n- Gestão de acordos seletiva (critérios, não padrão) para não alimentar o incentivo à massa.\n\n## Lacunas\n\n- Prazo/forma da comunicação de incidente ao BCB (Res. 85/2021 consolidada): NAO_CONFIRMADO — fichar a norma-base.\n- Fundamentos marcados \"conferir na minuta\": art. 154-A CP, Lei 12.850, Lei 9.613, Marco Civil art. 13, cabimento de exibição contra terceiro — verificar texto legal ao redigir.\n- Mecânica operacional dos ofícios interbancários no arranjo Pix (canais, SLAs): depende do Manual do DICT — fichar IN 752/2026.\n\n## Relações\n\n[[hub-matriz-prazos]] · [[hub-pix-med]] · [[hub-anpd-lgpd]] · [[hub-jurisprudencia-consumerista]] · [[hub-litigancia-predatoria]] · [[hub-seguranca-cibernetica]]\n"}, {"info": {"id": "hub-jurisprudencia-consumerista", "titulo": "Hub — Jurisprudência consumerista", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "", "tags": "[hub, jurisprudencia, consumidor, fortuito-interno]", "grupo": "hubs", "caminho": "hubs/hub-jurisprudencia-consumerista.md", "quando": "2026-07-07"}, "meta": {"id": "hub-jurisprudencia-consumerista", "tipo": "conceito", "titulo": "Hub — Jurisprudência consumerista", "status": "fichado", "tags": "[hub, jurisprudencia, consumidor, fortuito-interno]", "confidencial": "false"}, "corpo": "\n# Hub — Jurisprudência consumerista\n\nNó estrutural da responsabilidade civil de instituições financeiras e de pagamento perante consumidores vítimas de fraude — base da fase de recuperação/defesa (onda consumerista pós-incidente).\n\n## Unidades\n\n- [[stj-sumula-479]] — responsabilidade objetiva por fortuito interno em fraudes bancárias.\n- [[dossie-pix-fortuito]] — 10 precedentes STJ (2011-2026) sobre fortuito interno × externo em golpes Pix/engenharia social, com a chave de leitura: o critério é a existência de falha autônoma da instituição, não o tipo de golpe.\n\n## Pendências de fichamento\n\n- Afetação repetitiva/IAC sobre engenharia social: não localizada até 2026-07-07 — a divergência 3ª × 4ª Turmas é candidata; monitorar.\n- Fichas individuais dos acórdãos-chave do dossiê (desmembrar sob demanda de minuta).\n\n## Relações\n\n[[hub-litigancia-predatoria]] · [[hub-pix-med]] · [[hub-matriz-prazos]]\n"}, {"info": {"id": "hub-litigancia-predatoria", "titulo": "Hub — Litigância predatória", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "", "tags": "[hub, litigancia-predatoria, contencioso]", "grupo": "hubs", "caminho": "hubs/hub-litigancia-predatoria.md", "quando": "2026-07-07"}, "meta": {"id": "hub-litigancia-predatoria", "tipo": "conceito", "titulo": "Hub — Litigância predatória", "status": "fichado", "tags": "[hub, litigancia-predatoria, contencioso]", "confidencial": "false"}, "corpo": "\n# Hub — Litigância predatória\n\nNó estrutural do tema litigância predatória/abusiva na onda consumerista pós-incidente — defesa adversarial na fase de recuperação.\n\n## Unidades\n\n- [[stj-tema-1198]] — repetitivo (Corte Especial, 13/03/2025): juiz pode exigir emenda fundamentada diante de indícios de litigância abusiva. A alavanca processual central.\n- [[cnj-rec-159-2024]] — Recomendação CNJ sobre litigância abusiva (o ato certo — NÃO confundir com a Rec. 127/2022, que trata de assédio judicial à liberdade de expressão).\n- [[cnj-res-615-2025]] — governança de IA no Judiciário (uso defensável de IA na triagem da massa).\n\n## Referências operacionais verificadas\n\n- NUMOPEDE/TJSP: criado pela Corregedoria em set/2016 (Comunicado CG nº 1757/2016, Proc. 2016/163905); Comunicado CG nº 02/2017 orienta juízes sobre demandas predatórias; enunciados EPM/TJSP publicados. Relatório 2016-2021: ~330 mil processos atípicos, custo estimado R$ 2,7 bi/ano. Modelo replicado (TJAM NT 01/2022, TJPR, TJPB).\n- Precedentes de aplicação (TJSP): Ap. 1009643-53.2024.8.26.0606 (14ª Câm. Dir. Privado, rel. Des. César Zalaf, set/2025 — extinção mantida + comunicação ao NUMOPEDE, fonte Migalhas); proc. 1011910-66.2022.8.26.0606 (4ª V. Cível Suzano, 2023 — extinção + má-fé por ação sem consentimento da autora, fonte oficial TJSP).\n- Dado quantitativo: Diagnóstico CNJ/ABJ sobre litigância abusiva (dez/2025) — 129 mil+ processos mencionam o fenômeno; 34,7 mil no 1º sem/2025. NÃO usar \"estudo da AMB\": não confirmado em fonte primária.\n\n## Pendências de fichamento\n\n- DJe do acórdão do Tema 1198: conferir antes de citar em peça.\n\n## Relações\n\n[[hub-jurisprudencia-consumerista]] · [[hub-matriz-prazos]]\n"}, {"info": {"id": "hub-matriz-prazos", "titulo": "Hub — Matriz consolidada de prazos ANPD/BACEN/MED", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "", "tags": "[hub, prazos, matriz]", "grupo": "hubs", "caminho": "hubs/hub-matriz-prazos.md", "quando": "2026-11-05"}, "meta": {"id": "hub-matriz-prazos", "tipo": "conceito", "titulo": "Hub — Matriz consolidada de prazos ANPD/BACEN/MED", "status": "fichado", "tags": "[hub, prazos, matriz]", "confidencial": "false"}, "corpo": "\n# Matriz consolidada de prazos — ANPD / BACEN / MED\n\nFonte única de prazos para o playbook de incidente e para o simulador de estudo de caso (Módulo 3). Só entram prazos confirmados em fonte primária; cômputos aritméticos vêm marcados. Datas em ordem cronológica.\n\n## Prazos operacionais (correm a partir de um evento)\n\n| Prazo | Termo inicial | Obrigação | Fonte |\n|---|---|---|---|\n| 3 dias úteis | Conhecimento pelo controlador de que o incidente afetou dados pessoais | Comunicar incidente com risco/dano relevante à ANPD (e aos titulares) | [[anpd-res-cd-15-2024]], art. 6º do Regulamento |\n| 5 anos (mínimo) | Data do registro | Manter registro de todos os incidentes, inclusive não comunicados | [[anpd-res-cd-15-2024]] |\n| Reclamação do usuário | Fundada suspeita de fraude | PSP do pagador instaura a recuperação de valores (rastreio/bloqueio/devolução) | [[bcb-res-493-2025]], art. 78-N do regulamento do Pix |\n| 24 horas | Identificação do indício de fraude (ou da necessidade de alterar/excluir) | Registrar/alterar/excluir o indício no sistema de compartilhamento | [[bcb-res-343-2023]], art. 4º |\n| Dia 15 de cada mês | Mês anterior | Declaração de conformidade do compartilhamento de indícios | [[bcb-res-343-2023]], art. 5º |\n\n| \"Tempestiva\" (SEM prazo fixado) | Incidente relevante que configure crise, pelos critérios documentados da própria instituição | Comunicar ao BCB o incidente e as providências de reinício | [[bcb-res-85-2021]], art. 20, III e p.u. |\n| 10 dias | Contratação/alteração de serviço relevante (incl. PSTI de mensageria) | Comunicar a contratação ao BCB | [[bcb-res-85-2021]], arts. 15, §2º e 22-B |\n\n| Imediata | Reclamação do usuário ou identificação da suspeita | Instaurar a Recuperação de Valores (a análise de mérito vem depois) | [[bcb-ingest-instrucao-normativa-bcb-752-2026-07-01]], Manual DICT v8.4, seção 20 |\n| 80 dias corridos (pacs.008) / 30 (pacs.004) | Transação contestada | Janela máxima de contestação para instaurar o MED | Manual DICT v8.4, seção 20.1.1 |\n| Imediato | Recebimento da notificação na cadeia | Bloquear recursos até o limite do saldo disponível | Manual DICT v8.4, seção 20.1.4 |\n| 7 dias | Notificação de infração | Informar ao DICT o resultado da análise | Manual DICT v8.4 / Manual de Tempos do Pix |\n| 72 horas | Encerramento da análise | Iniciar a etapa de devolução — sob pena de conclusão automática do procedimento | Manual DICT v8.4, seção 20.1.6 |\n\n| 30 min (ANS 95%) | Reclamação do usuário no canal | Abrir a notificação de infração/recuperação de valores | [[manual-tempos-pix]], Manual de Tempos 4.2.2.7 |\n| 6 horas (ANS 99%) | Solicitação de devolução por fundada suspeita | PSP recebedor concluir/efetivar a devolução | [[manual-tempos-pix]], Manual de Tempos 4.2.1.8 |\n| Até 72 horas | Suspeita de fraude | Bloqueio cautelar de valores pelo PSP do recebedor | [[manual-tempos-pix]], Guia MED v4.3 |\n\nATENÇÃO metodológica: os tempos do Manual de Tempos são ANS por PERCENTIL (metas de nível de serviço), não prazos peremptórios caso a caso — citar sempre com essa nuance.\n\n### Relógios PLD/FT (Lei 9.613/1998 e Circular BCB 3.978/2020, consolidada; conferidos em 5/11/2026)\n\n| Prazo | Termo inicial | Obrigação | Fonte |\n|---|---|---|---|\n| 24 horas | Proposta ou realização de operação com sérios indícios (art. 11, I) ou acima do limite (art. 10, II) | Comunicar ao Coaf, \"abstendo-se de dar ciência de tal ato a qualquer pessoa, inclusive àquela à qual se refira a informação\" | [[lei-9613-1998]], art. 11, II |\n| 45 dias | Data de ocorrência da operação ou situação | Concluir os procedimentos de monitoramento e seleção | [[bcb-circular-3978-2020]], art. 39, parágrafo único |\n| 45 dias | Data da seleção | Concluir a análise e formalizá-la em dossiê; a decisão de comunicar ou não ao Coaf é tomada, fundamentada e registrada no dossiê até o fim deste prazo | [[bcb-circular-3978-2020]], art. 43, §§ 1º e 2º; art. 48, § 1º |\n| Dia útil seguinte | Decisão de comunicação | Comunicar a operação ou situação suspeita ao Coaf, sem ciência aos envolvidos ou a terceiros | [[bcb-circular-3978-2020]], art. 48, § 2º; art. 50 |\n| Dia útil seguinte | Ocorrência da operação ou do provisionamento | Comunicar ao Coaf: espécie ≥ R$ 50 mil (depósito, aporte, saque, pagamento contra espécie, provisionamento); câmbio em espécie ≥ US$ 10 mil; ativos virtuais de ou para carteira autocustodiada ≥ US$ 10 mil (IV e V desde 1º/10/2026) | [[bcb-circular-3978-2020]], art. 49, I a V e § 1º (redação da Res. BCB 591/2026) |\n| 5º dia útil após a comunicação | Comunicação realizada | Alteração ou cancelamento depois desse dia exige justificativa | [[bcb-circular-3978-2020]], art. 51 |\n| 31/3 do ano seguinte | Data-base de 31/12 | Relatório anual de avaliação de efetividade ao comitê de auditoria, se houver, e ao conselho ou diretoria | [[bcb-circular-3978-2020]], art. 62, § 2º |\n| 5 anos (mínimo, ampliável) | Encerramento da conta ou conclusão da transação | Conservar cadastros e registros (art. 10, I e II) | [[lei-9613-1998]], art. 10, § 2º |\n| 10 anos | Primeiro dia do ano seguinte ao término do relacionamento (clientes); encerramento do contrato (funcionários, parceiros, prestadores); primeiro dia do ano seguinte à operação (registros) | Guarda das informações de conhecimento do cliente, de funcionários e parceiros, dos registros dos arts. 28 a 37 e do dossiê de análise | [[bcb-circular-3978-2020]], art. 67 |\n\nNota de leitura: a lei diz 24 horas; a Circular organiza seleção, análise, decisão e comunicação no dia útil seguinte à decisão. Nenhuma fonte lida concilia os dois textos. Citar cada um pelo que diz. Os três relógios de \"24 horas\" da base têm objetos distintos e não se substituem: comunicação ao Coaf (Lei 9.613, art. 11, II), registro de indício no sistema de compartilhamento (Res. 343, art. 4º) e trava de aumento de limite (Res. 142, art. 2º, II).\n\n## Marcos de adequação (datas fixas de calendário)\n\n| Data | Marco | Fonte |\n|---|---|---|\n| 2025-11-23 | Implementação facultativa da recuperação de valores (MED 2.0) | [[bcb-res-493-2025]], art. 121 |\n| 2026-01-01 a 2026-05-01 | Janela de pedido de autorização — IPs participantes do Pix | [[bcb-res-494-498-2025]] (Res. 496) |\n| ~2026-01-05 | Teto de 4 meses para pedido de credenciamento de PSTIs em funcionamento (cômputo aritmético — conferir) | [[bcb-res-494-498-2025]] (Res. 498, art. 37, §3º) |\n| 2026-02-02 | Implementação obrigatória da recuperação de valores (provedores de conta transacional e liquidantes especiais). Apuração de descumprimento dispensada para os ocorridos até 10/5/2026 (ver linha de 2026-05-11) | [[bcb-res-493-2025]], arts. 4º, I e 121 |\n| 2026-03-01 | Prazo final de adequação à nova redação da Res. BCB 85/2021 (segurança cibernética) | [[bcb-res-538-2025]], art. 2º |\n| ~2026-03-04 | Efeitos das alterações ao art. 26 do regulamento do Pix — 180 dias (cômputo aritmético — conferir) | [[bcb-res-494-498-2025]] (Res. 496) |\n| 2026-05-01 a 2026-05-31 | Janela de protocolo de pedido de autorização — IPs pré-existentes não autorizadas | [[bcb-res-494-498-2025]] (Res. 494) |\n| 2026-05-11 | Fim da dispensa de apuração de descumprimento do MED 2.0: a dispensa cobre os descumprimentos relacionados ao art. 121 ocorridos de 2/2/2026 a 10/5/2026 (datas literais); 11/5 é o dia seguinte ao termo final, não escrito na norma | [[bcb-res-546-2026]], art. 113-A do regulamento do Pix (DOU 23/1/2026, S.1, p. 72) |\n| ~2026-07-12 | Fim dos 12 meses de adequação de projetos de IA dos tribunais (cômputo aritmético — conferir) | [[cnj-res-615-2025]], art. 45, p.u. |\n| 2026-10-01 | Vigência da Res. BCB 591/2026: comunicação ao Coaf de câmbio em espécie e de transferências de ativos virtuais de ou para carteiras autocustodiadas ≥ US$ 10 mil (art. 49, IV e V, da Circular 3.978) | [[bcb-circular-3978-2020]] |\n| 2026-10-30 | Adequação do compartilhamento de indícios para ativos virtuais | [[bcb-res-343-2023]], art. 13-A, I |\n| 2026-12-01 | Adequação do compartilhamento para operadoras de apostas não autorizadas | [[bcb-res-569-2026]]; Res. 343, art. 13-A, II |\n| \"Primeiro dia útil de janeiro de 2027\" (literal; cômputo: 4/1/2027, conferir) | Comunicação acumulada ao Coaf das operações dos incisos IV e V do art. 49 contratadas entre 1º/10 e 31/12/2026 | [[bcb-circular-3978-2020]], art. 49, § 2º (Res. BCB 591/2026) |\n\n## Lacunas\n\n- \"Produção plena do MED 2.0 em 11/6/2026\": NAO_CONFIRMADO em fonte primária — não incluído na matriz (ver [[bcb-res-493-2025]]). Revisão de 2026-09-28: a data com lastro primário é 11/5/2026 (fim da dispensa de apuração, [[bcb-res-546-2026]]), incluída na matriz acima. Não há fonte que relacione as duas datas.\n- RESOLVIDO (2026-07-14): comunicação de incidente ao BCB não tem prazo fixado — padrão \"tempestiva\" condicionado aos critérios de crise autodocumentados ([[bcb-res-85-2021]]).\n\n## Relações\n\n[[hub-pix-med]] · [[hub-seguranca-cibernetica]] · [[hub-anpd-lgpd]] · [[hub-jurisprudencia-consumerista]] · [[hub-litigancia-predatoria]] · [[hub-catalogo-medidas]] · [[bcb-circular-3978-2020]] · [[lei-9613-1998]]\n"}, {"info": {"id": "hub-pix-med", "titulo": "Hub — Pix e MED", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "", "tags": "[hub, pix, med]", "grupo": "hubs", "caminho": "hubs/hub-pix-med.md", "quando": "2026-09-28"}, "meta": {"id": "hub-pix-med", "tipo": "conceito", "titulo": "Hub — Pix e MED", "status": "fichado", "tags": "[hub, pix, med]", "confidencial": "false"}, "corpo": "\n# Hub — Pix e MED\n\nNó estrutural do tema Pix e Mecanismo Especial de Devolução. Agrupa o regulamento do Pix (Resolução BCB nº 1/2020) e suas alterações, com destaque para o MED 2.0.\n\n## Unidades\n\n- [[bcb-res-493-2025]] — MED 2.0 (rastreio em múltiplos saltos, devolução parcial), altera a Resolução BCB nº 1/2020.\n- [[bcb-res-546-2026]] — inclui o art. 113-A no regulamento do Pix: dispensa de apuração dos descumprimentos relacionados ao art. 121 ocorridos de 2/2/2026 a 10/5/2026; a obrigatoriedade do MED 2.0 segue em 2/2/2026.\n\n## Pendências de fichamento\n\n- Resolução BCB nº 1/2020 (regulamento base do Pix) — ainda não fichada.\n- Comunicados/instruções normativas do BCB detalhando o manual operacional do MED — ainda não fichados.\n\n## Relações\n\n[[hub-matriz-prazos]] · [[hub-seguranca-cibernetica]] · [[hub-jurisprudencia-consumerista]]\n"}, {"info": {"id": "hub-seguranca-cibernetica", "titulo": "Hub — Segurança cibernética (BCB)", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "", "tags": "[hub, seguranca-cibernetica, psti]", "grupo": "hubs", "caminho": "hubs/hub-seguranca-cibernetica.md", "quando": "2026-07-03"}, "meta": {"id": "hub-seguranca-cibernetica", "tipo": "conceito", "titulo": "Hub — Segurança cibernética (BCB)", "status": "fichado", "tags": "[hub, seguranca-cibernetica, psti]", "confidencial": "false"}, "corpo": "\n# Hub — Segurança cibernética (BCB)\n\nNó estrutural do tema segurança cibernética de instituições de pagamento e prestadores relevantes (PSTI).\n\n## Unidades\n\n- [[bcb-res-538-2025]] — altera a Resolução BCB nº 85/2021 (política de segurança cibernética de IPs).\n- [[bcb-res-494-498-2025]] — pacote: autorização prévia de IPs, requisitos para PSTI, seguro obrigatório de responsabilidade civil.\n\n## Pendências de fichamento\n\n- Resolução BCB nº 85/2021 (norma base alterada) — ainda não fichada.\n\n## Relações\n\n[[hub-pix-med]] · [[hub-anpd-lgpd]] · [[hub-matriz-prazos]]\n"}, {"info": {"id": "escopo-controles-internos", "titulo": "Escopo dos sistemas de controles internos — quem responde a quê (4.968 × 260, perímetro da 80 e 436, conexas de riscos, conformidade e auditoria interna)", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "2026-10-29", "tags": "[controles-internos, instituicao-de-pagamento, instituicao-financeira, perimetro, vasp, tipos-fintech]", "grupo": "frameworks", "caminho": "frameworks/ESCOPO-CONTROLES-INTERNOS.md", "quando": "2026-10-29"}, "meta": {"id": "escopo-controles-internos", "tipo": "conceito", "titulo": "Escopo dos sistemas de controles internos — quem responde a quê (4.968 × 260, perímetro da 80 e 436, conexas de riscos, conformidade e auditoria interna)", "orgao": "", "data_publicacao": "2026-10-29", "fase_rastro": "[prontidao]", "conexao_comercial": "[diagnostico]", "status": "fichado", "tags": "[controles-internos, instituicao-de-pagamento, instituicao-financeira, perimetro, vasp, tipos-fintech]", "confidencial": "false"}, "corpo": "\n# Escopo dos sistemas de controles internos\n\nTabela montada em 2026-10-29 a partir do inteiro teor consolidado lido no endpoint oficial do BCB (exibenormativo) das quatro normas, conferido contra a versão vigente da 4.968 atualizada em 29/12/2025 enviada por Fabio: Res. CMN 4.968/2021 (DOU 29/11/2021), Res. BCB 80/2021 (DOU 29/3/2021), Res. BCB 260/2022 (DOU 24/11/2022) e Res. BCB 552/2026 (DOU 5/3/2026). Os textos integrais de cada uma estão em `normas/` (`_texto-*.txt`) ou nas fichas [[cmn-res-4968-2021]], [[bcb-res-80-2021]], [[bcb-res-260-2022]] e [[bcb-res-552-2026]]. Nenhuma célula foi preenchida por inferência: onde o dado não vem dessas quatro normas, a célula diz \"fora destas normas\" e indica o que conferir.\n\n**Chave de leitura.** A 4.968 (CMN) e a 260 (BCB) são normas-espelho: mesmo capítulo, mesma numeração de artigos, mesmos incisos e alíneas. O que muda é o destinatário. O art. 1º, parágrafo único, da 4.968 exclui consórcios, instituições de pagamento, corretoras, distribuidoras e corretoras de câmbio e os remete ao BCB; o art. 1º da 260 recolhe exatamente esse grupo e, pela 552, acrescenta as prestadoras de serviços de ativos virtuais (VASPs). A 80/2021 não descreve um sistema de controles internos: ela define o que é instituição de pagamento (art. 3º), quem precisa de autorização (art. 9º, na redação da 494/2025) e quais instituições financeiras podem prestar serviço de pagamento sem virar IP (art. 16); o inciso III do seu art. 25, que mandava as IPs seguirem a norma das instituições financeiras, foi revogado pela 260. A 552 só altera escopos.\n\nLegenda das colunas de destinatário: **IF** = instituição financeira e demais autorizadas pelo BCB não excluídas pela 4.968; **IP** = instituição de pagamento autorizada; **Demais 260** = administradora de consórcio, corretora e distribuidora de TVM, corretora de câmbio e VASP. A coluna \"Fintech envolvida\" usa a tipologia de `frameworks/tipos-fintech.json`.\n\n## Bloco A — Sistema de controles internos: dispositivo por dispositivo\n\n| Nº | Dispositivo (mesma numeração nas duas normas) | Sistema ou controle descrito | IF — Res. CMN 4.968 | IP — Res. BCB 260 | Demais 260 (consórcio, corretora, DTVM, câmbio, VASP) | Fintech envolvida |\n|---|---|---|---|---|---|---|\n| A1 | Art. 1º | Âmbito: a quem a norma se dirige | Instituições financeiras e demais autorizadas pelo BCB, exceto as do parágrafo único (consórcio, IP, corretora, DTVM, câmbio — redação da Res. CMN 5.117/2024, desde 1º/3/2024) | Art. 1º, II | Art. 1º, I, III, IV, V e VI (VI incluído pela 552/2026) | IF: SCD, SEP, banco digital (banco múltiplo ou comercial), SCFI digital, SCM, cooperativa digital. IP: conta transacional (EME), pré-pago, pós-pago (cartão), credenciadora, ITP. Demais: VASP, corretora ou DTVM digital, remessa digital (câmbio), consórcio digital |\n| A2 | Art. 2º | Dever de implementar e manter sistema de controles internos compatível com natureza, porte, complexidade, estrutura, perfil de risco e modelo de negócio (proporcionalidade) | Sim | Sim | Sim | Todas as autorizadas; a proporcionalidade é o argumento de calibragem para fintech pequena |\n| A3 | Art. 3º, I | Objetivo de desempenho (eficiência e efetividade no uso de recursos) | Sim | Sim | Sim | Todas |\n| A4 | Art. 3º, II | Objetivo de informação (divulgação interna ou externa de informações financeiras, operacionais e gerenciais) | Sim | Sim | Sim | Todas |\n| A5 | Art. 3º, III | Objetivo de conformidade (leis, regulamentos, políticas e códigos internos) | Sim | Sim | Sim | Todas |\n| A6 | Art. 4º, I | Continuidade e efetividade: atividades de controle para todos os níveis de negócio e todos os riscos | Sim | Sim (redação da 368/2024) | Sim | Todas |\n| A7 | Art. 4º, II | Integração às atividades rotineiras das áreas relevantes | Sim | Sim (redação da 368/2024) | Sim | Todas |\n| A8 | Art. 4º, III | Revisão e atualização periódicas do sistema | Sim | Sim | Sim | Todas |\n| A9 | Art. 5º, I, a | Cultura de controle: definição das responsabilidades dos funcionários e meios para cumpri-las | Sim | Sim | Sim | Todas |\n| A10 | Art. 5º, I, b | Cultura de controle: comunicação tempestiva ao nível gerencial de problemas nas operações, não conformidade com padrões de conduta e violações de políticas ou de normas (itens 1 a 3) | Sim | Sim (itens 2 e 3 com redação da 368/2024) | Sim | Todas |\n| A11 | Art. 5º, I, c | Proibição de metas de desempenho que incentivem risco acima do definido pela alta administração | Sim | Sim | Sim | Todas; relevante para fintech com meta comercial de onboarding |\n| A12 | Art. 5º, I, d | Formalização do compromisso com ética e integridade (código de ética ou equivalente) | Sim | Sim | Sim | Todas |\n| A13 | Art. 5º, I, e | Divulgação do código de ética ou equivalente | Sim | Sim | Sim | Todas |\n| A14 | Art. 5º, II, a | Identificação e avaliação contínuas de fatores internos e externos adversos, inclusive do grupo econômico | Sim | Sim (redação da 368/2024) | Sim | Todas; alcança o conglomerado da fintech híbrida (IP + SCD) |\n| A15 | Art. 5º, II, b | Revisão periódica do sistema com inclusão de riscos novos | Sim | Sim | Sim | Todas |\n| A16 | Art. 5º, II, c | Mitigação dos riscos não tolerados e não controlados | Sim | Sim | Sim | Todas |\n| A17 | Art. 5º, II, d | Análise do potencial de ocorrência de fraudes em todos os níveis de negócio | Sim | Sim | Sim | Todas; núcleo do eixo Rastro |\n| A18 | Art. 5º, III, a | Políticas e procedimentos de controle e verificação de cumprimento | Sim | Sim | Sim | Todas |\n| A19 | Art. 5º, III, b | Revisão e acompanhamento de atividades relevantes pelos níveis gerenciais | Sim | Sim | Sim | Todas |\n| A20 | Art. 5º, III, c | Controles apropriados por departamento ou área de negócio | Sim | Sim | Sim | Todas |\n| A21 | Art. 5º, III, d | Controles físicos de ativos de valor (acesso restrito, dupla custódia, inventários) | Sim | Sim | Sim | VASP (custódia de chaves) e credenciadora (terminais) são os casos de maior peso |\n| A22 | Art. 5º, III, e | Verificação de limites de exposição e acompanhamento de não conformidades | Sim | Sim | Sim | Todas |\n| A23 | Art. 5º, III, f | Sistema de aprovações e autorizações de transações sensíveis, verificação e reconciliação | Sim | Sim | Sim | Todas; para IP, reconciliação de contas de pagamento e liquidação |\n| A24 | Art. 5º, III, g | Segregação de funções para evitar conflito de interesses | Sim | Sim (redação da 368/2024) | Sim | Todas |\n| A25 | Art. 5º, III, h | Identificação e monitoramento independentes de áreas com potencial conflito, com revisão periódica | Sim | Sim | Sim | Todas |\n| A26 | Art. 5º, III, i | Controles contra envolvimento em atividades indevidas ou ilícitas, em especial riscos sociais, ambientais e climáticos | Sim | Sim (redação da 368/2024) | Sim | Todas |\n| A27 | Art. 5º, III, j | Procedimentos e controles de prevenção à lavagem de dinheiro e ao financiamento do terrorismo previstos na regulação própria | Sim | Sim | Sim | Todas; a norma PLD aplicável é externa a esta tabela |\n| A28 | Art. 5º, III, k | Controles para prevenção, detecção, investigação e correção de fraudes | Sim | Sim | Sim | Todas; fundamento direto do plano de resposta a incidentes |\n| A29 | Art. 5º, IV, a | Canais de comunicação que assegurem acesso a informação compreensível, confiável, tempestiva e relevante | Sim | Sim | Sim | Todas |\n| A30 | Art. 5º, IV, b | Fluxos de informação descendentes e entre componentes organizacionais | Sim | Sim | Sim | Todas |\n| A31 | Art. 5º, IV, c | Metodologias de registro e manutenção de informações internas (financeiras, operacionais e de conformidade) | Sim | Sim (redação da 368/2024) | Sim | Todas |\n| A32 | Art. 5º, IV, d | Diretrizes para fontes externas de informação e divulgação ao público de eventos de mercado | Sim | Sim | Sim | Todas |\n| A33 | Art. 5º, IV, e | Sistemas de informação confiáveis, com medidas de segurança e monitoramento independente | Sim | Sim | Sim | Todas; ponto de contato com a norma de segurança cibernética |\n| A34 | Art. 5º, IV, f | Processamento adequado de informações eletrônicas e trilha de auditoria | Sim | Sim | Sim | Todas; é o \"rastro\" em sentido literal |\n| A35 | Art. 5º, IV, g | Testes periódicos de segurança dos sistemas de informação e tecnologia | Sim (redação da 5.178/2024, desde 1º/1/2025) | Sim (redação da 431/2024, desde 1º/1/2025) | Sim | Todas |\n| A36 | Art. 5º, IV, h | Planos de retomada e contingência de negócios para interrupção por eventos fora do controle, com instalações remotas inclusive de terceiros | Sim | Sim (redação da 368/2024) | Sim | Todas; base normativa do plano de contingência |\n| A37 | Art. 5º, IV, i e parágrafo único | Medidas para fornecer documentos, dados e informações corretos e no prazo ao regulador, com processo de verificação de qualidade e testes específicos | Revogados a partir de 1º/1/2026 pela Res. Conjunta 18/2025, art. 13; a matéria passou à política de qualidade das informações dessa resolução, que também alcança a IF (ver B10) | Sim (alínea i e parágrafo único incluídos pela 431/2024, desde 1º/1/2025; a Res. Conjunta 18 não os revogou) e, cumulativamente, a política da Res. Conjunta 18 (B10) | Igual à coluna IP | Para IF a obrigação migrou; para IP, consórcio, corretora, DTVM, câmbio e VASP ela se duplicou: alínea i da 260 mais política própria da Res. Conjunta 18 |\n| A38 | Art. 5º, V, a | Monitoramento contínuo da eficácia do sistema e dos principais riscos | Sim | Sim (redação da 368/2024) | Sim | Todas |\n| A39 | Art. 5º, V, b | Avaliações periódicas, inclusive pela auditoria interna | Sim | Sim (redação da 368/2024) | Sim | Todas |\n| A40 | Art. 5º, V, c | Acompanhamento sistemático: objetivos alcançados, limites e normas cumpridos, desvios corrigidos (itens 1 a 3) | Sim | Sim (item 1 com redação da 368/2024) | Sim | Todas |\n| A41 | Art. 5º, V, d | Atualização de premissas, metodologias e modelos de gestão de riscos | Sim | Sim | Sim | Todas |\n| A42 | Art. 5º, V, e | Metodologia e canais de relato de deficiências aos responsáveis, à diretoria e ao conselho, no caso de falhas materiais | Sim | Sim (\"conselho, quando existente\") | Sim | Todas |\n| A43 | Art. 6º, caput, I a III | Relatório anual: avaliação de adequação e efetividade, recomendações com cronograma de saneamento, manifestação das áreas sobre deficiências anteriores | Sim | Sim | Sim | Todas; entregável recorrente do serviço |\n| A44 | Art. 6º, parágrafo único, I e II | Relatório submetido ao conselho (ou diretoria) e às auditorias interna e externa; guarda à disposição do BCB por cinco anos | Sim | Sim (redação da 368/2024 no inciso I) | Sim | Todas |\n| A45 | Art. 7º, I a IV | Envolvimento ativo de conselho e diretoria: padrões éticos, cultura de controle, estrutura organizacional adequada, recursos suficientes e independentes | Sim | Sim | Sim | Todas |\n| A46 | Art. 8º, I a IV e parágrafo único | Responsabilidade do conselho (ou da diretoria, se não houver conselho) por identificação, medição, monitoramento e controle de riscos, correção tempestiva de falhas, monitoramento da eficácia e conformidade com a norma | Sim | Sim (redação da 368/2024) | Sim | Todas; a maioria das fintechs não tem conselho e cai no parágrafo único |\n| A47 | Art. 9º, I e II | Responsabilidade da diretoria: implementar diretrizes aprovadas e monitorar adequação e eficácia | Sim | Sim (redação da 368/2024) | Sim | Todas |\n| A48 | Art. 10 e parágrafo único | Designação perante o BCB de diretor responsável, que pode acumular funções sem conflito de interesses | Sim, exigível desde 1º/1/2023 (art. 13, I) | Sim, exigível desde 1º/1/2024 (art. 13, I) | Sim | Todas; para IP a data é um ano posterior |\n| A49 | Art. 11, I | Poder do BCB de determinar controles adicionais quando constatar inadequação | Sim | Sim (redação da 368/2024) | Sim | Todas |\n| A50 | Art. 11, II | Segunda faculdade do BCB | Baixar normas e adotar medidas para cumprimento da resolução | Imputar limites operacionais mais restritivos a quem descumprir a determinação de controles adicionais no prazo | Igual à coluna IP | Diferença real: a sanção de limite operacional só existe no regime da 260 |\n| A51 | Art. 12 | Revogações | Res. 2.554/1998, 3.056/2002 e 4.390/2014 | Circulares 3.078/2002 e 3.856/2017 e inciso III do art. 25 da Res. BCB 80/2021 | Igual à coluna IP | Mostra a costura: a 80 remetia à 2.554; a 4.968 revogou a 2.554; a 260 fechou o vácuo |\n| A52 | Art. 13 | Vigência | 1º/1/2022 (geral) e 1º/1/2023 (art. 10) | 1º/1/2023 (geral) e 1º/1/2024 (art. 10) | Igual à coluna IP; para corretoras, DTVM e câmbio os efeitos começam em 1º/3/2024 (368/2024); para VASP, na data de publicação da 552 (5/3/2026) | Linha de tempo para o diagnóstico |\n\n## Bloco B — Sistemas conexos: os pares CMN (instituição financeira) × BCB (instituição de pagamento e demais)\n\nLido em fonte primária em 29/10/2026 (fichas de cada norma linkadas). A Res. BCB 552/2026 inseriu as VASPs em nove normas do BCB; a tabela abaixo mostra cada sistema de controle conexo, a norma de cada lado e o dispositivo da 4.968/260 que o pressupõe. Todas as normas do lado BCB alcançam IP, consórcio, corretora, DTVM, câmbio e VASP, salvo indicação.\n\n| Nº | Sistema de controle | Pressuposto em (4.968 = 260) | IF — norma CMN | IP e demais — norma BCB | Diferença que importa | Fintech envolvida |\n|---|---|---|---|---|---|---|\n| B1 | Sistema de controles internos | — | Res. CMN 4.968/2021 ([[cmn-res-4968-2021]]) | Res. BCB 260/2022 ([[bcb-res-260-2022]]), VASP desde 5/3/2026 pela 552 | Ver Bloco A (linhas A37, A48, A50) | Ver Bloco A |\n| B2 | Estrutura de gerenciamento de riscos (define e controla o risco operacional, inclusive fraude interna e externa) | Art. 5º, II (identificação e avaliação de riscos) e V, d (modelos de gestão de riscos) | Res. CMN 4.557/2017 ([[cmn-res-4557-2017]]): estrutura completa para S1 a S4 (arts. 5º a 60); estrutura simplificada para S5 (arts. 61 a 67) | Depende da classificação da Res. BCB 436/2024 ([[bcb-res-436-2024]]): Tipo 2 (IP singular ou grupo só de IPs) → Res. BCB 198/2022, arts. 12 a 27 ([[bcb-res-198-2022]]); Tipo 3 S2 a S4 (IP que lidera grupo com IF; corretora, DTVM, câmbio e VASP grandes) → Res. BCB 265/2022 ([[bcb-res-265-2022]]); Tipo 3 S5 optante → Res. BCB 201/2022, arts. 19 a 37 ([[bcb-res-201-2022]]). Consórcio fora da 436 | A lista de controles antifraude é muito mais longa para IP (Res. 198, art. 15, vinte incisos; Res. 265, art. 35, §1º; Res. 201, art. 23, §3º) do que para IF pequena (4.557, art. 61, genérico). Ver Bloco E | SCD/SEP/banco → 4.557; IP pura e grupos de IPs → 198; fintech híbrida (IP + SCD), VASP, corretora digital → 265 ou 201 |\n| B3 | Política de conformidade (compliance) | Art. 3º, III (objetivo de conformidade) e art. 5º, III, a (políticas e verificação de cumprimento) | Res. CMN 4.595/2017 ([[cmn-res-4595-2017]]); exclui IP e consórcio no art. 1º, parágrafo único | Res. BCB 65/2021 ([[bcb-res-65-2021]]); art. 2º, §2º (redação da 552) exige gestão integrada do risco de conformidade | Conteúdo mínimo idêntico (art. 5º, I a IX, nas duas). Art. 8º (remuneração) revogado só na 65 pela Res. BCB 432/2024 | Todas as autorizadas |\n| B4 | Auditoria interna (avalia o sistema de controles internos) | Art. 5º, V, b (avaliações periódicas pela auditoria interna) e art. 6º, parágrafo único, I (relatório anual às auditorias) | Res. CMN 4.879/2020 ([[cmn-res-4879-2020]]); art. 13 manda auditar a estrutura de riscos da 4.557 | Res. BCB 93/2021 ([[bcb-res-93-2021]]); art. 11 lista o que avaliar; art. 17 lista os documentos obrigatórios | Estrutura espelhada; a 4.879 exclui também cooperativas S5 de sistemas de dois ou três níveis. Ambas vedam ao auditor interno implementar controles (regra de segregação do produto) | Todas as autorizadas |\n| B5 | Política de segurança cibernética e contratação de nuvem e processamento de dados | Art. 5º, IV, e e g (sistemas de informação seguros; testes periódicos de segurança) | Res. CMN 4.893/2021 ([[cmn-res-4893-2021]], stub) | Res. BCB 85/2021 ([[bcb-res-85-2021]]); consórcio não consta do art. 1º | Ver ficha da 85 | Todas |\n| B6 | Compartilhamento de dados e informações sobre indícios de fraude | Art. 5º, II, d e III, k (fraude) | Res. Conjunta CMN/BCB 6/2023 ([[resolucao-conjunta-6-2023]]), ato conjunto que alcança IF e IP | Res. BCB 343/2023 ([[bcb-res-343-2023]]) regulamenta a Res. Conjunta 6; VASP no art. 2º, V, com adequação até 30/10/2026 (552) e bets até 1º/12/2026 (569) | Único sistema em que o ato de base é conjunto e vale igual para os dois lados | Todas |\n| B7 | Política de qualidade das informações prestadas ao BCB | Art. 5º, IV, i (revogado na 4.968; vigente na 260) | Res. Conjunta CMN/BCB 18/2025 ([[resolucao-conjunta-18-2025]]): adequação até 31/12/2026 | A mesma Res. Conjunta 18, cumulada com o art. 5º, IV, i, da 260 | Ver A37 | Todas |\n| B8 | Ouvidoria | — (não é pressuposta nas normas de controles internos; entra pela 552) | Res. CMN 4.860/2020 (não lida nesta rodada; conferir) | Res. BCB 28/2020 (arts. 1º e 2º da 552); só para quem tem cliente pessoa natural, empresário individual, ME ou EPP | — | Fintech com cliente PF ou pequeno negócio |\n| B9 | Relacionamento com clientes e usuários | — (idem) | Res. CMN 4.949/2021 (não lida; conferir) | Res. BCB 155/2021 (arts. 10 e 11 da 552) | — | Todas com usuário final |\n| B10 | Débito em conta de pagamento pré-paga | — (idem) | Res. BCB 51/2020, art. 1º reescrito pela 552 para alcançar \"instituições financeiras e demais autorizadas\" detentoras de conta pré-paga | A mesma Res. BCB 51 | Única linha em que a 552 alcança IF pela letra | EME, banco digital e SCD com conta pré-paga |\n| B11 | Política de remuneração de administradores | — (idem) | Res. CMN 3.921/2010 (não lida; conferir) | Res. BCB 432/2024 (arts. 15 e 16 da 552); revogou os artigos de remuneração da 65 e da 93 | — | Todas |\n| B12 | Auditoria independente | Art. 6º, parágrafo único, I (relatório anual à auditoria externa) | Res. CMN 4.910/2021 (ementa confirmada na API: auditoria independente; não é a norma de comitê de auditoria, como registrado antes por engano) | Não identificada nesta rodada | — | Todas |\n| B13 | Comitê de auditoria | Referido no art. 3º, §2º, da Res. 93 e da 4.879 | Norma CMN não identificada nesta rodada | Norma BCB não identificada nesta rodada | Lacuna aberta | Instituições acima dos parâmetros da norma própria |\n| B14 | Política de Responsabilidade Social, Ambiental e Climática (PRSAC) | Art. 5º, III, i (atividades ilícitas, riscos sociais, ambientais e climáticos) | Res. CMN 4.945/2021 (ementa confirmada na API; texto não lido) | Equivalente BCB não identificado nesta rodada; a Res. 265, art. 5º, §4º, exige compatibilidade com a PRSAC | — | Todas |\n\n## Bloco C — O que a Res. BCB 80/2021 define sobre perímetro e governança\n\n| Nº | Dispositivo | Conteúdo | Efeito sobre o regime de controles internos | Fintech envolvida |\n|---|---|---|---|---|\n| C1 | Art. 2º, I e II (redação da 296/2023) | A 80 não se aplica a IP que participe só de arranjo de propósito limitado, nem a IP que preste serviço exclusivamente em programa de benefícios por relação de trabalho ou auxílio-alimentação | Essas IPs não são \"autorizadas a funcionar\", logo não entram na 260 (art. 1º) nem na 4.968 (não são IF) | Cartão de benefícios, vale-refeição, cartão de loja fechado, programa de incentivo |\n| C2 | Art. 3º, I a IV e §3º | Quatro modalidades: emissor de moeda eletrônica, emissor de instrumento pós-pago, credenciador, iniciador de transação de pagamento; uma IP pode acumular modalidades | Define quem é \"instituição de pagamento\" para o art. 1º, II, da 260 | Conta transacional, pré-pago, cartão de crédito sem banco, adquirência, ITP de Open Finance |\n| C3 | Art. 4º, parágrafo único | ITP que presta serviço de nuvem ou processamento a instituições autorizadas deve observar as normas de segurança cibernética, PLD e Open Finance | Mostra que o ITP infraestrutural responde pelos sistemas conexos do Bloco B mesmo fora da conta | ITP, BaaS de iniciação |\n| C4 | Art. 4º-A (incluído pela 407/2024) | Atividade especial: iniciação sem redirecionamento no Open Finance, com comunicação prévia de 90 dias ao BCB | Nova atividade dentro da modalidade ITP; mesmo regime da 260 | ITP e participantes do Open Finance |\n| C5 | Art. 6º e parágrafo único | Política de governança aprovada pelo conselho ou diretoria, com atribuições definidas, documentada e revisada a cada dois anos, à disposição do BCB | Controle de governança próprio da IP, anterior e complementar ao sistema de controles internos da 260; não existe artigo equivalente na 4.968 | Todas as IPs |\n| C6 | Art. 9º (redação da 494/2025) e parágrafo único | Toda IP deve solicitar autorização ao BCB antes de iniciar a prestação de serviço de pagamento, incluindo todas as modalidades pretendidas; arts. 10 a 13 (limiares de volume) revogados | Acabou a faixa de IP que operava sem autorização por estar abaixo do limiar; a 260 passa a alcançar, com a autorização, toda IP nova. Janela de regularização das pré-existentes em [[bcb-res-494-498-2025]] | Toda fintech de pagamento, inclusive a pequena |\n| C7 | Art. 16, I a VII | Bancos comerciais e múltiplos, caixas, SCFI, cooperativas, SCD, SEP, SCM, DTVM e corretoras podem prestar serviços de pagamento nas modalidades listadas sem autorização adicional | A IF que presta serviço de pagamento continua IF: seu sistema de controles internos é o da 4.968 (ou, para DTVM e corretora, o da 260 desde a 368/2024), não vira IP por prestar o serviço | SCD e SEP com conta de pagamento; banco digital com conta e cartão |\n| C8 | Art. 25, III (revogado pela 260 desde 1º/1/2023) | Remissão das IPs à norma de controles internos das IFs | Remissão extinta; o regime das IPs é exclusivamente a 260 | Todas as IPs |\n| C9 | Art. 25-A (incluído pela 407/2024) | Até norma específica, aplicam-se às IPs as medidas prudenciais preventivas vigentes | Fora do sistema de controles internos, mas é o gancho para intervenção do BCB | Todas as IPs |\n\n## Bloco D — Fintechs fora das quatro normas\n\nNenhuma destas quatro normas alcança a entidade abaixo por força própria. Isso não significa ausência de regra: em quase todos os casos a obrigação recai sobre a instituição autorizada que lhe dá suporte, e é ela quem responde ao BCB pela falha do parceiro.\n\n| Nº | Tipo de fintech | Por que fica fora | Quem carrega a obrigação de controles internos | Base da exclusão |\n|---|---|---|---|---|\n| D1 | IP em arranjo de propósito limitado (cartão fechado de rede de lojas, benefícios de uso restrito) | Excluída da 80 (art. 2º, I); sem autorização, não entra na 260; não é IF | Ninguém, dentro destas normas | Res. 80, art. 2º, I |\n| D2 | IP exclusiva de benefícios trabalhistas e auxílio-alimentação | Excluída da 80 (art. 2º, II, a e b, redação da 296/2023) | Ninguém, dentro destas normas | Res. 80, art. 2º, II |\n| D3 | Embedded finance e marketplace que oferece conta, cartão ou crédito sob licença de parceiro | Não é instituição autorizada; a 260 e a 4.968 só alcançam autorizadas | O parceiro licenciado (IP sob a 260 ou IF sob a 4.968), inclusive pelo art. 5º, II, a, que manda avaliar fatores externos e o grupo | Res. 260, art. 1º; Res. CMN 4.968, art. 1º |\n| D4 | BaaS e provedor de infraestrutura sem licença própria (inclusive PSTI) | Não é IP nem IF; o PSTI tem regime próprio de credenciamento | A instituição contratante, pelo art. 5º, IV, e e h (sistemas de informação e contingência com terceiros); o PSTI responde à Res. 498/2025, fora desta tabela | Res. 260 e 4.968, art. 1º; ver [[bcb-res-494-498-2025]] |\n| D5 | Subadquirente e facilitador de pagamento que não detém autorização como credenciador | A 80 só lista credenciador (art. 3º, III); o subadquirente não é modalidade de IP e, sem autorização, não entra na 260 | A credenciadora autorizada que o contrata | Res. 80, art. 3º; status regulatório do subadquirente na regulação de arranjos: a confirmar fora desta tabela |\n| D6 | Correspondente no país e plataforma de originação ou cobrança que atua por conta de IF | Não é instituição autorizada | A IF contratante, sob a 4.968 | Res. CMN 4.968, art. 1º |\n| D7 | IP pré-existente ainda não autorizada, dentro da janela de regularização da 494/2025 | Até a autorização, não é \"autorizada a funcionar\" para o art. 1º da 260 | Transitoriamente ninguém, dentro destas normas; a exposição é de operar sem autorização | Res. 80, art. 9º (494/2025) |\n| D8 | Software financeiro que não detém fundos nem conta (gestão financeira, conciliação, ERP, scoring, antifraude como fornecedor) | Não presta serviço de pagamento nem opera como IF | A instituição cliente, pelo art. 5º, IV, e e h | Res. 80, art. 3º (não se enquadra em modalidade) |\n| D9 | Fintech de crédito que não é SCD nem SEP (opera via parceiro ou como correspondente) | Não é IF autorizada | O parceiro IF, sob a 4.968 | Res. CMN 4.968, art. 1º |\n\n## Bloco E — Mapa de riscos: qual norma de gerenciamento de riscos vale para cada fintech\n\nClassificação da Res. BCB 436/2024 (sucessora da 197/2022, revogada em 1º/1/2025), lida em fonte primária.\n\n| Nº | Classificação | Quem cai aqui | Norma de riscos | Controles antifraude e de continuidade exigidos | Governança exigida |\n|---|---|---|---|---|---|\n| E1 | Tipo 1, S1 a S4 | Bancos, financeiras, cooperativas e demais IF acima do S5 (art. 2º, I, da 436; segmentação da Res. CMN 4.553) | Res. CMN 4.557/2017, arts. 5º a 60 | Art. 33 (terceirização, governança de TI, sistemas seguros contra ataques, base de perdas com causa raiz, cenários) | Unidade de riscos, CRO, comitê de riscos, diretor de capital |\n| E2 | Tipo 1, S5 | IF de porte inferior a 0,1% do PIB que optou pela metodologia facultativa simplificada de capital (Res. CMN 4.553, art. 2º, §5º); sem a opção, a SCD ou SEP pequena é S4 e cai em E1 com as dispensas do art. 60 da 4.557 | Res. CMN 4.557/2017, arts. 61 a 67 | Só a cláusula geral do art. 61 (identificar, mensurar, avaliar, monitorar, reportar, controlar e mitigar riscos relevantes; políticas avaliadas pela administração; auditoria interna) | Diretor responsável (art. 62) |\n| E3 | Tipo 2 | IP singular e conglomerado liderado por IP formado só por IPs (autorizadas ou não), securitizadoras, factoring, holdings e fundos (art. 2º, II, da 436) | Res. BCB 198/2022, arts. 12 a 27 | Art. 15: vinte incisos (plano de contingência; proteção de dados e redes; rastreio de acesso; monitoramento de falhas e reclamações; revisão pós-falha; testes; segregação de ambientes; identificação e autenticação; rastreabilidade; monitoramento e bloqueio de suspeitas; filtros de alto risco; notificação; verificação pelo usuário; terceirização; subcredenciador; falhas de iniciação). Base de perdas só acima de 0,1% do PIB (art. 21) | Diretor de riscos (art. 23); conselho ou diretoria (arts. 24 e 25) |\n| E4 | Tipo 3, S2 a S4 | Conglomerado liderado por IP com IF dentro (fintech híbrida grande); corretora, DTVM, câmbio e VASP acima do S5 (art. 2º, III, da 436) | Res. BCB 265/2022 | Art. 18 (continuidade com análise de impacto e testes); art. 35 e §1º (controles de TI e os oito de pagamento); base de perdas (art. 36); S3 e S4 têm dispensas (arts. 66 e 67; S4 dispensa base de perdas, cenários e comitê de riscos) | Unidade de riscos, CRO designado perante o BCB, comitê de riscos, diretor de capital (arts. 51 a 55) |\n| E5 | Tipo 3, S5 optante | Fintech híbrida pequena, VASP ou corretora digital com perfil de risco simplificado | Res. BCB 201/2022, arts. 19 a 37 | Art. 23: terceirização, TI segura, política de continuidade com plano; §3º reinsere os dezessete controles de pagamento só para quem presta serviço de pagamento | Diretor responsável (art. 35); conselho revisa políticas a cada dois anos (art. 36) |\n| E6 | Fora da 436 | Administradoras de consórcio (art. 1º, §2º) | Norma própria não lida | — | — |\n\nA assimetria que a tabela expõe: a IP pura (E3) responde a uma lista de vinte controles antifraude nominados; a SCD optante pelo S5 (E2), que concede crédito e sofre fraude de contratação, responde a uma cláusula geral, e a SCD no S4 responde ao art. 33 da 4.557 com as dispensas do art. 60. Para a SCD, os controles antifraude concretos vêm da Res. CMN 4.968 (art. 5º, II, d e III, k), da Res. CMN 4.893 e da Res. Conjunta 6/2023, não da norma de riscos.\n\n## Lacunas\n\n- Lidas em fonte primária em 29/10/2026: Res. CMN 4.557, 4.595 e 4.879; Res. BCB 65, 93, 198, 201, 265 e 436 (fichas próprias). Res. CMN 4.553 lida em 29/10/2026 (PDF oficial). Ainda não lidas: Res. CMN 4.860, 4.949, 3.921, 4.910, 4.945 e 4.893 (stub); Res. BCB 28, 51, 155, 432, 447, 580; norma de comitê de auditoria dos dois lados.\n- A Res. BCB 197/2022, citada em fichas e no `tipos-fintech.json`, está revogada desde 1º/1/2025; substituir por Res. BCB 436/2024.\n- O status regulatório do subadquirente (D5) depende da regulação de arranjos de pagamento, não lida aqui.\n- A 4.968 consolidada mostra as alterações da Res. CMN 5.178/2024 (art. 5º, IV, g e i) e a revogação da alínea i pela Res. Conjunta 18/2025; a ficha [[cmn-res-4968-2021]] precisa refletir isso.\n- O cronograma de autorização das IPs pré-existentes (D7) está na ficha [[bcb-res-494-498-2025]]; a janela de 1º a 31/5/2026 já passou, de modo que IP ainda sem pedido protocolado está em situação irregular, não transitória.\n\n## Relações\n\n[[matriz-controles-internos]] · [[cmn-res-4968-2021]] · [[bcb-res-80-2021]] · [[bcb-res-260-2022]] · [[bcb-res-552-2026]] · [[bcb-res-85-2021]] · [[bcb-res-343-2023]] · [[bcb-res-494-498-2025]] · [[resolucao-conjunta-18-2025]] · [[resolucao-conjunta-6-2023]] · [[cmn-res-4557-2017]] · [[cmn-res-4595-2017]] · [[cmn-res-4879-2020]] · [[bcb-res-65-2021]] · [[bcb-res-93-2021]] · [[bcb-res-198-2022]] · [[bcb-res-201-2022]] · [[bcb-res-265-2022]] · [[bcb-res-436-2024]] · [[cmn-res-4553-2017]]\n\n## Fichamento (operador, 2026-10-29)\n\n### Aplicação prática no ciclo Rastro\n\nIMPORTANTE! trata-se de escopo específico para a prontidão e diagnóstico, pois define taxativamente os procedimentos de controles internos das instituições financeiras e de pagamento.\n\n### Lacunas\n\nNenhuma apontada no fichamento.\n"}, {"info": {"id": "mapa-controles-fintech", "titulo": "Mapa de controles internos por tipo de fintech (dados da aba 'Mapa por f
