2026).\n- **REsp 2.222.059 e REsp 2.229.519** (falsa central COM falha de detecção; alcança instituições de pagamento) — 3ª Turma, rel. Min. Ricardo Villas Bôas Cueva, unânime. Falha na proteção de dados ou na identificação de transações fora do perfil → responsabilidade. O acórdão invoca expressamente o **art. 7º da Lei 12.865/2013** para estender o dever de segurança às instituições de pagamento, e manda o sistema considerar valor, horário, local, intervalo entre transações e meio utilizado. Precedente central sobre dever de monitoramento por perfil. CONFIRMADO em fonte oficial (reverificado 30/07/2026): https://www.stj.jus.br/sites/portalp/Paginas/Comunicacao/Noticias/2025/21102025-Bancos-e-instituicoes-de-pagamento-devem-indenizar-clientes-por-falhas-que-viabilizam-golpe-da-falsa-central.aspx — **ATENÇÃO à data**: a notícia oficial é de 21/10/2025; a data de julgamento de 07/10/2025 vinha de matéria da Conjur (08/10/2025) e NÃO foi reconfirmada em fonte oficial. Conferir no acórdão antes de citar dia e mês em peça.\n- **REsp 2.220.333** (falha de segurança afasta culpa concorrente) — 3ª Turma, rel. Min. Ricardo Villas Bôas Cueva, unânime. Caso concreto: vítima induzida a instalar aplicativo sob pretexto de \"regularizar a segurança da conta\"; empréstimo fraudulento de R$ 45 mil e prejuízo material de R$ 55.046,84, em operações incompatíveis com o perfil. Vítima induzida não assume \"risco consciente\"; havendo falha da instituição, reparação integral, sem culpa concorrente. CONFIRMADO em fonte oficial (reverificado 30/07/2026): https://www.stj.jus.br/sites/portalp/Paginas/Comunicacao/Noticias/2025/13112025-Falha-de-seguranca-do-banco-afasta-alegacao-de-culpa-concorrente-do-consumidor-em-caso-de-golpe.aspx — **CORREÇÃO: a data \"07/10/2025, mesma sessão\" registrada aqui até 30/07/2026 estava ERRADA.** A notícia oficial é de 13/11/2025 e não informa a data de julgamento. NAO_CONFIRMADO quanto ao dia; usar \"3ª Turma, rel. Villas Bôas Cueva\" e conferir o acórdão antes de datar em peça.\n\n## Não confirmados — NÃO usar sem checagem no SCON\n\n- REsp 2.222.137/SP (suposto caso de banco recebedor sem KYC, 07/10/2025): apenas em resumo de busca; NÃO CONFIRMADO.\n- REsp 2.082.281/SP (21/11/2023): número não confirmado em nenhuma fonte. NÃO CONFIRMADO.\n\n## Aplicação prática no ciclo Rastro\n\nProntidão: os precedentes do Polo 2 definem O QUE documentar antes do incidente (perfil transacional, motor de atípicas, KYC do onboarding, guarda de dados) — cada item vira pergunta de benchmark/IPR-72. Recuperação/defesa: a contestação-tipo argumenta pela chave de leitura acima — ausência de falha autônoma provada com a trilha das fases 1-2; contra bancos recebedores de contas-laranja, o REsp 2.124.423 delimita o que exigir deles (e o que nos exigirão).\n\n## Lacunas\n\n- Datas de DJe dos acórdãos de 2025-2026: conferir no SCON antes de citar em peça (vários confirmados por notícia oficial/veículo, não pelo inteiro teor).\n- Divergência 3ª × 4ª Turmas: monitorar afetação pela 2ª Seção (radar Hermes + monitor).\n- Fichas individuais por acórdão: desmembrar deste dossiê quando a minuta exigir profundidade em precedente específico.\n\n## Relações\n\n[[stj-sumula-479]] · [[hub-jurisprudencia-consumerista]] · [[hub-catalogo-medidas]] · [[bcb-res-493-2025]] · [[anpd-res-cd-15-2024]]\n"}, {"info": {"id": "stj-sumula-479", "titulo": "Súmula 479 do STJ (fortuito interno)", "orgao": "STJ", "tipo": "sumula", "status": "fichado", "data_publicacao": "2012-08-01", "tags": "[jurisprudencia, fortuito-interno, responsabilidade-objetiva, consumidor]", "grupo": "jurisprudencia", "caminho": "jurisprudencia/stj-sumula-479.md", "quando": "2026-07-23"}, "meta": {"id": "stj-sumula-479", "tipo": "sumula", "titulo": "Súmula 479 do STJ (fortuito interno)", "orgao": "STJ", "data_publicacao": "2012-08-01", "vigencia": "", "altera": "[]", "fase_rastro": "[recuperacao_defesa, prontidao]", "conexao_comercial": "[adversarial, benchmark]", "fonte_primaria": "https://processo.stj.jus.br/jurisprudencia/externo/informativo/?acao=pesquisar&sumula=479", "status": "fichado", "tags": "[jurisprudencia, fortuito-interno, responsabilidade-objetiva, consumidor]", "confidencial": "false"}, "corpo": "\n# Súmula 479 do STJ\n\n## Enunciado\n\nEnunciado literal: \"As instituições financeiras respondem objetivamente pelos danos gerados por fortuito interno relativo a fraudes e delitos praticados por terceiros no âmbito de operações bancárias.\" Segunda Seção, julgada em 27/06/2012, publicada no DJe de 1º/08/2012 (também RSTJ vol. 227, p. 937).\n\n## Alcance\n\nConsagra a responsabilidade objetiva das instituições financeiras por fraudes que constituam fortuito interno — risco inerente à atividade bancária —, com base no CDC, art. 14 (precedentes de origem, ex.: REsp 1.197.929/PR). A fronteira operacional do litígio contemporâneo é a distinção entre fortuito interno (falha de segurança do fornecedor) e fortuito externo/culpa exclusiva da vítima (CDC, art. 14, §3º), especialmente em golpes de engenharia social via Pix.\n\n## Aplicação prática no ciclo Rastro\n\nRecuperação/defesa: é a moldura de imputação de toda a onda consumerista pós-incidente; a tese de defesa gira em torno de deslocar o caso para o fortuito externo ou para a culpa exclusiva da vítima/terceiro, com prova técnica de que os controles exigidos (MED 2.0, Res. 85/538) foram cumpridos. Prontidão: quanto melhor a instituição documenta seus controles antes do incidente, mais viável a tese de fortuito externo depois — argumento comercial central do benchmark.\n\n## Conexão comercial\n\nAlimenta o entregável adversarial (dossiê de jurisprudência da onda consumerista) e sustenta o discurso de venda do benchmark (prevenção documentada como insumo de defesa futura).\n\n## Lacunas\n\n- Referência legislativa detalhada da súmula: o núcleo (CDC, art. 14) é pacífico nos precedentes de origem; a lista exata de dispositivos indicada pelo STJ inclui menção à Lei nº 4.595/1964, mas o detalhamento por artigo é NAO_CONFIRMADO nas páginas oficiais consultadas.\n- Jurisprudência posterior delimitando fortuito interno vs. externo em golpes via Pix/engenharia social (acórdãos com número de processo): mapeamento pendente — é o próximo passo do dossiê. Ver [[hub-jurisprudencia-consumerista]].\n\n## Relações\n\n[[hub-jurisprudencia-consumerista]] · [[bcb-res-493-2025]] · [[hub-litigancia-predatoria]]\n"}, {"info": {"id": "stj-tema-1198", "titulo": "STJ, Tema Repetitivo 1198 (litigância predatória — emenda da inicial)", "orgao": "STJ", "tipo": "acordao", "status": "fichado", "data_publicacao": "2025-03-13", "tags": "[jurisprudencia, litigancia-predatoria, repetitivo, contencioso]", "grupo": "jurisprudencia", "caminho": "jurisprudencia/stj-tema-1198.md", "quando": "2026-07-07"}, "meta": {"id": "stj-tema-1198", "tipo": "acordao", "titulo": "STJ, Tema Repetitivo 1198 (litigância predatória — emenda da inicial)", "orgao": "STJ", "data_publicacao": "2025-03-13", "vigencia": "", "altera": "[]", "fase_rastro": "[recuperacao_defesa]", "conexao_comercial": "[adversarial]", "fonte_primaria": "https://www.stj.jus.br/sites/portalp/Paginas/Comunicacao/Noticias/2025/20032025-Corte-Especial-decide-em-repetitivo-que-juiz-pode-exigir-documentos-para-coibir-litigancia-abusiva.aspx", "status": "fichado", "tags": "[jurisprudencia, litigancia-predatoria, repetitivo, contencioso]", "confidencial": "false"}, "corpo": "\n# STJ — Tema Repetitivo 1198\n\n## Identificação e tese\n\nTema 1198/STJ, REsp 2.021.665/MS (oriundo de IRDR do TJMS), rel. Min. Moura Ribeiro. Afetado pela Segunda Seção em 02/05/2023 (DJe 09/05/2023, Informativo 774); mérito julgado pela Corte Especial em 13/03/2025. Tese firmada: \"Constatados indícios de litigância abusiva, o juiz pode exigir de modo fundamentado e com observância à razoabilidade do caso concreto a emenda da petição inicial a fim de demonstrar o interesse de agir e a autenticidade da postulação, respeitadas as regras de distribuição do ônus da prova.\"\n\n## Alcance\n\nAutoriza o juiz, diante de indícios de litigância predatória, a exigir na emenda documentos que lastreiem minimamente a pretensão (procuração atualizada, declarações de pobreza e residência, contrato, extratos). Vedada a extinção automática: assegura-se oportunidade de emenda. É repetitivo — vincula as instâncias ordinárias (CPC, art. 927, III).\n\n## Aplicação prática no ciclo Rastro\n\nRecuperação/defesa: é a alavanca processual central contra a onda predatória pós-incidente — permite requerer, caso a caso e com indícios documentados (petições clonadas, procurações antigas/viciadas, padrões de distribuição), que o juízo condicione o prosseguimento à comprovação de autenticidade. A triagem de massa do escritório (com IA governada — [[cnj-res-615-2025]]) produz exatamente os indícios que fundamentam o requerimento.\n\n## Lacunas\n\n- Data e página de publicação do acórdão no DJe: conferir no acórdão oficial antes de citar em peça (a sessão de julgamento foi 13/03/2025; a notícia oficial é de 20/03/2025).\n\n## Relações\n\n[[hub-litigancia-predatoria]] · [[cnj-rec-159-2024]] · [[stj-sumula-479]]\n"}, {"info": {"id": "basilisk-pericia-digital", "titulo": "BASILISK — perícia digital de integridade processual (frente do delivery)", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "2026-08-17", "tags": "[pericia-digital, litigancia-predatoria, prova, tema-1198]", "grupo": "conceitos", "caminho": "conceitos/basilisk-pericia-digital.md", "quando": "2026-08-17"}, "meta": {"id": "basilisk-pericia-digital", "tipo": "conceito", "titulo": "BASILISK — perícia digital de integridade processual (frente do delivery)", "orgao": "", "data_publicacao": "2026-08-17", "fase_rastro": "[recuperacao_defesa, prontidao]", "conexao_comercial": "[retainer, adversarial]", "status": "fichado", "tags": "[pericia-digital, litigancia-predatoria, prova, tema-1198]", "confidencial": "false"}, "corpo": "\n# BASILISK — perícia digital de integridade processual\n\nBancada de perícia digital do escritório, incorporada ao delivery do Plano de Contingência em 17/08/2026. Este é o registro público, em linguagem de cliente; a mecânica interna fica no documento confidencial do produto.\n\n## O que faz\n\nQuatro funções, todas produzindo laudo com cadeia de custódia criptográfica e ratificação humana obrigatória:\n\n1. **Integridade de documentos e petições.** Verificação técnica de autenticidade e de manipulação em peças e anexos — o extrato adulterado, a procuração montada, o comprovante editado.\n2. **Comandos ocultos em peças processuais.** Detecção de instruções embutidas em petições para manipular ferramentas automatizadas de análise — vetor já registrado publicamente pelo TJSP em 2026.\n3. **Citações sem lastro.** Conferência de precedentes e doutrina citados contra as bases oficiais, apontando referências inexistentes ou distorcidas.\n4. **Padrões de rede em litigância seriada.** Análise do conjunto de ações — partes, patronos, documentos, tempos e comarcas — para identificar estrutura de carteira incompatível com litígio espontâneo.\n\n## O que entrega, e o que não afirma\n\nO produto é **indício ratificável com fundamentação de caso concreto**, apto a embasar pedido de emenda da inicial (Tema 1198/STJ) e diligências — nunca veredicto automático e nunca acusação em bloco, que a jurisprudência pune. Toda análise passa por ratificação humana, na linha da Res. CNJ 615/2025.\n\nO método está sob **validação empírica pré-registrada**, com critérios de sucesso congelados antes do teste. Até a conclusão, nenhum número de desempenho é afirmado em material público. A honestidade metodológica é parte do produto: laudo que promete menos e prova mais.\n\n## Onde entra no Plano de Contingência\n\n- **Onda consumerista pós-incidente:** triagem da massa separando vítima legítima de padrão abusivo, com laudo por caso (ver a medida correspondente na matriz de incidentes).\n- **Prova e cadeia de custódia (eixo 7 do diagnóstico):** selos criptográficos e trilha auditável no dossiê probatório.\n- **Defesa documental:** suporte pericial nos cenários de fraude documental e contratação contestada.\n\n## Contratação\n\nIncluído no nível Integral do Plano de Contingência; disponível como laudo avulso por caso para não assinantes.\n\n## Relações\n\n[[stj-tema-1198]] · [[cnj-res-615-2025]] · [[hub-litigancia-predatoria]] · [[plano-de-contingencia]]\n"}, {"info": {"id": "camadas-da-fraude", "titulo": "As três camadas da fraude — do incidente à fraude-como-negócio", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "2026-07-23", "tags": "[conceito, fraude, deep-web, insider, crime-organizado, inteligencia, war-room]", "grupo": "conceitos", "caminho": "conceitos/camadas-da-fraude.md", "quando": "2026-07-23"}, "meta": {"id": "camadas-da-fraude", "tipo": "conceito", "titulo": "As três camadas da fraude — do incidente à fraude-como-negócio", "orgao": "", "data_publicacao": "2026-07-23", "status": "fichado", "tags": "[conceito, fraude, deep-web, insider, crime-organizado, inteligencia, war-room]", "confidencial": "false"}, "corpo": "\n# As três camadas da fraude\n\nModelo analítico para desenhar a resposta do Rastro além do incidente visível. A maior parte do mercado (e a versão inicial do próprio war room) trata apenas a camada 1. As camadas 2 e 3 são onde o crime realmente se organiza — e onde entram os parceiros de tecnologia, sob coordenação jurídica.\n\n## Camada 1 — a fraude do incidente\n\nO golpe aconteceu, o dinheiro saiu, correm os relógios (MED 2.0, ANPD). É a resposta jurídico-operacional que o war room já cobre: rastreio, bloqueio, comunicação a reguladores, preservação de prova, defesa consumerista. Ver [[hub-catalogo-medidas]] e [[estudo-72h-aprofundamento]]. É reativa e visível — começa quando a vítima reclama.\n\n## Camada 2 — a fraude da origem\n\nO incidente da camada 1 quase nunca nasce na madrugada em que é detectado. Nasce semanas antes: um **vazamento de dados** (às vezes externo, às vezes **interno** — o insider, vetor confirmado no caso C&M Software), credenciais e bases cadastrais vendidas em fóruns e na **deep/dark web**, kits de golpe circulando. Quando o PSP recebe a reclamação, os dados da vítima já podem estar num mercado que a instituição não monitora.\n\nConsequência para o Rastro: a resposta madura inclui **inteligência PRÉ-incidente** — monitorar a exposição do cliente (dados à venda, menções, credenciais vazadas) antes de o golpe se consumar. Isso é capacidade técnica de threat intelligence, não jurídica; entra por parceiro especializado, coordenado pelo escritório. No insider, a apuração é simultaneamente **trabalhista + criminal + forense**, com cadeia de custódia reforçada (a prova precisa sobreviver às duas jurisdições).\n\n## Camada 3 — a fraude como estrutura de negócio (fraud-as-a-service)\n\nO adversário contemporâneo não é o \"hacker no porão\". É uma **organização com divisão de trabalho**: quem vaza, quem compra dado, quem opera o golpe, quem fornece contas-laranja, quem lava via bets e cripto. Margem alta, risco baixo — porque cada elo é substituível e o combate estatal é fragmentado (rastreio de laranja não chega ao topo da estrutura). É crime organizado com racionalidade empresarial.\n\nConsequência para o Rastro: bloquear o laranja da camada 1 não desmonta o negócio. A **atribuição** (quem é a estrutura por trás) é o que transforma resposta reativa em persecução criminal real e recuperação de ativos com alcance — território de frente criminal + inteligência + cooperação com PF, orquestrado juridicamente.\n\n## Como as três camadas mudam o war room\n\n- A frente de inteligência do catálogo sobe de \"forense pós-incidente\" para incluir **vigilância pré-incidente** e **atribuição** (ver ajuste em [[hub-catalogo-medidas]]).\n- O produto (retainer de prontidão) ganha argumento concreto: não basta responder rápido; é saber que os dados do cliente estão à venda antes de o dinheiro sair.\n- O papel do escritório é de **maestro**: coordena os parceiros técnicos (threat intel, DFIR, chain analysis), decide o que vira comunicação a regulador, notícia-crime ou ação de recuperação. A execução técnica é do parceiro; a regência e a defensabilidade jurídica são do Rastro.\n\n## Isto NÃO é um novo serviço — é o mesmo produto, com mais alcance\n\nRegra de desenho comercial: as camadas 2 e 3 NÃO viram um segundo produto (não há \"assinatura de monitoramento de deep web\" à parte). Elas são frentes do MESMO produto — \"RASTRO · Resposta a Fraudes 72h\" — e se encaixam na escada existente sem criar degrau novo:\n\n- Camada 1 (incidente) = o war room das 72h. É o núcleo do produto.\n- Camada 2 (origem/vigilância pré-incidente) = entra em ANTES (diagnóstico de prontidão) e SEMPRE (retainer): o mesmo plantão que responde ao incidente também vigia a exposição do cliente. Não é uma venda nova; é um argumento a mais para o retainer que já existe.\n- Camada 3 (atribuição/fraude-como-negócio) = entra em DEPOIS (recuperação & defesa) e reforça o war room: identificar a estrutura vira persecução criminal e recuperação de ativos, dentro do caso já contratado.\n\nContinua valendo \"um comando, todas as frentes\": o cliente aciona UM número; o que muda é que esse comando agora orquestra também o parceiro técnico das camadas 2 e 3. A escada comercial (prontidão → retainer → recuperação/defesa) permanece com três degraus, não quatro.\n\n## Fronteira de core business (decisão estratégica)\n\nCamadas 2 e 3 são **capacidade técnica**, não jurídica. Absorvê-las transformaria o escritório em empresa de segurança mediana e destruiria a **independência** necessária para auditar com isenção os fornecedores do cliente. Por isso: parceria de indicação, não fusão. O Rastro coordena e responde pela camada jurídica; o parceiro fornece o músculo técnico das camadas 2 e 3.\n\n## Lacunas / pendências\n\n- Parceiro tecnológico de referência: avaliação de fornecedor concluída em 2026-07-23 — perfil e cautelas na ficha interna de parceiro (confidencial). Confirma-se que camadas 2 e 3 têm fornecedor de mercado maduro. Definir modelo (indicação recíproca vs. unidirecional) e concluir due diligence.\n- Base normativa da apuração de insider (interface trabalhista × criminal × LGPD): mapear e fichar.\n\n## Relações\n\n[[hub-catalogo-medidas]] · governança interna do projeto · [[estudo-72h-aprofundamento]] · [[dossie-pix-fortuito]] · [[bcb-res-85-2021]]\n"}, {"info": {"id": "estudo-72h-aprofundamento", "titulo": "Estudo — a estrutura das 72 horas, item por item (prazos, textos originais e explicação)", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "2026-07-09", "tags": "[estudo, war-room, 72h, prazos, aprofundamento]", "grupo": "conceitos", "caminho": "conceitos/estudo-72h-aprofundamento.md", "quando": "2026-09-28"}, "meta": {"id": "estudo-72h-aprofundamento", "tipo": "conceito", "titulo": "Estudo — a estrutura das 72 horas, item por item (prazos, textos originais e explicação)", "orgao": "", "data_publicacao": "2026-07-09", "status": "fichado", "tags": "[estudo, war-room, 72h, prazos, aprofundamento]", "confidencial": "false"}, "corpo": "\n# A estrutura das 72 horas — aprofundamento técnico\n\nDocumento de estudo. Cada item traz: o que fazer, o prazo, o **texto original** da norma (transcrito da fonte primária — Resoluções BCB obtidas do inteiro teor oficial em bcb.gov.br; LGPD do Planalto; Res. CD/ANPD 15/2024 conforme verificação no DOU de 26/04/2024), um resumo objetivo e a explicação didática. Ao final, as lacunas de verificabilidade.\n\n## Visão geral — a linha do tempo e os dois relógios\n\n| Janela | Ação central | Relógio | Fonte |\n|---|---|---|---|\n| 1ª hora | Registrar o conhecimento + acionar a recuperação de valores | O dinheiro pulveriza em minutos | Res. BCB 493/2025, art. 78-N |\n| Manhã | Teste de risco relevante + abrir o registro de incidente | 3 dias úteis começam a correr | Res. CD/ANPD 15/2024, arts. 5º e 6º |\n| Dia 1-3 | Decisão fundamentada de comunicar + preservação forense + narrativa única | Vencimento dos 3 dias úteis | LGPD, art. 48; Res. 15/2024 |\n| Semana 1+ | Preparar a defesa consumerista com a trilha probatória | A onda de processos | Súmula 479/STJ; Tema 1198/STJ |\n\nA ideia-força: correm **dois relógios paralelos** — o do dinheiro (Pix/MED, medido em minutos) e o dos dados (ANPD, medido em dias úteis). O war room existe para que nenhum dos dois estoure, e para que cada passo deixe rastro documental que vira defesa depois.\n\n---\n\n## Bloco 1 — Primeira hora\n\n### 1.1 Registrar o momento do conhecimento\n\n**O que é.** Anotar formalmente (ata, e-mail com hora, registro no sistema) QUANDO a instituição soube do incidente e, separadamente, quando soube que ele afetou dados pessoais.\n\n**Por que é a primeira ação.** O prazo de comunicação à ANPD não conta da invasão nem da reclamação do cliente — conta do conhecimento pelo controlador de que dados pessoais foram afetados (Res. CD/ANPD 15/2024, art. 6º, §1º — ver Bloco 3). Quem não registra o marco zero não consegue provar depois que comunicou no prazo. É prova que só existe se for contemporânea.\n\n**Didaticamente:** é o \"carimbo de ponto\" da crise. Sem ele, qualquer discussão futura sobre tempestividade vira palavra contra palavra — e a dúvida corre contra a instituição.\n\n### 1.2 Acionar a recuperação de valores (MED 2.0)\n\n**Texto original** (Resolução BCB nº 493/2025, alterando o regulamento do Pix — inteiro teor oficial, bcb.gov.br; DOU 29/08/2025, S.1, p. 187):\n\n> Art. 54, XII — \"recuperação de valores: procedimento de rastreamento, de bloqueio e de devolução de valores no âmbito do Pix decorrente de suspeita de fraude na transação.\"\n\n> Art. 78-N — \"O procedimento de recuperação de valores deverá ser iniciado pelo participante prestador de serviço de pagamento do usuário pagador quando houver fundada suspeita de que a transação Pix tenha sido realizada de forma fraudulenta após reclamação do usuário pagador. Parágrafo único. As regras e os procedimentos operacionais da recuperação de valores serão detalhados no Manual Operacional do DICT.\"\n\n> Art. 121 — \"A funcionalidade de recuperação de valores de que trata o art. 54, caput, inciso XII: I - poderá ser implementada facultativamente pelos participantes do Pix a partir de 23 de novembro de 2025; e II - deverá ser implementada obrigatoriamente pelos participantes do Pix nas modalidades provedor de conta transacional e liquidante especial a partir de 2 de fevereiro de 2026.\"\n\n> Art. 4º (da Resolução) — \"Esta Resolução entra em vigor na data de sua publicação produzindo efeitos: I - em 2 de fevereiro de 2026, para o art. 3º; e II - imediatos, para os demais artigos.\"\n\n**Resumo.** Dois requisitos cumulativos para instaurar: reclamação do usuário pagador + fundada suspeita de fraude. Quem instaura é o PSP do PAGADOR. Boletim de ocorrência não é requisito. Obrigatório desde 02/02/2026 para provedores de conta transacional e liquidantes especiais.\n\n> Art. 113-A (incluído pela Resolução BCB nº 546/2026) — \"Fica dispensada a instauração do processo de apuração de descumprimento a este Regulamento para os descumprimentos relacionados ao art. 121, ocorridos no período compreendido entre 2 de fevereiro de 2026 e 10 de maio de 2026.\"\n\n**Nota sobre a exposição sancionatória (2026-09-28).** A dispensa não adia a obrigação, que segue sendo de 02/02/2026; afasta apenas o processo de apuração do regulamento para os descumprimentos ocorridos na janela. Descumprimentos a partir de 11/05/2026 ficam sujeitos à apuração. O dispositivo não trata da responsabilidade perante o usuário. Fonte: [[bcb-res-546-2026]].\n\n**Explicação didática.** O MED original congelava só a primeira conta de destino; o MED 2.0 segue o dinheiro pelos saltos da cadeia de laranjas, bloqueando o que encontrar em cada conta — e a devolução é limitada ao saldo bloqueado. Tradução operacional: cada minuto de espera é dinheiro que sai do alcance. Por isso a decisão da 1ª hora não é jurídica sofisticada, é executiva: formar a \"fundada suspeita\" rápido (sinais: horário, valor, destinatário novo, sequência de transações) e documentar com hora — porque esse mesmo registro vira, meses depois, a prova de diligência na onda consumerista.\n\n**Atenção (verificabilidade).** O parágrafo único do art. 78-N remete TODO o detalhamento operacional (janelas de bloqueio, número de saltos, prazos de análise e devolução) ao Manual Operacional do DICT. A versão 8.4 do Manual foi divulgada pela IN BCB nº 752/2026 (capturada pelo monitor, status a_fichar). Antes de desenhar o playbook-modelo com prazos operacionais internos do MED, é obrigatório fichar essa IN — nenhum prazo interno do MED deve ser afirmado sem ela.\n\n---\n\n## Bloco 2 — Manhã do dia 1\n\n### 2.1 O teste do risco relevante (art. 5º)\n\n**Teor** (Res. CD/ANPD nº 15/2024, art. 5º, conforme verificação no DOU de 26/04/2024 — conferir inteiro teor ao citar em peça): o incidente deve ser comunicado quando puder acarretar risco ou dano relevante aos titulares, assim entendido o que afeta significativamente interesses e direitos fundamentais E, cumulativamente, envolva ao menos um critério objetivo: dados sensíveis; dados de crianças, adolescentes ou idosos; dados financeiros; dados de autenticação em sistemas; dados protegidos por sigilo legal, judicial ou profissional; ou dados em larga escala.\n\n**Resumo.** Teste em duas etapas cumulativas: (1) afetação significativa + (2) pelo menos um critério objetivo. Dado financeiro sozinho não dispara comunicação.\n\n**Explicação didática.** Pense num interruptor de duas chaves: as duas precisam estar ligadas. Num golpe Pix típico há quase sempre a chave 2 (dados financeiros, dados de autenticação); a análise da manhã concentra-se na chave 1 — houve incidente no ambiente do controlador? A afetação é significativa? Essa análise deve ser roteirizada (quem avalia, com que perguntas, em que documento), porque a decisão precisa nascer fundamentada por escrito — comunicar ou não comunicar são AMBAS decisões defensáveis, desde que documentadas.\n\n### 2.2 Abrir o registro de incidente\n\n**Teor** (Res. CD/ANPD 15/2024, Regulamento): obrigação de registrar TODOS os incidentes de segurança, inclusive os não comunicados, por prazo mínimo de cinco anos contado da data do registro, com conteúdo mínimo (data de conhecimento, descrição das circunstâncias, natureza dos dados, avaliação de risco, medidas adotadas).\n\n**Explicação didática.** O registro é o \"diário de bordo\" obrigatório — e a sua ausência é infração autônoma. A lógica que o cliente precisa entender: registrar não é confessar; é construir a prova da própria diligência. Registro reconstituído a posteriori a partir de logs não cumpre a norma (que exige data de conhecimento) e tem valor probatório fragilizado.\n\n---\n\n## Bloco 3 — Dias 1 a 3\n\n### 3.1 A decisão de comunicar ANPD e titulares\n\n**Texto original** (Lei nº 13.709/2018 — LGPD, art. 48, planalto.gov.br):\n\n> \"Art. 48. O controlador deverá comunicar à autoridade nacional e ao titular a ocorrência de incidente de segurança que possa acarretar risco ou dano relevante aos titulares. § 1º A comunicação será feita em prazo razoável, conforme definido pela autoridade nacional, e deverá mencionar, no mínimo: I - a descrição da natureza dos dados pessoais afetados; II - as informações sobre os titulares envolvidos; III - a indicação das medidas técnicas e de segurança utilizadas para a proteção dos dados, observados os segredos comercial e industrial; IV - os riscos relacionados ao incidente; V - os motivos da demora, no caso de a comunicação não ter sido imediata; e VI - as medidas que foram ou que serão adotadas para reverter ou mitigar os efeitos do prejuízo.\"\n\n**Teor do prazo** (Res. CD/ANPD 15/2024, art. 6º, caput e §1º, conforme verificação no DOU): \"A comunicação de incidente de segurança à ANPD deverá ser realizada pelo controlador no prazo de três dias úteis, ressalvada a existência de prazo para comunicação previsto em legislação específica\", contado \"do conhecimento pelo controlador de que o incidente afetou dados pessoais\".\n\n**Resumo.** O \"prazo razoável\" do art. 48, §1º da LGPD foi concretizado pela ANPD em três dias úteis, com termo inicial no conhecimento da afetação de dados pessoais. O §1º do art. 48 é, na prática, o checklist do conteúdo da comunicação — repare no inciso V: a própria lei prevê a justificativa de demora, mais uma razão para o registro do marco zero.\n\n**Explicação didática.** O erro clássico é contar o prazo do evento (a invasão) ou da reclamação. O termo inicial é cognitivo: quando o controlador soube que dados pessoais foram afetados. Isso protege a instituição diligente (a perícia pode revelar a afetação semanas depois — o prazo nasce ali) e pune a negligente (não investigar não suspende o relógio; a ANPD avalia a razoabilidade da apuração). Corolário: a linha do tempo da apuração deve ser documentada com o mesmo rigor do incidente.\n\n### 3.2 Preservação forense com cadeia de custódia\n\n**O que é.** Congelar as evidências digitais (logs de transação, telemetria de dispositivo, registros de acesso, imagens de sistemas) de forma que a integridade e a origem sejam demonstráveis em juízo — quem coletou, quando, como, com que hash, quem custodiou.\n\n**Base normativa.** A Res. BCB 85/2021 (na redação da Res. 538/2025) exige testes de intrusão com resultados documentados e planos de correção (art. 22-A, III — texto original: \"ter os resultados de sua execução documentados, especialmente as eventuais vulnerabilidades que forem identificadas e os planos de ação estabelecidos para suas correções\"). Para o padrão de cadeia de custódia em si, o parâmetro normativo é o CPP, arts. 158-A a 158-F (incluídos pela Lei nº 13.964/2019) — nascidos para a prova penal, usados por analogia como régua de melhor prática na prova cível/regulatória (marcar como parâmetro, conferir na minuta).\n\n**Explicação didática.** A tese de fortuito externo (Bloco 4) morre se a prova técnica for impugnável. Log sem hash, coleta sem ata, perícia sobre sistema alterado — tudo isso transforma prova em indício. Por isso o parceiro de forense entra nas primeiras horas, não na semana 2: prova digital é perecível e a coleta correta não se refaz.\n\n### 3.3 Narrativa única para reguladores\n\n**O que é.** Um documento-mestre de fatos (o que se sabe, desde quando, o que foi feito) do qual derivam TODAS as comunicações: BCB, ANPD, seguradora, clientes, imprensa. Inconsistência entre canais vira prova adversa — a comunicação à ANPD que contradiz o aviso de sinistro à seguradora é presente para o autor da ação.\n\n**Atenção (verificabilidade).** A obrigação e o prazo de comunicação de incidente relevante AO BCB decorrem da Res. BCB 85/2021 consolidada, ainda não fichada — NAO_CONFIRMADO neste documento. Fichar a norma-base antes de fixar esse item no playbook.\n\n---\n\n## Bloco 4 — Semana 1 em diante\n\n### 4.1 A moldura: Súmula 479 e a chave interno × externo\n\n**Texto original** (STJ, Segunda Seção, j. 27/06/2012, DJe 1º/08/2012): \"As instituições financeiras respondem objetivamente pelos danos gerados por fortuito interno relativo a fraudes e delitos praticados por terceiros no âmbito de operações bancárias.\"\n\n**Explicação didática.** Responsabilidade objetiva significa: não se discute culpa, discute-se a qualificação do evento. A chave de leitura extraída do dossiê de precedentes ([[dossie-pix-fortuito]]): houve falha autônoma da instituição (vazamento, transação atípica não barrada, conta recebedora aberta sem diligência)? Fortuito interno — paga. A fraude correu inteira fora do ambiente do banco, com atos voluntários da vítima no seu padrão de uso? Fortuito externo/culpa exclusiva (CDC, art. 14, §3º) — não paga. Tudo que os Blocos 1-3 mandam documentar existe para responder essa pergunta a favor do cliente.\n\n### 4.2 A onda e a litigância predatória\n\nCom a tese pronta, a semana 1+ organiza a defesa em escala: contestação-padrão ancorada na trilha probatória, triagem da massa separando vítimas legítimas de padrões predatórios (petições clonadas, procurações viciadas), e o instrumento processual do [[stj-tema-1198]] (Corte Especial, 13/03/2025): o juiz pode exigir emenda fundamentada diante de indícios de litigância abusiva. Reforço institucional: Recomendação CNJ 159/2024 e NUMOPEDE ([[hub-litigancia-predatoria]]).\n\n---\n\n## O playbook e os papéis (por que \"assinado antes\")\n\nNada do que está acima pode ser decidido às 3h da manhã por consenso improvisado. O playbook é o documento que fixa ANTES: quem recebe a reclamação, quem forma a fundada suspeita, quem aciona o MED, quem roda o teste do art. 5º, quem decide comunicar, quem fala com cada regulador, quando o forense é convocado — com nomes, suplentes e critérios de convocação. A exigência de critérios documentados de configuração de crise tem base expressa na Res. BCB 85/2021, art. 20, parágrafo único (redação da Res. 538/2025). \"Assinado\" importa: playbook sem aprovação da diretoria não protege quem o executa às 3h. É o entregável central do retainer; o mapeamento de quem executa cada frente na banca está em governança interna do projeto.\n\n## O instrumento de regência\n\nA [[hub-matriz-prazos]] consolida todos os relógios num único lugar — é o que o coordenador olha durante a crise (e o que o simulador usa para avaliar você no treino). Este documento explica; a matriz comanda.\n\n## Lacunas consolidadas deste estudo\n\n1. RESOLVIDO (2026-07-14, leitura do Manual DICT v8.4 — [[bcb-ingest-instrucao-normativa-bcb-752-2026-07-01]]): instauração IMEDIATA após a reclamação/suspeita; contestação em até 80 dias corridos (pacs.008) ou 30 (pacs.004); bloqueio imediato na cadeia até o saldo disponível; análise da notificação em 7 dias; 72 horas para iniciar a devolução após a análise, sob pena de conclusão automática. Pendente apenas: prazo de EFETIVAÇÃO da devolução pelo recebedor (Manual de Tempos do Pix, não lido).\n2. RESOLVIDO (2026-07-14 — [[bcb-res-85-2021]]): comunicação de incidente ao BCB NÃO tem prazo fixado — \"tempestiva\" quando configurada crise pelos critérios documentados da própria instituição (art. 20, III e p.u.).\n3. Res. CD/ANPD 15/2024: teores dos arts. 5º e 6º transcritos da verificação no DOU; conferir inteiro teor oficial ao citar em peça.\n4. CPP arts. 158-A a 158-F como régua de cadeia de custódia no cível: uso por analogia — conferir redação na minuta.\n\n## Relações\n\n[[hub-matriz-prazos]] · [[hub-catalogo-medidas]] · [[bcb-res-493-2025]] · [[anpd-res-cd-15-2024]] · [[bcb-res-538-2025]] · [[stj-sumula-479]] · [[dossie-pix-fortuito]] · [[stj-tema-1198]] · governança interna do projeto\n"}, {"info": {"id": "glossario-dispositivos-diagnostico", "titulo": "Glossário normativo do diagnóstico de fraudes — dispositivos citados, com texto literal", "orgao": "", "tipo": "conceito", "status": "fichado", "data_publicacao": "2026-09-17", "tags": "[glossario, cpc, cdc, lgpd, bcb, anpd, prova, diagnostico]", "grupo": "conceitos", "caminho": "conceitos/glossario-dispositivos-diagnostico.md", "quando": "2026-11-05"}, "meta": {"id": "glossario-dispositivos-diagnostico", "tipo": "conceito", "titulo": "Glossário normativo do diagnóstico de fraudes — dispositivos citados, com texto literal", "orgao": "", "data_publicacao": "2026-09-17", "fase_rastro": "[prontidao, war_room, recuperacao_defesa]", "conexao_comercial": "[diagnostico, adversarial]", "status": "fichado", "tags": "[glossario, cpc, cdc, lgpd, bcb, anpd, prova, diagnostico]", "confidencial": "false"}, "corpo": "\n# Glossário normativo do diagnóstico de fraudes\n\nTextos literais dos dispositivos usados no diagnóstico e no Plano de Contingência. Regras deste glossário: cada entrada traz a redação vigente, a fonte oficial e a data em que o texto foi conferido; nas normas consolidadas do BCB, transcreve-se apenas a redação atual, com a indicação da resolução que a deu; o que não pôde ser conferido na fonte está marcado. Datas de consulta: 17/9/2026, salvo indicação.\n\nFontes: Planalto (CPC, CDC, LGPD, texto compilado); API oficial de normativos do BCB (`exibenormativo`, textos consolidados: Res. 85 versão 4.0, Res. 142 versão 2.0, Res. 343 versão 3.0, Res. Conjunta 6 versão 1.0, Res. 1/2020 versão 41.0; Circular 3.978 versão 6 e Carta Circular 4.001 versão 4 lidas no PDF consolidado listado no campo `Documentos` da API, porque o `exibenormativo` devolve o texto original, conferidas em 5/11/2026); Planalto para a Lei 9.613 e a LC 105 (5/11/2026); DOU via Imprensa Nacional (Res. CD/ANPD 15/2024); STJ (súmula e tema, conferidos em 7/7/2026 na ficha própria; em 17/9/2026 o portal SCON estava atrás de verificação antibot e não foi reconferido).\n\n## A. Código de Processo Civil (Lei 13.105/2015)\n\n### Art. 300 (tutela de urgência)\n\n> Art. 300. A tutela de urgência será concedida quando houver elementos que evidenciem a probabilidade do direito e o perigo de dano ou o risco ao resultado útil do processo.\n> § 1º Para a concessão da tutela de urgência, o juiz pode, conforme o caso, exigir caução real ou fidejussória idônea para ressarcir os danos que a outra parte possa vir a sofrer, podendo a caução ser dispensada se a parte economicamente hipossuficiente não puder oferecê-la.\n> § 2º A tutela de urgência pode ser concedida liminarmente ou após justificação prévia.\n> § 3º A tutela de urgência de natureza antecipada não será concedida quando houver perigo de irreversibilidade dos efeitos da decisão.\n\nUso no diagnóstico: medida de bloqueio ou de preservação quando o incidente já produziu dano e há prova mínima da fraude. Não se pede bloqueio patrimonial por presunção.\n\n### Art. 301 (tutela cautelar)\n\n> Art. 301. A tutela de urgência de natureza cautelar pode ser efetivada mediante arresto, sequestro, arrolamento de bens, registro de protesto contra alienação de bem e qualquer outra medida idônea para asseguração do direito.\n\nUso: base da medida de constrição sobre a cadeia de contas de passagem, quando o MED não alcança o valor.\n\n### Art. 381 (produção antecipada da prova)\n\n> Art. 381. A produção antecipada da prova será admitida nos casos em que:\n> I - haja fundado receio de que venha a tornar-se impossível ou muito difícil a verificação de certos fatos na pendência da ação;\n> II - a prova a ser produzida seja suscetível de viabilizar a autocomposição ou outro meio adequado de solução de conflito;\n> III - o prévio conhecimento dos fatos possa justificar ou evitar o ajuizamento de ação.\n> § 1º O arrolamento de bens observará o disposto nesta Seção quando tiver por finalidade apenas a realização de documentação e não a prática de atos de apreensão.\n> § 2º A produção antecipada da prova é da competência do juízo do foro onde esta deva ser produzida ou do foro de domicílio do réu.\n> § 3º A produção antecipada da prova não previne a competência do juízo para a ação que venha a ser proposta.\n> § 4º O juízo estadual tem competência para produção antecipada de prova requerida em face da União, de entidade autárquica ou de empresa pública federal se, na localidade, não houver vara federal.\n> § 5º Aplica-se o disposto nesta Seção àquele que pretender justificar a existência de algum fato ou relação jurídica para simples documento e sem caráter contencioso, que exporá, em petição circunstanciada, a sua intenção.\n\nUso: quando logs, gravações ou registros de terceiro (PSTI, parceiro BaaS, outra instituição) correm risco de descarte por política de retenção. O inciso III sustenta a produção antecipada para decidir se há ação a propor.\n\n### Arts. 396 a 404 (exibição de documento ou coisa)\n\n> Art. 396. O juiz pode ordenar que a parte exiba documento ou coisa que se encontre em seu poder.\n\n> Art. 397. O pedido formulado pela parte conterá:\n> I - a descrição, tão completa quanto possível, do documento ou da coisa, ou das categorias de documentos ou de coisas buscados;\n> II - a finalidade da prova, com indicação dos fatos que se relacionam com o documento ou com a coisa, ou com suas categorias;\n> III - as circunstâncias em que se funda o requerente para afirmar que o documento ou a coisa existe, ainda que a referência seja a categoria de documentos ou de coisas, e se acha em poder da parte contrária.\n\nNota: incisos I a III na redação dada pela Lei 14.195/2021, que passou a admitir o pedido por categoria de documentos. Isso importa para pedir \"os registros de autenticação do período X\" sem ter de individualizar cada log.\n\n> Art. 398. O requerido dará sua resposta nos 5 (cinco) dias subsequentes à sua intimação.\n> Parágrafo único. Se o requerido afirmar que não possui o documento ou a coisa, o juiz permitirá que o requerente prove, por qualquer meio, que a declaração não corresponde à verdade.\n\n> Art. 399. O juiz não admitirá a recusa se:\n> I - o requerido tiver obrigação legal de exibir;\n> II - o requerido tiver aludido ao documento ou à coisa, no processo, com o intuito de constituir prova;\n> III - o documento, por seu conteúdo, for comum às partes.\n\nNota: o inciso I conversa com as obrigações de guarda das resoluções do BCB (Res. 85, art. 23; Res. 343, art. 12; Res. Conjunta 6, art. 8º) e da ANPD (Res. 15, art. 10): quem tem obrigação regulatória de guardar tem obrigação legal de exibir.\n\n> Art. 400. Ao decidir o pedido, o juiz admitirá como verdadeiros os fatos que, por meio do documento ou da coisa, a parte pretendia provar se:\n> I - o requerido não efetuar a exibição nem fizer nenhuma declaração no prazo do art. 398;\n> II - a recusa for havida por ilegítima.\n> Parágrafo único. Sendo necessário, o juiz pode adotar medidas indutivas, coercitivas, mandamentais ou sub-rogatórias para que o documento seja exibido.\n\n> Art. 401. Quando o documento ou a coisa estiver em poder de terceiro, o juiz ordenará sua citação para responder no prazo de 15 (quinze) dias.\n\n> Art. 402. Se o terceiro negar a obrigação de exibir ou a posse do documento ou da coisa, o juiz designará audiência especial, tomando-lhe o depoimento, bem como o das partes e, se necessário, o de testemunhas, e em seguida proferirá decisão.\n\n> Art. 403. Se o terceiro, sem justo motivo, se recusar a efetuar a exibição, o juiz ordenar-lhe-á que proceda ao respectivo depósito em cartório ou em outro lugar designado, no prazo de 5 (cinco) dias, impondo ao requerente que o ressarça pelas despesas que tiver.\n> Parágrafo único. Se o terceiro descumprir a ordem, o juiz expedirá mandado de apreensão, requisitando, se necessário, força policial, sem prejuízo da responsabilidade por crime de desobediência, pagamento de multa e outras medidas indutivas, coercitivas, mandamentais ou sub-rogatórias necessárias para assegurar a efetivação da decisão.\n\n> Art. 404. A parte e o terceiro se escusam de exibir, em juízo, o documento ou a coisa se:\n> I - concernente a negócios da própria vida da família;\n> II - sua apresentação puder violar dever de honra;\n> III - sua publicidade redundar em desonra à parte ou ao terceiro, bem como a seus parentes consanguíneos ou afins até o terceiro grau, ou lhes representar perigo de ação penal;\n> IV - sua exibição acarretar a divulgação de fatos a cujo respeito, por estado ou profissão, devam guardar segredo;\n> V - subsistirem outros motivos graves que, segundo o prudente arbítrio do juiz, justifiquem a recusa da exibição;\n> VI - houver disposição legal que justifique a recusa da exibição.\n> Parágrafo único. Se os motivos de que tratam os incisos I a VI do caput disserem respeito a apenas uma parcela do documento, a parte ou o terceiro exibirá a outra em cartório, para dela ser extraída cópia reprográfica, de tudo sendo lavrado auto circunstanciado.\n\nNota: o inciso IV (sigilo por profissão) e o VI (disposição legal) são a defesa da própria instituição quando outra parte pede a exibição do dossiê de fraude; o sigilo bancário (LC 105/2001) e o sigilo dos registros de indício (Res. Conjunta 6, art. 2º, § 7º) entram aqui.\n\n## B. Código de Defesa do Consumidor (Lei 8.078/1990)\n\n### Art. 14 (responsabilidade pelo fato do serviço)\n\n> Art. 14. O fornecedor de serviços responde, independentemente da existência de culpa, pela reparação dos danos causados aos consumidores por defeitos relativos à prestação dos serviços, bem como por informações insuficientes ou inadequadas sobre sua fruição e riscos.\n> § 1° O serviço é defeituoso quando não fornece a segurança que o consumidor dele pode esperar, levando-se em consideração as circunstâncias relevantes, entre as quais:\n> I - o modo de seu fornecimento;\n> II - o resultado e os riscos que razoavelmente dele se esperam;\n> III - a época em que foi fornecido.\n> § 2º O serviço não é considerado defeituoso pela adoção de novas técnicas.\n> § 3° O fornecedor de serviços só não será responsabilizado quando provar:\n> I - que, tendo prestado o serviço, o defeito inexiste;\n> II - a culpa exclusiva do consumidor ou de terceiro.\n> § 4° A responsabilidade pessoal dos profissionais liberais será apurada mediante a verificação de culpa.\n\nUso: o § 3º é o eixo de todo o diagnóstico. O que a instituição precisa provar (inexistência do defeito ou culpa exclusiva) define o que precisa estar documentado antes do incidente.\n\n## C. Lei Geral de Proteção de Dados (Lei 13.709/2018)\n\n### Art. 7º, VI (base legal: exercício regular de direitos)\n\n> Art. 7º O tratamento de dados pessoais somente poderá ser realizado nas seguintes hipóteses:\n> [...]\n> VI - para o exercício regular de direitos em processo judicial, administrativo ou arbitral, esse último nos termos da Lei nº 9.307, de 23 de setembro de 1996 (Lei de Arbitragem);\n\n### Art. 11, II, \"d\" e \"g\" (dados sensíveis)\n\n> Art. 11. O tratamento de dados pessoais sensíveis somente poderá ocorrer nas seguintes hipóteses:\n> [...]\n> II - sem fornecimento de consentimento do titular, nas hipóteses em que for indispensável para:\n> [...]\n> d) exercício regular de direitos, inclusive em contrato e em processo judicial, administrativo e arbitral, este último nos termos da Lei nº 9.307, de 23 de setembro de 1996 (Lei de Arbitragem);\n> [...]\n> g) garantia da prevenção à fraude e à segurança do titular, nos processos de identificação e autenticação de cadastro em sistemas eletrônicos, resguardados os direitos mencionados no art. 9º desta Lei e exceto no caso de prevalecerem direitos e liberdades fundamentais do titular que exijam a proteção dos dados pessoais.\n\nUso: a alínea \"g\" é a base do tratamento biométrico no onboarding e na autenticação; a \"d\" e o art. 7º, VI, são a base do dossiê de defesa. O manual v1 citava só a \"d\".\n\n### Art. 46 (segurança)\n\n> Art. 46. Os agentes de tratamento devem adotar medidas de segurança, técnicas e administrativas aptas a proteger os dados pessoais de acessos não autorizados e de situações acidentais ou ilícitas de destruição, perda, alteração, comunicação ou qualquer forma de tratamento inadequado ou ilícito.\n> § 1º A autoridade nacional poderá dispor sobre padrões técnicos mínimos para tornar aplicável o disposto no caput deste artigo, considerados a natureza das informações tratadas, as características específicas do tratamento e o estado atual da tecnologia, especialmente no caso de dados pessoais sensíveis, assim como os princípios previstos no caput do art. 6º desta Lei.\n> § 2º As medidas de que trata o caput deste artigo deverão ser observadas desde a fase de concepção do produto ou do serviço até a sua execução.\n\n### Art. 48 (comunicação de incidente)\n\n> Art. 48. O controlador deverá comunicar à autoridade nacional e ao titular a ocorrência de incidente de segurança que possa acarretar risco ou dano relevante aos titulares.\n> § 1º A comunicação será feita em prazo razoável, conforme definido pela autoridade nacional, e deverá mencionar, no mínimo:\n> I - a descrição da natureza dos dados pessoais afetados;\n> II - as informações sobre os titulares envolvidos;\n> III - a indicação das medidas técnicas e de segurança utilizadas para a proteção dos dados, observados os segredos comercial e industrial;\n> IV - os riscos relacionados ao incidente;\n> V - os motivos da demora, no caso de a comunicação não ter sido imediata; e\n> VI - as medidas que foram ou que serão adotadas para reverter ou mitigar os efeitos do prejuízo.\n> § 2º A autoridade nacional verificará a gravidade do incidente e poderá, caso necessário para a salvaguarda dos direitos dos titulares, determinar ao controlador a adoção de providências, tais como:\n> I - ampla divulgação do fato em meios de comunicação; e\n> II - medidas para reverter ou mitigar os efeitos do incidente.\n> § 3º No juízo de gravidade do incidente, será avaliada eventual comprovação de que foram adotadas medidas técnicas adequadas que tornem os dados pessoais afetados ininteligíveis, no âmbito e nos limites técnicos de seus serviços, para terceiros não autorizados a acessá-los.\n\nO \"prazo razoável\" do § 1º foi fixado pela ANPD em três dias úteis (seção G).\n\n## D. STJ\n\n### Súmula 479\n\n> \"As instituições financeiras respondem objetivamente pelos danos gerados por fortuito interno relativo a fraudes e delitos praticados por terceiros no âmbito de operações bancárias.\"\n\nSegunda Seção, julgada em 27/6/2012, DJe de 1º/8/2012. Ficha: [[stj-sumula-479]]. Precedentes de delimitação (fortuito interno × externo em golpes por engenharia social) no [[dossie-pix-fortuito]], com a regra de citação: número, Turma, relator e ano em material comercial.\n\n### Tema Repetitivo 1198 (litigância abusiva)\n\n> \"Constatados indícios de litigância abusiva, o juiz pode exigir de modo fundamentado e com observância à razoabilidade do caso concreto a emenda da petição inicial a fim de demonstrar o interesse de agir e a autenticidade da postulação, respeitadas as regras de distribuição do ônus da prova.\"\n\nREsp 2.021.665/MS, Corte Especial, rel. Min. Moura Ribeiro, julgado em 13/3/2025. Ficha: [[stj-tema-1198]]. Uso: fundamento do pedido de emenda caso a caso na onda consumerista; a triagem com perícia digital ([[basilisk-pericia-digital]]) produz o indício.\n\n## E. Resolução BCB 85/2021 (segurança cibernética; texto consolidado, versão 4.0)\n\nAplica-se, pela ementa vigente, a instituições de pagamento, corretoras e distribuidoras, corretoras de câmbio e prestadoras de serviços de ativos virtuais autorizadas pelo BCB. O enquadramento da instituição diagnosticada é a primeira linha da checklist. Ficha: [[bcb-res-85-2021]].\n\n### Art. 2º, caput (política)\n\n> Art. 2º As instituições mencionadas no art. 1º devem implementar e manter política de segurança cibernética formulada com base em princípios e diretrizes que busquem assegurar a confidencialidade, a integridade e a disponibilidade dos dados e dos sistemas de informação utilizados. (Redação dada pela Res. BCB 368/2024.)\n\n### Art. 3º, V, \"d\" (parâmetros de relevância)\n\n> V - as diretrizes para:\n> [...]\n> d) a definição dos parâmetros a serem utilizados na avaliação da relevância dos incidentes;\n\n### Art. 3º-A, I, \"f\" (chaves privadas)\n\n> f) vedação do acesso de empresas prestadoras de serviços a terceiros às chaves privadas associadas a certificados digitais utilizados pela instituição para a assinatura de mensagens; (Incluída pela Res. BCB 538/2025.)\n\n### Art. 6º (plano de ação e de resposta a incidentes)\n\n> Art. 6º As instituições mencionadas no art. 1º devem estabelecer plano de ação e de resposta a incidentes visando à implementação da política de segurança cibernética. (Redação dada pela Res. BCB 368/2024.)\n> Parágrafo único. O plano mencionado no caput deve abranger, no mínimo:\n> I - as ações a serem desenvolvidas pela instituição para adequar suas estruturas organizacional e operacional aos princípios e às diretrizes da política de segurança cibernética;\n> II - as rotinas, os procedimentos, os controles e as tecnologias a serem utilizados na prevenção e na resposta a incidentes, em conformidade com as diretrizes da política de segurança cibernética; e\n> III - a área responsável pelo registro e controle dos efeitos de incidentes relevantes.\n\n### Art. 7º (diretor responsável)\n\n> Art. 7º As instituições mencionadas no art. 1º devem designar diretor responsável pela política de segurança cibernética e pela execução do plano de ação e de resposta a incidentes. (Redação dada pela Res. BCB 368/2024.)\n> Parágrafo único. O diretor mencionado no caput pode desempenhar outras funções na instituição, desde que não haja conflito de interesses.\n\n### Art. 8º (relatório anual)\n\n> Art. 8º As instituições mencionadas no art. 1º devem elaborar relatório anual sobre a implementação do plano de ação e de resposta a incidentes, mencionado no art. 6º, com data-base de 31 de dezembro. (Redação dada pela Res. BCB 368/2024.)\n> § 1º O relatório de que trata o caput deve abordar, no mínimo:\n> I - a efetividade da implementação das ações descritas no art. 6º, parágrafo único, inciso I;\n> II - o resumo dos resultados obtidos na implementação das rotinas, dos procedimentos, dos controles e das tecnologias a serem utilizados na prevenção e na resposta a incidentes descritos no art. 6º, parágrafo único, inciso II;\n> III - os incidentes relevantes relacionados com o ambiente cibernético ocorridos no período; (Redação dada pela Res. BCB 538/2025.)\n> IV - os resultados dos testes de continuidade de negócios, considerando cenários de indisponibilidade ocasionada por incidentes; e (Redação dada pela Res. BCB 538/2025.)\n> V - os resultados dos testes de intrusão e dos testes, varreduras e análises periódicas para detecção de vulnerabilidades de que trata o art. 3º, § 8º, e os planos de ação estabelecidos para as suas correções, observado o disposto no art. 22-A, caput, inciso III. (Incluído pela Res. BCB 538/2025.)\n> § 2º O relatório mencionado no caput deve ser: (Redação dada pela Res. BCB 368/2024.)\n> I - submetido ao comitê de risco, quando existente; e\n> II - apresentado ao conselho de administração ou, na sua inexistência, à diretoria da instituição até 31 de março do ano seguinte ao da data-base.\n\n### Art. 9º e art. 10 (aprovação e revisão)\n\n> Art. 9º A política de segurança cibernética referida no art. 2º e o plano de ação e de resposta a incidentes mencionado no art. 6º devem ser aprovados pelo conselho de administração ou, na sua inexistência, pela diretoria da instituição mencionada no art. 1º. (Redação dada pela Res. BCB 368/2024.)\n\n> Art. 10. A política de segurança cibernética e o plano de ação e de resposta a incidentes devem ser documentados e revisados, no mínimo, anualmente.\n\n### Art. 14 (responsabilidade indelegável)\n\n> Art. 14. A instituição contratante dos serviços mencionados no art. 12 é responsável pela confiabilidade, pela integridade, pela disponibilidade, pela segurança e pelo sigilo em relação aos serviços contratados, bem como pelo cumprimento da legislação e da regulamentação em vigor. (Redação dada pela Res. BCB 368/2024.)\n\n### Art. 20, III e parágrafo único (comunicação ao BCB e critérios de crise)\n\n> III - a comunicação tempestiva ao Banco Central do Brasil das ocorrências de incidentes relevantes e das interrupções dos serviços relevantes, citados no inciso I, que configurem situação de crise pela instituição mencionada no art. 1º, bem como das providências para o reinício das suas atividades. (Redação dada pela Res. BCB 368/2024.)\n> Parágrafo único. As instituições mencionadas no art. 1º devem estabelecer e documentar os critérios que configurem a situação de crise de que trata o inciso III do caput. (Redação dada pela Res. BCB 368/2024.)\n\nNota: não há prazo em horas ou dias para a comunicação ao BCB em todo o texto consolidado; o padrão é \"tempestiva\", e o gatilho é a crise definida pela própria instituição. Sem critérios documentados, a instituição descumpre a norma e perde a defesa de tempestividade.\n\n### Art. 22-A (testes de intrusão)\n\n> Art. 22-A. As instituições devem assegurar que os testes de intrusão mencionados no art. 3º, § 8º, inciso IV, devem: (Incluído pela Res. BCB 538/2025.)\n> I - ter periodicidade mínima anual;\n> II - ser realizados com independência e imparcialidade por pessoa natural ou empresa especializada contratada pela instituição para essa finalidade, sem prejuízo da realização de testes por equipes da própria instituição; e\n> III - ter os resultados de sua execução documentados, especialmente as eventuais vulnerabilidades que forem identificadas e os planos de ação estabelecidos para suas correções.\n\n### Art. 23 (guarda de cinco anos; incisos pertinentes)\n\n> Art. 23. Devem ficar à disposição do Banco Central do Brasil pelo prazo de cinco anos:\n> I - o documento relativo à política de segurança cibernética, de que trata o art. 2º;\n> [...]\n> III - o documento relativo ao plano de ação e de resposta a incidentes, de que trata o art. 6º;\n> IV - o relatório anual, de que trata o art. 8º;\n> V - a documentação sobre os procedimentos de que trata o art. 12, § 2º;\n> [...]\n> VII - os contratos de que trata o art. 17, contado o prazo referido no caput a partir da extinção do contrato;\n> [...]\n> IX - a documentação com os critérios que configurem uma situação de crise de que trata o art. 20, parágrafo único; e (Redação dada pela Res. BCB 538/2025.)\n> X - a documentação com os resultados da execução de testes de intrusão e os planos de ação estabelecidos para as correções de vulnerabilidades identificadas de que trata o art. 22-A, caput, inciso III, contado o prazo a partir da data de execução dos testes. (Incluído pela Res. BCB 538/2025.)\n\n## F. Resolução BCB 142/2021 (prevenção de fraudes em pagamentos; consolidado, versão 2.0)\n\nFicha: [[bcb-res-142-2021]]. A versão consolidada da API ainda não incorpora a Res. BCB 584/2026 (vigor em 1º/1/2027); o art. 2º-B está transcrito do texto da própria Res. 584.\n\n### Art. 2º, caput (limite noturno e prazo de aumento de limite)\n\n> Art. 2º As instituições referidas no art. 1º, na prestação de serviços de pagamento, devem estabelecer:\n> I - limite máximo de R$1.000,00 (mil reais), por conta de depósitos ou de pagamento pré-paga, para o valor total das transações de pagamento realizadas no âmbito de um mesmo arranjo de pagamento no período das vinte horas às seis horas entre clientes pessoas naturais distintas, exceto empresários individuais; e\n> II - prazo mínimo de vinte e quatro horas para a efetivação do aumento de limites para transações de pagamento a pedido do cliente, formalizado nos canais de atendimento eletrônicos disponibilizados pela instituição.\n\n### Art. 2º-A (rejeição por fundada suspeita)\n\n> Art. 2º-A As instituições referidas no art. 1º, na prestação de serviços de pagamento, quando constatarem identificação de fundada suspeita de envolvimento de fraude em contas de depósitos à vista, contas de depósitos de poupança e contas de pagamento pré-pagas, devem rejeitar transações de pagamento que tenham essas contas como destinatárias. (Incluído pela Res. BCB 501/2025.)\n> § 1º As transações de pagamento citadas no caput contemplam aquelas listadas no art. 2º, § 1º.\n> § 2º A avaliação de fundada suspeita de envolvimento de fraude deve incluir fatores a critério de cada instituição, podendo inclusive se utilizar de informações constantes em sistemas eletrônicos e bases de dados de caráter público ou privado.\n> § 3º A instituição destinatária dos recursos deve comunicar ao titular da conta a efetivação da medida de que trata o caput.\n> § 4º As instituições de que trata o art. 1º deverão implementar as medidas necessárias ao cumprimento dos deveres previstos neste artigo até o dia 13 de outubro de 2025.\n\nNota: a IN BCB 774/2026 (v7.4 dos Requisitos Mínimos para a Experiência do Usuário, vigor em 1º/3/2027) passa a exigir mensagem ao usuário quando a transação Pix não puder ser realizada por essa marcação; ficha pendente.\n\n### Art. 4º (registros diários de fraude)\n\n> Art. 4º As instituições mencionadas no art. 1º devem manter registros diários detalhando as ocorrências de fraudes ou de tentativas de fraude na prestação de serviços de pagamento, discriminando inclusive as medidas corretivas adotadas.\n> § 1º As instituições devem elaborar relatório com avaliação mensal consolidada das ocorrências e as medidas preventivas e corretivas adotadas, com base nos registros diários, que deve ser encaminhado, para ciência:\n> I - ao comitê de auditoria, se houver;\n> II - à auditoria interna;\n> III - ao comitê de risco, se houver;\n> IV - à Diretoria Executiva; e\n> V - ao Conselho de Administração, se houver.\n> § 2º O Banco Central do Brasil poderá definir a forma e o conteúdo do relatório mencionado no § 1º.\n\nUso: é a base normativa direta da \"relação completa de incidentes do período\" que o manual pede ao cliente. Se o registro diário e o relatório mensal não existem, o GAP é jurídico antes de ser operacional.\n\n### Art. 2º-B, incluído pela Res. BCB 584/2026 (VASP; vigor em 1º/1/2027)\n\nTexto obtido da API do BCB em 10/8/2026 (arquivo `normas/bcb/_texto-res-584-2026.txt`); data de publicação no DOU não confirmada na ficha de ingestão.\n\n> Art. 2º-B As instituições referidas no art. 1º, quando prestarem serviços de ativos virtuais ou executarem transações de pagamento relacionadas à prestação desses serviços, somente podem executar ordens de transferência desses ativos vinte e quatro horas após o recebimento dos respectivos recursos de aporte na carteira, em reais ou na forma de ativos virtuais, quando a transferência tiver por destino:\n> I - entidade constituída no exterior que desempenhe atividades no mercado de ativos virtuais; ou\n> II - carteira autocustodiada, conforme definida nos termos de regulamentação específica.\n> § 1º A retenção de que trata o caput:\n> I - tem caráter exclusivamente cautelar e se destina à realização de análise de risco da respectiva operação;\n> II - não implica indisponibilidade definitiva de ativos; e\n> III - deve ser aplicada em operações que:\n> a) superem o valor equivalente a US$10.000,00 (dez mil dólares dos Estados Unidos) ou o seu equivalente em outras moedas por operação ou pelo valor total de operações realizadas no mesmo dia em nome do cliente; ou\n> b) caracterizem, nos termos das políticas, estratégias e estruturas para gerenciamento de riscos da instituição, a necessidade de retenção para realização de análise de risco da respectiva operação, observado o disposto no § 2º.\n> § 3º A instituição deve comunicar ao cliente a efetivação da retenção de que trata o caput, com indicação, de forma clara e adequada:\n> I - da natureza cautelar da medida de que trata o inciso I do § 1º; e\n> II - do prazo aplicável, citado no caput.\n\n## G. Resolução Conjunta CMN/BCB 6/2023 (compartilhamento de indícios de fraude; versão 1.0)\n\nFicha: [[resolucao-conjunta-6-2023]].\n\n### Art. 2º, caput e §§ 3º, 4º e 8º\n\n> Art. 2º As instituições devem compartilhar dados e informações com as demais instituições referidas no art. 1º com a finalidade de subsidiar seus procedimentos e controles para prevenção de fraudes.\n> [...]\n> § 3º As instituições de que trata o caput devem obter do cliente com quem possuam relacionamento o consentimento prévio e geral, possibilitando o registro dos dados e das informações de que trata o § 2º que digam respeito ao referido cliente.\n> § 4º O consentimento de que trata o § 3º deve:\n> I - ter como finalidade o tratamento e o compartilhamento de dados e informações sobre indícios de fraudes no âmbito desta Resolução Conjunta; e\n> II - constar de contrato firmado entre o cliente e a instituição, mediante cláusula em destaque no corpo do instrumento contratual ou por outro instrumento jurídico válido.\n> [...]\n> § 8º As instituições devem estabelecer e documentar os procedimentos e critérios para identificação de que trata o inciso I do § 2º deste artigo, de forma detalhada e compatível com o perfil de risco da instituição, com a legislação e com a regulamentação em vigor, os quais incluirão, no mínimo, a conferência com dados constantes de sistemas, cadastros e demais bases de dados disponíveis para consulta.\n\n### Art. 4º, III, \"h\" (direito do marcado)\n\n> h) ao titular dos dados, o livre acesso às informações que lhe digam respeito, bem como a exclusão ou a correção tempestiva dos dados e das informações registrados, em caso de eventuais erros, inconsistências ou outras demandas, em observância da legislação e da regulamentação vigentes; e\n\n### Art. 6º (responsabilidades)\n\n> Art. 6º As instituições de que trata o art. 1º são responsáveis:\n> I - pela confiabilidade, integridade, disponibilidade, segurança e pelo sigilo em relação aos dados e informações por elas registrados nos termos do art. 2º, § 1º, inciso I;\n> II - pela implementação das funcionalidades do sistema de que trata o art. 2º, § 1º;\n> III - pela observância aos requisitos citados no art. 4º;\n> IV - pela utilização dos dados e das informações por elas obtidos em consulta ao sistema eletrônico de que trata o art. 2º, § 1º, e pela preservação do sigilo de tais dados; e\n> V - pelo cumprimento da legislação e da regulamentação em vigor.\n\n## H. Resolução BCB 343/2023 (execução do compartilhamento; consolidado, versão 3.0)\n\nFicha: [[bcb-res-343-2023]].\n\n### Art. 3º, II, \"j\" e § 3º (atuação do cliente)\n\n> j) indicação se houve ou não a atuação do cliente no indício da ocorrência ou da tentativa de fraude, observado o disposto no § 3º; e\n> [...]\n> § 3º A atuação do cliente de que trata a alínea \"j\" do inciso II do caput, apurada pela instituição mencionada no art. 1º, independe de ter sido induzida ou não por terceiros.\n\nNota: a vítima de engenharia social que executou o Pix é registrada como tendo atuado. Esse campo alimenta a tese de culpa exclusiva ou concorrente e expõe quem registra sem lastro.\n\n### Art. 4º (24 horas)\n\n> Art. 4º Os procedimentos operacionais para o compartilhamento de dados e de informações de que trata o art. 2º da Resolução Conjunta nº 6, de 2023, devem contemplar o registro de dados e de informações sobre indícios de ocorrências ou de tentativas de fraudes em, no máximo, 24 (vinte e quatro) horas contadas do momento da identificação pelas instituições mencionadas no art. 1º do indício de ocorrência ou de tentativa de fraude em suas atividades.\n> Parágrafo único. O prazo máximo mencionado no caput aplica-se, também, à alteração e à exclusão dos dados e das informações registrados sobre indícios de ocorrências ou de tentativas de fraudes, contado do momento da identificação, pela instituição, da necessidade de alteração ou de exclusão desses dados e dessas informações.\n\n### Art. 5º (declaração mensal de conformidade)\n\n> Art. 5º O sistema eletrônico de que trata o art. 2º, § 1º, da Resolução Conjunta nº 6, de 2023, deve dispor de funcionalidade para permitir que as instituições mencionadas no art. 1º efetuem a declaração de conformidade, até o dia 15 (quinze) de cada mês:\n> I - do registro dos dados e das informações sobre indícios de ocorrências ou de tentativas de fraudes do mês anterior; ou\n> II - da inexistência de indício de ocorrência ou de tentativa de fraude no mês anterior.\n> § 1º A declaração de conformidade de que trata o caput deve ser documentada pelas instituições mencionadas no art. 1º.\n\n## I. Regulamento do Pix (anexo à Resolução BCB 1/2020; consolidado, versão 41.0)\n\nFicha da alteração: [[bcb-res-493-2025]]. Prazos operacionais do MED 2.0: [[bcb-ingest-instrucao-normativa-bcb-752-2026-07-01]] (Manual Operacional do DICT v8.4).\n\n### Art. 54, XII (recuperação de valores)\n\n> XII - recuperação de valores: procedimento de rastreamento, de bloqueio e de devolução de valores no âmbito do Pix decorrente de suspeita de fraude na transação. (Incluído pela Res. BCB 493/2025.)\n\n### Art. 78-N (instauração)\n\n> Art. 78-N. O procedimento de recuperação de valores deverá ser iniciado pelo participante prestador de serviço de pagamento do usuário pagador quando houver fundada suspeita de que a transação Pix tenha sido realizada de forma fraudulenta após reclamação do usuário pagador. (Incluído pela Res. BCB 493/2025.)\n> Parágrafo único. As regras e os procedimentos operacionais da recuperação de valores serão detalhados no Manual Operacional do DICT.\n\n## J. Resolução CD/ANPD 15/2024 (Regulamento de Comunicação de Incidente de Segurança)\n\nDOU de 26/4/2024, Seção 1, p. 114. Texto conferido na Imprensa Nacional em 17/9/2026. Ficha: [[anpd-res-cd-15-2024]]. Artigos do Regulamento anexo.\n\n### Art. 5º (risco ou dano relevante)\n\n> Art. 5º O incidente de segurança pode acarretar risco ou dano relevante aos titulares quando puder afetar significativamente interesses e direitos fundamentais dos titulares e, cumulativamente, envolver, pelo menos, um dos seguintes critérios:\n> I - dados pessoais sensíveis;\n> II - dados de crianças, de adolescentes ou de idosos;\n> III - dados financeiros;\n> IV - dados de autenticação em sistemas;\n> V - dados protegidos por sigilo legal, judicial ou profissional; ou\n> VI - dados em larga escala.\n> § 1º O incidente de segurança que possa afetar significativamente interesses e direitos fundamentais será caracterizado, dentre outras situações, naquelas em que a atividade de tratamento puder impedir o exercício de direitos ou a utilização de um serviço, assim como ocasionar danos materiais ou morais aos titulares, tais como discriminação, violação à integridade física, ao direito à imagem e à reputação, fraudes financeiras ou roubo de identidade.\n\nNota: em fintech, os incisos III e IV quase sempre estão presentes; o teste decisivo é a \"afetação significativa\" do caput, e o § 1º cita expressamente fraudes financeiras. Não se equipara automaticamente fraude a incidente comunicável, mas a fundamentação da não comunicação precisa enfrentar esse § 1º.\n\n### Art. 6º (prazo, conteúdo e forma da comunicação à ANPD)\n\n> Art. 6º A comunicação de incidente de segurança à ANPD deverá ser realizada pelo controlador no prazo de três dias úteis, ressalvada a existência de prazo para comunicação previsto em legislação específica.\n> § 1º O prazo a que se refere o caput será contado do conhecimento pelo controlador de que o incidente afetou dados pessoais.\n> § 2º A comunicação de incidente de segurança deverá conter as seguintes informações:\n> I - a descrição da natureza e da categoria de dados pessoais afetados;\n> II - o número de titulares afetados, discriminando, quando aplicável, o número de crianças, de adolescentes ou de idosos;\n> III - as medidas técnicas e de segurança utilizadas para a proteção dos dados pessoais, adotadas antes e após o incidente, observados os segredos comercial e industrial;\n> IV - os riscos relacionados ao incidente com identificação dos possíveis impactos aos titulares;\n> V - os motivos da demora, no caso de a comunicação não ter sido realizada no prazo previsto no caput deste artigo;\n> VI - as medidas que foram ou que serão adotadas para reverter ou mitigar os efeitos do incidente sobre os titulares;\n> VII - a data da ocorrência do incidente, quando possível determiná-la, e a de seu conhecimento pelo controlador;\n> VIII - os dados do encarregado ou de quem represente o controlador;\n> IX - a identificação do controlador e, se for o caso, declaração de que se trata de agente de tratamento de pequeno porte;\n> X - a identificação do operador, quando aplicável;\n> XI - a descrição do incidente, incluindo a causa principal, caso seja possível identificá-la; e\n> XII - o total de titulares cujos dados são tratados nas atividades de tratamento afetadas pelo incidente.\n> § 3º As informações poderão ser complementadas, de maneira fundamentada, no prazo de vinte dias úteis, a contar da data da comunicação.\n> § 4º A comunicação de incidente de segurança deverá ocorrer por meio de formulário eletrônico disponibilizado pela ANPD.\n> § 5º A comunicação de incidente de segurança deverá ser realizada pelo controlador, por meio do encarregado, acompanhada de documento comprobatório de vínculo contratual, empregatício ou funcional, ou por meio de representante constituído, acompanhada de instrumento com poderes de representação junto à ANPD.\n> § 6º Os documentos de que trata o § 5º deverão ser apresentados juntamente com a comunicação do incidente de segurança, no prazo previsto no caput deste artigo.\n> § 8º Os prazos constantes no caput e no § 3º deste artigo são contados em dobro para os agentes de pequeno porte [...].\n\nNota operacional: o § 5º exige, para o advogado comunicar em nome do cliente, instrumento com poderes de representação junto à ANPD, apresentado com a comunicação (§ 6º). A procuração específica faz parte do kit preventivo; sem ela, nas 72 horas, a comunicação sai pelo encarregado.\n\n### Art. 9º (comunicação ao titular)\n\n> Art. 9º A comunicação de incidente de segurança ao titular deverá ser realizada pelo controlador no prazo de três dias úteis contados do conhecimento pelo controlador de que o incidente afetou dados pessoais, e deverá conter as seguintes informações:\n> I - a descrição da natureza e da categoria de dados pessoais afetados;\n> II - as medidas técnicas e de segurança utilizadas para a proteção dos dados, observados os segredos comercial e industrial;\n> III - os riscos relacionados ao incidente com identificação dos possíveis impactos aos titulares;\n> IV - os motivos da demora, no caso de a comunicação não ter sido feita no prazo do caput deste artigo;\n> V - as medidas que foram ou que serão adotadas para reverter ou mitigar os efeitos do incidente, quando cabíveis;\n> VI - a data do conhecimento do incidente de segurança; e\n> VII - o contato para obtenção de informações e, quando aplicável, os dados de contato do encarregado.\n> § 1º A comunicação do incidente aos titulares de dados deverá atender aos seguintes critérios:\n> I - fazer uso de linguagem simples e de fácil entendimento; e\n> II - ocorrer de forma direta e individualizada, caso seja possível identificá-los.\n> § 3º Caso a comunicação direta e individualizada mostre-se inviável ou não seja possível identificar, parcial ou integralmente, os titulares afetados, o controlador deverá comunicar a ocorrência do incidente, no prazo e com as informações definidas no caput, pelos meios de divulgação disponíveis, tais como seu sítio eletrônico, aplicativos, suas mídias sociais e canais de atendimento ao titular, de modo que a comunicação permita o conhecimento amplo, com direta e fácil visualização, pelo período de, no mínimo, três meses.\n> § 4º O controlador deverá juntar ao processo de comunicação de incidente uma declaração de que foi realizada a comunicação aos titulares, constando os meios de comunicação ou divulgação utilizados, em até três dias úteis, contados do término do prazo de que trata o caput deste artigo.\n\n### Art. 10, caput (registro por cinco anos)\n\n> Art. 10. O controlador deverá manter o registro do incidente de segurança, inclusive daquele não comunicado à ANPD e aos titulares, pelo prazo mínimo de cinco anos, contado a partir da data do registro, exceto se constatadas obrigações adicionais que demandem maior prazo de manutenção.\n\n## K. Lei 9.613/1998 (lavagem de dinheiro; texto compilado do Planalto, 5/11/2026)\n\n### Art. 10, § 2º (guarda de cadastros e registros)\n\n> § 2º Os cadastros e registros referidos nos incisos I e II deste artigo deverão ser conservados durante o período mínimo de cinco anos a partir do encerramento da conta ou da conclusão da transação, prazo este que poderá ser ampliado pela autoridade competente.\n\n### Art. 11, II e §§ 1º e 2º (comunicação ao Coaf em 24 horas; boa-fé)\n\n> II - deverão comunicar ao Coaf, abstendo-se de dar ciência de tal ato a qualquer pessoa, inclusive àquela à qual se refira a informação, no prazo de 24 (vinte e quatro) horas, a proposta ou realização: (Redação dada pela Lei nº 12.683, de 2012)\n> a) de todas as transações referidas no inciso II do art. 10, acompanhadas da identificação de que trata o inciso I do mencionado artigo; e\n> b) das operações referidas no inciso I;\n> § 1º As autoridades competentes, nas instruções referidas no inciso I deste artigo, elaborarão relação de operações que, por suas características, no que se refere às partes envolvidas, valores, forma de realização, instrumentos utilizados, ou pela falta de fundamento econômico ou legal, possam configurar a hipótese nele prevista.\n> § 2º As comunicações de boa-fé, feitas na forma prevista neste artigo, não acarretarão responsabilidade civil ou administrativa.\n\n### Art. 12, caput e II (sanções, inclusive aos administradores)\n\n> Art. 12. Às pessoas referidas no art. 9º, bem como aos administradores das pessoas jurídicas, que deixem de cumprir as obrigações previstas nos arts. 10 e 11 serão aplicadas, cumulativamente ou não, pelas autoridades competentes, as seguintes sanções:\n> I - advertência;\n> II - multa pecuniária variável não superior: (Redação dada pela Lei nº 12.683, de 2012)\n> a) ao dobro do valor da operação;\n> b) ao dobro do lucro real obtido ou que presumivelmente seria obtido pela realização da operação; ou\n> c) ao valor de R$ 20.000.000,00 (vinte milhões de reais);\n> III - inabilitação temporária, pelo prazo de até dez anos, para o exercício do cargo de administrador das pessoas jurídicas referidas no art. 9º;\n> IV - cassação ou suspensão da autorização para o exercício de atividade, operação ou funcionamento. (Redação dada pela Lei nº 12.683, de 2012)\n\n## L. Circular BCB 3.978/2020 (PLD/FT; texto consolidado, versão 6, com a Res. BCB 591/2026)\n\n### Art. 39, parágrafo único (prazo de monitoramento e seleção)\n\n> Parágrafo único. O período para a execução dos procedimentos de monitoramento e de seleção das operações e situações suspeitas não pode exceder o prazo de quarenta e cinco dias, contados a partir da data de ocorrência da operação ou da situação.\n\n### Art. 43 (análise e dossiê)\n\n> Art. 43. As instituições referidas no art. 1º devem implementar procedimentos de análise das operações e situações selecionadas por meio dos procedimentos de monitoramento e seleção de que trata o art. 39, com o objetivo de caracterizá-las ou não como suspeitas de lavagem de dinheiro e de financiamento do terrorismo.\n> § 1º O período para a execução dos procedimentos de análise das operações e situações selecionadas não pode exceder o prazo de quarenta e cinco dias, contados a partir da data da seleção da operação ou situação.\n> § 2º A análise mencionada no caput deve ser formalizada em dossiê, independentemente da comunicação ao Coaf referida no art. 48.\n\n### Art. 48 (comunicação de operações suspeitas ao Coaf)\n\n> Art. 48. As instituições referidas no art. 1º devem comunicar ao Coaf as operações ou situações suspeitas de lavagem de dinheiro e de financiamento do terrorismo.\n> § 1º A decisão de comunicação da operação ou situação ao Coaf deve:\n> I - ser fundamentada com base nas informações contidas no dossiê mencionado no art. 43, § 2º;\n> II - ser registrada de forma detalhada no dossiê mencionado no art. 43, § 2º; e\n> III - ocorrer até o final do prazo de análise referido no art. 43, § 1º.\n> § 2º A comunicação da operação ou situação suspeita ao Coaf deve ser realizada até o dia útil seguinte ao da decisão de comunicação.\n\n### Art. 49, V, §§ 1º e 2º (ativos virtuais em carteiras autocustodiadas; redação da Res. BCB 591/2026)\n\n> V - as operações relativas a transferências de ativos virtuais para ou de carteiras autocustodiadas de valor igual ou superior ao equivalente a US$10.000,00 (dez mil dólares dos Estados Unidos). (Incluído pela Resolução BCB nº 591, de 30/9/2026.)\n> § 1º A comunicação mencionada no caput deve ser realizada até o dia útil seguinte ao da ocorrência da operação ou do provisionamento.\n> § 2º A comunicação decorrente de operações relacionadas nos incisos IV e V do caput, contratadas no período compreendido entre 1º de outubro de 2026 e 31 de dezembro de 2026, deve ser efetuada no primeiro dia útil de
